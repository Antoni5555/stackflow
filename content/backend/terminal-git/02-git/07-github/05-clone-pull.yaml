title: clone или pull
type: quiz
kind: single
difficulty: 1
pitfall: git clone скачивает репозиторий один раз на новом месте, git pull обновляет уже скачанный.
statement: |
  Вы работаете над проектом на двух компьютерах. Утром на ноутбуке, где проект уже склонирован, нужно получить коммиты, отправленные вчера с домашнего компьютера. Какая команда?
options:
  - "`git clone git@github.com:anna/shop.git` ещё раз"
  - "`git pull`"
  - "`git push`"
  - "`git init`"
answer: [1]
explanation: |
  `git pull` забирает новые коммиты из `origin` в текущую ветку. `git clone` создаёт копию с нуля — он нужен один раз на новом компьютере (и в уже существующую папку не склонирует). `git push` отправляет, а не получает.

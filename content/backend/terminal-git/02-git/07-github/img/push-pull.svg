<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" class="fig" role="img" aria-labelledby="t"><title id="t">push отправляет коммиты на GitHub, pull забирает новые, clone скачивает репозиторий целиком</title>
<style>
.fig text{white-space:pre}
.fig-t{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:14px;fill:#0e0e0e;fill:var(--text,#0e0e0e)}

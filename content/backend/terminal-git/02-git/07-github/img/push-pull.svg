<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fig-ah"/></marker></defs>
<rect x="20" y="50" width="280" height="90" rx="12" class="fig-box2"/>
<text x="160.0" y="91.0" text-anchor="middle" class="fig-c">локальный репозиторий</text>
<text x="160.0" y="109.0" text-anchor="middle" class="fig-c">~/shop/.git</text>
<rect x="580" y="50" width="280" height="90" rx="12" class="fig-acc"/>
<text x="720.0" y="91.0" text-anchor="middle" class="fig-onacc">GitHub (origin)</text>
<text x="720.0" y="109.0" text-anchor="middle" class="fig-onacc">anna/shop.git</text>
<path d="M300 76H576" class="fig-ln" marker-end="url(#a)"/>
<text x="380" y="66" text-anchor="start" class="fig-cs">git push (-u origin main)</text>
<path d="M576 114H304" class="fig-ln" marker-end="url(#a)"/>
<text x="400" y="134" text-anchor="start" class="fig-cs">git pull / git clone</text>
<text x="20" y="186" text-anchor="start" class="fig-s">Push отклонён (fetch first) — на GitHub есть чужие коммиты: git pull --no-rebase, затем git push.</text>
<text x="20" y="206" text-anchor="start" class="fig-s">Доступ — SSH-ключ: публичный .pub на GitHub, приватный остаётся у вас.</text>

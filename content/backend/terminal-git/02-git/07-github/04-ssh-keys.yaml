title: Какой ключ отдать GitHub
type: quiz
kind: single
difficulty: 1
pitfall: На GitHub добавляют только публичный ключ (.pub); приватный никому не передают.
statement: |
  `ssh-keygen -t ed25519` создал в `~/.ssh` файлы `id_ed25519` и `id_ed25519.pub`. Содержимое какого файла вставить в GitHub (Settings → SSH and GPG keys)?
options:
  - "`id_ed25519` — это и есть ключ"
  - "`id_ed25519.pub` — публичный ключ"
  - Оба файла, чтобы GitHub мог проверить пару
  - Никакой — GitHub сам создаст ключ
answer: [1]
explanation: |
  Публичный ключ (`.pub`) не секретен — его кладут на сервер. Приватный `id_ed25519` остаётся только на вашем компьютере: с ним любой сможет войти от вашего имени. GitHub проверяет, что у подключающегося есть приватный ключ к публичному, сам приватный ключ по сети не передаётся.

title: Git или GitHub
type: quiz
kind: multiple
difficulty: 1
pitfall: Git — программа на компьютере, GitHub — сервис для копии репозитория в сети.
statement: |
  Что верно?
options:
  - Коммит можно сделать без интернета
  - Без аккаунта на GitHub Git не работает
  - История проекта хранится в папке `.git` внутри проекта
  - GitHub хранит копию репозитория в сети и помогает работать вместе
  - Git — это сайт github.com
answer: [0, 2, 3]
explanation: |
  Git — программа на вашем компьютере: репозиторий, коммиты и история живут в папке `.git`, интернет не нужен. GitHub — один из сервисов, где хранят копию репозитория в сети, смотрят код и обсуждают изменения; есть и другие (GitLab, Bitbucket).

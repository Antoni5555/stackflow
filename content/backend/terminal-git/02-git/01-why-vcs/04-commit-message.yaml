title: Сообщение коммита
type: quiz
kind: single
difficulty: 1
pitfall: Сообщение коммита объясняет, что и зачем изменено, — через месяц по нему ищут нужное изменение.
statement: |
  Какое сообщение коммита лучше?
options:
  - "`правки`"
  - "`fix`"
  - "`Корзина: нельзя положить больше товара, чем на складе`"
  - "`изменил cart/views.py, cart/models.py, templates/cart.html`"
answer: [2]
explanation: |
  Хорошее сообщение коротко говорит, что изменилось в поведении и зачем. «правки» и «fix» ничего не объясняют, а список файлов Git и так покажет (`git show`). По сообщениям ищут в истории — `git log --grep=корзина`.

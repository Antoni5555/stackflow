title: Разобраться потом
type: quiz
kind: single
difficulty: 1
pitfall: Незавершённое слияние можно отменить git merge --abort — всё вернётся как было до merge.
statement: |
  `git merge feature` закончился конфликтом в десяти файлах, а через пять минут демо. Как вернуть проект в состояние до слияния?
options:
  - "`git merge --abort`"
  - Удалить папку `.git`
  - "`git commit -m 'потом разберусь'`"
  - Удалить все файлы с конфликтами
answer: [0]
explanation: |
  `git merge --abort` отменяет незавершённое слияние: файлы и индекс возвращаются к состоянию до `merge`. Коммит с маркерами испортил бы код, а удаление `.git` уничтожило бы историю. К слиянию можно вернуться позже.

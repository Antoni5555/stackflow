<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fig-ah"/></marker></defs>
<rect x="20" y="96" width="220" height="56" rx="10" class="fig-box2"/>
<text x="130.0" y="120.0" text-anchor="middle" class="fig-cs">d4153a5</text>
<text x="130.0" y="138.0" text-anchor="middle" class="fig-cs">TIME_ZONE = 'UTC'</text>
<rect x="320" y="30" width="260" height="56" rx="10" class="fig-box2"/>
<text x="450.0" y="54.0" text-anchor="middle" class="fig-cs">4ca0a0f  main</text>
<text x="450.0" y="72.0" text-anchor="middle" class="fig-cs">TIME_ZONE = 'Europe/Kazan'</text>
<rect x="320" y="160" width="260" height="56" rx="10" class="fig-box2"/>
<text x="450.0" y="184.0" text-anchor="middle" class="fig-cs">7dc2562  timezone</text>
<text x="450.0" y="202.0" text-anchor="middle" class="fig-cs">TIME_ZONE = 'Europe/Moscow'</text>
<path d="M320 58L244 110" class="fig-ln" marker-end="url(#a)"/>
<path d="M320 188L244 140" class="fig-ln" marker-end="url(#a)"/>
<rect x="640" y="70" width="220" height="110" rx="8" class="fig-err"/>
<text x="750.0" y="94.0" text-anchor="middle" class="fig-errt">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text>
<text x="750.0" y="112.0" text-anchor="middle" class="fig-errt">Kazan</text>
<text x="750.0" y="130.0" text-anchor="middle" class="fig-errt">=======</text>
<text x="750.0" y="148.0" text-anchor="middle" class="fig-errt">Moscow</text>
<text x="750.0" y="166.0" text-anchor="middle" class="fig-errt">&gt;&gt;&gt;&gt;&gt;&gt;&gt; timezone</text>
<path d="M584 120H636" class="fig-ln" marker-end="url(#a)"/>
<text x="20" y="240" text-anchor="start" class="fig-s">Решение: оставить нужный вариант без маркеров → git add → git commit; отмена — git merge --abort.</text>

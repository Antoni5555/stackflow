title: Чья это версия
type: quiz
kind: single
difficulty: 2
pitfall: Между <<<<<<< HEAD и ======= — версия текущей ветки, между ======= и >>>>>>> — вливаемой.
statement: |
  Вы на ветке `main` и выполнили `git merge promo`. В файле:
  ```
  <<<<<<< HEAD
  DISCOUNT = 10
  =======
  DISCOUNT = 15
  >>>>>>> promo
  ```
  Какое значение было в `main`?
options:
  - "`DISCOUNT = 10`"
  - "`DISCOUNT = 15`"
  - Оба значения — из ветки `promo`
  - Неизвестно — маркеры случайные
answer: [0]
explanation: |
  `HEAD` — текущая ветка, в которую вливают: верхняя часть до `=======` — версия `main`, `DISCOUNT = 10`. Нижняя часть до `>>>>>>> promo` — версия вливаемой ветки `promo`.

title: Где я в истории
type: quiz
kind: single
difficulty: 1
pitfall: HEAD -> main означает «текущая ветка main, и это её последний коммит».
statement: |
  Что означает вывод?
  ```
  34b56d0 (HEAD -> main) Настройки для продакшена
  3243adf Каталог: модель товара
  5700f91 Каркас магазина
  ```
options:
  - Три ветки с именами-хешами
  - Три коммита ветки `main`, новые сверху; вы на ветке `main`, последний коммит — «Настройки для продакшена»
  - Самый новый коммит — «Каркас магазина»
  - «Настройки для продакшена» ещё не закоммичены
answer: [1]
explanation: |
  `git log --oneline` выводит коммиты новыми сверху: короткий хеш и сообщение. `(HEAD -> main)` у первого — вы на ветке `main`, и это её последний коммит. Самый старый — «Каркас магазина» внизу.

title: Что такое ветка
type: quiz
kind: single
difficulty: 2
pitfall: Ветка — указатель на коммит, а не копия файлов.
statement: |
  Что происходит при `git switch -c about`?
options:
  - Git копирует все файлы проекта в новую папку `about`
  - Создаётся указатель `about` на текущий коммит, и `HEAD` переключается на него
  - Создаётся новый коммит с именем `about`
  - Текущая ветка `main` переименовывается в `about`
answer: [1]
explanation: |
  Ветка — имя, указывающее на коммит. `switch -c` создаёт такой указатель на текущем коммите и делает его текущим (`HEAD -> about`). Файлы не копируются, коммитов не появляется; следующие коммиты будут двигать уже `about`.

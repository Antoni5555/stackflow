title: Ветка не удаляется
type: quiz
kind: single
difficulty: 2
pitfall: git branch -d не удаляет не слитую ветку — это защита от потери коммитов.
statement: |
  `git branch -d promo` отвечает `error: the branch 'promo' is not fully merged`. Что это значит?
options:
  - Ветка повреждена
  - В `promo` есть коммиты, которых нет в текущей ветке; удаление их потеряет
  - Нужно сначала удалить `main`
  - Ветку нельзя удалить, пока она есть на GitHub
answer: [1]
explanation: |
  `-d` удаляет только ветки, чьи коммиты уже есть в текущей ветке. Иначе Git предупреждает: эти коммиты станут недоступны. Если работа нужна — сначала `git merge promo`; если точно не нужна — `git branch -D promo` удалит принудительно.

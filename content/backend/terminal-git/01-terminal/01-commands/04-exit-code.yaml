title: Код выхода
type: quiz
kind: multiple
difficulty: 2
pitfall: Код выхода 0 — успех, любое другое число — ошибка; && выполняет следующую команду только после успеха.
statement: |
  Что верно про код выхода команды в Linux?
options:
  - "`0` означает успешное выполнение"
  - "`1` означает успешное выполнение — «истина»"
  - "`echo $?` показывает код выхода предыдущей команды"
  - "В `mkdir build && cd build` команда `cd` выполнится, только если `mkdir` завершилась с кодом 0"
  - Код выхода бывает только 0 или 1
answer: [0, 2, 3]
explanation: |
  В Linux успех — `0`, а любое ненулевое число — ошибка, и разные числа обозначают разные причины (например, `2` — неверное использование команды). Здесь логика противоположна Python, где `1` — истина. `$?` хранит код последней команды, а `&&` запускает следующую только после успеха.

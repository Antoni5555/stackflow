title: Части команды
type: quiz
kind: single
difficulty: 1
pitfall: После имени команды идут флаги (с дефисом) и аргументы — с чем работать.
statement: |
  Что в команде `cp -r templates backup` является флагом, а что — аргументами?
options:
  - "`cp` — флаг, `-r templates backup` — аргументы"
  - "`-r` — флаг, `templates` и `backup` — аргументы"
  - "`-r templates` — флаг, `backup` — аргумент"
  - Флагов нет, всё после `cp` — аргументы
answer: [1]
explanation: |
  `cp` — имя команды, `-r` — флаг (начинается с дефиса, меняет поведение: копировать папку целиком), `templates` и `backup` — аргументы: что копировать и куда. Части разделяются пробелами — поэтому имена с пробелами берут в кавычки.

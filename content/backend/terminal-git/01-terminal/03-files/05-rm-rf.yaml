title: Лишний пробел
type: quiz
kind: single
difficulty: 2
pitfall: rm -rf удаляет без вопросов всё, что получил в аргументах, — лишний пробел превращает один путь в два.
statement: |
  Разработчик в папке проекта `~/shop` хотел удалить окружение `venv` и набрал:
  ```bash
  rm -rf ./ venv
  ```
  Что произойдёт?
options:
  - Удалится только папка `venv`
  - Удалится содержимое текущей папки `~/shop` целиком и папка `venv`
  - Ошибка — у `rm` не может быть двух аргументов
  - Ничего — `./` нельзя удалить
answer: [1]
explanation: |
  Пробел разделил аргументы: `./` — текущая папка и `venv`. `-r` удаляет папки со всем содержимым, `-f` — без вопросов, так что исчезнет весь проект (корзины нет). Перед `rm -r` полезно выполнить `ls` с теми же аргументами — опечатка станет видна до удаления.

title: У меня работает
type: quiz
kind: single
difficulty: 2
pitfall: Без зафиксированных версий pip install у разных людей ставит разное.
statement: |
  В `requirements.txt` проекта одна строка: `django`. Полгода назад у вас всё работало. Коллега сегодня ставит зависимости и получает ошибки при запуске. Какая причина вероятнее всего?
options:
  - У коллеги другая операционная система
  - Без версии pip поставил коллеге последний Django, а он несовместим с кодом проекта
  - Файл должен называться `requirements.py`
  - pip ставит пакеты в случайном порядке
answer: [1]
explanation: |
  `django` без версии значит «последнюю доступную»: у вас — та, что была полгода назад, у коллеги — новая, где что-то изменилось. `pip freeze > requirements.txt` записывает точные версии всех пакетов, и окружения совпадают. Обновлять версии нужно явно и с проверкой тестами.

title: Двойной список
type: quiz
kind: single
difficulty: 2
pitfall: "Перенаправление >> дописывает в конец файла, > перезаписывает его."
statement: |
  В `requirements.txt` уже записаны версии пакетов. После установки `requests` разработчик выполнил `pip freeze >> requirements.txt`. Что стало с файлом?
options:
  - Файл содержит актуальный список без повторов
  - К старому списку дописан новый полный список — многие пакеты указаны дважды
  - Файл стал пустым
  - В файл добавилась только строка с requests
answer: [1]
explanation: |
  `>>` дописывает вывод в конец файла, а `pip freeze` выводит **все** пакеты окружения — в файле окажутся два списка, и старые пакеты повторятся. Для обновления списка нужен `>`: он перезаписывает файл целиком актуальным выводом.

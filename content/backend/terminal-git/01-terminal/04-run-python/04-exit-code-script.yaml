title: Скрипт «отработал»
type: quiz
kind: single
difficulty: 2
pitfall: Сообщение об ошибке без ненулевого кода выхода — для оболочки и cron это успех.
statement: |
  Скрипт выгрузки при отсутствии файла делает `print("Файл не найден")` и доходит до конца. Его запускают так: `python3 export.py && python3 send_email.py`. Что произойдёт, если файла нет?
options:
  - "`send_email.py` не запустится — была ошибка"
  - "`send_email.py` запустится: код выхода `export.py` — 0, для оболочки это успех"
  - Оболочка выведет ошибку и остановится
  - "`&&` выполнит обе команды одновременно"
answer: [1]
explanation: |
  Оболочка не читает текст вывода — она смотрит на код выхода. Скрипт дошёл до конца и вернул `0`, поэтому `&&` запустил следующую команду, и письмо ушло без выгрузки. При ошибке скрипт должен выйти с ненулевым кодом: `sys.exit(1)` (а сообщение лучше писать в `stderr`).

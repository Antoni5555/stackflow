title: Что в sys.argv
type: quiz
kind: single
difficulty: 1
pitfall: sys.argv — список строк, нулевой элемент — имя скрипта.
statement: |
  Скрипт `report.py` состоит из одной строки `print(sys.argv)` (после `import sys`). Что он выведет при запуске `python3 report.py 2026-04 "Казань"`?
options:
  - "`['2026-04', 'Казань']`"
  - "`['report.py', '2026-04', 'Казань']`"
  - "`['report.py', 2026-04, 'Казань']`"
  - "`['python3', 'report.py', '2026-04', 'Казань']`"
answer: [1]
explanation: |
  `sys.argv[0]` — имя скрипта, дальше — аргументы по порядку, все строками: `'2026-04'`, а не число. Кавычки вокруг `"Казань"` убирает оболочка. Сам `python3` в список не входит.

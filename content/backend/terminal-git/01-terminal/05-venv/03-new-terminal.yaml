title: Новое окно терминала
type: quiz
kind: single
difficulty: 1
pitfall: Активация окружения действует только в том терминале, где выполнена.
statement: |
  Вчера разработчик создал окружение и активировал его. Сегодня открыл новый терминал, перешёл в `~/shop` и запустил `python manage.py runserver` — получил `Command 'python' not found`. В чём дело?
options:
  - Окружение удалилось за ночь — нужно создать заново
  - В новом терминале окружение не активировано — нужно `source venv/bin/activate`
  - Django не установлен — нужно `pip install django`
  - Нужно перезагрузить компьютер
answer: [1]
explanation: |
  Активация меняет переменные только текущей оболочки, и в новом окне её нет: `python` не найден, `(venv)` в приглашении нет. Окружение на месте — достаточно снова выполнить `source venv/bin/activate` (или запускать `venv/bin/python manage.py runserver`).

title: Окружение в репозитории
type: quiz
kind: multiple
difficulty: 2
pitfall: Окружение не переносят — переносят список пакетов, а окружение создают заново.
statement: |
  Что верно про папку виртуального окружения `venv`?
options:
  - Её нужно закоммитить, чтобы коллеги получили те же пакеты
  - Её добавляют в `.gitignore`
  - Скопированная на другой компьютер, она может не работать — внутри пути и файлы конкретной системы
  - Состав пакетов передают через `requirements.txt`, а окружение создают заново
  - Окружение нужно создавать в `/usr/lib/python3`
answer: [1, 2, 3]
explanation: |
  Окружение — сотни файлов, привязанных к пути проекта и системе; переносить и коммитить его бессмысленно. Коллеги получают список пакетов (`requirements.txt`) и создают своё окружение: `python3 -m venv venv && venv/bin/pip install -r requirements.txt`. Окружение живёт в папке проекта, а не в системных папках.

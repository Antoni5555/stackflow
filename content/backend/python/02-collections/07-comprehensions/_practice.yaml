- title: Товары в наличии
  text: |
    ```python
    products = [
        {"id": 1, "name": "Чайник", "price": 2490, "stock": 3},
        {"id": 2, "name": "Кружка", "price": 390, "stock": 0},
        {"id": 3, "name": "Лейка", "price": 890, "stock": 12},
    ]
    ```
    Соберите comprehension список названий товаров, которые есть на складе.
  answer: |
    Ответ:
    ```python
    names = [p["name"] for p in products if p["stock"] > 0]
    print(names)
    ```
    Результат:
    ```
    ['Чайник', 'Лейка']
    ```
- title: Цены по id
  text: |
    Для того же списка `products` соберите словарь `{id: цена}`.
    ```python
    products = [
        {"id": 1, "name": "Чайник", "price": 2490, "stock": 3},
        {"id": 2, "name": "Кружка", "price": 390, "stock": 0},
        {"id": 3, "name": "Лейка", "price": 890, "stock": 12},
    ]
    ```
  answer: |
    Ответ:
    ```python
    prices = {p["id"]: p["price"] for p in products}
    print(prices)
    ```
    Результат:
    ```
    {1: 2490, 2: 390, 3: 890}
    ```
- title: Цены со скидкой
  text: |
    ```python
    prices = [2490, 390, 890]
    ```
    Соберите список цен со скидкой 10 %, округлив вниз до рубля.
  answer: |
    Ответ:
    ```python
    discounted = [price * 90 // 100 for price in prices]
    print(discounted)
    ```
    Результат:
    ```
    [2241, 351, 801]
    ```
    Целочисленная арифметика `* 90 // 100` не даёт хвостов `float`.
- title: Ячейки склада списком
  text: |
    Соберите одним comprehension список ячеек для рядов `A`, `B` и полок 1–2: `['A1', 'A2', 'B1', 'B2']`.
  answer: |
    Ответ:
    ```python
    cells = [f"{row}{shelf}" for row in "AB" for shelf in range(1, 3)]
    print(cells)
    ```
    Результат:
    ```
    ['A1', 'A2', 'B1', 'B2']
    ```
    Циклы в comprehension идут в том же порядке, что и вложенные `for`: сначала внешний.
- title: Метка наличия
  text: |
    ```python
    stocks = {"Чайник": 3, "Кружка": 0, "Лейка": 12}
    ```
    Соберите словарь `{название: "есть" или "нет"}`.
  answer: |
    Ответ:
    ```python
    labels = {name: "есть" if stock > 0 else "нет" for name, stock in stocks.items()}
    print(labels)
    ```
    Результат:
    ```
    {'Чайник': 'есть', 'Кружка': 'нет', 'Лейка': 'есть'}
    ```
    Здесь `if … else` — часть значения (условное выражение), а не фильтр: в словарь попадают все товары.

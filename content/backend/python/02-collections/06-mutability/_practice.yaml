- title: Две независимые корзины
  text: |
    Корзину Олега сделали из корзины Анны, и покупки Олега попали к Анне:
    ```python
    anna = ["чайник"]
    oleg = anna
    oleg.append("кружка")
    print(anna)
    ```
    Исправьте вторую строку так, чтобы у Анны остался только чайник.
  answer: |
    Ответ:
    ```python
    anna = ["чайник"]
    oleg = anna.copy()
    oleg.append("кружка")
    print(anna, oleg)
    ```
    Результат:
    ```
    ['чайник'] ['чайник', 'кружка']
    ```
    `oleg = anna` не копирует список, а даёт ему второе имя. `copy()` создаёт новый список.
- title: Одинаковые или один и тот же
  text: |
    ```python
    a = [1, 2]
    b = [1, 2]
    c = a
    ```
    Предскажите, что напечатает `print(a == b, a is b, a is c)`, и проверьте.
  answer: |
    Ответ:
    ```python
    print(a == b, a is b, a is c)
    ```
    Результат:
    ```
    True False True
    ```
    `==` сравнивает содержимое, `is` — один ли это объект.
- title: Цена не изменилась
  text: |
    Предскажите результат:
    ```python
    price = 100
    old_price = price
    price += 10
    print(old_price, price)
    ```
  answer: |
    Результат:
    ```
    100 110
    ```
    Число неизменяемо: `price += 10` создаёт новое число и перепривязывает имя `price`, а `old_price` по-прежнему указывает на 100.
- title: Копия заказа
  text: |
    Менеджер правит копию заказа, а меняется и оригинал:
    ```python
    import copy

    order = {"id": 1042, "items": [{"name": "Кружка", "qty": 2}]}
    draft = copy.copy(order)
    draft["items"][0]["qty"] = 5
    print(order["items"][0]["qty"])
    ```
    Исправьте копирование, чтобы оригинал не менялся.
  hint: |
    `copy.copy` копирует только верхний уровень: список позиций остаётся общим.
  answer: |
    Ответ:
    ```python
    order = {"id": 1042, "items": [{"name": "Кружка", "qty": 2}]}
    draft = copy.deepcopy(order)
    draft["items"][0]["qty"] = 5
    print(order["items"][0]["qty"], draft["items"][0]["qty"])
    ```
    Результат:
    ```
    2 5
    ```
    `deepcopy` копирует и вложенные списки и словари.

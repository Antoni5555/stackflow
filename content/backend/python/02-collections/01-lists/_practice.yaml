- title: Добавить в корзину
  text: |
    Корзина — список товаров:
    ```python
    cart = ["чайник", "кружка", "ложка"]
    ```
    Добавьте в конец `"тарелка"` и напечатайте корзину и число товаров в ней.
  answer: |
    Ответ:
    ```python
    cart.append("тарелка")
    print(cart, len(cart))
    ```
    Результат:
    ```
    ['чайник', 'кружка', 'ложка', 'тарелка'] 4
    ```
- title: Убрать из корзины
  text: |
    ```python
    cart = ["чайник", "кружка", "ложка", "тарелка"]
    ```
    Удалите `"кружка"` по значению, затем последний товар — так, чтобы его название напечаталось. В конце напечатайте корзину.
  hint: |
    `remove` удаляет по значению, `pop()` — последний элемент и возвращает его.
  answer: |
    Ответ:
    ```python
    cart.remove("кружка")
    last = cart.pop()
    print(last)
    print(cart)
    ```
    Результат:
    ```
    тарелка
    ['чайник', 'ложка']
    ```
- title: Последние заказы
  text: |
    ```python
    orders = [1040, 1041, 1042, 1043, 1044]
    ```
    Напечатайте срезами первые три заказа и последние два.
  answer: |
    Ответ:
    ```python
    print(orders[:3])
    print(orders[-2:])
    ```
    Результат:
    ```
    [1040, 1041, 1042]
    [1043, 1044]
    ```
- title: Товар в начало
  text: |
    ```python
    cart = ["чайник", "ложка"]
    ```
    Если `"нож"` ещё нет в корзине, вставьте его первым. Напечатайте корзину.
  answer: |
    Ответ:
    ```python
    if "нож" not in cart:
        cart.insert(0, "нож")
    print(cart)
    ```
    Результат:
    ```
    ['нож', 'чайник', 'ложка']
    ```
- title: Заменить товар
  text: |
    ```python
    cart = ["нож", "чайник", "ложка"]
    ```
    Покупатель поменял чайник на термос. Замените элемент по его позиции, найдя её через `index`.
  answer: |
    Ответ:
    ```python
    position = cart.index("чайник")
    cart[position] = "термос"
    print(cart)
    ```
    Результат:
    ```
    ['нож', 'термос', 'ложка']
    ```
    Список изменяемый: элемент можно перезаписать по индексу.

- title: Уникальные просмотры
  text: |
    id товаров, которые открыл покупатель, по порядку:
    ```python
    viewed = [3, 7, 3, 12, 7, 3]
    ```
    Напечатайте, сколько **разных** товаров он посмотрел.
  answer: |
    Ответ:
    ```python
    print(len(set(viewed)))
    ```
    Результат:
    ```
    3
    ```
    Во множестве каждое значение хранится один раз — повторы отбрасываются сами.
- title: Общие покупки
  text: |
    id товаров, купленных двумя покупателями:
    ```python
    anna = {1, 2, 5, 6}
    oleg = {2, 3, 6}
    ```
    Напечатайте товары, которые купили оба.
  answer: |
    Ответ:
    ```python
    print(anna & oleg)
    ```
    Результат:
    ```
    {2, 6}
    ```
- title: Нет на складе
  text: |
    ```python
    cart = {1, 3, 4}
    in_stock = {1, 2, 4}
    ```
    Напечатайте товары из корзины, которых нет на складе.
  answer: |
    Ответ:
    ```python
    print(cart - in_stock)
    ```
    Результат:
    ```
    {3}
    ```
    Разность `a - b` — элементы `a`, которых нет в `b`; порядок важен: `in_stock - cart` дал бы `{2}`.
- title: Все проданные товары
  text: |
    ```python
    monday = {1, 2, 5}
    tuesday = {2, 3, 6}
    ```
    Сколько разных товаров продали за два дня?
  answer: |
    Ответ:
    ```python
    print(len(monday | tuesday))
    ```
    Результат:
    ```
    5
    ```
- title: Чёрный список
  text: |
    ```python
    blocked = {"spam@mail.ru", "bot@shop.test"}
    email = "bot@shop.test"
    ```
    Напечатайте `Регистрация запрещена`, если адрес в чёрном списке, иначе `Добро пожаловать`.
  answer: |
    Ответ:
    ```python
    if email in blocked:
        print("Регистрация запрещена")
    else:
        print("Добро пожаловать")
    ```
    Результат:
    ```
    Регистрация запрещена
    ```
    Проверка `in` во множестве не перебирает все элементы, поэтому быстра даже на миллионе адресов.

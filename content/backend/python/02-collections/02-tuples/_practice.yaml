- title: Позиция заказа
  text: |
    Позиция заказа — кортеж `(id товара, количество)`:
    ```python
    item = (17, 3)
    ```
    Распакуйте его в две переменные и напечатайте `Товар 17, количество 3`.
  answer: |
    Ответ:
    ```python
    product_id, quantity = item
    print(f"Товар {product_id}, количество {quantity}")
    ```
    Результат:
    ```
    Товар 17, количество 3
    ```
- title: Промежуточные склады
  text: |
    Маршрут доставки:
    ```python
    route = ("Москва", "Тверь", "Клин", "Санкт-Петербург")
    ```
    Распакуйте его в `start`, `stops` и `finish` одной строкой и напечатайте `stops`.
  hint: |
    Звёздочка перед именем собирает «всё остальное» в список.
  answer: |
    Ответ:
    ```python
    start, *stops, finish = route
    print(stops)
    ```
    Результат:
    ```
    ['Тверь', 'Клин']
    ```
    Остаток после звёздочки — всегда список, даже если исходные данные в кортеже.
- title: Один размер
  text: |
    У товара один размер, но `len` показывает 2:
    ```python
    sizes = ("XL")
    print(len(sizes))
    ```
    Исправьте так, чтобы `sizes` был кортежем из одного элемента.
  answer: |
    Ответ:
    ```python
    sizes = ("XL",)
    print(len(sizes), type(sizes))
    ```
    Результат:
    ```
    1 <class 'tuple'>
    ```
    Кортеж делает запятая, а не скобки. `("XL")` — просто строка в скобках.
- title: Обмен без третьей переменной
  text: |
    ```python
    old_price = 2490
    new_price = 2990
    ```
    Поменяйте значения местами одной строкой и напечатайте обе переменные.
  answer: |
    Ответ:
    ```python
    old_price, new_price = new_price, old_price
    print(old_price, new_price)
    ```
    Результат:
    ```
    2990 2490
    ```
    Справа сначала собирается кортеж `(2990, 2490)`, потом он распаковывается в имена слева.

- title: Итог корзины
  text: |
    ```python
    prices = [2490, 390, 890, 120]
    ```
    Напечатайте сумму, самую низкую и самую высокую цену.
  answer: |
    Ответ:
    ```python
    print(sum(prices), min(prices), max(prices))
    ```
    Результат:
    ```
    3890 120 2490
    ```
- title: Есть ли товар не в наличии
  text: |
    Остатки товаров корзины:
    ```python
    stocks = [3, 0, 12]
    ```
    Напечатайте, есть ли товар, которого нет на складе, и все ли товары в наличии.
  answer: |
    Ответ:
    ```python
    print(any(stock == 0 for stock in stocks))
    print(all(stock > 0 for stock in stocks))
    ```
    Результат:
    ```
    True
    False
    ```
- title: Дорогие сначала
  text: |
    ```python
    prices = [2490, 390, 890, 120]
    ```
    Напечатайте цены по убыванию, а затем исходный список — он не должен измениться.
  answer: |
    Ответ:
    ```python
    print(sorted(prices, reverse=True))
    print(prices)
    ```
    Результат:
    ```
    [2490, 890, 390, 120]
    [2490, 390, 890, 120]
    ```
    `sorted` возвращает новый список, а `prices.sort()` изменил бы исходный.
- title: Нумерованный список
  text: |
    ```python
    names = ["Чайник", "Кружка", "Лейка"]
    ```
    Напечатайте `1. Чайник`, `2. Кружка`, `3. Лейка` без ручного счётчика.
  answer: |
    Ответ:
    ```python
    for number, name in enumerate(names, start=1):
        print(f"{number}. {name}")
    ```
    Результат:
    ```
    1. Чайник
    2. Кружка
    3. Лейка
    ```
- title: Два списка в словарь
  text: |
    ```python
    names = ["Чайник", "Кружка", "Лейка"]
    prices = [2490, 390, 890]
    ```
    Соберите словарь `{название: цена}` и напечатайте сумму позиций дороже 500 ₽.
  answer: |
    Ответ:
    ```python
    catalog = dict(zip(names, prices))
    print(catalog)
    print(sum(p for p in catalog.values() if p > 500))
    ```
    Результат:
    ```
    {'Чайник': 2490, 'Кружка': 390, 'Лейка': 890}
    3380
    ```
    `zip` идёт по двум спискам параллельно и выдаёт пары, из пар `dict` собирает словарь.

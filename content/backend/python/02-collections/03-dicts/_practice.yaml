- title: Цена и скидка товара
  text: |
    ```python
    product = {"id": 17, "name": "Чайник Steel", "price": 2490}
    ```
    Напечатайте цену товара и его скидку. Скидки в словаре нет — вместо ошибки должен получиться `0`.
  answer: |
    Ответ:
    ```python
    print(product["price"], product.get("discount", 0))
    ```
    Результат:
    ```
    2490 0
    ```
    `product["discount"]` упал бы с `KeyError`, а `get` возвращает значение по умолчанию.
- title: Обновить карточку
  text: |
    ```python
    product = {"id": 17, "name": "Чайник Steel", "price": 2490}
    ```
    Снизьте цену до 2290 и добавьте остаток на складе — 5 штук. Напечатайте словарь без названия, а затем его ключи.
  answer: |
    Ответ:
    ```python
    product["price"] = 2290
    product["stock"] = 5
    print(product["price"], product["stock"])
    print(list(product))
    ```
    Результат:
    ```
    2290 5
    ['id', 'name', 'price', 'stock']
    ```
    Присваивание по существующему ключу меняет значение, по новому — добавляет пару в конец.
- title: Прайс-лист
  text: |
    ```python
    prices = {"чайник": 2490, "кружка": 390, "ложка": 120}
    ```
    Напечатайте каждый товар строкой `чайник: 2490 ₽`.
  answer: |
    Ответ:
    ```python
    for name, price in prices.items():
        print(f"{name}: {price} ₽")
    ```
    Результат:
    ```
    чайник: 2490 ₽
    кружка: 390 ₽
    ложка: 120 ₽
    ```
- title: Покупки по категориям
  text: |
    Категории купленных товаров:
    ```python
    categories = ["кухня", "дом", "кухня", "сад", "кухня"]
    ```
    Посчитайте, сколько покупок в каждой категории, и напечатайте словарь.
  hint: |
    `counts.get(category, 0) + 1` — текущее число или 0, если категории ещё нет.
  answer: |
    Ответ:
    ```python
    counts = {}
    for category in categories:
        counts[category] = counts.get(category, 0) + 1
    print(counts)
    ```
    Результат:
    ```
    {'кухня': 3, 'дом': 1, 'сад': 1}
    ```
- title: Убрать из прайса
  text: |
    ```python
    prices = {"чайник": 2490, "кружка": 390, "ложка": 120}
    ```
    Уберите ложку так, чтобы её цена напечаталась, затем напечатайте словарь.
  answer: |
    Ответ:
    ```python
    removed = prices.pop("ложка")
    print(removed)
    print(prices)
    ```
    Результат:
    ```
    120
    {'чайник': 2490, 'кружка': 390}
    ```

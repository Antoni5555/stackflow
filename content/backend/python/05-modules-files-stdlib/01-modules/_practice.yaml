- title: Сколько коробок
  text: |
    50 кружек раскладывают по коробкам по 12 штук. Неполная коробка — тоже коробка. Посчитайте их число функцией `ceil` из модуля `math`.
  answer: |
    Ответ:
    ```python
    import math

    print(math.ceil(50 / 12))
    ```
    Результат:
    ```
    5
    ```
    `ceil` округляет вверх. `50 // 12` дал бы 4 и потерял неполную коробку.
- title: Импорт имени с псевдонимом
  text: |
    Импортируйте `Decimal` под коротким именем `D` и напечатайте сумму `D("0.1") + D("0.2")`.
  answer: |
    Ответ:
    ```python
    from decimal import Decimal as D

    print(D("0.1") + D("0.2"))
    ```
    Результат:
    ```
    0.3
    ```
    `from … import … as …` берёт из модуля одно имя и даёт ему своё.
- title: Запуск только напрямую
  text: |
    Модуль `report.py` должен печатать отчёт, только когда его запускают, а при импорте — нет. Оформите вызов `main()` так, как это делают в модулях.
    ```python
    def main():
        print("Отчёт за ноябрь готов")
    ```
  answer: |
    Ответ:
    ```python
    if __name__ == "__main__":
        main()
    print(__name__)
    ```
    Результат:
    ```
    Отчёт за ноябрь готов
    __main__
    ```
    У запущенного файла `__name__` равно `"__main__"`, у импортированного — имени модуля, и `main()` не вызовется.
- title: Что есть в модуле
  text: |
    Напечатайте имена из модуля `string`, которые начинаются с `ascii`, и значение `string.digits`.
  hint: |
    Список имён модуля возвращает `dir(модуль)`.
  answer: |
    Ответ:
    ```python
    import string

    print([name for name in dir(string) if name.startswith("ascii")])
    print(string.digits)
    ```
    Результат:
    ```
    ['ascii_letters', 'ascii_lowercase', 'ascii_uppercase']
    0123456789
    ```

- title: Формат артикула
  text: |
    Артикул: две заглавные латинские буквы, дефис, 4 цифры года, дефис, 3 цифры номера.
    ```python
    skus = ["SH-2024-017", "sh-2024-017", "SH-24-017", "SH-2024-0170"]
    ```
    Напечатайте для каждого, подходит ли он.
  answer: |
    Ответ:
    ```python
    import re

    for sku in skus:
        print(sku, bool(re.fullmatch(r"[A-Z]{2}-\d{4}-\d{3}", sku)))
    ```
    Результат:
    ```
    SH-2024-017 True
    sh-2024-017 False
    SH-24-017 False
    SH-2024-0170 False
    ```
    `fullmatch` требует совпадения всей строки. `search` нашёл бы шаблон и внутри `SH-2024-0170`.
- title: Цифры телефона
  text: |
    ```python
    phone = "+7 (912) 345-67-89"
    ```
    Оставьте только цифры одним вызовом `re.sub`.
  answer: |
    Ответ:
    ```python
    import re

    print(re.sub(r"\D", "", phone))
    ```
    Результат:
    ```
    79123456789
    ```
    `\D` — любой символ, кроме цифры. Заменяем все такие на пустую строку.
- title: Номер заказа из письма
  text: |
    ```python
    text = "Здравствуйте! Заказ №1042 от 17.11.2026 передан в доставку."
    ```
    Достаньте номер заказа и дату с помощью групп.
  answer: |
    Ответ:
    ```python
    import re

    match = re.search(r"№(\d+) от (\d{2}\.\d{2}\.\d{4})", text)
    print(match.group(1), match.group(2))
    ```
    Результат:
    ```
    1042 17.11.2026
    ```
    Точка в шаблоне — «любой символ», поэтому настоящую точку экранируем: `\.`.
- title: Все цены в тексте
  text: |
    ```python
    text = "Чайник — 2490 ₽, кружка — 390 ₽, доставка — 300 ₽"
    ```
    Найдите все цены и напечатайте их сумму.
  answer: |
    Ответ:
    ```python
    import re

    prices = re.findall(r"(\d+) ₽", text)
    print(prices, sum(int(p) for p in prices))
    ```
    Результат:
    ```
    ['2490', '390', '300'] 3180
    ```
    С одной группой `findall` возвращает только её содержимое — без « ₽».

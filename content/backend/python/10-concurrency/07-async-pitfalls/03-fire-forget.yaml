title: "Письмо не ушло"
type: quiz
kind: single
difficulty: 2
pitfall: "Задачу, которую не дождались, asyncio.run отменяет при выходе; её ошибка теряется."
statement: |
  ```python
  async def main():
      asyncio.create_task(send_welcome_mail(user))   # 0,5 с
      return "регистрация завершена"


  print(asyncio.run(main()))
  ```
  Регистрация печатается, но письма пользователи не получают. Почему?
options:
  - "`create_task` не запускает корутину без `await`"
  - "`main` закончилась сразу, `asyncio.run` завершился и отменил незаконченную задачу"
  - "Письма уходят, но в спам"
  - "Нужен `asyncio.gather`, иначе задачи в Python не работают"
answer: [1]
explanation: |
  Задача стартовала, но `main` вернула результат, не дожидаясь её. Выходя, `asyncio.run` отменяет все незавершённые задачи — письмо так и не отправилось, а если бы в нём была ошибка, её никто бы не увидел. Задачу сохраняют и дожидаются (`await task` перед выходом) или запускают в `TaskGroup`. В веб-сервере такие «фоновые» письма отдают очереди задач (Celery).

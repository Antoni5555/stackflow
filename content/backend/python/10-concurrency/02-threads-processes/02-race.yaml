title: "Минус один на складе"
type: quiz
kind: single
difficulty: 2
pitfall: "«Проверить, потом изменить» в потоках — гонка: между проверкой и изменением другой поток успевает сделать то же."
statement: |
  ```python
  def reserve(qty):
      global stock
      if stock >= qty:
          price = ask_bank(qty)      # 0,2 с ожидания сети
          stock -= qty
          return price
  ```
  Остаток — 2. Два потока одновременно вызвали `reserve(2)`. Что может получиться?
options:
  - "Только один резерв: Python не даст двум потокам войти в функцию"
  - "Оба резерва и остаток `-2`: оба потока прошли проверку, пока первый ждал банк"
  - "Ошибка `RuntimeError: stock changed`"
  - "Второй поток подождёт первого, потому что GIL"
answer: [1]
explanation: |
  GIL защищает внутренности интерпретатора, а не вашу логику: пока первый поток ждёт банк, GIL свободен, второй выполняет ту же проверку и тоже видит `stock = 2`. Проверку и изменение объединяют под одним `with lock:` — или, если остаток в базе, делают атомарным запросом в транзакции.

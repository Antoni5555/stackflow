title: "Не больше трёх запросов к доставке"
type: exercise
difficulty: 2
pitfall: "Один семафор на все корутины, создаётся снаружи; запрос — внутри async with sem."
statement: |
  Служба доставки разрешает не больше `limit` одновременных запросов. Напишите `statuses(order_ids, limit)`: запрашивает `delivery_status(id)` для всех заказов одновременно, но не больше `limit` сразу, и возвращает список статусов в порядке `order_ids`. Функцию `delivery_status` не меняйте — она считает пик одновременных запросов.
starter_code: |
  import asyncio

  active = 0
  peak = 0


  async def delivery_status(order_id):
      global active, peak
      active += 1
      peak = max(peak, active)
      await asyncio.sleep(0.05)
      active -= 1
      return f"{order_id}: в пути"


  print(asyncio.run(statuses([1, 2, 3, 4, 5], 2)), peak)
check:
  type: tests
  tests:
    - code: |
        g = delivery_status.__globals__
        g["peak"] = 0
        result = asyncio.run(statuses(list(range(1, 11)), 3))
        assert result == [f"{i}: в пути" for i in range(1, 11)]
        assert g["peak"] == 3, g["peak"]
      fail: "Все статусы по порядку, и одновременно в службе — ровно limit запросов (пик 3)."
    - code: |
        import time
        g = delivery_status.__globals__
        g["peak"] = 0
        start = time.perf_counter()
        asyncio.run(statuses(list(range(1, 7)), 2))
        elapsed = time.perf_counter() - start
        assert g["peak"] == 2 and 0.15 <= elapsed < 0.25, (g["peak"], elapsed)
      fail: "6 запросов по 0,05 с при limit = 2 — три волны, около 0,15 с. Семафор один на все корутины?"
    - code: |
        g = delivery_status.__globals__
        g["peak"] = 0
        assert asyncio.run(statuses([], 3)) == [] and g["peak"] == 0
      fail: "Пустой список — пустой результат."
solution: |
  import asyncio

  active = 0
  peak = 0


  async def delivery_status(order_id):
      global active, peak
      active += 1
      peak = max(peak, active)
      await asyncio.sleep(0.05)
      active -= 1
      return f"{order_id}: в пути"


  async def statuses(order_ids, limit):
      sem = asyncio.Semaphore(limit)

      async def one(order_id):
          async with sem:
              return await delivery_status(order_id)

      return await asyncio.gather(*(one(i) for i in order_ids))


  print(asyncio.run(statuses([1, 2, 3, 4, 5], 2)), peak)
hints:
  - "Создайте `asyncio.Semaphore(limit)` один раз в `statuses` и оберните каждый запрос в `async with sem:`."
  - "Вложенная корутина `one(order_id)`: `async with sem: return await delivery_status(order_id)`; затем `gather` по всем."
explanation: |
  Семафор общий для всех корутин, поэтому внутри одновременно не больше `limit` запросов, а остальные ждут пропуска. Если бы `Semaphore(limit)` создавался внутри `one`, у каждого запроса был бы свой семафор и ограничение не работало бы.

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" class="fig" role="img" aria-labelledby="t"><title id="t">Семафор пропускает по три запроса; очередь раздаёт заказы двум обработчикам</title>
<style>
.fig text{white-space:pre}
.fig-t{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:14px;fill:#0e0e0e;fill:var(--text,#0e0e0e)}
.fig-c{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:14px;fill:#0e0e0e;fill:var(--text,#0e0e0e)}
.fig-cs{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:12px;fill:#0e0e0e;fill:var(--text,#0e0e0e)}
.fig-h{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:12px;letter-spacing:.04em;text-transform:uppercase;fill:#6e6e6a;fill:var(--muted,#6e6e6a)}
.fig-s{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:12px;fill:#6e6e6a;fill:var(--muted,#6e6e6a)}
.fig-box{fill:#ffffff;fill:var(--surface,#ffffff);stroke:#e0e0dc;stroke:var(--border,#e0e0dc);stroke-width:1.5}
.fig-box2{fill:#ebebe8;fill:var(--surface-2,#ebebe8);stroke:#e0e0dc;stroke:var(--border,#e0e0dc);stroke-width:1.5}
.fig-acc{fill:#dcf25c;fill:var(--accent,#dcf25c)}
.fig-onacc{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:13px;fill:#0e0e0e;fill:var(--on-accent,#0e0e0e)}
.fig-ln{stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5;fill:none}
.fig-lnd{stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.fig-ah{fill:#6e6e6a;fill:var(--muted,#6e6e6a)}
.fig-err{fill:#fdecea;fill:var(--error-bg,#fdecea);stroke:#d93025;stroke:var(--error,#d93025);stroke-width:1.5}
.fig-errt{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:13px;fill:#d93025;fill:var(--error,#d93025)}
.fig-ok{fill:#e7f6ec;fill:var(--success-bg,#e7f6ec);stroke:#1f9d55;stroke:var(--success,#1f9d55);stroke-width:1.5}
.fig-dash{fill:none;stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5;stroke-dasharray:5 4}
.fig-term{fill:#0d0d0f;fill:var(--term-bg,#0d0d0f)}
.fig-tt{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:13px;fill:#e6e6e3;fill:var(--term-text,#e6e6e3)}
.fig-tterr{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:13px;fill:#f87171}
.fig-m1{fill:#dbe4ff;fill:var(--match-1,#dbe4ff)}
.fig-m2{fill:#ffe3e3;fill:var(--match-2,#ffe3e3)}
.fig-m3{fill:#d3f9d8;fill:var(--match-3,#d3f9d8)}
.fig-venn{fill-opacity:.75;stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fig-ah"/></marker></defs>
<text x="20" y="30" text-anchor="start" class="fig-t">Semaphore(3): 10 запросов по 0,1 с</text>
<rect x="20" y="44" width="90" height="26" rx="6" class="fig-acc"/>
<text x="65.0" y="62.0" text-anchor="middle" class="fig-onacc">запрос 1</text>
<rect x="20" y="76" width="90" height="26" rx="6" class="fig-acc"/>
<text x="65.0" y="94.0" text-anchor="middle" class="fig-onacc">запрос 2</text>
<rect x="20" y="108" width="90" height="26" rx="6" class="fig-acc"/>
<text x="65.0" y="126.0" text-anchor="middle" class="fig-onacc">запрос 3</text>
<rect x="120" y="44" width="90" height="26" rx="6" class="fig-box"/>
<text x="165.0" y="62.0" text-anchor="middle" class="fig-cs">запрос 4</text>
<rect x="120" y="76" width="90" height="26" rx="6" class="fig-box"/>
<text x="165.0" y="94.0" text-anchor="middle" class="fig-cs">запрос 5</text>
<rect x="120" y="108" width="90" height="26" rx="6" class="fig-box"/>
<text x="165.0" y="126.0" text-anchor="middle" class="fig-cs">запрос 6</text>
<rect x="220" y="44" width="90" height="26" rx="6" class="fig-box"/>
<text x="265.0" y="62.0" text-anchor="middle" class="fig-cs">запрос 7</text>
<rect x="220" y="76" width="90" height="26" rx="6" class="fig-box"/>
<text x="265.0" y="94.0" text-anchor="middle" class="fig-cs">запрос 8</text>
<rect x="220" y="108" width="90" height="26" rx="6" class="fig-box"/>
<text x="265.0" y="126.0" text-anchor="middle" class="fig-cs">запрос 9</text>
<rect x="320" y="44" width="90" height="26" rx="6" class="fig-box"/>
<text x="365.0" y="62.0" text-anchor="middle" class="fig-cs">запрос 10</text>
<text x="20" y="166" text-anchor="start" class="fig-s">4 волны × 0,1 с = 0,4 с; одновременно — не больше 3</text>
<rect x="460" y="20" width="400" height="200" rx="12" class="fig-box2"/>
<text x="476" y="46" text-anchor="start" class="fig-cs">asyncio.Queue</text>
<text x="476" y="74" text-anchor="start" class="fig-s">производитель: put(1) … put(6)</text>
<rect x="476" y="86" width="34" height="26" rx="4" class="fig-box"/>
<text x="493.0" y="104.0" text-anchor="middle" class="fig-cs">1</text>
<rect x="516" y="86" width="34" height="26" rx="4" class="fig-box"/>
<text x="533.0" y="104.0" text-anchor="middle" class="fig-cs">2</text>
<rect x="556" y="86" width="34" height="26" rx="4" class="fig-box"/>
<text x="573.0" y="104.0" text-anchor="middle" class="fig-cs">3</text>
<rect x="596" y="86" width="34" height="26" rx="4" class="fig-box"/>
<text x="613.0" y="104.0" text-anchor="middle" class="fig-cs">4</text>
<rect x="636" y="86" width="34" height="26" rx="4" class="fig-box"/>
<text x="653.0" y="104.0" text-anchor="middle" class="fig-cs">5</text>
<rect x="676" y="86" width="34" height="26" rx="4" class="fig-box"/>
<text x="693.0" y="104.0" text-anchor="middle" class="fig-cs">6</text>
<path d="M560 112V140" class="fig-ln" marker-end="url(#a)"/>
<path d="M700 112V140" class="fig-ln" marker-end="url(#a)"/>
<rect x="476" y="144" width="170" height="30" rx="6" class="fig-ok"/>
<text x="561.0" y="164.0" text-anchor="middle" class="fig-cs">w1: 1, 3, 5</text>
<rect x="660" y="144" width="170" height="30" rx="6" class="fig-ok"/>
<text x="745.0" y="164.0" text-anchor="middle" class="fig-cs">w2: 2, 4, 6</text>
<text x="476" y="204" text-anchor="start" class="fig-s">task_done() после каждого; join() ждёт все</text>
<rect x="20" y="250" width="400" height="30" rx="6" class="fig-err"/>
<text x="220.0" y="270.0" text-anchor="middle" class="fig-errt">без lock: Анна и Борис купили, stock = -1</text>
<rect x="20" y="288" width="400" height="30" rx="6" class="fig-ok"/>
<text x="220.0" y="308.0" text-anchor="middle" class="fig-cs">async with lock: Борис — нет в наличии, stock = 0</text>
<text x="460" y="270" text-anchor="start" class="fig-s">Гонка в asyncio — на await между</text>
<text x="460" y="294" text-anchor="start" class="fig-s">проверкой остатка и списанием.</text>
</svg>

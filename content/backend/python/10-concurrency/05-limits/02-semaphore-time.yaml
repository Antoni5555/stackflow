title: "Сколько с семафором"
type: quiz
kind: single
difficulty: 2
pitfall: "Семафор на n пропускает запросы волнами по n: время ≈ ceil(всего / n) × длительность."
statement: |
  20 запросов, каждый 1 секунду. Запускают через `gather`, внутри каждого — `async with sem:`, где `sem = asyncio.Semaphore(5)`. Сколько примерно займёт всё?
options:
  - "1 секунда — `gather` запускает всё сразу"
  - "4 секунды"
  - "20 секунд — семафор делает запросы последовательными"
  - "5 секунд"
answer: [1]
explanation: |
  Одновременно внутри — не больше пяти: 20 запросов проходят четырьмя волнами по 5, каждая — 1 секунда. Семафор не делает код последовательным, он ограничивает ширину: при `Semaphore(1)` было бы 20 секунд, без него — 1 секунда и 20 одновременных запросов к сервису.

title: "Потоки для вычислений"
type: quiz
kind: single
difficulty: 2
pitfall: "Из-за GIL потоки не ускоряют вычисления — переключения даже добавляют накладные расходы."
statement: |
  Программа по очереди считает 4 отчёта, каждый — 1 секунда работы процессора, без сети и диска. Её переписали на 4 потока (`ThreadPoolExecutor`). Что будет со временем в обычном CPython?
options:
  - "Около 0,25 секунды — в 4 раза быстрее"
  - "Около 4 секунд или чуть больше — быстрее не станет"
  - "Около 1 секунды — по самому долгому отчёту"
  - "Программа упадёт с ошибкой GIL"
answer: [1]
explanation: |
  GIL пропускает к выполнению Python-кода один поток за раз, а ждать здесь нечего — потоки просто делят одно ядро и тратят время на переключения. Для вычислений берут процессы (`ProcessPoolExecutor`). Потоки выигрывают только на ожидании.

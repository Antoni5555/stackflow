title: "Когда переключается asyncio"
type: quiz
kind: single
difficulty: 2
pitfall: "Корутина отдаёт управление только на await; код без await выполняется целиком, не пуская другие."
statement: |
  В каком месте цикл событий asyncio может переключиться с одной корутины на другую?
options:
  - "В любой момент, как поток"
  - "Только на `await`, когда корутина ждёт"
  - "После каждой строки кода"
  - "Только когда корутина закончилась"
answer: [1]
explanation: |
  Корутина сама приостанавливает себя на `await` и отдаёт управление циклу событий — «тут я жду». Между `await` её никто не прервёт. Поэтому в уроке два «тяжёлых» вычисления без `await` выполнились строго друг за другом, а цикл, где нет `await`, останавливает все остальные задачи.

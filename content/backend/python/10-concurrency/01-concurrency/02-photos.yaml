title: "Сжать 1000 фото"
type: quiz
kind: single
difficulty: 1
pitfall: "Вычисления ускоряют только процессы: потоки упираются в GIL, asyncio переключается лишь на await."
statement: |
  Нужно сжать 1000 фото товаров, каждое — 0,5 секунды работы процессора. На сервере 4 ядра. Что ускорит работу?
options:
  - "`asyncio.gather` на 1000 корутин"
  - "Пул из 4 процессов"
  - "Пул из 100 потоков"
  - "Ничего: Python не умеет работать параллельно"
answer: [1]
explanation: |
  Сжатие — вычисления, а не ожидание. Потоки делят один GIL и выполняются по очереди, корутины переключаются только на `await`, которого при счёте нет. Процессы работают на разных ядрах, у каждого свой GIL: четыре процесса — почти вчетверо быстрее.

title: "Распараллелить расчёт корзины"
type: quiz
kind: single
difficulty: 2
pitfall: "Распараллеливание стоит дорого: процесс запускается десятки миллисекунд — мелкие задачи так только замедлить."
statement: |
  Расчёт суммы корзины занимает 2 мс работы процессора. Коллега предлагает считать каждую корзину в отдельном процессе, «чтобы было быстрее». Что скажете?
options:
  - "Отличная идея: процессы обходят GIL"
  - "Запуск процесса стоит дороже самой задачи — станет медленнее; оставить обычный вызов"
  - "Лучше потоки — они легче процессов и ускорят счёт"
  - "Лучше asyncio — он самый лёгкий"
answer: [1]
explanation: |
  Создать процесс и передать ему данные — десятки миллисекунд, а работа — 2 мс. Потоки и asyncio не ускорят вычисления вовсе. Распараллеливают долгие задачи или большие пачки задач; быстрые выполняют как есть.

title: "10 000 соединений"
type: quiz
kind: single
difficulty: 2
pitfall: "Много соединений, которые почти всё время ждут, — задача для asyncio: корутина дешевле потока."
statement: |
  Чат поддержки держит 10 000 открытых соединений. Каждое почти всё время ждёт сообщения и иногда пересылает пару строк. Какой подход подходит лучше всего?
options:
  - "Процесс на каждое соединение"
  - "Поток на каждое соединение"
  - "asyncio: корутина на соединение в одном потоке"
  - "Обрабатывать соединения по очереди в одном потоке без async"
answer: [2]
explanation: |
  Задача — ожидание, и её очень много. Процессы и потоки на каждое соединение съедят память и время на переключения. Корутина весит килобайты, и десятки тысяч живут в одном потоке. По очереди без async нельзя: пока ждём одного клиента, остальные висят.

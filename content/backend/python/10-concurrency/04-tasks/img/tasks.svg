<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" class="fig" role="img" aria-labelledby="t"><title id="t">Банк упал: gather отдаёт ошибку, остальные работают впустую; TaskGroup отменяет остальных</title>
<style>

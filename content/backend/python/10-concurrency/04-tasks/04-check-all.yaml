title: "Склад, банк и доставка одновременно"
type: exercise
difficulty: 2
pitfall: "Независимые запросы запускают вместе через gather: время — по самому медленному."
statement: |
  Сервисы уже написаны. Напишите корутину `check_all(product_id, amount)`, которая **одновременно** вызывает `stock(product_id)`, `limit(amount)` и `delivery_days(product_id)` и возвращает словарь:
  ```
  {"stock": …, "limit_ok": …, "days": …}
  ```
  Сервисы ждут 0,1, 0,15 и 0,1 с — вся проверка должна занять около 0,15 с.
starter_code: |
  import asyncio
  import time


  async def stock(product_id):
      await asyncio.sleep(0.1)
      return {1: 3, 2: 0}[product_id]


  async def limit(amount):
      await asyncio.sleep(0.15)
      return amount <= 50_000


  async def delivery_days(product_id):
      await asyncio.sleep(0.1)
      return 2


  print(asyncio.run(check_all(1, 2490)))
check:
  type: tests
  tests:
    - code: |
        assert asyncio.run(check_all(1, 2490)) == {"stock": 3, "limit_ok": True, "days": 2}
        assert asyncio.run(check_all(2, 90_000)) == {"stock": 0, "limit_ok": False, "days": 2}
      fail: "check_all возвращает {\"stock\": …, \"limit_ok\": …, \"days\": …} от трёх сервисов."
    - code: |
        start = time.perf_counter()
        asyncio.run(check_all(1, 2490))
        elapsed = time.perf_counter() - start
        assert 0.15 <= elapsed < 0.25, elapsed
      fail: "Проверка должна занять около 0,15 с — по самому медленному сервису. Сервисы вызываются одновременно?"
solution: |
  import asyncio
  import time


  async def stock(product_id):
      await asyncio.sleep(0.1)
      return {1: 3, 2: 0}[product_id]


  async def limit(amount):
      await asyncio.sleep(0.15)
      return amount <= 50_000


  async def delivery_days(product_id):
      await asyncio.sleep(0.1)
      return 2


  async def check_all(product_id, amount):
      left, limit_ok, days = await asyncio.gather(
          stock(product_id), limit(amount), delivery_days(product_id)
      )
      return {"stock": left, "limit_ok": limit_ok, "days": days}


  print(asyncio.run(check_all(1, 2490)))
hints:
  - "Три независимых запроса — один `gather`. В каком порядке он вернёт результаты?"
  - "`left, limit_ok, days = await asyncio.gather(stock(…), limit(…), delivery_days(…))`."
explanation: |
  `gather` вернул результаты в порядке аргументов — их удобно распаковать в три переменные. Время — по самому медленному сервису (0,15 с), а не сумма 0,35 с. Тест времени проверяет: нижняя граница — сам медленный сервис, верхняя — с запасом.

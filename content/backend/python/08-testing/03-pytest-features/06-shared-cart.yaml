title: Тест проходит только в компании
type: quiz
kind: single
difficulty: 2
pitfall: Тесты, которые меняют общий объект модуля, зависят от порядка запуска.
statement: |
  ```python
  cart = Cart()


  def test_add():
      cart.add(4, 1499)
      assert cart.total() == 1499


  def test_remove():
      cart.remove(4)
      assert cart.total() == 0
  ```
  Весь файл проходит. Что будет, если запустить только `test_remove` (`pytest test_cart.py::test_remove`)?
options:
  - "Пройдёт: pytest всегда запускает тесты файла по порядку"
  - "Упадёт: корзина пуста, `remove(4)` выбросит `KeyError`"
  - "Пройдёт: `total()` пустой корзины — 0"
  - "pytest откажется запускать один тест из файла"
answer: [1]
explanation: |
  `test_remove` рассчитывает, что товар добавил `test_add`, — тесты связаны общим объектом модуля. Отдельно (или в другом порядке, или параллельно) тест падает. Каждый тест должен сам готовить свои данные — для этого фикстура: она создаёт новую корзину для каждого теста.

title: Две проверки в одном raises
type: quiz
kind: single
difficulty: 2
pitfall: Код в блоке pytest.raises после строки с исключением не выполняется.
statement: |
  Тест должен проверить, что и 0, и 100 штук дают ошибку:
  ```python
  def test_invalid_quantity():
      with pytest.raises(ValueError):
          add_to_cart({}, 4, 0)
          add_to_cart({}, 4, 100)
  ```
  Функцию сломали: 100 штук теперь добавляются без ошибки, а 0 по-прежнему даёт `ValueError`. Что покажет тест?
options:
  - "`FAILED` — вторая строка не выбросила исключение"
  - "`PASSED` — вторая строка не выполнялась"
  - "`FAILED` — исключений было больше одного"
  - "`ERROR` — в блоке `pytest.raises` можно только одну строку"
answer: [1]
explanation: |
  Первый вызов выбросил `ValueError`, блок `with` сразу завершился, и `pytest.raises` засчитал проверку. Строка со 100 штуками не выполнилась вовсе — поломку никто не заметил. В блоке `pytest.raises` пишут ровно один вызов; несколько значений проверяют через `parametrize` или отдельными блоками.

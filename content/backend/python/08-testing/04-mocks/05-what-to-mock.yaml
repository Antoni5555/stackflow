title: Что подменять в тесте
type: quiz
kind: multiple
difficulty: 2
pitfall: Если подменить собственную логику, тест проверяет только заглушки.
statement: |
  Пишем тесты функции оформления заказа. Что из этого стоит подменить заглушкой?
options:
  - Списание денег через платёжный шлюз банка
  - Отправку письма покупателю
  - Расчёт скидки по промокоду (своя функция магазина)
  - Текущее время — от него зависит, действует ли промокод
  - Подсчёт суммы корзины (свой класс `Cart`)
answer: [0, 1, 3]
explanation: |
  Подменяют внешнее и непредсказуемое: банк и почту (сеть, деньги, чужой сервер) и текущее время (тест должен давать один результат в любой день). Скидку и корзину писали вы, и именно их тест должен проверять: если заменить их заглушками, тест подтвердит только то, что заглушки вернули заданные числа.

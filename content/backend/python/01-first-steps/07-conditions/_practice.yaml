- title: Стоимость доставки
  text: |
    Доставка бесплатна от 3000 ₽, иначе стоит 300 ₽:
    ```python
    total = 2700
    ```
    Напечатайте `Доставка: бесплатно` или `Доставка: 300 ₽`.
  answer: |
    Ответ:
    ```python
    if total >= 3000:
        print("Доставка: бесплатно")
    else:
        print("Доставка: 300 ₽")
    ```
    Результат:
    ```
    Доставка: 300 ₽
    ```
- title: Уровень скидки
  text: |
    Скидка зависит от суммы: от 10 000 ₽ — 10 %, от 5000 ₽ — 5 %, иначе 0 %.
    ```python
    total = 5200
    ```
    Напечатайте `Скидка 5 %` (число — по сумме).
  hint: |
    Проверяйте условия от большего порога к меньшему: первое совпавшее выполнится, остальные — нет.
  answer: |
    Ответ:
    ```python
    if total >= 10000:
        discount = 10
    elif total >= 5000:
        discount = 5
    else:
        discount = 0
    print(f"Скидка {discount} %")
    ```
    Результат:
    ```
    Скидка 5 %
    ```
- title: Подпись наличия
  text: |
    Напечатайте `в наличии` или `нет в наличии` одной строкой с условным выражением:
    ```python
    stock = 0
    ```
  answer: |
    Ответ:
    ```python
    label = "в наличии" if stock > 0 else "нет в наличии"
    print(label)
    ```
    Результат:
    ```
    нет в наличии
    ```
- title: Статус заказа
  text: |
    По статусу заказа покажите покупателю сообщение: `new` — «Заказ создан», `paid` — «Заказ оплачен», `shipped` — «Заказ в пути», любой другой — «Статус неизвестен». Используйте `match`.
    ```python
    status = "shipped"
    ```
  answer: |
    Ответ:
    ```python
    match status:
        case "new":
            print("Заказ создан")
        case "paid":
            print("Заказ оплачен")
        case "shipped":
            print("Заказ в пути")
        case _:
            print("Статус неизвестен")
    ```
    Результат:
    ```
    Заказ в пути
    ```
    `case _` срабатывает, если не подошёл ни один вариант выше.
- title: Проверка промокода
  text: |
    Промокод действует, если он не пустой и сумма заказа не меньше 1000 ₽. Напечатайте одно из сообщений: «Введите промокод», «Сумма заказа меньше 1000 ₽» или «Промокод применён».
    ```python
    code = "SALE10"
    total = 800
    ```
  answer: |
    Ответ:
    ```python
    if not code:
        print("Введите промокод")
    elif total < 1000:
        print("Сумма заказа меньше 1000 ₽")
    else:
        print("Промокод применён")
    ```
    Результат:
    ```
    Сумма заказа меньше 1000 ₽
    ```
    Сначала отсекаем ошибки, в `else` остаётся «всё в порядке» — так условие не приходится вкладывать.

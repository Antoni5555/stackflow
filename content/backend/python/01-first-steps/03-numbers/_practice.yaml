- title: Сумма позиции
  text: |
    Кружка стоит 349 ₽, в заказе 3 штуки:
    ```python
    price = 349
    quantity = 3
    ```
    Напечатайте сумму позиции.
  answer: |
    Ответ:
    ```python
    print(price * quantity)
    ```
    Результат:
    ```
    1047
    ```
- title: Товары по коробкам
  text: |
    На складе 50 кружек, в коробку входит 12. Напечатайте, сколько получится полных коробок и сколько кружек останется.
    ```python
    total = 50
    per_box = 12
    ```
  hint: |
    Целую часть деления даёт `//`, остаток — `%`.
  answer: |
    Ответ:
    ```python
    print(total // per_box, total % per_box)
    ```
    Результат:
    ```
    4 2
    ```
- title: Бонусные баллы
  text: |
    У покупателя 120 бонусов. За заказ начислили 35, потом 50 списали. Посчитайте остаток, используя сокращённое присваивание.
    ```python
    points = 120
    ```
  answer: |
    Ответ:
    ```python
    points += 35
    points -= 50
    print(points)
    ```
    Результат:
    ```
    105
    ```
- title: Средняя цена
  text: |
    Три товара в корзине стоят 2490, 390 и 120 ₽. Напечатайте среднюю цену, округлённую до двух знаков.
  answer: |
    Ответ:
    ```python
    average = (2490 + 390 + 120) / 3
    print(round(average, 2))
    ```
    Результат:
    ```
    1000.0
    ```
    Скобки нужны: без них сначала выполнилось бы деление `120 / 3`. Деление `/` всегда даёт `float`, даже если делится нацело.
- title: Скидка 15 % в деньгах
  text: |
    Цена товара — 2490.90 ₽. Посчитайте цену со скидкой 15 % без ошибок округления `float` и округлите до копеек.
  hint: |
    Для денег — `Decimal` из строки, округление до копеек — `quantize(Decimal("0.01"))`.
  answer: |
    Ответ:
    ```python
    from decimal import Decimal

    price = Decimal("2490.90")
    discounted = price * (1 - Decimal("0.15"))
    print(discounted.quantize(Decimal("0.01")))
    ```
    Результат:
    ```
    2117.26
    ```
    `Decimal("2490.90")` хранит число точно, как записано в строке, поэтому копейки не «плывут».

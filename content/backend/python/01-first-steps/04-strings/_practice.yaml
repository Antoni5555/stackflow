- title: Ценник
  text: |
    Дано:
    ```python
    name = "Чайник Steel"
    price = 2490
    ```
    Напечатайте ценник `Чайник Steel — 2490 ₽` с помощью f-строки.
  answer: |
    Ответ:
    ```python
    print(f"{name} — {price} ₽")
    ```
    Результат:
    ```
    Чайник Steel — 2490 ₽
    ```
- title: Телефон из формы
  text: |
    Покупатель ввёл телефон с пробелами, скобками и дефисами:
    ```python
    phone = "+7 (912) 345-67-89"
    ```
    Оставьте только `+` и цифры: `+79123456789`.
  hint: |
    `replace` можно вызывать цепочкой: `phone.replace(" ", "").replace(...)`.
  answer: |
    Ответ:
    ```python
    clean = phone.replace(" ", "").replace("(", "").replace(")", "").replace("-", "")
    print(clean)
    ```
    Результат:
    ```
    +79123456789
    ```
    Каждый `replace` возвращает новую строку, и следующий вызов работает уже с ней.
- title: Части артикула
  text: |
    Артикул устроен так: серия, год, номер.
    ```python
    sku = "SH-2024-017"
    ```
    Напечатайте год и номер, вырезав их срезами.
  answer: |
    Ответ:
    ```python
    year = sku[3:7]
    number = sku[-3:]
    print(year, number)
    ```
    Результат:
    ```
    2024 017
    ```
    Отрицательный индекс считает с конца: `sku[-3:]` — последние три символа.
- title: Теги в хештеги
  text: |
    Теги товара пришли одной строкой:
    ```python
    tags = "чайник, кухня, сталь"
    ```
    Напечатайте их как `#чайник #кухня #сталь`.
  hint: |
    Разбейте строку `split(", ")`, а склейте `" #".join(...)`.
  answer: |
    Ответ:
    ```python
    parts = tags.split(", ")
    print("#" + " #".join(parts))
    ```
    Результат:
    ```
    #чайник #кухня #сталь
    ```
    `join` ставит разделитель только между частями, поэтому `#` перед первой частью дописываем сами.
- title: Промокод без учёта регистра
  text: |
    Покупатель ввёл промокод с пробелами и строчными буквами. Промокоды магазина начинаются с `SALE`.
    ```python
    code = "  sale2026 "
    ```
    Напечатайте очищенный код в верхнем регистре и `True`/`False` — начинается ли он с `SALE`.
  answer: |
    Ответ:
    ```python
    code = code.strip().upper()
    print(code, code.startswith("SALE"))
    ```
    Результат:
    ```
    SALE2026 True
    ```

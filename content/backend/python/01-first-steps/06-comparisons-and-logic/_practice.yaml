- title: Товар доступен
  text: |
    Товар можно купить, если он активен и на складе есть хотя бы одна штука:
    ```python
    is_active = True
    stock = 4
    ```
    Напечатайте `True` или `False`.
  answer: |
    Ответ:
    ```python
    available = is_active and stock > 0
    print(available)
    ```
    Результат:
    ```
    True
    ```
- title: Цена в диапазоне
  text: |
    В фильтре каталога выбран диапазон цен от 1000 до 3000 ₽ включительно. Проверьте цену одной цепочкой сравнений:
    ```python
    price = 2490
    ```
  answer: |
    Ответ:
    ```python
    print(1000 <= price <= 3000)
    ```
    Результат:
    ```
    True
    ```
    Цепочка читается как в математике и означает `1000 <= price and price <= 3000`.
- title: Пустой комментарий
  text: |
    Покупатель не оставил комментарий к заказу:
    ```python
    comment = ""
    ```
    Напечатайте `True`, если комментарий пустой, не сравнивая с `""` и не используя `len`.
  answer: |
    Ответ:
    ```python
    print(not comment)
    ```
    Результат:
    ```
    True
    ```
    Пустая строка ложна, поэтому `not comment` истинно.
- title: Имя или «Гость»
  text: |
    Если покупатель не указал имя, в шапке пишем «Гость»:
    ```python
    name = ""
    ```
    Напечатайте `Привет, Гость!` одной строкой с `or`, без `if`.
  hint: |
    `or` возвращает не `True`/`False`, а первое истинное значение (или последнее).
  answer: |
    Ответ:
    ```python
    print(f"Привет, {name or 'Гость'}!")
    ```
    Результат:
    ```
    Привет, Гость!
    ```
    `name` ложно, поэтому `or` возвращает правую часть.
- title: Скидка покупателю
  text: |
    Скидка положена, если сумма заказа от 5000 ₽ **или** покупатель постоянный, но **не** при оплате бонусами:
    ```python
    total = 3200
    is_regular = True
    pays_with_bonus = False
    ```
    Напечатайте, положена ли скидка.
  answer: |
    Ответ:
    ```python
    print((total >= 5000 or is_regular) and not pays_with_bonus)
    ```
    Результат:
    ```
    True
    ```
    Скобки обязательны: `and` выполняется раньше `or`.

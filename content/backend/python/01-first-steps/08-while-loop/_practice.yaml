- title: Бронь истекает
  text: |
    Напечатайте обратный отсчёт брони `3`, `2`, `1`, каждое число на своей строке, а затем `Бронь снята`.
    ```python
    seconds = 3
    ```
  answer: |
    Ответ:
    ```python
    while seconds > 0:
        print(seconds)
        seconds -= 1
    print("Бронь снята")
    ```
    Результат:
    ```
    3
    2
    1
    Бронь снята
    ```
- title: Сколько раз хватит бонусов
  text: |
    На бонусном счёте 1000 баллов, кофе стоит 350. Списывайте, пока хватает, и напечатайте, сколько чашек купили и сколько баллов осталось.
    ```python
    balance = 1000
    price = 350
    ```
  answer: |
    Ответ:
    ```python
    cups = 0
    while balance >= price:
        balance -= price
        cups += 1
    print(cups, balance)
    ```
    Результат:
    ```
    2 300
    ```
- title: Номер партии
  text: |
    Номер новой партии — первое число больше 1000, которое делится на 7. Найдите его циклом `while True` с `break`.
  answer: |
    Ответ:
    ```python
    number = 1000
    while True:
        number += 1
        if number % 7 == 0:
            break
    print(number)
    ```
    Результат:
    ```
    1001
    ```
    `while True` сам не закончится — выход только через `break`.
- title: Полки без четвёртых
  text: |
    Полки склада нумеруются от 1 до 10, каждая четвёртая (4, 8) — на ремонте. Посчитайте сумму номеров рабочих полок с помощью `continue`.
  answer: |
    Ответ:
    ```python
    shelf = 0
    total = 0
    while shelf < 10:
        shelf += 1
        if shelf % 4 == 0:
            continue
        total += shelf
    print(total)
    ```
    Результат:
    ```
    43
    ```
    Счётчик увеличиваем до `continue`, иначе на полке 4 цикл застрял бы навсегда.

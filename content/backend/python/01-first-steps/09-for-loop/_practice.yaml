- title: Номера заказов
  text: |
    Напечатайте строки `Заказ №1040` … `Заказ №1044` — по одной на строке.
  answer: |
    Ответ:
    ```python
    for number in range(1040, 1045):
        print(f"Заказ №{number}")
    ```
    Результат:
    ```
    Заказ №1040
    Заказ №1041
    Заказ №1042
    Заказ №1043
    Заказ №1044
    ```
    Правая граница `range` не входит, поэтому `1045`.
- title: Цифры в телефоне
  text: |
    Посчитайте, сколько цифр в телефоне:
    ```python
    phone = "+7 (912) 345-67-89"
    ```
  answer: |
    Ответ:
    ```python
    digits = 0
    for ch in phone:
        if ch.isdigit():
            digits += 1
    print(digits)
    ```
    Результат:
    ```
    11
    ```
- title: Сумма по чётным дням
  text: |
    Акция идёт по чётным числам ноября (1–30), в каждый такой день продаётся 12 товаров. Посчитайте, сколько товаров продадут за месяц, перебирая дни через `range` с шагом.
  answer: |
    Ответ:
    ```python
    sold = 0
    for day in range(2, 31, 2):
        sold += 12
    print(sold)
    ```
    Результат:
    ```
    180
    ```
- title: Ячейки склада
  text: |
    На складе ряды `A` и `B`, в каждом полки 1–3. Напечатайте адреса всех ячеек: `A1`, `A2`, … `B3` — по одной на строке.
  hint: |
    Внешний цикл — по рядам (строке `"AB"`), внутренний — по номерам полок.
  answer: |
    Ответ:
    ```python
    for row in "AB":
        for shelf in range(1, 4):
            print(f"{row}{shelf}")
    ```
    Результат:
    ```
    A1
    A2
    A3
    B1
    B2
    B3
    ```
- title: Первый номер с 17
  text: |
    Среди номеров заказов от 1001 до 1100 найдите первый, который делится на 17, и остановите цикл.
  answer: |
    Ответ:
    ```python
    for number in range(1001, 1101):
        if number % 17 == 0:
            print(number)
            break
    ```
    Результат:
    ```
    1003
    ```
    Когда количество шагов известно заранее, `for` проще `while`: счётчик не нужно увеличивать вручную.

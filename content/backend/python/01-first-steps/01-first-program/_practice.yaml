- title: Заказ принят
  text: |
    Напечатайте одной командой `print` сообщение `Заказ №1042 принят`, передав три значения: `"Заказ"`, `"№1042"` и `"принят"`.
  hint: |
    `print` ставит между значениями пробел сам.
  answer: |
    Ответ:
    ```python
    print("Заказ", "№1042", "принят")
    ```
    Результат:
    ```
    Заказ №1042 принят
    ```
    Значения через запятую `print` разделяет пробелом — склеивать строки вручную не нужно.
- title: Артикул через дефис
  text: |
    Артикул товара состоит из трёх частей: `SH`, `2024` и `017`. Напечатайте их одной командой так, чтобы получилось `SH-2024-017`.
  hint: |
    Разделитель между значениями меняет параметр `sep`.
  answer: |
    Ответ:
    ```python
    print("SH", "2024", "017", sep="-")
    ```
    Результат:
    ```
    SH-2024-017
    ```
- title: Итог в одну строку
  text: |
    Есть две команды, и они печатают итог на двух строках:
    ```python
    print("Итого:")
    print("3270 ₽")
    ```
    Измените первую команду так, чтобы обе части оказались на одной строке через пробел: `Итого: 3270 ₽`.
  hint: |
    После каждого `print` по умолчанию идёт перевод строки — его задаёт параметр `end`.
  answer: |
    Ответ:
    ```python
    print("Итого:", end=" ")
    print("3270 ₽")
    ```
    Результат:
    ```
    Итого: 3270 ₽
    ```
    `end=" "` заменяет перевод строки после первого `print` пробелом.
- title: Комментарий вместо удаления
  text: |
    Программа печатает чек, но строку со скидкой нужно временно отключить, не удаляя её:
    ```python
    print("Чайник Steel — 2490 ₽")
    print("Скидка 10 %")
    print("К оплате: 2490 ₽")
    ```
    Сделайте так, чтобы скидка не печаталась, а строка осталась в коде.
  answer: |
    Ответ:
    ```python
    print("Чайник Steel — 2490 ₽")
    # print("Скидка 10 %")
    print("К оплате: 2490 ₽")
    ```
    Результат:
    ```
    Чайник Steel — 2490 ₽
    К оплате: 2490 ₽
    ```
    Всё после `#` до конца строки Python пропускает. Так удобно отключать строку на время.

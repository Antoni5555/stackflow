- title: Количество из формы
  text: |
    Из формы заказа всё приходит строками:
    ```python
    quantity = "3"
    price = "1250"
    ```
    Напечатайте сумму позиции числом.
  answer: |
    Ответ:
    ```python
    total = int(quantity) * int(price)
    print(total)
    ```
    Результат:
    ```
    3750
    ```
    Без `int()` получилась бы ошибка: строку нельзя умножить на строку.
- title: Строка плюс число
  text: |
    Код падает с `TypeError`:
    ```python
    count = 3
    ```
    ```text
    print("Позиций в корзине: " + count)
    ```
    Исправьте его двумя способами: через `str()` и через f-строку.
  answer: |
    Ответ:
    ```python
    print("Позиций в корзине: " + str(count))
    print(f"Позиций в корзине: {count}")
    ```
    Результат:
    ```
    Позиций в корзине: 3
    Позиций в корзине: 3
    ```
    `+` склеивает только строку со строкой; f-строка приводит значение к строке сама.
- title: Цена с копейками
  text: |
    Цена пришла строкой с запятой, как её ввёл менеджер:
    ```python
    raw_price = "349,90"
    ```
    Превратите её в `float` и напечатайте цену за две штуки, округлив до двух знаков.
  hint: |
    `float()` понимает только точку — замените запятую.
  answer: |
    Ответ:
    ```python
    price = float(raw_price.replace(",", "."))
    print(round(price * 2, 2))
    ```
    Результат:
    ```
    699.8
    ```
- title: Что примет int()
  text: |
    Предскажите, что выведет каждая строка, затем проверьте в песочнице по одной:
    ```text
    int(" 3 ")
    int("3.0")
    ```
  answer: |
    Ответ: пробелы по краям `int()` отбрасывает сам:
    ```python
    print(int(" 3 "))
    ```
    Результат:
    ```
    3
    ```
    А строку с точкой не примет — сначала `float()`:
    ```python
    print(int("3.0"))
    ```
    Результат:
    ```
    ValueError: invalid literal for int() with base 10: '3.0'
    ```
- title: Истинность строк
  text: |
    Предскажите, что напечатает код, и проверьте:
    ```python
    print(bool(""), bool("0"), bool(" "), bool(0))
    ```
  answer: |
    Результат:
    ```
    False True True False
    ```
    Ложна только пустая строка. Строки `"0"` и `" "` непустые, поэтому истинны; ложен лишь ноль-число.

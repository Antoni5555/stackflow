title: "Шлюз написан, но «неизвестен»"
type: quiz
kind: single
difficulty: 3
pitfall: "Декоратор регистрации выполняется при импорте модуля; неимпортированный модуль — нет записи в реестре."
statement: |
  Шлюзы регистрируются декоратором, каждый в своём модуле:
  ```
  gateways/
      __init__.py      # from . import card
      registry.py      # GATEWAYS, register, get_gateway
      card.py          # @register("card") class CardGateway
      sbp.py           # @register("sbp") class SbpGateway
  ```
  `get_gateway("sbp")` выбрасывает `ValueError: неизвестный шлюз 'sbp', есть: card`, хотя класс в `sbp.py` написан правильно. Почему?
options:
  - "Декоратор не работает с классами — только с функциями"
  - "Модуль `sbp.py` нигде не импортирован, поэтому `@register(\"sbp\")` не выполнился"
  - "Словарь `GATEWAYS` сортирует ключи и теряет последний"
  - "Нужно вызвать `register` вручную после объявления класса"
answer: [1]
explanation: |
  Декоратор — обычный код, который выполняется при импорте модуля. `__init__.py` импортирует только `card`, поэтому до `sbp.py` Python не доходит и запись в реестре не появляется. Исправление — `from . import card, sbp` в `__init__.py`. Так же работает регистрация моделей в админке Django: `admin.py` приложений импортируется автоматически, а свой модуль — нет.

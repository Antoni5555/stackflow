title: "Тест падает 1 января"
type: quiz
kind: single
difficulty: 1
pitfall: "Текущее время — тоже зависимость: внутри логики его не берут, а получают параметром."
statement: |
  ```python
  def is_active(promo):
      return date.today() <= promo["until"]


  def test_promo_active():
      assert is_active({"until": date(2026, 12, 31)})
  ```
  Тест проходил весь декабрь, а 1 января 2027 года упал, хотя код никто не менял. Как исправить правильно?
options:
  - "Поменять в тесте дату на `date(2099, 12, 31)`"
  - "Передавать текущую дату в функцию: `is_active(promo, today)` или `clock=date.today`, а в тесте — фиксированную дату"
  - "Пометить тест `@pytest.mark.skip` после 31 декабря"
  - "Вызывать `date.today()` в тесте и сравнивать с ним"
answer: [1]
explanation: |
  У функции скрытая зависимость — системные часы. Дата 2099 года лишь отложит проблему и не позволит проверить «последний день акции». Когда дата приходит параметром, тест задаёт любой день — 31 декабря и 1 января — и результат не зависит от дня запуска.

title: "Где создавать EmailNotifier"
type: quiz
kind: single
difficulty: 2
pitfall: "Конкретные объекты создаются и связываются в одной точке сборки; остальной код их только получает."
statement: |
  Магазин переходит с почты на Telegram. Сейчас `EmailNotifier()` создаётся внутри `CheckoutService`, `RefundService` и `ShippingService`. Как устроить код, чтобы такой переход был правкой в одном месте?
options:
  - "Сделать глобальную переменную `NOTIFIER = EmailNotifier()` и импортировать её в сервисах"
  - "Принимать `notifier` в конструкторах сервисов, а создавать его в одной функции сборки приложения"
  - "Унаследовать все сервисы от `EmailNotifier`"
  - "Заменить `EmailNotifier()` на `TelegramNotifier()` в трёх сервисах"
answer: [1]
explanation: |
  Сервисы получают уведомитель параметром, а создаёт его одна точка сборки — там и меняют канал. Глобальная переменная тоже «одно место», но сервисы снова сами берут зависимость: в тестах её приходится подменять `patch`, и все тесты делят один объект. Наследование от уведомителя — путаница «является» и «имеет».

title: "Тест начал слать письма"
type: quiz
kind: single
difficulty: 3
pitfall: "patch завязывает тест на пути импорта; DI — только на интерфейс."
statement: |
  Тест подменял отправку письма так:
  ```python
  with patch("shop.checkout.send_email") as fake:
      checkout(1042)
  ```
  После рефакторинга письмо отправляет новая функция `notify_customer` из модуля `shop.customers` (она сама импортирует `send_email`), а в `shop.checkout` остался старый, уже ненужный импорт `send_email`. Тест по-прежнему зелёный, но при каждом запуске уходит настоящее письмо. Какое решение надёжнее?
options:
  - "Поменять путь на `patch(\"shop.customers.send_email\")`"
  - "Передавать уведомитель в `checkout` параметром и в тесте подставлять заглушку"
  - "Отключить интернет на время тестов"
  - "Добавить второй `patch` на старый путь"
answer: [1]
explanation: |
  `patch` подменил имя в `shop.checkout`, где его больше никто не вызывает, — подмена «прошла», а письмо ушло из `shop.customers`. Тест хрупко зависит от того, где код ищет функцию, и новый путь снова сломается при следующем рефакторинге. С внедрением зависимостей тест передаёт заглушку в `checkout` и знает только интерфейс `send(text)` — пути импортов ему неважны.

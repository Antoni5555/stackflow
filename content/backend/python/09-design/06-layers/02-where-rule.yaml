title: "Где живёт правило"
type: quiz
kind: single
difficulty: 1
pitfall: "Бизнес-правила — в сервисном слое; представление разбирает запрос, репозиторий хранит данные."
statement: |
  Новое правило: «постоянным клиентам (от 5 заказов) — бесплатная доставка». Его используют сайт, мобильное API и фоновая задача пересчёта заказов. Куда его поместить?
options:
  - "Во view сайта, а в API скопировать"
  - "В сервис оформления заказа"
  - "В репозиторий заказов — он и так знает, сколько у клиента заказов"
  - "В шаблон страницы корзины"
answer: [1]
explanation: |
  Это бизнес-правило, и нужно оно трём точкам входа — значит, в сервисе. Репозиторий может дать число заказов (`count_by_customer`), но решать, положена ли бесплатная доставка, — не его работа. Во view и в шаблоне правило придётся копировать, и копии разойдутся.

title: "Сервис возвращает 409"
type: quiz
kind: single
difficulty: 2
pitfall: "Сервис не знает про HTTP: при нарушении правила он выбрасывает исключение приложения, а статус выбирает представление."
statement: |
  ```python
  class OrderService:
      def place_order(self, product_id, qty):
          product = self.products.get(product_id)
          if product.stock < qty:
              return 409, {"error": "не хватает на складе"}
          ...
  ```
  Чем плох такой сервис?
options:
  - "Ничем: 409 — правильный статус для конфликта"
  - "Сервис говорит на языке HTTP: фоновой задаче и админке придётся разбирать статусы; правильнее `raise OutOfStockError(...)`, а 409 выбрать во view"
  - "Нужно вернуть 400, а не 409"
  - "Сервис должен печатать ошибку через `print`"
answer: [1]
explanation: |
  Статусы HTTP — дело представления. Фоновая задача не отвечает на HTTP-запрос, ей нужно исключение, которое она поймает или залогирует. С исключением `OutOfStockError` сервис одинаково полезен везде, а сайт и API сами решают, как его показать.

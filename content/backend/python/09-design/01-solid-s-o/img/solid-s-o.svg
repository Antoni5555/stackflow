<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" class="fig" role="img" aria-labelledby="t"><title id="t">Одна причина для изменения — один класс; новый способ доставки — новый класс, а не новый elif</title>
<style>
.fig text{white-space:pre}

<text x="50" y="86" text-anchor="start" class="fig-cs">сумма и скидка</text>
<text x="320" y="86" text-anchor="end" class="fig-s">продажи</text>
<rect x="36" y="110" width="298" height="38" rx="8" class="fig-box"/>

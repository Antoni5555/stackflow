<path d="M782 66V86" class="fig-ln" marker-end="url(#a)"/>
<rect x="712" y="90" width="148" height="40" rx="8" class="fig-box2"/>
<text x="786.0" y="115.0" text-anchor="middle" class="fig-cs">EmailNotifier</text>
<rect x="400" y="150" width="460" height="120" rx="12" class="fig-box2"/>
<text x="416" y="174" text-anchor="start" class="fig-cs">DELIVERY = {</text>
<text x="436" y="198" text-anchor="start" class="fig-cs">&quot;courier&quot;: Courier(),</text>
<text x="436" y="220" text-anchor="start" class="fig-cs">&quot;pickup&quot;:  Pickup(),</text>
<rect x="430" y="230" width="260" height="28" rx="6" class="fig-ok"/>
<text x="560.0" y="249.0" text-anchor="middle" class="fig-cs">&quot;post&quot;:    Post(),   ← новый</text>
<text x="700" y="250" text-anchor="start" class="fig-cs">}</text>
<text x="20" y="310" text-anchor="start" class="fig-s">Слева метод меняют четыре разных отдела — правка одного ломает другое.</text>
<text x="20" y="336" text-anchor="start" class="fig-s">Справа каждая часть меняется по своей причине и проверяется отдельно;</text>
<text x="20" y="358" text-anchor="start" class="fig-s">delivery_price(method, total) берёт объект из словаря и вызывает .price(total).</text>

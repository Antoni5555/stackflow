title: "Что не так с ReportService"
type: quiz
kind: single
difficulty: 1
pitfall: "Класс, который меняют по разным поводам разные люди, нарушает принцип единственной ответственности."
statement: |
  ```python
  class ReportService:
      def sales_total(self, orders): ...
      def to_pdf(self, total): ...
      def send_to_accountant(self, pdf): ...
  ```
  Бухгалтерия просит поменять формулу выручки, дизайнер — вёрстку PDF, админ — почтовый сервер. Какой принцип нарушен в первую очередь?
options:
  - "S — единственной ответственности"
  - "O — открытости/закрытости"
  - "L — подстановки Лисков"
  - "I — разделения интерфейса"
answer: [0]
explanation: |
  У класса три причины для изменения — расчёт, оформление и доставка отчёта. Правка вёрстки PDF требует трогать класс, в котором лежит формула выручки. Делят на `SalesCalculator`, `PdfRenderer`, `ReportMailer`, а общий сценарий оставляют координатору.

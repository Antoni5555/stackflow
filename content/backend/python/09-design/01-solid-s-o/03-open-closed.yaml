title: "Новый способ оплаты"
type: quiz
kind: single
difficulty: 2
pitfall: "Принцип открытости/закрытости: новое поведение добавляют новым кодом, а не новой веткой в проверенной функции."
statement: |
  ```python
  def commission(method, amount):
      if method == "card":
          return amount * Decimal("0.02")
      elif method == "sbp":
          return amount * Decimal("0.004")
  ```
  Добавляют оплату долями — каждый раз так же: ещё `elif`. Какое изменение лучше соответствует принципу O?
options:
  - "Дописать `elif method == \"split\"` — это одна строка"
  - "Сделать классы способов оплаты с общим методом `commission(amount)` и выбирать объект по словарю"
  - "Вынести `commission` в отдельный модуль"
  - "Заменить `if/elif` на `match/case`"
answer: [1]
explanation: |
  `elif` и `match/case` — та же правка проверенной функции при каждом новом способе. Модуль ничего не меняет. Объекты с общим методом и словарь «название → объект» позволяют добавить способ новым классом и строкой в словаре, а `commission` больше не меняется.

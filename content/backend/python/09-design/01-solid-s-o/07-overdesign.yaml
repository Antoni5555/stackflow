title: "Когда не делить"
type: quiz
kind: single
difficulty: 2
pitfall: "Принципы — инструмент против дорогих изменений, а не обязательная форма любого кода."
statement: |
  Нужен разовый скрипт на 25 строк: выгрузить заказы за вчера в CSV для бухгалтера. Менять его не планируют. Как поступить?
options:
  - "Сразу разделить на `OrderReader`, `CsvWriter`, `ReportService` и интерфейсы к ним — так требует SOLID"
  - "Написать простой скрипт из пары функций; делить, если появятся разные причины для изменений"
  - "Написать один класс со статическими методами"
  - "Скопировать готовый сервис отчётов и удалить лишнее"
answer: [1]
explanation: |
  SOLID окупается там, где код меняется: разделение уменьшает цену будущих правок. У разового скрипта будущих правок нет, а пять классов только усложнят чтение. Разумная мера — короткие функции с понятными именами; делить, когда появятся разные причины для изменения или третий `elif`.

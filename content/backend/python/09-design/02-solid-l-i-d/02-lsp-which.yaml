title: "Какой наследник нарушает L"
type: quiz
kind: single
difficulty: 2
pitfall: "Наследник не должен выбрасывать новые ошибки, сужать вход или менять тип результата."
statement: |
  Базовый шлюз обещает: `charge(amount)` списывает любую положительную сумму и возвращает строку — номер платежа.
  ```python
  class Gateway:
      def charge(self, amount: Decimal) -> str: ...
  ```
  Какой наследник нарушает принцип подстановки Лисков?
options:
  - "`CardGateway.charge` списывает сумму и возвращает `\"card_8812\"`"
  - "`LoggingGateway.charge` пишет сумму в лог, вызывает `super().charge(amount)` и возвращает его результат"
  - "`SbpGateway.charge` при сумме больше 10 000 ₽ выбрасывает `ValueError(\"лимит СБП\")`"
  - "`TestGateway.charge` ничего не списывает и возвращает `\"test_1\"`"
answer: [2]
explanation: |
  `SbpGateway` требует на входе больше, чем родитель: код, который платил через `Gateway` сумму 15 000 ₽, с ним упадёт. Остальные держат обещание — принимают любую сумму и возвращают строку. Лимит — это свойство способа оплаты, которое общий код должен узнать заранее (например, метод `max_amount()` у всех шлюзов), а не по исключению.

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" class="fig" role="img" aria-labelledby="t"><title id="t">L — наследник держит обещание родителя; I — узкие интерфейсы; D — сервис зависит от абстракции</title>
<style>
.fig text{white-space:pre}
.fig-t{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:14px;fill:#0e0e0e;fill:var(--text,#0e0e0e)}
.fig-c{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:14px;fill:#0e0e0e;fill:var(--text,#0e0e0e)}
.fig-cs{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:12px;fill:#0e0e0e;fill:var(--text,#0e0e0e)}
.fig-h{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:12px;letter-spacing:.04em;text-transform:uppercase;fill:#6e6e6a;fill:var(--muted,#6e6e6a)}
.fig-s{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:12px;fill:#6e6e6a;fill:var(--muted,#6e6e6a)}
.fig-box{fill:#ffffff;fill:var(--surface,#ffffff);stroke:#e0e0dc;stroke:var(--border,#e0e0dc);stroke-width:1.5}
.fig-box2{fill:#ebebe8;fill:var(--surface-2,#ebebe8);stroke:#e0e0dc;stroke:var(--border,#e0e0dc);stroke-width:1.5}
.fig-acc{fill:#dcf25c;fill:var(--accent,#dcf25c)}
.fig-onacc{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:13px;fill:#0e0e0e;fill:var(--on-accent,#0e0e0e)}
.fig-ln{stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5;fill:none}
.fig-lnd{stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.fig-ah{fill:#6e6e6a;fill:var(--muted,#6e6e6a)}
.fig-err{fill:#fdecea;fill:var(--error-bg,#fdecea);stroke:#d93025;stroke:var(--error,#d93025);stroke-width:1.5}
.fig-errt{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:13px;fill:#d93025;fill:var(--error,#d93025)}
.fig-ok{fill:#e7f6ec;fill:var(--success-bg,#e7f6ec);stroke:#1f9d55;stroke:var(--success,#1f9d55);stroke-width:1.5}
.fig-dash{fill:none;stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5;stroke-dasharray:5 4}
.fig-term{fill:#0d0d0f;fill:var(--term-bg,#0d0d0f)}
.fig-tt{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:13px;fill:#e6e6e3;fill:var(--term-text,#e6e6e3)}
.fig-tterr{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:13px;fill:#f87171}
.fig-m1{fill:#dbe4ff;fill:var(--match-1,#dbe4ff)}
.fig-m2{fill:#ffe3e3;fill:var(--match-2,#ffe3e3)}
.fig-m3{fill:#d3f9d8;fill:var(--match-3,#d3f9d8)}
.fig-venn{fill-opacity:.75;stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fig-ah"/></marker></defs>
<text x="20" y="30" text-anchor="start" class="fig-h">L</text>
<rect x="20" y="42" width="260" height="40" rx="8" class="fig-box"/>
<text x="150.0" y="67.0" text-anchor="middle" class="fig-cs">cart_weight(products)</text>
<rect x="20" y="96" width="260" height="40" rx="8" class="fig-ok"/>
<text x="150.0" y="121.0" text-anchor="middle" class="fig-cs">Product.weight() → 1.2</text>
<rect x="20" y="150" width="260" height="54" rx="8" class="fig-err"/>
<text x="150.0" y="173.0" text-anchor="middle" class="fig-errt">DigitalProduct.weight()</text>
<text x="150.0" y="191.0" text-anchor="middle" class="fig-errt">raise NotImplementedError</text>
<rect x="20" y="218" width="260" height="40" rx="8" class="fig-ok"/>
<text x="150.0" y="243.0" text-anchor="middle" class="fig-cs">исправление: weight() → 0</text>
<text x="310" y="30" text-anchor="start" class="fig-h">I</text>
<rect x="310" y="42" width="260" height="92" rx="12" class="fig-err"/>
<text x="326" y="66" text-anchor="start" class="fig-cs">Notifier: send_email,</text>
<text x="326" y="88" text-anchor="start" class="fig-cs">send_sms, send_push</text>
<text x="326" y="116" text-anchor="start" class="fig-errt">Telegram: 2 заглушки raise</text>
<path d="M440 134V158" class="fig-ln" marker-end="url(#a)"/>
<rect x="310" y="162" width="260" height="44" rx="8" class="fig-ok"/>
<text x="440.0" y="189.0" text-anchor="middle" class="fig-cs">Notifier: send(text)</text>
<text x="326" y="236" text-anchor="start" class="fig-s">каждый класс — только то, что умеет</text>
<text x="600" y="30" text-anchor="start" class="fig-h">D</text>
<rect x="600" y="42" width="260" height="44" rx="8" class="fig-acc"/>
<text x="730.0" y="69.0" text-anchor="middle" class="fig-onacc">OrderService</text>
<path d="M730 86V108" class="fig-ln" marker-end="url(#a)"/>
<rect x="600" y="112" width="260" height="44" rx="8" class="fig-box2"/>
<text x="730.0" y="139.0" text-anchor="middle" class="fig-cs">Notifier (Protocol)</text>
<path d="M640 196V160" class="fig-ln" marker-end="url(#a)"/>
<rect x="600" y="200" width="84" height="40" rx="8" class="fig-box"/>
<text x="642.0" y="225.0" text-anchor="middle" class="fig-cs">Email</text>
<path d="M728 196V160" class="fig-ln" marker-end="url(#a)"/>
<rect x="688" y="200" width="84" height="40" rx="8" class="fig-box"/>
<text x="730.0" y="225.0" text-anchor="middle" class="fig-cs">Telegram</text>
<path d="M816 196V160" class="fig-ln" marker-end="url(#a)"/>
<rect x="776" y="200" width="84" height="40" rx="8" class="fig-box"/>
<text x="818.0" y="225.0" text-anchor="middle" class="fig-cs">Fake</text>
<text x="600" y="266" text-anchor="start" class="fig-s">детали реализуют абстракцию</text>
<text x="20" y="320" text-anchor="start" class="fig-s">L: общий код не проверяет isinstance — различия живут в методах наследников.</text>
<text x="20" y="346" text-anchor="start" class="fig-s">I: заглушка raise NotImplementedError — признак толстого интерфейса (и нарушения L).</text>
<text x="20" y="372" text-anchor="start" class="fig-s">D: смена канала или банка не трогает сервис; в тесте — заглушка.</text>
</svg>

- title: Место на сервере
  text: |
    Посмотрите, сколько места на дисках сервера, в понятных единицах:
    ```
    df
    ```
  answer: |
    Ответ:
    ```bash
    df -h
    ```
    Результат:
    ```
    Filesystem Size Used Avail Use% Mounted on
    /dev/sda1   15G 4.3G   11G  29% /
    tmpfs      982M    0  982M   0% /dev/shm
    ```
    Основной диск `/` занят на 29 %. `tmpfs` — память, не диск.
- title: Три самых больших в проекте
  text: |
    Выведите три самых больших файла или папки в проекте, от большего к меньшему. Папка:
    ```
    /srv/shop
    ```
  answer: |
    Ответ:
    ```bash
    du -s /srv/shop/* | sort -n -r | head -n 3
    ```
    Результат:
    ```
    3076	/srv/shop/media
    8	/srv/shop/logs
    8	/srv/shop/data
    ```
    Числа — килобайты (`du -s` без `-h`), поэтому их сортирует `sort -n`. Больше всего места занимают фото.
- title: Сжать журнал Nginx
  text: |
    Журнал запросов Nginx весит 12 МБ. Сожмите его и посмотрите новый размер:
    ```
    /var/log/nginx/access.log
    ```
  answer: |
    Ответ:
    ```bash
    sudo gzip /var/log/nginx/access.log
    du -sh /var/log/nginx/access.log.gz
    ```
    Результат:
    ```
    3.7M	/var/log/nginx/access.log.gz
    ```
    Текст сжался примерно втрое. На настоящем сервере так сжимают только старые журналы — текущий пишет работающий Nginx.

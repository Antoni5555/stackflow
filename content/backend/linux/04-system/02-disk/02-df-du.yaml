title: "df или du"
type: quiz
kind: single
difficulty: 1
pitfall: "df — место на диске целиком, du — сколько занимает папка или файл."
statement: |
  Сайт пишет `No space left on device`. Какая команда сначала покажет, насколько заполнен диск сервера?
options:
  - "`du -sh /srv/shop`"
  - "`df -h`"
  - "`ls -lh /`"
  - "`find / -size +1G`"
answer: [1]
explanation: |
  `df -h` — размер, занято, свободно и процент по каждому разделу: сразу видно, что `/` заполнен на 100 %. `du` отвечает на следующий вопрос — какая папка занимает место; `du -sh /srv/shop` покажет только код магазина, а он редко виноват. `ls -lh` не считает содержимое папок.

title: "Поставить Nginx и клиент базы"
type: exercise
difficulty: 1
pitfall: "Программы ставит apt через sudo; сначала apt update, несколько пакетов — одной командой."
statement: |
  На новом сервере магазина поставьте веб-сервер Nginx и клиент PostgreSQL (`psql`, `pg_dump` — для бэкапов базы с другого сервера). Пакеты — `nginx` и `postgresql-client`. Списки пакетов ещё не обновлялись.
setup:
  cwd: /home/shop
  files:
    /srv/shop/manage.py: |
      import os
check:
  type: state
  expect:
    - path: /usr/sbin/nginx
      exists: true
      fail: "Nginx не установлен (/usr/sbin/nginx нет). Пакеты ставят через sudo: sudo apt install nginx."
    - path: /etc/nginx/nginx.conf
      exists: true
      fail: "Нет настроек /etc/nginx/nginx.conf — пакет nginx не установлен."
    - path: /usr/bin/psql
      exists: true
      fail: "Нет /usr/bin/psql — пакет postgresql-client не установлен."
    - path: /usr/bin/pg_dump
      exists: true
      fail: "Нет /usr/bin/pg_dump — его тоже ставит postgresql-client."
solution: |
  sudo apt update
  sudo apt install -y nginx postgresql-client
hints:
  - "Что сделать на новом сервере до установки? Можно ли поставить два пакета одной командой?"
  - "`sudo apt update`, затем `sudo apt install -y nginx postgresql-client`."
explanation: |
  `apt update` обновляет списки, `apt install` ставит пакеты и раскладывает файлы: `/usr/sbin/nginx`, `/etc/nginx/…`, `/usr/bin/psql`. Без `sudo` — `Unable to acquire the dpkg frontend lock … are you root?`. `postgresql-client` — только инструменты подключения, сам сервер базы — пакет `postgresql`.

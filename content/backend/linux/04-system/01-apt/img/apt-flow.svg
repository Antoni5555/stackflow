<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fig-ah"/></marker></defs>
<rect x="20" y="30" width="220" height="60" rx="12" class="fig-box2"/>
<text x="130.0" y="65.0" text-anchor="middle" class="fig-t">репозиторий Ubuntu</text>
<text x="20" y="112" text-anchor="start" class="fig-cs">apt update — свежие списки</text>
<path d="M240 60H296" class="fig-ln" marker-end="url(#a)"/>
<rect x="300" y="30" width="220" height="60" rx="12" class="fig-acc"/>
<text x="410.0" y="65.0" text-anchor="middle" class="fig-onacc">sudo apt install nginx</text>
<path d="M520 60H566" class="fig-ln" marker-end="url(#a)"/>
<rect x="570" y="20" width="290" height="150" rx="12" class="fig-box"/>
<text x="586" y="46" text-anchor="start" class="fig-cs">/usr/sbin/nginx — программа</text>
<text x="586" y="72" text-anchor="start" class="fig-cs">/etc/nginx/ — настройки</text>
<text x="586" y="98" text-anchor="start" class="fig-cs">/var/www/html — страница</text>
<text x="586" y="124" text-anchor="start" class="fig-cs">/var/log/nginx — логи</text>
<text x="586" y="150" text-anchor="start" class="fig-cs">служба nginx</text>
<rect x="20" y="200" width="400" height="44" rx="12" class="fig-box2"/>
<text x="220.0" y="227.0" text-anchor="middle" class="fig-cs">apt remove — программа удалена, /etc/nginx остаётся</text>
<rect x="460" y="200" width="400" height="44" rx="12" class="fig-err"/>
<text x="660.0" y="227.0" text-anchor="middle" class="fig-errt">apt purge — удалены и настройки</text>
<text x="20" y="290" text-anchor="start" class="fig-s">apt — программы системы; библиотеки проекта — pip в venv.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" class="fig" role="img" aria-labelledby="t"><title id="t">sudo apt install nginx: пакет из репозитория раскладывается по стандартным папкам</title>
<style>

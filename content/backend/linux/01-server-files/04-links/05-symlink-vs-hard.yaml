title: "Символическая или жёсткая"
type: quiz
kind: multiple
difficulty: 2
pitfall: "Символическая ссылка хранит путь (может указывать на папку и ломается без цели); жёсткая — второе имя тех же данных."
statement: |
  Какие утверждения о ссылках верны?
options:
  - "Символическая ссылка может указывать на папку"
  - "Если удалить файл, на который указывает символическая ссылка, ссылка покажет пустой файл"
  - "Жёсткая ссылка — второе имя тех же данных: после удаления первого имени данные доступны по второму"
  - "Удаление символической ссылки командой `rm ссылка` удаляет и цель"
  - "В `ls -l` символическая ссылка видна как `имя -> цель`"
answer: [0, 2, 4]
explanation: |
  Символическая ссылка хранит путь: может вести на папку, в `ls -l` — `имя -> цель`, а без цели становится битой (`No such file or directory`, а не пустой файл). `rm ссылка` удаляет только ссылку — так в Nginx выключают сайт. Жёсткая ссылка — ещё одно имя тех же данных: в уроке `env-hard` пережил удаление `.env`.

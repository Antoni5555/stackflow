title: "Как остановить tail -f"
type: quiz
kind: single
difficulty: 1
pitfall: "tail -f следит бесконечно и останавливается Ctrl+C; q — выход из less."
statement: |
  Вы запустили `tail -f /var/log/shop/app.log`, нашли нужную ошибку и хотите вернуться к командной строке. Что нажать?
options:
  - "`q`"
  - "`Ctrl+C`"
  - "`Esc`, затем `:q`"
  - "Ничего — `tail -f` закончит сам, когда лог перестанет расти"
answer: [1]
explanation: |
  `tail -f` не заканчивается сам: он ждёт новые строки, пока его не прервут. `Ctrl+C` посылает программе сигнал прерывания — в терминале остаётся `^C`. `q` — выход из `less`, `:q` — из `vim`.

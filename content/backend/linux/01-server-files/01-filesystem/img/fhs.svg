<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fig-ah"/></marker></defs>
<rect x="20" y="140" width="60" height="44" rx="12" class="fig-acc"/>
<text x="50.0" y="167.0" text-anchor="middle" class="fig-onacc">/</text>
<path d="M80 162H100V40H126" class="fig-ln"/>
<rect x="130" y="20" width="130" height="40" rx="12" class="fig-box2"/>
<text x="195.0" y="45.0" text-anchor="middle" class="fig-cs">/etc</text>
<text x="276" y="38" text-anchor="start" class="fig-t">настройки</text>
<text x="276" y="55" text-anchor="start" class="fig-cs">/etc/nginx/sites-available/shop</text>
<path d="M80 162H100V90H126" class="fig-ln"/>
<rect x="130" y="70" width="130" height="40" rx="12" class="fig-box2"/>
<text x="195.0" y="95.0" text-anchor="middle" class="fig-cs">/var/log</text>
<text x="276" y="88" text-anchor="start" class="fig-t">логи</text>
<text x="276" y="105" text-anchor="start" class="fig-cs">/var/log/shop/app.log, /var/log/nginx/access.log</text>
<path d="M80 162H100V140H126" class="fig-ln"/>
<rect x="130" y="120" width="130" height="40" rx="12" class="fig-box2"/>
<text x="195.0" y="145.0" text-anchor="middle" class="fig-cs">/srv/shop</text>
<text x="276" y="138" text-anchor="start" class="fig-t">код магазина</text>
<text x="276" y="155" text-anchor="start" class="fig-cs">manage.py, shop/settings.py, .env, media/products/</text>
<path d="M80 162H100V190H126" class="fig-ln"/>
<rect x="130" y="170" width="130" height="40" rx="12" class="fig-box2"/>
<text x="195.0" y="195.0" text-anchor="middle" class="fig-cs">/home/shop</text>
<text x="276" y="188" text-anchor="start" class="fig-t">домашняя папка (~)</text>
<text x="276" y="205" text-anchor="start" class="fig-cs">~/backups</text>
<path d="M80 162H100V240H126" class="fig-ln"/>
<rect x="130" y="220" width="130" height="40" rx="12" class="fig-box2"/>
<text x="195.0" y="245.0" text-anchor="middle" class="fig-cs">/tmp</text>
<text x="276" y="238" text-anchor="start" class="fig-t">временное, для всех</text>
<text x="276" y="255" text-anchor="start" class="fig-cs">очищается при перезагрузке</text>
<path d="M80 162H100V290H126" class="fig-ln"/>
<rect x="130" y="270" width="130" height="40" rx="12" class="fig-box2"/>
<text x="195.0" y="295.0" text-anchor="middle" class="fig-cs">/usr/bin</text>
<text x="276" y="288" text-anchor="start" class="fig-t">программы</text>
<text x="276" y="305" text-anchor="start" class="fig-cs">python3, git, ls</text>
<text x="20" y="340" text-anchor="start" class="fig-s">Пользователь shop пишет в /srv/shop, /home/shop и /tmp; /etc и /var/log — только через sudo.</text>
</svg>

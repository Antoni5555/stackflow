title: "Куда положить код"
type: quiz
kind: single
difficulty: 1
pitfall: "Код сайта — в /srv/<проект> или домашней папке пользователя сайта; не в /tmp и не в /root."
statement: |
  Вы выкладываете магазин на новый сервер. Какая папка лучше всего подходит для кода сайта?
options:
  - "`/tmp/shop`"
  - "`/root/shop`"
  - "`/srv/shop`"
  - "`/usr/bin/shop`"
answer: [2]
explanation: |
  `/srv` — данные сервисов этого сервера, сайт там естественен. `/tmp` очищается при перезагрузке и доступен всем, в `/root` у веб-сервера нет доступа, а `/usr/bin` — для программ из пакетов. Подходит и домашняя папка пользователя сайта, например `/home/shop/shop`.

title: "Пароль со знаком $"
type: exercise
difficulty: 2
pitfall: "В двойных кавычках $имя заменяется значением переменной; значения с $ пишут в одинарных кавычках."
statement: |
  Допишите в `/srv/shop/.env` пароль базы данных — строку `DB_PASSWORD=x7$kq9` (именно так, со знаком `$`). Остальные строки не трогайте.
setup:
  cwd: /srv/shop
  files:
    /srv/shop/manage.py: |
      import os
    /srv/shop/.env: |
      SECRET_KEY=change-me
      DEBUG=False
check:
  type: state
  expect:
    - path: /srv/shop/.env
      not_contains: '^DB_PASSWORD=x7$'
      fail: "В .env записалось DB_PASSWORD=x7: в двойных кавычках оболочка заменила $kq9 пустотой. Удалите строку (nano) и запишите в одинарных кавычках."
    - path: /srv/shop/.env
      contains: '^DB_PASSWORD=x7\$kq9$'
      fail: "В .env нет строки DB_PASSWORD=x7$kq9. Значение с $ — в одинарных кавычках."
    - path: /srv/shop/.env
      contains: '^SECRET_KEY=change-me$'
      fail: "Пропала строка SECRET_KEY — нужен >>, а не >."
solution: |
  echo 'DB_PASSWORD=x7$kq9' >> .env
hints:
  - "Что сделает оболочка с `$kq9` внутри двойных кавычек?"
  - "Одинарные кавычки: `echo 'DB_PASSWORD=x7$kq9' >> .env`."
explanation: |
  В двойных кавычках `$kq9` — обращение к переменной `kq9`; её нет, и подставляется пустая строка — в файл попадает `DB_PASSWORD=x7`, а ошибки никто не видит, пока база не откажет в доступе. В одинарных кавычках оболочка ничего не подставляет. Можно и экранировать: `"x7\$kq9"`.

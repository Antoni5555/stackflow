title: "Что удалит find"
type: quiz
kind: multiple
difficulty: 2
pitfall: "-mtime +7 — больше 7 полных суток; -name ограничивает удаление нужными файлами."
statement: |
  Сейчас 23 ноября, 03:00. В `~/backups` лежат файлы, каждый создан в 03:00 своего дня:
  ```
  media-2026-11-14.tar.gz
  media-2026-11-15.tar.gz
  media-2026-11-16.tar.gz
  media-2026-11-22.tar.gz
  notes-2026-11-01.txt
  ```
  Какие удалит `find ~/backups -name '*.tar.gz' -mtime +7 -delete`?
options:
  - "`media-2026-11-14.tar.gz`"
  - "`media-2026-11-15.tar.gz`"
  - "`media-2026-11-16.tar.gz`"
  - "`media-2026-11-22.tar.gz`"
  - "`notes-2026-11-01.txt`"
answer: [0, 1]
explanation: |
  `-mtime` считает возраст в полных сутках с отбрасыванием остатка, а `+7` — «больше 7», то есть 8 и больше. Файлу от 14-го — 9 суток, от 15-го — 8: удаляются. От 16-го — ровно 7: остаётся. `notes-…txt` старый, но не подходит под `-name '*.tar.gz'`. Перед `-delete` такую команду запускают без него и смотрят список.

title: "Больше семи"
type: quiz
kind: single
difficulty: 2
pitfall: "В [ ] знак > — перенаправление; числа сравнивают -gt, -lt, -eq."
statement: |
  В скрипте уборки:
  ```bash
  COUNT=10
  if [ $COUNT > 7 ]; then
      echo "архивов больше семи"
  fi
  ```
  Что происходит на самом деле?
options:
  - "Числа сравниваются, условие истинно"
  - "Числа сравниваются как строки: `10` меньше `7`, условие ложно"
  - "`>` — перенаправление: bash создаёт файл `7`, а `[ 10 ]` всегда истинно"
  - "Ошибка `integer expression expected`"
answer: [2]
explanation: |
  `[` — обычная команда, поэтому `> 7` bash понимает как «вывод в файл `7`»: в текущей папке появляется пустой файл `7`, а проверяется `[ 10 ]` — непустая строка, всегда истина. Даже при `COUNT=3` будет «больше семи». Правильно — `[ "$COUNT" -gt 7 ]`.

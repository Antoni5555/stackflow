title: "Ошибка без exit"
type: quiz
kind: single
difficulty: 2
pitfall: "Сообщение об ошибке не останавливает скрипт; нужен exit 1, иначе код — от последней команды."
statement: |
  Скрипт `check.sh` запустили без аргумента: `./check.sh; echo $?`.
  ```bash
  #!/bin/bash
  if [ -z "$1" ]; then
      echo "Нужно имя папки" >&2
  fi
  echo "Проверяю /srv/shop/$1"
  ```
  Что будет?
options:
  - "`Нужно имя папки`, код `1`"
  - "`Нужно имя папки`, затем `Проверяю /srv/shop/`, код `0`"
  - "Только `Проверяю /srv/shop/`, код `0`"
  - "Ошибка bash: `$1` не задан"
answer: [1]
explanation: |
  `echo` только печатает — скрипт идёт дальше и проверяет `/srv/shop/` целиком. Код скрипта — от последней команды, успешного `echo`, то есть `0`, и cron сочтёт запуск удачным. После сообщения об ошибке нужен `exit 1`. Незаданная `$1` в bash — просто пустая строка (ошибкой её делает только `set -u`).

title: "Цикл по пустой папке"
type: quiz
kind: single
difficulty: 2
pitfall: "Если шаблон не нашёл файлов, bash оставляет его как есть — цикл пройдёт один раз со строкой шаблона."
statement: |
  В `~/backups` нет ни одного `.zip`. Что выведет цикл?
  ```bash
  cd ~/backups
  for f in *.zip; do echo "файл: $f"; done
  ```
options:
  - "Ничего — цикл не выполнится ни разу"
  - "`файл: *.zip`"
  - "`файл: ` с пустым именем"
  - "Ошибку `No such file or directory`"
answer: [1]
explanation: |
  Шаблон без совпадений bash оставляет буквально, и цикл проходит один раз с `f='*.zip'`. Если внутри стоит `rm "$f"` или `tar … "$f"`, команда получит несуществующий файл. Защита — проверка в начале тела: `[ -e "$f" ] || continue`.

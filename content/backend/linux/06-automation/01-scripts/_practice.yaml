- title: Запустить скрипт деплоя
  text: |
    В песочнице есть скрипт `/srv/shop/deploy.sh`. Сделайте его исполняемым и запустите с аргументом:
    ```
    v2
    ```
  answer: |
    Ответ:
    ```bash
    chmod +x deploy.sh
    ./deploy.sh v2
    ```
    Результат:
    ```
    Деплой магазина: v2
    ```
    Скрипт подставил аргумент в `$1`. Без `chmod +x` было бы `Permission denied`.
- title: Имя файла с датой
  text: |
    Выведите имя архива с сегодняшней датой, не набирая дату руками:
    ```
    backup-ГГГГ-ММ-ДД.tar.gz
    ```
  answer: |
    Ответ:
    ```bash
    echo "backup-$(date +%F).tar.gz"
    ```
    Результат (у вас — сегодняшняя дата):
    ```
    backup-2026-11-23.tar.gz
    ```
    `$(date +%F)` заменяется выводом `date`; в двойных кавычках подстановка работает.
- title: Что получает скрипт
  text: |
    Создайте скрипт `args.sh`, который печатает число аргументов и первый из них, и вызовите его с двумя аргументами, первый — с пробелом:
    ```
    "my files" static
    ```
  answer: |
    Ответ:
    ```bash
    echo -e '#!/bin/bash\necho "аргументов: $#, первый: $1"' > args.sh
    chmod +x args.sh
    ./args.sh "my files" static
    ```
    Результат:
    ```
    аргументов: 2, первый: my files
    ```
    Кавычки при вызове сделали `my files` одним аргументом. `echo -e` превращает `\n` в перевод строки — так скрипт из двух строк пишется одной командой; можно и через `nano`.

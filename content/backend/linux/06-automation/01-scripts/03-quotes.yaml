title: "Одинарные или двойные"
type: quiz
kind: single
difficulty: 1
pitfall: "В одинарных кавычках $ не работает; переменные пишут в двойных."
statement: |
  Что выведет скрипт?
  ```bash
  #!/bin/bash
  NAME=media
  echo 'Архив: $NAME.tar.gz'
  echo "Архив: $NAME.tar.gz"
  ```
options:
  - "`Архив: media.tar.gz` дважды"
  - "`Архив: $NAME.tar.gz`, затем `Архив: media.tar.gz`"
  - "`Архив: $NAME.tar.gz` дважды"
  - "Ошибку: точка после имени переменной"
answer: [1]
explanation: |
  В одинарных кавычках текст печатается как есть — `$NAME` не подставляется. В двойных подставляется, а значение остаётся одним словом. Точка не может быть частью имени, поэтому `$NAME.tar.gz` — это `media` и `.tar.gz`; для букв после имени нужны фигурные скобки: `${NAME}_old`.

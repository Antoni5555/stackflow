title: "Три часа ночи"
type: quiz
kind: single
difficulty: 1
pitfall: "Первое поле — минута, второе — час."
statement: |
  Бэкап должен идти каждую ночь в 03:00. В crontab написали:
  ```
  3 0 * * * /home/shop/bin/backup.sh media
  ```
  Когда он запустится на самом деле?
options:
  - "В 03:00"
  - "В 00:03"
  - "3-го числа каждого месяца"
  - "Не установится: `bad hour`"
answer: [1]
explanation: |
  Первое поле — минута, второе — час: `3 0` — это 3 минуты после полуночи. Для 03:00 — `0 3 * * *`. Строка синтаксически верна, поэтому crontab её примет молча — ошибку заметят только по времени архивов.

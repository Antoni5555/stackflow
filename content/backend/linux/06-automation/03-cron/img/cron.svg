<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" class="fig" role="img" aria-labelledby="t"><title id="t">Строка crontab: пять полей времени и команда</title>
<style>
.fig text{white-space:pre}
.fig-t{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:14px;fill:#0e0e0e;fill:var(--text,#0e0e0e)}
.fig-c{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:14px;fill:#0e0e0e;fill:var(--text,#0e0e0e)}
.fig-cs{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:12px;fill:#0e0e0e;fill:var(--text,#0e0e0e)}
.fig-h{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:12px;letter-spacing:.04em;text-transform:uppercase;fill:#6e6e6a;fill:var(--muted,#6e6e6a)}
.fig-s{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:12px;fill:#6e6e6a;fill:var(--muted,#6e6e6a)}
.fig-box{fill:#ffffff;fill:var(--surface,#ffffff);stroke:#e0e0dc;stroke:var(--border,#e0e0dc);stroke-width:1.5}
.fig-box2{fill:#ebebe8;fill:var(--surface-2,#ebebe8);stroke:#e0e0dc;stroke:var(--border,#e0e0dc);stroke-width:1.5}
.fig-acc{fill:#dcf25c;fill:var(--accent,#dcf25c)}
.fig-onacc{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:13px;fill:#0e0e0e;fill:var(--on-accent,#0e0e0e)}
.fig-ln{stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5;fill:none}
.fig-lnd{stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.fig-ah{fill:#6e6e6a;fill:var(--muted,#6e6e6a)}
.fig-err{fill:#fdecea;fill:var(--error-bg,#fdecea);stroke:#d93025;stroke:var(--error,#d93025);stroke-width:1.5}
.fig-errt{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:13px;fill:#d93025;fill:var(--error,#d93025)}
.fig-ok{fill:#e7f6ec;fill:var(--success-bg,#e7f6ec);stroke:#1f9d55;stroke:var(--success,#1f9d55);stroke-width:1.5}
.fig-dash{fill:none;stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5;stroke-dasharray:5 4}
.fig-term{fill:#0d0d0f;fill:var(--term-bg,#0d0d0f)}
.fig-tt{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:13px;fill:#e6e6e3;fill:var(--term-text,#e6e6e3)}
.fig-tterr{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:13px;fill:#f87171}
.fig-m1{fill:#dbe4ff;fill:var(--match-1,#dbe4ff)}
.fig-m2{fill:#ffe3e3;fill:var(--match-2,#ffe3e3)}
.fig-m3{fill:#d3f9d8;fill:var(--match-3,#d3f9d8)}
.fig-venn{fill-opacity:.75;stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fig-ah"/></marker></defs>
<rect x="20" y="20" width="96" height="50" rx="12" class="fig-acc"/>
<text x="68.0" y="50.0" text-anchor="middle" class="fig-onacc">0</text>
<text x="68" y="92" text-anchor="middle" class="fig-t">минута</text>
<text x="68" y="114" text-anchor="middle" class="fig-s">0–59</text>
<rect x="130" y="20" width="96" height="50" rx="12" class="fig-acc"/>
<text x="178.0" y="50.0" text-anchor="middle" class="fig-onacc">3</text>
<text x="178" y="92" text-anchor="middle" class="fig-t">час</text>
<text x="178" y="114" text-anchor="middle" class="fig-s">0–23</text>
<rect x="240" y="20" width="96" height="50" rx="12" class="fig-box"/>
<text x="288.0" y="50.0" text-anchor="middle" class="fig-cs">*</text>
<text x="288" y="92" text-anchor="middle" class="fig-t">день</text>
<text x="288" y="114" text-anchor="middle" class="fig-s">1–31</text>
<rect x="350" y="20" width="96" height="50" rx="12" class="fig-box"/>
<text x="398.0" y="50.0" text-anchor="middle" class="fig-cs">*</text>
<text x="398" y="92" text-anchor="middle" class="fig-t">месяц</text>
<text x="398" y="114" text-anchor="middle" class="fig-s">1–12</text>
<rect x="460" y="20" width="96" height="50" rx="12" class="fig-box"/>
<text x="508.0" y="50.0" text-anchor="middle" class="fig-cs">*</text>
<text x="508" y="92" text-anchor="middle" class="fig-t">день нед.</text>
<text x="508" y="114" text-anchor="middle" class="fig-s">0–7, 0 и 7 — вс</text>
<rect x="570" y="20" width="290" height="50" rx="12" class="fig-box2"/>
<text x="715.0" y="50.0" text-anchor="middle" class="fig-cs">/home/shop/bin/backup.sh media</text>
<text x="715" y="92" text-anchor="middle" class="fig-t">команда — полные пути</text>
<text x="715" y="114" text-anchor="middle" class="fig-s">запускает /bin/sh, PATH=/usr/bin:/bin</text>
<rect x="20" y="150" width="200" height="28" rx="6" class="fig-box"/>
<text x="120.0" y="169.0" text-anchor="middle" class="fig-cs">0 3 * * *</text>
<text x="236" y="169" text-anchor="start" class="fig-s">каждый день в 03:00</text>
<rect x="20" y="184" width="200" height="28" rx="6" class="fig-box"/>
<text x="120.0" y="203.0" text-anchor="middle" class="fig-cs">*/15 * * * *</text>
<text x="236" y="203" text-anchor="start" class="fig-s">каждые 15 минут</text>
<rect x="20" y="218" width="200" height="28" rx="6" class="fig-box"/>
<text x="120.0" y="237.0" text-anchor="middle" class="fig-cs">0 9-18 * * 1-5</text>
<text x="236" y="237" text-anchor="start" class="fig-s">по будням, каждый час с 9 до 18</text>
<rect x="20" y="252" width="200" height="28" rx="6" class="fig-box"/>
<text x="120.0" y="271.0" text-anchor="middle" class="fig-cs">30 4 1 * *</text>
<text x="236" y="271" text-anchor="start" class="fig-s">1-го числа каждого месяца в 04:30</text>
<rect x="20" y="286" width="200" height="28" rx="6" class="fig-box"/>
<text x="120.0" y="305.0" text-anchor="middle" class="fig-cs">@reboot</text>
<text x="236" y="305" text-anchor="start" class="fig-s">один раз после загрузки сервера</text>
<text x="560" y="170" text-anchor="start" class="fig-s">* — любое значение</text>
<text x="560" y="198" text-anchor="start" class="fig-s">a-b — диапазон, a,b — список</text>
<text x="560" y="226" text-anchor="start" class="fig-s">*/N — каждые N</text>
<text x="560" y="254" text-anchor="start" class="fig-s">% в команде — перевод строки,</text>
<text x="560" y="276" text-anchor="start" class="fig-s">пишут \%</text>
</svg>

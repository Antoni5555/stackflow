title: "Когда запустится"
type: quiz
kind: single
difficulty: 1
pitfall: "Поля crontab: минута, час, день месяца, месяц, день недели; 1 — понедельник."
statement: |
  Когда cron запустит эту строку?
  ```
  30 2 * * 1 /home/shop/bin/report.sh
  ```
options:
  - "Каждый день в 02:30"
  - "По понедельникам в 02:30"
  - "1-го числа каждого месяца в 02:30"
  - "По понедельникам в 30:02"
answer: [1]
explanation: |
  Поля по порядку: минута `30`, час `2`, день месяца `*`, месяц `*`, день недели `1` — понедельник (`0` и `7` — воскресенье). 1-е число месяца — это третье поле: `30 2 1 * *`.

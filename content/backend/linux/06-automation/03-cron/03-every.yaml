title: "Каждые 10 минут"
type: quiz
kind: single
difficulty: 1
pitfall: "*/N в поле минут — каждые N минут; одно число — один раз в час."
statement: |
  Проверку здоровья сайта нужно запускать каждые 10 минут. Какая строка подходит?
options:
  - "`10 * * * * /home/shop/bin/health.sh`"
  - "`*/10 * * * * /home/shop/bin/health.sh`"
  - "`* */10 * * * /home/shop/bin/health.sh`"
  - "`0 10 * * * /home/shop/bin/health.sh`"
answer: [1]
explanation: |
  `*/10` в поле минут — 0, 10, 20… 50 каждого часа. `10 * * * *` — раз в час, в 10 минут. `* */10 * * *` — каждую минуту в часы 0, 10 и 20. `0 10 * * *` — раз в день в 10:00.

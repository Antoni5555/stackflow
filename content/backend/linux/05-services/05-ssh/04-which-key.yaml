title: "Какой ключ отдать"
type: quiz
kind: single
difficulty: 1
pitfall: "Серверу и коллегам отдают только открытый ключ .pub; закрытый не покидает ваш компьютер."
statement: |
  Администратор просит ключ, чтобы дать вам доступ к серверу. Что отправить?
options:
  - "`~/.ssh/id_ed25519`"
  - "`~/.ssh/id_ed25519.pub`"
  - "Оба файла"
  - "Пароль от компьютера"
answer: [1]
explanation: |
  Открытый ключ (`.pub`, строка `ssh-ed25519 AAAA…`) можно показывать кому угодно: по нему сервер только проверяет подпись. Закрытый — это ваш пароль от всех серверов с этим ключом; если он ушёл, ключ меняют и удаляют старую строку из всех `authorized_keys`.

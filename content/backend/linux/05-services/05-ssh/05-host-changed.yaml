title: "Изменился отпечаток сервера"
type: quiz
kind: single
difficulty: 2
pitfall: "Отпечаток сервера запоминается в known_hosts; изменение — переустановка или подмена; сначала выяснить, потом ssh-keygen -R."
statement: |
  При подключении: `WARNING: REMOTE HOST IDENTIFICATION HAS CHANGED!` и `Host key verification failed`. Что делать?
options:
  - "Удалить `~/.ssh` целиком"
  - "Выяснить, переустанавливали ли сервер; если да — удалить старый отпечаток `ssh-keygen -R адрес` и подключиться заново"
  - "Сменить свой ключ"
  - "Подключиться с `sudo`"
answer: [1]
explanation: |
  SSH сравнивает ключ сервера с отпечатком в `~/.ssh/known_hosts`. Изменился — либо сервер переустановили (новый ключ), либо кто-то перехватывает соединение. Поэтому сначала уточняют у администратора, а потом убирают старую запись `ssh-keygen -R 203.0.113.10` и проверяют новый отпечаток при первом входе.

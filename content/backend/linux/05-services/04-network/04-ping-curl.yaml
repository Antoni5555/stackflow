title: "ping отвечает, сайт — нет"
type: quiz
kind: single
difficulty: 1
pitfall: "ping проверяет машину, а не сайт; сайт проверяют curl."
statement: |
  `ping -c 3 shop.example` — `0% packet loss`, а в браузере сайт не открывается. Что это значит?
options:
  - "Сайт работает, проблема в браузере"
  - "Сервер доступен по сети, но веб-сервер или приложение не отвечают — проверять `curl -I` и службы"
  - "Не работает DNS"
  - "Сервер выключен"
answer: [1]
explanation: |
  `ping` отвечает ядро сервера — даже если Nginx и Gunicorn остановлены. Значит, сеть и машина в порядке, а проблема выше: `curl -I https://shop.example/` с вашего компьютера, `ss -tlnp` и `systemctl status` на сервере. Имя к тому же разрешилось — DNS работает.

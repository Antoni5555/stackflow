title: "Что открыть в файрволе"
type: quiz
kind: multiple
difficulty: 2
pitfall: "Снаружи на сервере сайта — только SSH (22), HTTP (80), HTTPS (443)."
statement: |
  Какие порты сервера магазина нужно открыть в `ufw` для доступа из интернета?
options:
  - "22 — SSH"
  - "80 — HTTP"
  - "443 — HTTPS"
  - "5432 — PostgreSQL"
  - "8000 — Gunicorn"
answer: [0, 1, 2]
explanation: |
  Через 22 вы заходите на сервер, через 80 и 443 покупатели открывают сайт (на 80 Nginx перенаправляет на HTTPS). База и Gunicorn работают на `127.0.0.1` и нужны только самому серверу — открывать их наружу значит подставить под перебор паролей и сканеры.

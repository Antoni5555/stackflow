title: "Какой адрес слушать"
type: quiz
kind: single
difficulty: 1
pitfall: "Приложение за Nginx слушает 127.0.0.1 — доступно только с самого сервера."
statement: |
  На каком адресе должен слушать Gunicorn, если перед ним стоит Nginx на том же сервере?
options:
  - "`0.0.0.0:8000`"
  - "`127.0.0.1:8000`"
  - "`0.0.0.0:80`"
  - "Внешний IP сервера, порт 8000"
answer: [1]
explanation: |
  `127.0.0.1` принимает подключения только с этой же машины — от Nginx. `0.0.0.0` открыл бы Gunicorn всему интернету в обход HTTPS, статики и защиты Nginx. Порт 80 слушает сам Nginx.

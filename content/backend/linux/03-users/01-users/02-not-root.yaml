title: "Запустить сайт от root"
type: quiz
kind: single
difficulty: 1
pitfall: "Приложение запускают от отдельного пользователя: взлом сайта не должен давать права root."
statement: |
  Gunicorn не может записать загруженное фото в `/srv/shop/media`. Коллега предлагает: «Запусти Gunicorn от `root` — и всё заработает». Что не так?
options:
  - "Ничего — от `root` сайт работает быстрее"
  - "Любая уязвимость в коде магазина даст злоумышленнику полный доступ к серверу; правильно — поправить владельца папки для пользователя приложения"
  - "От `root` Gunicorn не сможет читать `.env`"
  - "`root` не умеет открывать порты"
answer: [1]
explanation: |
  От `root` проверки прав не действуют — ошибка исчезнет, но вместе с ней исчезнет и защита: загрузка вредного файла или уязвимость в зависимости станут правами на весь сервер. Приложение работает от `shop`, а проблема решается владельцем папки (`sudo chown -R shop:shop /srv/shop/media`) — тема «Владельцы».

title: "Что говорит id"
type: quiz
kind: multiple
difficulty: 2
pitfall: "id показывает uid, основную группу и все группы; группа sudo — право выполнять команды от root."
statement: |
  ```
  $ id
  uid=1000(shop) gid=1000(shop) groups=1000(shop),27(sudo)
  ```
  Какие выводы верны?
options:
  - "Текущий пользователь — `shop`, его номер 1000"
  - "Основная группа — `shop`"
  - "Пользователь может выполнять команды через `sudo`"
  - "Пользователь — `root`, раз у него есть группа `sudo`"
  - "Новые файлы `shop` будут принадлежать группе `sudo`"
answer: [0, 1, 2]
explanation: |
  `uid` — номер и имя пользователя, `gid` — основная группа (её получают новые файлы), `groups` — все группы. Членство в `sudo` даёт право на `sudo`, но сам пользователь остаётся `shop` с `uid=1000`; у `root` — `uid=0`.

title: "Какой пароль спросит sudo"
type: quiz
kind: single
difficulty: 1
pitfall: "sudo спрашивает пароль текущего пользователя и работает, только если он в группе sudo."
statement: |
  Пользователь `shop` выполняет `sudo tail /var/log/nginx/access.log`. Какой пароль спросит система?
options:
  - "Пароль `root`"
  - "Пароль пользователя `shop`"
  - "Пароль `www-data`"
  - "Никакой — `sudo` не спрашивает пароль"
answer: [1]
explanation: |
  `sudo` подтверждает, что за клавиатурой именно `shop`, поэтому спрашивает **его** пароль, а право на повышение проверяет по группе `sudo` (в выводе `id` — `27(sudo)`) и `/etc/sudoers`. У `root` на Ubuntu пароля по умолчанию нет вовсе. Без пароля `sudo` работает, только если так настроено (например, для пользователя деплоя).

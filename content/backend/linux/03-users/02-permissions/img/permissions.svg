<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" class="fig" role="img" aria-labelledby="t"><title id="t">Права в ls -l: тип и три тройки, каждая — сумма r=4, w=2, x=1</title>
<style>

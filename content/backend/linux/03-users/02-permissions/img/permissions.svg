<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fig-ah"/></marker></defs>
<rect x="20" y="30" width="60" height="50" rx="12" class="fig-box"/>
<text x="50.0" y="60.0" text-anchor="middle" class="fig-c">-</text>
<text x="20" y="104" text-anchor="start" class="fig-s">тип: файл</text>
<rect x="170" y="30" width="110" height="50" rx="12" class="fig-acc"/>
<text x="225.0" y="60.0" text-anchor="middle" class="fig-onacc">rw-</text>
<text x="170" y="104" text-anchor="start" class="fig-s">владелец shop: 4+2 = 6</text>
<rect x="370" y="30" width="110" height="50" rx="12" class="fig-box2"/>
<text x="425.0" y="60.0" text-anchor="middle" class="fig-c">r--</text>
<text x="370" y="104" text-anchor="start" class="fig-s">группа www-data: 4</text>
<rect x="570" y="30" width="110" height="50" rx="12" class="fig-box"/>
<text x="625.0" y="60.0" text-anchor="middle" class="fig-c">---</text>
<text x="570" y="104" text-anchor="start" class="fig-s">остальные: 0</text>
<text x="20" y="150" text-anchor="start" class="fig-cs">-rw-r----- 1 shop www-data 33 .env  →  chmod 640 .env</text>
<rect x="20" y="180" width="400" height="90" rx="12" class="fig-box2"/>
<text x="36" y="206" text-anchor="start" class="fig-t">файл: r — читать, w — менять, x — запускать</text>
<text x="36" y="232" text-anchor="start" class="fig-t">папка: r — список, w — создать/удалить,</text>
<text x="36" y="256" text-anchor="start" class="fig-t">x — войти и открыть файлы по пути</text>
<rect x="460" y="180" width="400" height="90" rx="12" class="fig-ok"/>
<text x="476" y="206" text-anchor="start" class="fig-cs">644 — файлы, 755 — папки и скрипты</text>
<text x="476" y="232" text-anchor="start" class="fig-cs">600 — .env и ключ SSH</text>
<text x="476" y="256" text-anchor="start" class="fig-cs">640 / 750 — для владельца и группы</text>

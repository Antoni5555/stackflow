title: "Папка без x"
type: quiz
kind: single
difficulty: 2
pitfall: "Право x на папку — войти и открыть файлы внутри; у папок r и x ставят вместе."
statement: |
  Выполнили `chmod -R 644 /srv/shop/media`, чтобы «у фото были правильные права». Что случится с сайтом?
options:
  - "Ничего — у фото права `644`, как и нужно"
  - "Nginx перестанет отдавать фото: у папок пропало право `x`, войти в них нельзя"
  - "Фото станут доступны на запись всем"
  - "Удалятся все фото"
answer: [1]
explanation: |
  `-R` применил `644` и к папкам: `rw-r--r--` без `x`. Без `x` папку нельзя пройти по пути — в уроке `ls media/products` ответил `Permission denied` даже владельцу. Папкам нужно `755`, файлам — `644`; раздельно их ставят через `find media -type d` и `find media -type f`.

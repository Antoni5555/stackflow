title: "Права числом"
type: quiz
kind: single
difficulty: 1
pitfall: "Каждая цифра — сумма r=4, w=2, x=1 для владельца, группы и остальных."
statement: |
  Какое число соответствует правам `rw-r-----`?
options:
  - "`640`"
  - "`644`"
  - "`604`"
  - "`460`"
answer: [0]
explanation: |
  Владелец `rw-` = 4 + 2 = 6, группа `r--` = 4, остальные `---` = 0 → `640`. `644` дал бы чтение и остальным (`rw-r--r--`). Так закрывают файл, который нужен владельцу и одной группе — например, фото для Nginx через группу `www-data`.

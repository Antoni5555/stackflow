title: "Шаблон для кода 500"
type: quiz
kind: single
difficulty: 2
pitfall: "Слишком общий шаблон совпадает с лишним; код ответа ищут вместе с пробелами вокруг."
statement: |
  Строка журнала Nginx: `203.0.113.7 - - [21/Nov/2026:10:50:02 +0300] "GET /catalog/ HTTP/1.1" 200 15000`. Какая команда найдёт **только** запросы с кодом ответа 500?
options:
  - "`grep 500 access.log`"
  - "`grep \" 500 \" access.log`"
  - "`grep -c 500 access.log`"
  - "`grep -i 500 access.log`"
answer: [1]
explanation: |
  `grep 500` совпадёт и с размером `15000`, и с временем `10:50:02` — в строке выше нет ошибки, а шаблон её найдёт. Код в журнале стоит между пробелами: `" 500 "`. `-c` только посчитает те же неточные совпадения, `-i` для цифр ничего не меняет.

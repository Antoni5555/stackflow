title: "Всё в один файл"
type: quiz
kind: single
difficulty: 2
pitfall: "Оба потока в файл — > файл 2>&1; перенаправления выполняются слева направо."
statement: |
  Скрипт бэкапа `./backup.sh` по ночам пишет и обычные сообщения, и ошибки. Как сохранить в `backup.log` **и то, и другое**?
options:
  - "`./backup.sh > backup.log`"
  - "`./backup.sh 2>&1 > backup.log`"
  - "`./backup.sh > backup.log 2>&1`"
  - "`./backup.sh 2> backup.log`"
answer: [2]
explanation: |
  Сначала `> backup.log` отправляет stdout в файл, потом `2>&1` — stderr туда же. В обратном порядке `2>&1` срабатывает, пока stdout ещё на экране, — ошибки останутся на экране (в уроке так вышло с `ls … nope`). `>` и `2>` по отдельности сохраняют только один поток. Для журнала по ночам обычно `>>` — дописывать, а не перезаписывать.

title: "Числа как текст"
type: quiz
kind: single
difficulty: 1
pitfall: "sort без -n сравнивает строки посимвольно: 9 больше 100; числа сортируют sort -n."
statement: |
  Размеры ответов из журнала (10-е поле) — `9`, `100`, `12`. Нужен самый большой ответ первым. Что выведет `cut -d " " -f 10 access.log | sort -r`?
options:
  - "`100`, `12`, `9`"
  - "`9`, `12`, `100`"
  - "`12`, `100`, `9`"
  - "`9`, `100`, `12`"
answer: [1]
explanation: |
  Без `-n` строки сравниваются посимвольно, как слова в словаре: первая цифра `9` больше `1`, поэтому `9` «больше» и `100`, и `12`. По убыванию как текст — `9`, `12`, `100`. Числа сортирует `sort -n`: `sort -n -r` даст `100`, `12`, `9`.

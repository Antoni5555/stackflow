title: "Топ-3 IP"
type: exercise
difficulty: 3
pitfall: "Топ-N: cut | sort | uniq -c | sort -n -r | head -n N; uniq считает только соседние строки."
statement: |
  Выведите (последней командой) три IP, с которых пришло больше всего запросов, по журналу Nginx `/var/log/nginx/access.log` — в формате `uniq -c` (число и IP), по убыванию. IP — первое поле строки (разделитель — пробел). Журнал доступен только `root`.
setup:
  cwd: /home/shop
  files:
    /var/log/nginx/access.log:
      content: |
        203.0.113.7 - - [21/Nov/2026:10:00:00 +0300] "GET /catalog/ HTTP/1.1" 200 5120
        203.0.113.7 - - [21/Nov/2026:10:02:17 +0300] "GET /product/2/ HTTP/1.1" 200 4380
        198.51.100.23 - - [21/Nov/2026:10:04:34 +0300] "POST /checkout/ HTTP/1.1" 500 145
        192.0.2.10 - - [21/Nov/2026:10:06:51 +0300] "GET /static/css/main.css HTTP/1.1" 200 18230
        203.0.113.7 - - [21/Nov/2026:10:08:08 +0300] "GET /catalog/ HTTP/1.1" 200 5120
        198.51.100.23 - - [21/Nov/2026:10:10:25 +0300] "GET /wp-login.php HTTP/1.1" 404 162
        93.184.216.34 - - [21/Nov/2026:10:12:42 +0300] "GET /cart/ HTTP/1.1" 200 3011
        203.0.113.7 - - [21/Nov/2026:10:14:59 +0300] "GET /product/5/ HTTP/1.1" 200 4422
        203.0.113.7 - - [21/Nov/2026:10:16:16 +0300] "POST /checkout/ HTTP/1.1" 500 145
        93.184.216.34 - - [21/Nov/2026:10:18:33 +0300] "GET /product/2/ HTTP/1.1" 200 4380
        198.51.100.99 - - [21/Nov/2026:10:20:50 +0300] "POST /cart/add/2/ HTTP/1.1" 302 0
        203.0.113.7 - - [21/Nov/2026:10:22:07 +0300] "GET /catalog/ HTTP/1.1" 200 5120
        198.51.100.23 - - [21/Nov/2026:10:24:24 +0300] "GET /static/css/main.css HTTP/1.1" 200 18230
        192.0.2.10 - - [21/Nov/2026:10:26:41 +0300] "POST /checkout/ HTTP/1.1" 500 145
        203.0.113.7 - - [21/Nov/2026:10:28:58 +0300] "GET /wp-login.php HTTP/1.1" 404 162
        198.51.100.23 - - [21/Nov/2026:10:30:15 +0300] "GET /cart/ HTTP/1.1" 200 3011
        93.184.216.34 - - [21/Nov/2026:10:32:32 +0300] "GET /product/2/ HTTP/1.1" 200 4380
        198.51.100.99 - - [21/Nov/2026:10:34:49 +0300] "GET /catalog/ HTTP/1.1" 200 5120
        203.0.113.7 - - [21/Nov/2026:10:36:06 +0300] "GET /product/5/ HTTP/1.1" 200 4422
        198.51.100.23 - - [21/Nov/2026:10:38:23 +0300] "POST /checkout/ HTTP/1.1" 500 145
        192.0.2.10 - - [21/Nov/2026:10:40:40 +0300] "GET /wp-login.php HTTP/1.1" 404 162
        203.0.113.7 - - [21/Nov/2026:10:42:57 +0300] "POST /cart/add/2/ HTTP/1.1" 302 0
        198.51.100.23 - - [21/Nov/2026:10:44:14 +0300] "GET /static/css/main.css HTTP/1.1" 200 18230
        93.184.216.34 - - [21/Nov/2026:10:46:31 +0300] "GET /catalog/ HTTP/1.1" 200 5120
      owner: root
      mode: '640'
check:
  type: state
  expect:
    - output_matches: '(?<![\s\S])\s*9 203\.0\.113\.7\n\s*6 198\.51\.100\.23\n\s*4 93\.184\.216\.34\n?$(?![\s\S])'
      fail: "Ожидался вывод из трёх строк: 9 203.0.113.7, 6 198.51.100.23, 4 93.184.216.34. Проверьте: sort перед uniq -c, потом sort -n -r и head -n 3."
solution: |
  sudo cut -d " " -f 1 /var/log/nginx/access.log | sort | uniq -c | sort -n -r | head -n 3
hints:
  - "Вырежьте IP (`cut -d \" \" -f 1`), отсортируйте, посчитайте одинаковые, отсортируйте по числу."
  - "`sudo cut -d \" \" -f 1 /var/log/nginx/access.log | sort | uniq -c | sort -n -r | head -n 3`."
explanation: |
  `uniq -c` без `sort` посчитал бы только подряд идущие одинаковые строки. После счёта строки вида `      9 203.0.113.7` сортируют как числа по убыванию (`sort -n -r`) и берут первые три. `sudo` нужен первой команде — той, что читает закрытый журнал.

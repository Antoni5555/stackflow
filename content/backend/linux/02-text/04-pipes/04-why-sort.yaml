title: "Зачем sort перед uniq"
type: quiz
kind: single
difficulty: 2
pitfall: "uniq схлопывает только соседние одинаковые строки — без sort счёт неверный."
statement: |
  `cut -d " " -f 1 access.log | uniq -c` показал `2 203.0.113.7`, хотя с этого адреса 9 запросов. Почему?
options:
  - "`uniq -c` считает только подряд идущие одинаковые строки, а остальные 7 запросов разбросаны по файлу"
  - "`cut` вырезал не то поле"
  - "`uniq` не умеет считать больше двух"
  - "Нужен `sudo` перед `uniq`"
answer: [0]
explanation: |
  `uniq` сравнивает строку только с предыдущей. В журнале первые два запроса `203.0.113.7` идут подряд, а остальные — вперемешку с другими IP, и каждая такая группа считается отдельно. `sort` ставит одинаковые строки рядом — тогда `uniq -c` даёт 9.

- title: Все логи проекта
  text: |
    Найдите в проекте (из `/srv/shop`) все файлы с расширением:
    ```
    .log
    ```
  answer: |
    Ответ:
    ```bash
    find . -name "*.log"
    ```
    Результат:
    ```
    ./logs/app.log
    ```
    Шаблон — в кавычках, иначе `*.log` раскроет оболочка.
- title: Большие файлы на сервере
  text: |
    Найдите на всём сервере файлы больше 1 МБ, спрятав сообщения о закрытых папках. Условие размера:
    ```
    больше 1 МБ
    ```
  answer: |
    Ответ:
    ```bash
    find / -type f -size +1M 2> /dev/null
    ```
    Результат:
    ```
    /srv/shop/media/photo.jpg
    /var/log/nginx/access.log
    ```
    Журнал Nginx на 12 МБ — главный кандидат на сжатие (тема «Архивы»).
- title: Старые логи
  text: |
    Какие файлы в логах не менялись больше недели? Папка:
    ```
    /var/log
    ```
  answer: |
    Ответ:
    ```bash
    find /var/log -mtime +7
    ```
    Результат:
    ```
    /var/log/nginx/access.log
    ```
    `+7` — старше 7 дней; `-7` дал бы свежие.

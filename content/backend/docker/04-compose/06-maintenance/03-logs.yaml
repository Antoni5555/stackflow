title: "Диск съели журналы"
type: quiz
kind: single
difficulty: 2
pitfall: "Драйвер json-file по умолчанию не ограничивает размер журнала; ограничение — max-size и max-file, для новых контейнеров."
statement: |
  `du -sh /var/lib/docker/containers/*` показывает 40 ГБ у одного контейнера — это его `-json.log`. Как не допустить такого впредь?
options:
  - "Раз в неделю удалять файлы журналов руками через `rm`"
  - "Задать `max-size` и `max-file` для журналов (в compose — `logging.options`, для сервера — в `daemon.json`) и пересоздать контейнер"
  - "`docker system prune -a`"
  - "Перезапустить контейнер — журнал обнулится"
answer: [1]
explanation: |
  `json-file` по умолчанию копит весь вывод без ограничения. `max-size: 10m` и `max-file: 3` держат не больше трёх файлов по 10 МБ. Настройка применяется к контейнеру при создании — поэтому его пересоздают (`docker compose up -d` после правки). Ручной `rm` открытого файла ломает учёт журнала, `prune` журналы работающих контейнеров не трогает, а перезапуск журнал не очищает.

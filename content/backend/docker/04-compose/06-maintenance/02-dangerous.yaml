title: "Какая команда удалит базу"
type: quiz
kind: multiple
difficulty: 2
pitfall: "Именованные тома удаляет volume prune -a; system prune --volumes с Docker 23 — только анонимные; после compose down том базы не подключён."
statement: |
  Магазин остановлен `docker compose down`, база — в именованном томе `shop_pgdata`. Какие команды удалят базу?
options:
  - "`docker container prune -f`"
  - "`docker image prune -a -f`"
  - "`docker volume prune -a -f`"
  - "`docker system prune -a --volumes -f`"
  - "`docker builder prune -f`"
answer: [2]
explanation: |
  После `down` контейнера базы нет, и том `shop_pgdata` ни к чему не подключён. `volume prune -a` удаляет все такие тома, включая именованные. `system prune -a --volumes` в Docker 23+ удаляет только анонимные тома — именованный `shop_pgdata` останется (в Docker до 23 удалился бы и он). Остальные команды тома не трогают: удаляют контейнеры, образы и кэш сборки.

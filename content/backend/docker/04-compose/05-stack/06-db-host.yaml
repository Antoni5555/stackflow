title: "Миграции не видят базу"
type: exercise
difficulty: 3
pitfall: "localhost внутри контейнера — сам контейнер; базу в compose ищут по имени сервиса db."
statement: |
  Стек магазина (`db`, `web`, `nginx`) запускается, но миграции падают:
  ```
  django.db.utils.OperationalError: connection failed: connection to server at "127.0.0.1", port 5432 failed: Connection refused
  ```
  Найдите ошибку в настройках окружения проекта и исправьте её. Затем запустите стек, выполните миграции разовым контейнером `web` и последней командой получите главную: `curl -s localhost:58080/`.
setup:
  cwd: /home/shop/shop
  files:
    /home/shop/shop/requirements.txt: |
      Django==5.2.8
      gunicorn==23.0.0
      psycopg[binary]==3.2.12
    /home/shop/shop/manage.py: |
      #!/usr/bin/env python
      import os
      import sys


      def main():
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          from django.core.management import execute_from_command_line
          execute_from_command_line(sys.argv)


      if __name__ == "__main__":
          main()
    /home/shop/shop/config/__init__.py: ""
    /home/shop/shop/config/settings.py: |
      import os
      from pathlib import Path

      BASE_DIR = Path(__file__).resolve().parent.parent
      SECRET_KEY = os.environ["DJANGO_SECRET_KEY"]
      DEBUG = False
      ALLOWED_HOSTS = os.environ.get("DJANGO_ALLOWED_HOSTS", "").split(",")
      DATABASES = {
          "default": {
              "ENGINE": "django.db.backends.postgresql",
              "NAME": os.environ.get("POSTGRES_DB", "shop"),
              "USER": "postgres",
              "PASSWORD": os.environ["POSTGRES_PASSWORD"],
              "HOST": os.environ.get("DB_HOST", "db"),
              "PORT": "5432",
          }
      }
      STATIC_URL = "static/"
      STATIC_ROOT = BASE_DIR / "staticfiles"
    /home/shop/shop/config/wsgi.py: |
      import os
      from django.core.wsgi import get_wsgi_application
      os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
      application = get_wsgi_application()
    /home/shop/shop/shop/__init__.py: ""
    /home/shop/shop/shop/views.py: |
      from django.contrib.auth.models import User
      from django.http import HttpResponse


      def home(request):
          return HttpResponse(f"Магазин работает, пользователей: {User.objects.count()}\n")
    /home/shop/shop/Dockerfile: |
      FROM python:3.12-slim
      WORKDIR /app
      COPY requirements.txt .
      RUN pip install --no-cache-dir -r requirements.txt
      COPY . .
      RUN python manage.py collectstatic --noinput
      CMD ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "2", "config.wsgi"]
    /home/shop/shop/nginx.conf: |
      server {
          listen 80;

          location /static/ {
              alias /static/;
          }

          location / {
              proxy_pass http://web:8000;
              proxy_set_header Host $host;
          }
      }
    /home/shop/shop/shop.env: |
      POSTGRES_PASSWORD=s3cr3t
      POSTGRES_DB=shop
      DJANGO_SECRET_KEY=change-me-on-server
      DJANGO_ALLOWED_HOSTS=localhost
      DB_HOST=localhost
    /home/shop/shop/compose.yaml: |
      services:
        db:
          image: postgres:16
          env_file: shop.env
          volumes:
            - pgdata:/var/lib/postgresql/data
          healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 2s
            retries: 10
          restart: unless-stopped

        web:
          build: .
          env_file: shop.env
          volumes:
            - static:/app/staticfiles
          depends_on:
            db:
              condition: service_healthy
          restart: unless-stopped

        nginx:
          image: nginx:1.27-alpine
          ports:
            - "58080:80"
          volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - static:/static:ro
          depends_on:
            - web
          restart: unless-stopped

      volumes:
        pgdata:
        static:
  docker:
    images: [python:3.12-slim, postgres:16, nginx:1.27-alpine]
check:
  type: state
  expect:
    - path: /home/shop/shop/shop.env
      not_contains: 'DB_HOST=localhost'
      fail: "В shop.env осталось DB_HOST=localhost — для контейнера web это он сам."
    - docker: compose
      service: nginx
      status: running
      fail: "Сервис nginx не работает."
    - output_matches: 'Магазин работает, пользователей: 0'
      fail: "Последней командой получите главную curl -s localhost:58080/ — после миграций она отвечает «Магазин работает, пользователей: 0»."
solution: |
  sed -i 's/^DB_HOST=localhost$/DB_HOST=db/' shop.env
  docker compose up -d --build
  docker compose run --rm web python manage.py migrate
  curl -s localhost:58080/
hints:
  - "Адрес `127.0.0.1` взялся из переменной `DB_HOST`. Где задаются переменные `web` (ключ `env_file` в `compose.yaml`)?"
  - "В `shop.env` замените `DB_HOST=localhost` на `DB_HOST=db` (или удалите строку — в `settings.py` по умолчанию `db`)."
explanation: |
  В контейнере `web` адрес `localhost` — сам `web`, а PostgreSQL слушает в контейнере `db`. В сети проекта имя сервиса — имя хоста, поэтому `DB_HOST=db`. Переменные из `env_file` читаются при создании контейнера: `run` создал новый — и увидел исправленный файл, а работающий `shop-web-1` пересоздал `up -d`.

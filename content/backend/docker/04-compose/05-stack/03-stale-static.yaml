title: "Новые стили не появились"
type: quiz
kind: single
difficulty: 3
pitfall: "Именованный том заполняется из образа только пустым; при обновлении статика в нём остаётся старой."
statement: |
  Статика собирается в образе (`collectstatic` в Dockerfile) и раздаётся Nginx через общий том `static`. Выпустили новую версию с изменённым CSS: `docker compose up -d --build`. Django работает в новой версии, а браузер получает старый CSS. Почему?
options:
  - "Nginx кэширует файлы навсегда"
  - "Том `static` уже заполнен прошлой версией; Docker копирует содержимое образа в именованный том только когда том пуст"
  - "`collectstatic` не выполняется при `--build`"
  - "Нужно перезапустить сервер"
answer: [1]
explanation: |
  Первое подключение пустого тома скопировало в него статику из образа. Дальше том — самостоятельное хранилище: новый образ его не перезаписывает. При деплое выполняют `docker compose run --rm web python manage.py collectstatic --noinput` (статика пишется в том) или пересоздают том `static` (в нём нет ничего ценного).

title: "depends_on есть, а приложение падает"
type: quiz
kind: single
difficulty: 2
pitfall: "depends_on без условия задаёт только порядок запуска, а не готовность сервиса."
statement: |
  У `web` указано `depends_on: [db]`. При первом `docker compose up` Django падает с `Connection refused`, а при втором запуске всё работает. Почему?
options:
  - "Порядок запуска перепутан: `web` стартует раньше `db`"
  - "`db` запускается раньше, но PostgreSQL ещё инициализирует новый кластер — подключения пока не принимаются"
  - "Нужно опубликовать порт базы `-p 5432:5432`"
  - "`depends_on` работает только со второго запуска"
answer: [1]
explanation: |
  Короткий `depends_on` ждёт лишь старта процесса контейнера. На первом запуске PostgreSQL несколько секунд создаёт кластер — в это время подключения отклоняются. На втором запуске том уже есть, база стартует быстро и успевает. Решение — `healthcheck` с `pg_isready` и `condition: service_healthy`.

title: "Что делает unhealthy"
type: quiz
kind: single
difficulty: 2
pitfall: "Healthcheck только меняет статус; перезапуск — ключ restart."
statement: |
  У сервиса `web` настроен `healthcheck` запросом к `/health/`. Приложение зависло, статус стал `unhealthy`. Что сделает Docker?
options:
  - "Перезапустит контейнер"
  - "Ничего, кроме смены статуса: перезапуск по healthcheck — забота оркестратора или своего мониторинга"
  - "Удалит контейнер"
  - "Остановит все сервисы проекта"
answer: [1]
explanation: |
  Обычный Docker и compose не перезапускают контейнер по статусу `unhealthy` — они только его показывают (и учитывают в `depends_on`). `restart: unless-stopped` перезапускает контейнер, когда его главный процесс **завершился**, а зависший процесс жив. Перезапуск по здоровью умеют Docker Swarm, Kubernetes и внешний мониторинг.

<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fig-ah"/></marker></defs>
<rect x="20" y="20" width="300" height="250" rx="12" class="fig-box2"/>
<text x="36" y="46" text-anchor="start" class="fig-cs">compose.yaml</text>
<text x="36" y="74" text-anchor="start" class="fig-cs">services:</text>
<text x="36" y="95" text-anchor="start" class="fig-cs">  db:</text>
<text x="36" y="116" text-anchor="start" class="fig-cs">    image: postgres:16</text>
<text x="36" y="137" text-anchor="start" class="fig-cs">    environment: …</text>
<text x="36" y="158" text-anchor="start" class="fig-cs">  web:</text>
<text x="36" y="179" text-anchor="start" class="fig-cs">    build: .</text>
<text x="36" y="200" text-anchor="start" class="fig-cs">    ports: [&quot;58000:8000&quot;]</text>
<text x="36" y="221" text-anchor="start" class="fig-cs">    environment:</text>
<text x="36" y="242" text-anchor="start" class="fig-cs">      DB_HOST: db</text>
<path d="M320 145H376" class="fig-ln" marker-end="url(#a)"/>
<text x="348" y="136" text-anchor="middle" class="fig-s">up -d</text>
<rect x="380" y="20" width="480" height="210" rx="12" class="fig-ok"/>
<text x="396" y="46" text-anchor="start" class="fig-t">проект shop — сеть shop_default</text>
<rect x="396" y="70" width="200" height="70" rx="8" class="fig-box"/>
<text x="496.0" y="101.0" text-anchor="middle" class="fig-cs">shop-web-1</text>
<text x="496.0" y="119.0" text-anchor="middle" class="fig-cs">сервис web</text>
<rect x="640" y="70" width="200" height="70" rx="8" class="fig-box"/>
<text x="740.0" y="101.0" text-anchor="middle" class="fig-cs">shop-db-1</text>
<text x="740.0" y="119.0" text-anchor="middle" class="fig-cs">сервис db</text>
<path d="M596 105H636" class="fig-ln" marker-end="url(#a)"/>
<text x="618" y="96" text-anchor="middle" class="fig-s">db:5432</text>
<rect x="396" y="166" width="200" height="40" rx="8" class="fig-acc"/>
<text x="496.0" y="191.0" text-anchor="middle" class="fig-onacc">localhost:58000</text>
<path d="M496 166V144" class="fig-ln" marker-end="url(#a)"/>
<text x="640" y="184" text-anchor="start" class="fig-s">5432 наружу не открыт</text>
<text x="20" y="300" text-anchor="start" class="fig-s">Имя сервиса — имя хоста; контейнеры — проект-сервис-1; down удаляет контейнеры и сеть, тома остаются.</text>
</svg>

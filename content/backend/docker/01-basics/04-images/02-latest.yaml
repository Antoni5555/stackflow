title: "База не стартует после перезапуска"
type: quiz
kind: single
difficulty: 2
pitfall: "latest — подвижный тег по умолчанию; на сервере версии образов фиксируют."
statement: |
  Год назад базу магазина запустили как `docker run -d -v pgdata:/var/lib/postgresql/data … postgres`. После переезда на новый сервер (там образ скачался заново) PostgreSQL пишет, что файлы базы созданы несовместимой версией. Почему?
options:
  - "Том повредился при переезде"
  - "Без тега скачался `postgres:latest`, а он теперь указывает на новую мажорную версию"
  - "На новом сервере другая версия Docker"
  - "Нужно было использовать `postgres:alpine`"
answer: [1]
explanation: |
  Без тега Docker подставляет `latest`, а владелец образа передвигает его на новые выпуски. Год назад это была одна мажорная версия, сейчас — другая, и она не читает файлы старой. На сервере пишут `postgres:16` (или точнее `16.4`); переход на новую мажорную версию делают осознанно, с выгрузкой и загрузкой данных.

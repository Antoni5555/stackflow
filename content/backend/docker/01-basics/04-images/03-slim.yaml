title: "Основа для образа Django"
type: quiz
kind: single
difficulty: 2
pitfall: "Для Python-приложения обычно берут slim: в разы меньше полного образа и без сюрпризов musl, как у alpine."
statement: |
  Какой базовый образ разумнее всего взять для образа Django-магазина?
options:
  - "`python` — без тега всегда самая новая версия"
  - "`python:3.12` — полный, там точно всё есть"
  - "`python:3.12-slim`"
  - "`python:3.12-alpine` — самый маленький, значит лучший"
answer: [2]
explanation: |
  `slim` — тот же Debian и Python 3.12 без инструментов сборки: в уроке 179 МБ против 1,62 ГБ у полного. Без тега — непредсказуемая версия. В Alpine другая библиотека C (musl), и `pip install` для многих пакетов начинает компилировать из исходников — нужны компиляторы, сборка дольше, а образ в итоге часто не меньше.

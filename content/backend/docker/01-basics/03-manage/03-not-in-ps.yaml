title: "Контейнера нет в списке"
type: quiz
kind: single
difficulty: 1
pitfall: "docker ps показывает только работающие; остановленные — docker ps -a, причина — docker logs."
statement: |
  Запустили `docker run -d --name shop-web shop-web:1.0`, команда вывела ID, но `docker ps` контейнера не показывает. Что сделать первым делом?
options:
  - "Запустить ещё раз с тем же именем"
  - "`docker ps -a` — увидеть статус и код выхода, затем `docker logs shop-web` — почему он завершился"
  - "Удалить образ и скачать заново"
  - "Перезагрузить сервер"
answer: [1]
explanation: |
  `docker ps` без `-a` показывает только работающие контейнеры. Контейнер создан (ID напечатан), но его главный процесс, скорее всего, сразу упал: `ps -a` покажет `Exited (1)`, а `logs` — сообщение об ошибке. Повторный `run` с тем же именем даст «name is already in use».

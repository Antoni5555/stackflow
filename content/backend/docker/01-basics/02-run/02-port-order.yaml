title: "Порядок портов"
type: quiz
kind: single
difficulty: 1
pitfall: "В -p сначала порт хоста, потом порт контейнера."
statement: |
  Django на сервере подключается к базе по `localhost:55432`, а PostgreSQL в контейнере слушает 5432. Какой флаг нужен в `docker run`?
options:
  - "`-p 5432:55432`"
  - "`-p 55432:5432`"
  - "`-p 55432`"
  - "`-e PORT=55432`"
answer: [1]
explanation: |
  Формат — **хост:контейнер**: порт 55432 сервера ведёт на 5432 контейнера. `-p 5432:55432` открыл бы на сервере 5432 и вёл бы в порт 55432 контейнера, где никто не слушает. Переменная `PORT` образ `postgres` не понимает.

title: "Что решает Docker"
type: quiz
kind: multiple
difficulty: 1
pitfall: "Docker фиксирует окружение целиком — язык, базу, системные пакеты; venv изолирует только пакеты Python."
statement: |
  Какие проблемы магазина решает упаковка в Docker?
options:
  - "У нового разработчика PostgreSQL 14, а у магазина — 16"
  - "На сервере Python 3.10, а проект требует 3.12"
  - "В коде ошибка в расчёте скидки"
  - "Чтобы запустить проект, нужно вручную поставить Redis и системные библиотеки"
  - "Сайт медленно отвечает из-за запросов N+1"
answer: [0, 1, 3]
explanation: |
  Docker фиксирует окружение: версии Python, PostgreSQL, Redis и системных пакетов лежат в образах, и у всех они одинаковые. Ошибки в коде и медленные запросы к базе он не исправит — в контейнере они будут ровно такими же.

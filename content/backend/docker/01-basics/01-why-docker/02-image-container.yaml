title: "Образ или контейнер"
type: quiz
kind: single
difficulty: 1
pitfall: "Образ — неизменяемый шаблон; контейнер — запущенный экземпляр со своим слоем изменений."
statement: |
  Из образа `postgres:16` запустили два контейнера: `shop-db` и `test-db`. В `test-db` создали таблицу и удалили контейнер. Что стало с образом и с `shop-db`?
options:
  - "Таблица появилась и в образе, и в `shop-db`"
  - "Образ и `shop-db` не изменились: изменения жили в слое контейнера `test-db` и удалились вместе с ним"
  - "Образ удалился вместе с контейнером"
  - "`shop-db` остановился, потому что общий образ изменился"
answer: [1]
explanation: |
  Образ только читается. У каждого контейнера свой тонкий слой для изменений — таблица была в слое `test-db` и пропала с ним. Чтобы данные переживали удаление контейнера, их хранят в томах (раздел 2).

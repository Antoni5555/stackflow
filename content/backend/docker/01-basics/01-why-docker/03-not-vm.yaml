title: "Почему контейнер стартует быстро"
type: quiz
kind: single
difficulty: 2
pitfall: "Контейнер — процесс на ядре хоста, а не виртуальная машина со своим ядром."
statement: |
  Контейнер с PostgreSQL стартует за секунду, а виртуальная машина с тем же PostgreSQL — за минуту. Главная причина?
options:
  - "Docker кэширует запущенные базы в памяти"
  - "Контейнер не загружает своё ядро ОС: это процесс на ядре сервера с изолированными файлами и сетью"
  - "В контейнере PostgreSQL урезанный и работает быстрее"
  - "Виртуальные машины всегда хранят диск в облаке"
answer: [1]
explanation: |
  Виртуальной машине нужно «включить компьютер»: загрузить своё ядро и ОС. Контейнер — обычный процесс сервера, которому ядро показывает свою файловую систему, процессы и сеть (namespaces) и ограничивает ресурсы (cgroups). Запустить процесс — быстро. Обратная сторона — ядро общее, изоляция слабее, чем у виртуальной машины.

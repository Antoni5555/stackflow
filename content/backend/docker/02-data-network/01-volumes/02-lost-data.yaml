title: "Заказы пропали после обновления"
type: quiz
kind: single
difficulty: 1
pitfall: "Данные базы хранят в именованном томе; новый контейнер без того же тома начинает с пустой базой."
statement: |
  База запущена так: `docker run -d --name shop-db -e POSTGRES_PASSWORD=… postgres:16`. Для обновления сделали `docker rm -f shop-db` и тот же `docker run` заново. Таблиц нет. Как надо было запускать?
options:
  - "С флагом `--restart always`"
  - "С именованным томом: `-v pgdata:/var/lib/postgresql/data` — и при обновлении подключить тот же том"
  - "С `-p 5432:5432` — тогда данные сохраняются на сервере"
  - "Делать `docker stop` вместо `rm` перед новым `run`"
answer: [1]
explanation: |
  Без `-v` данные лежали в анонимном томе первого контейнера; новый контейнер получил новый пустой том. Именованный том живёт отдельно от контейнеров: новый `docker run` с `-v pgdata:/var/lib/postgresql/data` видит те же файлы базы. Порт и политика перезапуска к хранению не относятся, а `stop` + новый `run` с тем же именем вообще не сработает — имя занято.

title: "Пропала статика"
type: quiz
kind: single
difficulty: 2
pitfall: "Монтирование закрывает содержимое образа по этому пути."
statement: |
  В образ магазина при сборке положили собранную статику в `/app/static`. В разработке запускают `docker run -v ./static:/app/static shop-web:1.0`, где `./static` на сервере пустая. Сайт открывается без стилей. Почему?
options:
  - "Bind mount не работает с относительными путями"
  - "Пустая папка сервера смонтирована поверх `/app/static` и закрыла файлы из образа"
  - "Статика удалилась из образа при запуске"
  - "Нужен именованный том вместо папки"
answer: [1]
explanation: |
  Смонтированная папка заменяет содержимое пути в контейнере, пока смонтирована: файлы образа никуда не делись, но их не видно. Образ при этом не меняется. Либо не монтировать эту папку, либо монтировать туда, где в образе ничего нет. Пустой **именованный** том, в отличие от папки, Docker при первом подключении заполняет содержимым образа — но потом обновления образа в него уже не попадут.

title: "Где хранить SECRET_KEY"
type: quiz
kind: single
difficulty: 2
pitfall: "Секреты передают при запуске контейнера; в образе их может прочитать любой, кто его скачал."
statement: |
  Образ магазина публикуется в реестр и запускается на трёх серверах. Как правильно передать Django `SECRET_KEY`?
options:
  - "`ENV SECRET_KEY=…` в Dockerfile — тогда на всех серверах одинаково"
  - "`COPY .env .` в Dockerfile, а Django прочитает файл"
  - "При запуске: `--env-file /etc/shop/.env` с правами 600 на каждом сервере"
  - "Записать ключ прямо в `settings.py`"
answer: [2]
explanation: |
  Всё, что попало в образ, — `ENV`, скопированный `.env`, код с ключом — читается из образа любым, кто его скачал, и остаётся в реестре навсегда. Секрет передают при запуске, из файла, который лежит только на сервере. В `settings.py` — `SECRET_KEY = os.environ["SECRET_KEY"]`.

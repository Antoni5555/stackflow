title: "Имя не находится"
type: quiz
kind: single
difficulty: 2
pitfall: "В сети bridge по умолчанию нет DNS по именам контейнеров; нужна своя сеть."
statement: |
  Два контейнера запущены без `--network`. Из одного `ping shop-db` отвечает `ping: bad address 'shop-db'`, хотя `docker ps` показывает `shop-db` работающим. Что сделать?
options:
  - "Подождать: DNS обновится через минуту"
  - "Создать сеть (`docker network create shop`) и подключить к ней оба контейнера"
  - "Прописать IP `shop-db` из `docker inspect` в настройки"
  - "Добавить `-p` обоим контейнерам"
answer: [1]
explanation: |
  Контейнеры без `--network` попадают в `bridge` по умолчанию, где имена не разрешаются. В пользовательской сети встроенный DNS Docker отвечает на имена контейнеров. IP из `inspect` сработает до первого пересоздания контейнера, а `-p` на связь между контейнерами не влияет.

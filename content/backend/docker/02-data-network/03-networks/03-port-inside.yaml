title: "Какой порт внутри сети"
type: quiz
kind: single
difficulty: 2
pitfall: "Внутри Docker-сети контейнеры обращаются к внутренним портам; опубликованный порт принадлежит серверу."
statement: |
  База запущена так: `docker run -d --name shop-db --network shop -p 55432:5432 -e POSTGRES_PASSWORD=… postgres:16`. По какому адресу к ней подключиться **из другого контейнера** в сети `shop`?
options:
  - "`shop-db:55432`"
  - "`shop-db:5432`"
  - "`localhost:55432`"
  - "`localhost:5432`"
answer: [1]
explanation: |
  Внутри сети PostgreSQL слушает свой порт 5432, а 55432 — порт на сервере, его используют только снаружи (`localhost:55432` с самого сервера). Из контейнера `localhost` — он сам. Если база нужна только контейнерам, `-p` можно не писать вовсе.

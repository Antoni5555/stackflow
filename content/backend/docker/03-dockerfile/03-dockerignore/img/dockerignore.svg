<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fig-ah"/></marker></defs>
<rect x="20" y="20" width="240" height="230" rx="12" class="fig-box2"/>
<text x="36" y="46" text-anchor="start" class="fig-t">папка проекта</text>
<rect x="36" y="58" width="208" height="24" rx="4" class="fig-box"/>
<text x="140.0" y="75.0" text-anchor="middle" class="fig-cs">Dockerfile</text>
<rect x="36" y="88" width="208" height="24" rx="4" class="fig-box"/>
<text x="140.0" y="105.0" text-anchor="middle" class="fig-cs">requirements.txt</text>
<rect x="36" y="118" width="208" height="24" rx="4" class="fig-box"/>
<text x="140.0" y="135.0" text-anchor="middle" class="fig-cs">shop/</text>
<rect x="36" y="148" width="208" height="24" rx="4" class="fig-err"/>
<text x="140.0" y="165.0" text-anchor="middle" class="fig-errt">.git (208 КБ)</text>
<rect x="36" y="178" width="208" height="24" rx="4" class="fig-err"/>
<text x="140.0" y="195.0" text-anchor="middle" class="fig-errt">venv (18 МБ)</text>
<rect x="36" y="208" width="208" height="24" rx="4" class="fig-err"/>
<text x="140.0" y="225.0" text-anchor="middle" class="fig-errt">.env — пароли</text>
<path d="M260 100H316" class="fig-ln" marker-end="url(#a)"/>
<path d="M260 190H316" class="fig-ln" marker-end="url(#a)"/>
<rect x="320" y="40" width="540" height="110" rx="12" class="fig-err"/>
<text x="336" y="66" text-anchor="start" class="fig-errt">без .dockerignore: контекст 15,21 МБ</text>
<text x="336" y="92" text-anchor="start" class="fig-s">в образе /app: .git, venv, .env — 18 МБ</text>
<text x="336" y="118" text-anchor="start" class="fig-cs">cat /app/.env → SECRET_KEY=…, POSTGRES_PASSWORD=…</text>
<rect x="320" y="170" width="540" height="80" rx="12" class="fig-ok"/>
<text x="336" y="196" text-anchor="start" class="fig-cs">.dockerignore: .git  .env  venv/  __pycache__/  *.pyc</text>
<text x="336" y="222" text-anchor="start" class="fig-s">контекст 229 байт, /app — 24 КБ, .env: No such file</text>
<text x="20" y="296" text-anchor="start" class="fig-s">Секреты передают при запуске (--env-file), а не в образе.</text>
</svg>

- title: Виртуальное окружение в образе
  text: |
    В папке проекта появилась папка `venv/` с локальным окружением разработчика. Исключите её из сборки вместе с `.env`, `.git` и `__pycache__/`, пересоберите `shop-web:1.0` и проверьте содержимое `/app`.
  answer: |
    Ответ. Файл `.dockerignore`:
    ```
    .env
    .git
    venv/
    __pycache__/
    ```
    Команды:
    ```bash
    docker build -t shop-web:1.0 .
    docker run --rm shop-web:1.0 ls -a /app
    ```
    Результат (без вывода сборки):
    ```
    .
    ..
    .dockerignore
    Dockerfile
    requirements.txt
    shop
    ```
    `venv/` с сервера разработчика в образе не нужен: зависимости ставит `pip install` внутри образа, для его Python. Локальное окружение только раздувало бы контекст и могло перекрыть установленное.
- title: Почему секрет остался
  text: |
    Разработчик добавил `.env` в `.dockerignore`, но `docker run --rm shop-web:1.0 cat /app/.env` всё ещё показывает ключ. `.dockerignore` написан правильно и лежит рядом с Dockerfile. В чём причина и как исправить?
  answer: |
    Ответ. Образ собран **до** появления `.dockerignore` — правка файла на диске не меняет уже собранный образ. Пересоберите:
    ```bash
    docker build -t shop-web:1.0 .
    docker run --rm shop-web:1.0 cat /app/.env
    ```
    Результат (без вывода сборки):
    ```
    cat: /app/.env: No such file or directory
    ```
    Если старый образ уже отправлен в реестр, секрет считается утёкшим: ключ нужно сменить, а не только пересобрать образ.

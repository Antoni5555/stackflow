title: "Пароль в опубликованном образе"
type: quiz
kind: single
difficulty: 2
pitfall: "Секрет, попавший в опубликованный образ, считается утёкшим: его меняют, а не только удаляют из следующей версии."
statement: |
  Выяснилось, что образ `shop-web:1.4`, уже лежащий в публичном реестре, содержит `/app/.env` с `SECRET_KEY` и паролем базы. Что сделать в первую очередь?
options:
  - "Добавить `.env` в `.dockerignore` и выпустить `1.5` — этого достаточно"
  - "Сменить `SECRET_KEY` и пароль базы, затем добавить `.env` в `.dockerignore` и пересобрать образ"
  - "Удалить тег `1.4` из реестра — тогда никто не сможет его скачать"
  - "Ничего: файл внутри образа зашифрован"
answer: [1]
explanation: |
  Образ уже могли скачать: слои публичного реестра кэшируются у пользователей и в зеркалах, поэтому удаление тега ничего не гарантирует. Утёкший секрет — это скомпрометированный секрет: его меняют. Потом закрывают причину — `.env` в `.dockerignore`, а секреты передают при запуске.

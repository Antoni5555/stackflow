title: "Какой тег запускать на сервере"
type: quiz
kind: single
difficulty: 2
pitfall: "Сервер запускают по неизменяемому тегу версии — видно, что работает, и есть куда откатиться."
statement: |
  CI при каждом выпуске публикует `ghcr.io/shop/web:<версия>` и переносит `latest` на новую версию. Как лучше запускать магазин на сервере?
options:
  - "`docker run ghcr.io/shop/web:latest` — всегда самая новая"
  - "`docker run ghcr.io/shop/web:1.4.2` — точный тег выпуска"
  - "Собирать образ на сервере из исходников"
  - "Без тега — Docker сам выберет подходящий"
answer: [1]
explanation: |
  С `latest` неясно, какая версия работает, а при откате или перезапуске сервер может получить другой образ. Точный тег однозначен: в журнале деплоя видно, что запущено, а откат — это запуск предыдущего тега (`1.4.1`). Без тега — тот же `latest`.

title: "Что уходит при push новой версии"
type: quiz
kind: single
difficulty: 2
pitfall: "push и pull передают только слои, которых нет на другой стороне."
statement: |
  Версия `1.4.2` уже лежит в реестре. В `1.4.3` поменяли только код (последний шаг Dockerfile — `COPY . .`), зависимости те же. Что отправит `docker push ghcr.io/shop/web:1.4.3`?
options:
  - "Весь образ — около 190 МБ"
  - "Только новый слой с кодом и описание образа; остальные слои — `Layer already exists`"
  - "Ничего: теги с одинаковым содержимым не отправляются"
  - "Только Dockerfile — реестр соберёт образ сам"
answer: [1]
explanation: |
  Слои базового образа и зависимостей совпадают с `1.4.2` (тема 3.02 — порядок инструкций) и уже есть в реестре. Отправятся десятки килобайт кода и манифест. Сервер при `pull` так же скачает только новый слой. Реестр образы не собирает — он только хранит.

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" class="fig" role="img" aria-labelledby="t"><title id="t">Многоэтапная сборка: компилятор остаётся в первом этапе</title>
<style>
.fig text{white-space:pre}
.fig-t{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:14px;fill:#0e0e0e;fill:var(--text,#0e0e0e)}
.fig-c{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:14px;fill:#0e0e0e;fill:var(--text,#0e0e0e)}
.fig-cs{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:12px;fill:#0e0e0e;fill:var(--text,#0e0e0e)}
.fig-h{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:12px;letter-spacing:.04em;text-transform:uppercase;fill:#6e6e6a;fill:var(--muted,#6e6e6a)}
.fig-s{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:12px;fill:#6e6e6a;fill:var(--muted,#6e6e6a)}
.fig-box{fill:#ffffff;fill:var(--surface,#ffffff);stroke:#e0e0dc;stroke:var(--border,#e0e0dc);stroke-width:1.5}
.fig-box2{fill:#ebebe8;fill:var(--surface-2,#ebebe8);stroke:#e0e0dc;stroke:var(--border,#e0e0dc);stroke-width:1.5}
.fig-acc{fill:#dcf25c;fill:var(--accent,#dcf25c)}
.fig-onacc{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:13px;fill:#0e0e0e;fill:var(--on-accent,#0e0e0e)}
.fig-ln{stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5;fill:none}
.fig-lnd{stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.fig-ah{fill:#6e6e6a;fill:var(--muted,#6e6e6a)}
.fig-err{fill:#fdecea;fill:var(--error-bg,#fdecea);stroke:#d93025;stroke:var(--error,#d93025);stroke-width:1.5}
.fig-errt{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:13px;fill:#d93025;fill:var(--error,#d93025)}
.fig-ok{fill:#e7f6ec;fill:var(--success-bg,#e7f6ec);stroke:#1f9d55;stroke:var(--success,#1f9d55);stroke-width:1.5}
.fig-dash{fill:none;stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5;stroke-dasharray:5 4}
.fig-term{fill:#0d0d0f;fill:var(--term-bg,#0d0d0f)}
.fig-tt{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:13px;fill:#e6e6e3;fill:var(--term-text,#e6e6e3)}
.fig-tterr{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:13px;fill:#f87171}
.fig-m1{fill:#dbe4ff;fill:var(--match-1,#dbe4ff)}
.fig-m2{fill:#ffe3e3;fill:var(--match-2,#ffe3e3)}
.fig-m3{fill:#d3f9d8;fill:var(--match-3,#d3f9d8)}
.fig-venn{fill-opacity:.75;stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fig-ah"/></marker></defs>
<rect x="20" y="20" width="300" height="200" rx="12" class="fig-box2"/>
<text x="36" y="46" text-anchor="start" class="fig-t">этап build</text>
<rect x="36" y="58" width="268" height="30" rx="6" class="fig-box"/>
<text x="170.0" y="78.0" text-anchor="middle" class="fig-cs">FROM python:3.12-slim AS build</text>
<rect x="36" y="96" width="268" height="30" rx="6" class="fig-err"/>
<text x="170.0" y="116.0" text-anchor="middle" class="fig-errt">apt: gcc libc6-dev libpq-dev</text>
<rect x="36" y="134" width="268" height="30" rx="6" class="fig-box"/>
<text x="170.0" y="154.0" text-anchor="middle" class="fig-cs">python -m venv /opt/venv</text>
<rect x="36" y="172" width="268" height="30" rx="6" class="fig-box"/>
<text x="170.0" y="192.0" text-anchor="middle" class="fig-cs">pip install → psycopg2 собран</text>
<path d="M320 170H356" class="fig-ln" marker-end="url(#a)"/>
<text x="338" y="160" text-anchor="middle" class="fig-s">/opt/venv</text>
<rect x="360" y="20" width="300" height="230" rx="12" class="fig-ok"/>
<text x="376" y="46" text-anchor="start" class="fig-t">итоговый образ</text>
<rect x="376" y="58" width="268" height="28" rx="6" class="fig-box"/>
<text x="510.0" y="77.0" text-anchor="middle" class="fig-cs">FROM python:3.12-slim</text>
<rect x="376" y="94" width="268" height="28" rx="6" class="fig-box"/>
<text x="510.0" y="113.0" text-anchor="middle" class="fig-cs">apt: libpq5 + useradd app</text>
<rect x="376" y="130" width="268" height="28" rx="6" class="fig-box"/>
<text x="510.0" y="149.0" text-anchor="middle" class="fig-cs">COPY --from=build /opt/venv</text>
<rect x="376" y="166" width="268" height="28" rx="6" class="fig-box"/>
<text x="510.0" y="185.0" text-anchor="middle" class="fig-cs">COPY --chown=app:app . .</text>
<rect x="376" y="202" width="268" height="28" rx="6" class="fig-box"/>
<text x="510.0" y="221.0" text-anchor="middle" class="fig-cs">USER app</text>
<rect x="690" y="20" width="170" height="230" rx="12" class="fig-box2"/>
<text x="706" y="46" text-anchor="start" class="fig-t">размер</text>
<text x="706" y="80" text-anchor="start" class="fig-s">python:3.12</text>
<text x="706" y="100" text-anchor="start" class="fig-errt">1,62 ГБ</text>
<text x="706" y="136" text-anchor="start" class="fig-s">slim + gcc</text>
<text x="706" y="156" text-anchor="start" class="fig-cs">536 МБ</text>
<text x="706" y="192" text-anchor="start" class="fig-s">многоэтапный</text>
<text x="706" y="212" text-anchor="start" class="fig-cs">205 МБ</text>
<text x="20" y="290" text-anchor="start" class="fig-s">В итоговом образе нет gcc и заголовков — только готовое окружение и библиотека libpq5.</text>
<text x="20" y="316" text-anchor="start" class="fig-s">Приложение работает от app: /etc и системные файлы ему не изменить.</text>
</svg>

title: "Что делает EXPOSE"
type: quiz
kind: single
difficulty: 1
pitfall: "EXPOSE — только пометка о порте; доступ с сервера открывает -p."
statement: |
  В Dockerfile есть `EXPOSE 8000`. Контейнер запущен `docker run -d shop-web:1.4`. Откроется ли страница по `curl localhost:8000` на сервере?
options:
  - "Да: `EXPOSE` публикует порт"
  - "Нет: `EXPOSE` только помечает порт, публикует его `-p 8000:8000` (или `-P` — на случайный)"
  - "Да, но только по IPv6"
  - "Нет, потому что `EXPOSE` закрывает порт"
answer: [1]
explanation: |
  `EXPOSE` — документация внутри образа: какой порт слушает приложение. `docker ps` покажет `8000/tcp`, но без стрелки `->` — порт не опубликован. Доступ с сервера даёт только `-p`.

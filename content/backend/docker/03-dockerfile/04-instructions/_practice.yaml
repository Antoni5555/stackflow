- title: Другая команда вместо CMD
  text: |
    Не меняя Dockerfile, выполните в разовом контейнере из `shop-web:1.0` команду `python --version` вместо Gunicorn.
  answer: |
    Ответ:
    ```bash
    docker run --rm shop-web:1.0 python --version
    ```
    Результат:
    ```
    Python 3.12.16
    ```
    Команда после имени образа заменяет `CMD` целиком. Так запускают миграции и `manage.py`-команды из того же образа, что и сайт. С `ENTRYPOINT` было бы иначе: команда стала бы его аргументами.
- title: EXPOSE и случайный порт
  text: |
    Добавьте в Dockerfile `EXPOSE 8000`, пересоберите `shop-web:1.0` и запустите контейнер `shop-web` с флагом `-P` (без номеров портов). Какой порт сервера ему достался?
  answer: |
    Ответ:
    ```bash
    docker build -t shop-web:1.0 .
    docker run -d --name shop-web -P shop-web:1.0
    docker ps --format '{{.Names}} {{.Ports}}'
    ```
    Результат (без вывода сборки и ID):
    ```
    shop-web 0.0.0.0:32768->8000/tcp, [::]:32768->8000/tcp
    ```
    `EXPOSE` сам ничего не открывает — это пометка в образе. `-P` публикует все такие порты на свободные порты сервера (32768 и выше). Для сервера магазина порт задают явно: `-p 58000:8000`.

title: "Сборка не заканчивается"
type: quiz
kind: single
difficulty: 1
pitfall: "RUN выполняется при сборке, CMD — при запуске контейнера."
statement: |
  Последняя строка Dockerfile:
  ```dockerfile
  RUN gunicorn --bind 0.0.0.0:8000 shop.wsgi
  ```
  `docker build` дошёл до этого шага и висит. Почему и как исправить?
options:
  - "Gunicorn долго устанавливается — подождать"
  - "`RUN` выполняет команду при сборке: сервер запустился внутри сборки и никогда не завершится. Нужно `CMD [\"gunicorn\", \"--bind\", \"0.0.0.0:8000\", \"shop.wsgi\"]`"
  - "Нет `EXPOSE 8000`"
  - "Нужно `RUN` с флагом `-d`"
answer: [1]
explanation: |
  Шаг `RUN` заканчивается, когда завершается команда, а сервер работает бесконечно. Запуск приложения — это `CMD`: при сборке он не выполняется, а при `docker run` становится главным процессом контейнера.

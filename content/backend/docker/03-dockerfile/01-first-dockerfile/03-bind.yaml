title: "Порт опубликован, а страницы нет"
type: quiz
kind: single
difficulty: 2
pitfall: "Сервер в контейнере слушает 0.0.0.0 — 127.0.0.1 внутри контейнера недоступен через проброс порта."
statement: |
  `CMD ["gunicorn", "--bind", "127.0.0.1:8000", "shop.wsgi"]`, контейнер запущен с `-p 58000:8000`, в `docker logs` — «Listening at: http://127.0.0.1:8000». Но `curl localhost:58000` с сервера получает обрыв соединения. Почему?
options:
  - "Порт нужно публиковать как `-p 8000:58000`"
  - "Gunicorn слушает только loopback внутри контейнера, а проброшенные запросы приходят на его сетевой интерфейс — нужно `--bind 0.0.0.0:8000`"
  - "Gunicorn не умеет работать в Docker"
  - "Нужно добавить `EXPOSE 58000`"
answer: [1]
explanation: |
  `127.0.0.1` внутри контейнера — его собственный loopback. Docker пересылает запросы с порта сервера на сетевой интерфейс контейнера, а там никто не слушает. `0.0.0.0` — «на всех интерфейсах». Наружу от этого ничего лишнего не откроется: доступ с сервера по-прежнему решает `-p`.

title: "Что повторять"
type: quiz
kind: multiple
difficulty: 2
pitfall: "Повторяют временные ошибки (сеть, 429, 502–504) и только безопасные для повтора запросы; 4xx не повторяют."
statement: |
  Клиент магазина получил при вызове внешних сервисов разные ошибки. Какие запросы стоит автоматически повторить (с паузой)?
options:
  - "`GET /v1/quote/` у службы доставки — `503 Service Unavailable`"
  - "`GET /v1/points/` — `httpx.ConnectError`"
  - "`POST /v1/payments/` без ключа идемпотентности — `httpx.ReadTimeout`"
  - "`POST /v1/quote/` — `422` «weight_kg должно быть числом»"
  - "`GET /v1/quote/` — `429` с `Retry-After: 2`"
  - "`GET /v1/quote/` — `401` «Нужен ключ API»"
answer: [0, 1, 4]
explanation: |
  503 и 429 — временная занятость сервиса (при 429 ждут `Retry-After`), `ConnectError` — запрос даже не дошёл. `ReadTimeout` на `POST` оплаты без ключа повторять нельзя: в уроке платёжка уже списала деньги, а ответ потерялся — повтор дал второе списание. 422 и 401 — ошибка в самом запросе: повтор получит то же самое.

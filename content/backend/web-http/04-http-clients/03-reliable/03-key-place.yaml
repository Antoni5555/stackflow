title: "Где создать ключ"
type: quiz
kind: single
difficulty: 2
pitfall: "Ключ идемпотентности создают один раз на операцию и передают во всех попытках."
statement: |
  ```python
  def pay(order):
      for attempt in range(3):
          key = str(uuid.uuid4())
          try:
              r = client.post("/v1/payments/", json={"order": order.id, "amount": order.total},
                              headers={"Idempotency-Key": key})
              return r
          except httpx.ReadTimeout:
              time.sleep(2 ** attempt)
  ```
  Первая попытка списала деньги, но ответ потерялся. Что сделает вторая?
options:
  - "Вернёт сохранённый результат первой — списание одно"
  - "Спишет деньги ещё раз: ключ новый, платёжка считает это новой оплатой"
  - "Получит 409 Conflict"
  - "Ничего не отправит"
answer: [1]
explanation: |
  `uuid4()` внутри цикла даёт каждой попытке новый ключ, и для платёжки это три разные оплаты — защиты нет. Ключ создают **до** цикла, один на оплату заказа, а лучше — сохраняют вместе с заказом, чтобы тот же ключ использовался и после перезапуска процесса. В уроке с одним ключом на все попытки списание было одно.

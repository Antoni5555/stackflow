title: "Сколько ждать"
type: quiz
kind: single
difficulty: 1
pitfall: "gather запускает запросы одновременно: общее время ≈ самый медленный, а не сумма."
statement: |
  Три службы доставки отвечают за 0,1, 0,3 и 0,2 секунды. Цены запрашивают так:
  ```python
  async with httpx.AsyncClient() as client:
      prices = await asyncio.gather(*(quote(client, h) for h in SERVICES))
  ```
  Сколько примерно ждать всех трёх цен?
options:
  - "0,6 с — сумма"
  - "0,3 с — самый медленный"
  - "0,1 с — самый быстрый"
  - "0,2 с — среднее"
answer: [1]
explanation: |
  `gather` отправляет все три запроса сразу, и они ждут ответа одновременно — время определяет самая медленная служба. В уроке: по очереди — 0,6 с, через `gather` — 0,3 с. Результаты при этом идут в порядке корутин, а не в порядке ответов.

title: "Неизвестная сортировка"
type: quiz
kind: single
difficulty: 1
pitfall: "Неразрешённый параметр сортировки — 400 с понятной ошибкой, а не тихий порядок по умолчанию и не 500."
statement: |
  API товаров разрешает сортировку `price`, `-price`, `name`, `-name`. Клиент прислал `GET /api/v1/products/?sort=rating`. Что лучше ответить?
options:
  - "`200 OK` — список в порядке по умолчанию"
  - "`400 Bad Request` и ошибку с полем `sort`"
  - "`500 Internal Server Error` — `order_by(\"rating\")` упал"
  - "`404 Not Found`"
answer: [1]
explanation: |
  Ошибка клиента — в параметре запроса: `400`, учебный API ответил `{"error": {"code": "invalid_param", "message": "Нельзя сортировать по rating", "field": "sort"}}`. С тихим `200` разработчик приложения долго ищет, почему порядок «странный». `500` — значит параметр без проверки дошёл до базы. Ресурс `/api/v1/products/` существует — не 404.

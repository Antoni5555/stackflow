title: "Страницы или курсор"
type: quiz
kind: multiple
difficulty: 2
pitfall: "Пагинация по номеру медленна на глубоких страницах и сдвигается при вставках; курсорная — быстрая и стабильная, но без перехода на N-ю страницу."
statement: |
  Какие утверждения о пагинации верны?
options:
  - "`?page=1000` с `OFFSET` заставляет базу пройти и отбросить все строки предыдущих страниц"
  - "Если между запросами страниц 1 и 2 добавили товар в начало списка, при пагинации по номеру один товар покажется дважды"
  - "Курсорная пагинация позволяет сразу перейти на страницу 50"
  - "Курсорная пагинация подходит для бесконечной ленты"
  - "Ограничивать `page_size` не нужно: клиент сам знает, сколько ему надо"
answer: [0, 1, 3]
explanation: |
  `OFFSET` — пропуск строк перебором, поэтому глубокие страницы медленные. Новый товар в начале сдвигает список: последний товар первой страницы окажется первым на второй. Курсор — «следующие N после такого-то ключа»: идёт по индексу и не сдвигается, но номера страниц у него нет — поэтому он хорош для ленты и плох для «перейти на страницу 50». Без верхней границы `page_size` клиент выгрузит всю таблицу одним запросом.

title: "Что ломает старых клиентов"
type: quiz
kind: multiple
difficulty: 2
pitfall: "Удалить, переименовать, сменить тип поля или сделать поле обязательным — ломающие изменения: только в новой версии."
statement: |
  В `v1` API магазина ответ о товаре — `{"id": 2, "name": "Беспроводная мышь", "price": "1499.00"}`. Какие изменения в **той же версии** сломают уже установленные мобильные приложения?
options:
  - "Добавить в ответ поле `\"rating\": 4.8`"
  - "Заменить `\"price\": \"1499.00\"` на `\"price\": {\"amount\": \"1499.00\", \"currency\": \"RUB\"}`"
  - "Переименовать `name` в `title`"
  - "Добавить необязательный параметр списка `?in_stock=true`"
  - "Сделать поле `comment` в `POST /api/v1/orders/` обязательным"
answer: [1, 2, 4]
explanation: |
  Старое приложение читает `price` как строку и `name` по имени — объект вместо строки и пропавшее поле его ломают; новое обязательное поле даёт 422 на запросы, которые вчера проходили. Новое поле в ответе и новый необязательный параметр старые клиенты просто не замечают. Поэтому цена-объект в учебном API — только в `/api/v2/products/2/`.

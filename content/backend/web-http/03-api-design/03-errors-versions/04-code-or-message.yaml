title: "По чему решать"
type: quiz
kind: single
difficulty: 1
pitfall: "Программа решает по стабильному коду ошибки, а текст message — для человека и может меняться."
statement: |
  API ответил `422` и `{"error": {"code": "validation_error", "message": "Проверьте поля", "fields": {"address": ["Нужен адрес для курьера"]}}}`. Мобильное приложение должно подсветить поле адреса. На что ему опираться?
options:
  - "На `message == \"Проверьте поля\"`"
  - "На `code == \"validation_error\"` и ключи `fields`"
  - "На длину тела ответа"
  - "На текст `\"Нужен адрес для курьера\"` — найти в нём слово «адрес»"
answer: [1]
explanation: |
  `code` — контракт API: его не меняют без новой версии. Ключи `fields` — имена полей запроса: по ним понятно, какое поле подсветить, а текст списка показывают пользователю. `message` и тексты ошибок поля перепишут при первой правке формулировок или переводе — и проверка по тексту сломается.

title: "Заказ из формы"
type: exercise
difficulty: 2
pitfall: "Значения формы — всегда строки; parse_qs возвращает списки, числа приводят сами."
statement: |
  Тело заказа пришло формой: `product=2&quantity=3`. Напишите `parse_order(body)`, которая возвращает словарь `{"product": 2, "quantity": 3}` с **числами**. Если `quantity` в теле нет — 1.
starter_code: |
  def parse_order(body):
      pairs = dict(p.split("=") for p in body.split("&"))
      return pairs
check:
  type: tests
  tests:
    - code: |
        assert parse_order("product=2&quantity=3") == {"product": 2, "quantity": 3}
      fail: "Значения формы — строки: product и quantity нужно привести к int."
    - code: |
        assert parse_order("product=5") == {"product": 5, "quantity": 1}
      fail: "Без quantity — количество 1."
    - code: |
        assert parse_order("quantity=2&product=7&note=%D0%BF%D0%BE%D0%B4%D0%B0%D1%80%D0%BE%D0%BA") == {"product": 7, "quantity": 2}
      fail: "Лишние поля пропускайте; порядок полей не важен."
solution: |
  from urllib.parse import parse_qs


  def parse_order(body):
      data = parse_qs(body)
      return {
          "product": int(data["product"][0]),
          "quantity": int(data.get("quantity", ["1"])[0]),
      }
hints:
  - "Какая функция разбирает строку формы?"
  - "`parse_qs(body)` — значения списки: `int(data[\"product\"][0])`."
explanation: |
  В форме нет типов — `request.POST` в учебном API вернул `{"product": "2", "quantity": "1"}` строками. `parse_qs` декодирует `%XX` и `+` и возвращает списки (ключ может повторяться), поэтому берём `[0]` и приводим к `int`. Самодельный `split("=")` ломается на закодированных значениях и не декодирует их.

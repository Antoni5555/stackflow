title: "Товар закончился"
type: quiz
kind: single
difficulty: 1
pitfall: "409 Conflict — запрос верный, но конфликтует с состоянием ресурса."
statement: |
  Покупатель оформляет заказ на 5 ноутбуков, а на складе осталось 3. Запрос корректный: JSON разобран, товар существует. Какой код вернуть?
options:
  - "`200 OK` с `{\"ok\": false}`"
  - "`404 Not Found`"
  - "`409 Conflict`"
  - "`500 Internal Server Error`"
answer: [2]
explanation: |
  Данные верные, но действие невозможно в текущем состоянии склада — `409 Conflict`; учебный API ответил `{"error": "Осталось 3 шт."}`. 404 — ресурса нет (а товар есть), 500 — сбой сервера, 200 с ошибкой в теле обманывает клиентов и мониторинг.

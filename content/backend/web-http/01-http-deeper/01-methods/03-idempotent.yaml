title: "Можно ли повторить"
type: quiz
kind: multiple
difficulty: 2
pitfall: "Идемпотентные методы можно повторять: GET, HEAD, OPTIONS, PUT, DELETE; POST — нет."
statement: |
  Мобильное приложение не дождалось ответа из-за обрыва связи. Какие запросы можно безопасно отправить повторно — итог на сервере не изменится?
options:
  - "`GET /api/products/2/`"
  - "`POST /api/orders/` — оформить заказ"
  - "`DELETE /api/cart/items/7/`"
  - "`PUT /api/cart/items/7/` с `{\"product\": 2, \"quantity\": 5}`"
  - "`PATCH /api/cart/items/7/` с `{\"add\": 1}` — прибавить одну штуку"
answer: [0, 2, 3]
explanation: |
  `GET` ничего не меняет. `DELETE` и `PUT` идемпотентны: удалённое остаётся удалённым, замена на те же данные даёт то же (повторный `DELETE` вернёт 404, но позиции нет и так). Повтор `POST` создаст второй заказ, а «прибавить 1» — ещё одну штуку.

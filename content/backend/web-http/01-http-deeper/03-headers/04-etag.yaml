title: "Ответ на If-None-Match"
type: quiz
kind: single
difficulty: 2
pitfall: "Если ETag совпал, сервер отвечает 304 без тела, и клиент берёт сохранённую копию."
statement: |
  Клиент уже получил товар с `ETag: "1499.00-40"` и запрашивает его снова с заголовком `If-None-Match: "1499.00-40"`. Цена и остаток не менялись. Что ответит сервер?
options:
  - "`200 OK` с тем же JSON"
  - "`304 Not Modified` без тела"
  - "`404 Not Found`"
  - "`412 Precondition Failed`"
answer: [1]
explanation: |
  Совпавший `ETag` — ресурс не изменился: `304 Not Modified`, `Content-Length: 0`; тело клиент берёт из своей копии. Изменится цена или остаток — изменится `ETag`, и придёт `200` с новым телом. 412 — ответ на несовпавший `If-Match` при изменении ресурса.

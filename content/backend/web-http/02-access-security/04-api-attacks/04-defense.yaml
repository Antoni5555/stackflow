title: "Что защищает вход"
type: quiz
kind: multiple
difficulty: 2
pitfall: "От подбора пароля защищает лимит неудачных попыток в общем хранилище — по IP и по аккаунту."
statement: |
  На `POST /api/token/` идёт подбор паролей. API работает в 4 воркерах Gunicorn. Какие меры действительно помогут?
options:
  - "Лимит неудачных попыток за окно времени, превышен — `429` с `Retry-After`"
  - "Хранить счётчики попыток в Redis или кэше Django, а не в словаре в памяти процесса"
  - "Лимит не только по IP, но и по аккаунту (почте)"
  - "Отвечать на неверный пароль `200` с `{\"ok\": false}`, чтобы атакующий не понял"
  - "Настроить CORS только на `https://app.shop.example`"
answer: [0, 1, 2]
explanation: |
  Лимит делает перебор бесконечно долгим: учебный API после 5 неудач ответил `429` и `Retry-After: 60` даже на верный пароль. Счётчик в памяти — свой у каждого из 4 воркеров: лимит фактически вчетверо больше и сбрасывается при перезапуске. Перебор одного аккаунта ведут с тысяч адресов — нужен лимит и по почте. 200 с ошибкой ничего не скрывает, а CORS не мешает `curl` и скриптам.

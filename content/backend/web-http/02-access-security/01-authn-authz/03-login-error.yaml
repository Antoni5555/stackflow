title: "Сообщение при неудачном входе"
type: quiz
kind: single
difficulty: 2
pitfall: "Одна и та же ошибка на «нет такой почты» и «неверный пароль» — иначе перебором узнают зарегистрированные почты."
statement: |
  На `POST /api/token/` пришла почта, которой нет в базе. Что лучше ответить?
options:
  - "`404 Not Found` и `{\"error\": \"Пользователь не найден\"}`"
  - "`401 Unauthorized` и `{\"error\": \"Такой почты нет\"}`"
  - "`401 Unauthorized` и `{\"error\": \"Неверная почта или пароль\"}` — как при неверном пароле"
  - "`200 OK` и `{\"access\": null}`"
answer: [2]
explanation: |
  Если на неизвестную почту и неверный пароль отвечать по-разному, перебором по списку адресов узнают, кто зарегистрирован в магазине, — и дальше подбирают пароли только к ним. Учебный API на оба случая отвечает `401` и `{"error": "Неверная почта или пароль"}`. 200 с `null` — ошибка, замаскированная под успех.

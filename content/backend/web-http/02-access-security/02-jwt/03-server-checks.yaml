title: "Что проверяет сервер"
type: quiz
kind: multiple
difficulty: 2
pitfall: "Сервер проверяет подпись со своим секретом, разрешённый алгоритм и exp; заголовку токена не доверяет."
statement: |
  API магазина получил `Authorization: Bearer eyJ…`. Что сервер обязан проверить, прежде чем считать пользователя Анной (`sub: 1`)?
options:
  - "Подпись — пересчитать HMAC своим секретом и сравнить"
  - "Что `exp` ещё не наступил"
  - "Что алгоритм — тот, который разрешил сам сервер (`HS256`), а не любой из заголовка токена"
  - "Что токен есть в таблице выданных токенов"
  - "Что данные токена расшифрованы правильным ключом"
answer: [0, 1, 2]
explanation: |
  Подпись — защита от подделки: токен с `sub: 2` и старой подписью учебный API отверг («Подпись неверна»). `exp` — истёкший токен получил «Токен истёк». Алгоритм задаёт сервер: если поверить заголовку `alg: none`, проверка подписи пропадёт. Хранить выданные JWT не нужно — в этом их смысл (таблица нужна только для чёрного списка или refresh). Данные JWT не зашифрованы.

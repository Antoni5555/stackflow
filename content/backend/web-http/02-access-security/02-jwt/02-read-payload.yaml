title: "Что видно в JWT"
type: quiz
kind: single
difficulty: 1
pitfall: "Данные JWT закодированы base64url, но не зашифрованы: их прочитает любой."
statement: |
  Разработчик предлагает положить в JWT телефон и адрес покупателя: «токен подписан, значит данные защищены». Кто сможет прочитать эти данные?
options:
  - "Только сервер — без секрета их не расшифровать"
  - "Любой, у кого есть токен: данные — base64url, их раскодирует одна строка кода"
  - "Никто — подпись скрывает данные"
  - "Только владелец токена после ввода пароля"
answer: [1]
explanation: |
  Подпись защищает от **изменения**, а не от чтения. В уроке данные токена Анны прочитаны без секрета: `base64.urlsafe_b64decode` → `{'sub': 1, 'iat': 1795240110, 'exp': 1795241010}`. Токен видят браузерные расширения, журналы, прокси при ошибках настройки — личные данные в нём утекут. В JWT кладут id и служебные поля.

title: Куда поставить условие
type: quiz
kind: multiple
difficulty: 2
pitfall: Условия на отдельные строки — в WHERE, условия на агрегаты групп — в HAVING.
statement: |
  Нужен отчёт: покупатели из Москвы, у которых за 2026 год больше двух неотменённых заказов. Какие условия должны стоять в `HAVING` (а не в `WHERE`)?
options:
  - "`u.city = 'Москва'`"
  - "`o.created_at >= '2026-01-01'`"
  - "`o.status <> 'cancelled'`"
  - "`count(*) > 2`"
answer: [3]
explanation: |
  Город, год и статус — свойства отдельной строки, их проверяют до группировки в `WHERE`: в группу должны попасть только подходящие заказы. Число заказов известно только для группы — это `HAVING count(*) > 2`. Если перенести статус в `HAVING`, запрос упадёт: `o.status` не входит в группировку.

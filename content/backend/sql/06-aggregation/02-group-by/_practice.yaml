- title: "Товаров в категории"
  text: |
    Для каждой `category_id` выведите число товаров `total`, по `category_id`.
  answer: |
    Ответ:
    ```sql
    SELECT category_id, count(*) AS total
    FROM products
    GROUP BY category_id
    ORDER BY category_id;
    ```
    Результат:
    ```
     category_id | total
    -------------+-------
               1 |     1
               3 |     3
               4 |     6
               5 |     4
               6 |     1
               7 |     4
               9 |     3
    (7 rows)
    ```
    Строка результата — на каждую группу.
- title: "Заказы покупателей"
  text: |
    Для каждого `user_id` выведите число заказов `total`; сначала самые активные, при равенстве — по `user_id`.
  answer: |
    Ответ:
    ```sql
    SELECT user_id, count(*) AS total
    FROM orders
    GROUP BY user_id
    ORDER BY total DESC, user_id;
    ```
    Результат:
    ```
     user_id | total
    ---------+-------
           1 |     6
           2 |     5
           3 |     4
           8 |     4
          12 |     4
           4 |     3
           5 |     3
           6 |     3
           7 |     2
    (9 rows)
    ```
    Сортировать можно по псевдониму агрегата.
- title: "Средняя оценка товара"
  text: |
    Для каждого `product_id` выведите среднюю оценку `avg_rating` (два знака) и число отзывов `reviews`, по `product_id`.
  answer: |
    Ответ:
    ```sql
    SELECT product_id,
           round(avg(rating), 2) AS avg_rating,
           count(*) AS reviews
    FROM reviews
    GROUP BY product_id
    ORDER BY product_id;
    ```
    Результат:
    ```
     product_id | avg_rating | reviews
    ------------+------------+---------
              1 |       5.00 |       2
              4 |       4.00 |       1
              5 |       5.00 |       1
              6 |       4.50 |       2
              7 |       4.00 |       1
              9 |       2.50 |       2
             10 |       5.00 |       2
             12 |       4.00 |       1
             13 |       3.50 |       2
             15 |       4.00 |       3
             16 |       4.00 |       1
             19 |       4.50 |       2
             20 |       5.00 |       1
    (13 rows)
    ```
    Несколько агрегатов считаются в одной группировке.
- title: "Заказы по статусам и месяцам"
  text: |
    Для заказов 2026 года выведите месяц `month` (дата первого дня), статус и число заказов `total`, по месяцу и статусу.
  answer: |
    Ответ:
    ```sql
    SELECT date_trunc('month', created_at)::date
               AS month,
           status,
           count(*) AS total
    FROM orders
    WHERE created_at >= '2026-01-01'
    GROUP BY month, status
    ORDER BY month, status;
    ```
    Результат:
    ```
       month    |  status   | total
    ------------+-----------+-------
     2026-01-01 | cancelled |     1
     2026-01-01 | shipped   |     5
     2026-02-01 | shipped   |     5
     2026-03-01 | cancelled |     2
     2026-03-01 | shipped   |     4
     2026-04-01 | new       |     3
     2026-04-01 | paid      |     4
    (7 rows)
    ```
    Группа — комбинация месяца и статуса.

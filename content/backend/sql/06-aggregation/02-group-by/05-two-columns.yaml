title: Группировка по двум столбцам
type: quiz
kind: single
difficulty: 2
pitfall: GROUP BY по нескольким столбцам создаёт группу на каждую встретившуюся комбинацию.
statement: |
  У Бориса (`user_id` 2) пять заказов: три `shipped`, один `cancelled`, один `new`. Сколько строк с `user_id = 2` будет в результате?
  ```sql
  SELECT user_id, status, count(*) AS total
  FROM orders
  GROUP BY user_id, status;
  ```
options:
  - "1"
  - "3"
  - "4"
  - "5"
answer: [1]
explanation: |
  Группа — комбинация `(user_id, status)`. У Бориса три разных статуса — три группы: `shipped` с `total` 3, `cancelled` и `new` — по 1. Статус `paid`, которого у Бориса нет, группу не образует.

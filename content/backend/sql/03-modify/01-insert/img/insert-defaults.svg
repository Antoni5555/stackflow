<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fig-ah"/></marker></defs>
<rect x="20" y="20" width="840" height="44" rx="8" class="fig-box2"/>
<text x="440.0" y="47.0" text-anchor="middle" class="fig-c">INSERT INTO products (category_id, name, price) VALUES (9, 'Книга', 2290)</text>
<rect x="20" y="110" width="70" height="32" rx="4" class="fig-box2"/>
<text x="55.0" y="131.0" text-anchor="middle" class="fig-c">id</text>

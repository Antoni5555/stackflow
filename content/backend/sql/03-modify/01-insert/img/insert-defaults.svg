<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" class="fig" role="img" aria-labelledby="t"><title id="t">INSERT: столбцы из списка берут значения из VALUES, остальные — из DEFAULT</title>
<style>

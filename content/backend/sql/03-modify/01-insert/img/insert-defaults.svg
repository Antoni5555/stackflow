<text x="150.0" y="196" text-anchor="middle" class="fig-s">VALUES</text>
<rect x="210" y="110" width="120" height="32" rx="4" class="fig-acc"/>
<text x="270.0" y="131.0" text-anchor="middle" class="fig-onacc">name</text>
<rect x="210" y="142" width="120" height="32" rx="4" class="fig-box"/>
<text x="270.0" y="163.0" text-anchor="middle" class="fig-c">Книга</text>
<text x="270.0" y="196" text-anchor="middle" class="fig-s">VALUES</text>
<rect x="330" y="110" width="110" height="32" rx="4" class="fig-acc"/>
<text x="385.0" y="131.0" text-anchor="middle" class="fig-onacc">price</text>
<rect x="330" y="142" width="110" height="32" rx="4" class="fig-box"/>
<text x="385.0" y="163.0" text-anchor="middle" class="fig-c">2290.00</text>
<text x="385.0" y="196" text-anchor="middle" class="fig-s">VALUES</text>
<rect x="440" y="110" width="80" height="32" rx="4" class="fig-box2"/>
<text x="480.0" y="131.0" text-anchor="middle" class="fig-c">stock</text>
<rect x="440" y="142" width="80" height="32" rx="4" class="fig-box"/>
<text x="480.0" y="163.0" text-anchor="middle" class="fig-c">0</text>
<text x="480.0" y="196" text-anchor="middle" class="fig-s">DEFAULT</text>
<rect x="520" y="110" width="120" height="32" rx="4" class="fig-box2"/>
<text x="580.0" y="131.0" text-anchor="middle" class="fig-c">attributes</text>
<rect x="520" y="142" width="120" height="32" rx="4" class="fig-box"/>
<text x="580.0" y="163.0" text-anchor="middle" class="fig-c">{}</text>
<text x="580.0" y="196" text-anchor="middle" class="fig-s">DEFAULT</text>
<rect x="640" y="110" width="220" height="32" rx="4" class="fig-box2"/>
<text x="750.0" y="131.0" text-anchor="middle" class="fig-c">created_at</text>
<rect x="640" y="142" width="220" height="32" rx="4" class="fig-box"/>
<text x="750.0" y="163.0" text-anchor="middle" class="fig-c">now()</text>
<text x="750.0" y="196" text-anchor="middle" class="fig-s">DEFAULT</text>
<path d="M300 64V106" class="fig-ln" marker-end="url(#a)"/>
<text x="20" y="98" text-anchor="start" class="fig-h">products — новая строка</text>
<text x="20" y="236" text-anchor="start" class="fig-s">лайм — столбцы из списка INSERT: значения из VALUES по порядку;</text>
<text x="20" y="256" text-anchor="start" class="fig-s">id выдаёт счётчик GENERATED ALWAYS AS IDENTITY; stock, attributes, created_at — DEFAULT из CREATE TABLE.</text>
<text x="20" y="276" text-anchor="start" class="fig-s">Столбец без DEFAULT получил бы NULL, а с NOT NULL и без DEFAULT — ошибку.</text>
</svg>

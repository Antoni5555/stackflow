title: Три тега от менеджера
type: exercise
difficulty: 1
pitfall: Многострочный INSERT атомарен — одна строка с ошибкой отменяет всю команду.
statement: |
  Менеджер прислал три тега для каталога: «эко», «хит», «для дома». Добавьте в таблицу `tags` те из них, которых там ещё нет. Запрос из заготовки падает — почему, и что с этим сделать?
starter_code: |
  INSERT INTO tags (name)
  VALUES ('эко'), ('хит'), ('для дома');
solution: |
  INSERT INTO tags (name)
  VALUES ('эко'), ('для дома');
check:
  type: state
  tables:
    tags: [name]
hints:
  - "Посмотрите на DETAIL ошибки: какой тег уже есть?"
  - "У `tags.name` ограничение `UNIQUE`. Добавились ли остальные два тега, раз команда упала?"
explanation: |
  «Хит» уже есть в `tags`, а `name` объявлен `UNIQUE` — PostgreSQL отвечает `duplicate key value violates unique constraint "tags_name_key"`. Команда выполняется целиком или никак, поэтому «эко» и «для дома» тоже не добавились. Убираем лишнюю строку — остальные две вставляются. Проверка сравнивает только названия тегов: номера `id` у разных решений могут отличаться — счётчик не возвращает номера, выданные упавшей команде.

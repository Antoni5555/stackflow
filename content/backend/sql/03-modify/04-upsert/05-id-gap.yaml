title: Какой id у нового тега
type: quiz
kind: single
difficulty: 2
pitfall: Счётчик id выдаёт номер до проверки конфликта и обратно его не забирает.
statement: |
  В `tags` шесть строк с `id` от 1 до 6, следующий номер счётчика — 7. Тег «хит» уже есть. Какой `id` вернёт второй запрос?
  ```sql
  INSERT INTO tags (name) VALUES ('хит')
  ON CONFLICT (name) DO NOTHING;

  INSERT INTO tags (name) VALUES ('эко')
  RETURNING id;
  ```
options:
  - "7"
  - "8"
  - "6"
  - Первый запрос упадёт, второй не выполнится
answer: [1]
explanation: |
  Значение `id` вычисляется до того, как база проверит конфликт: первый запрос взял у счётчика 7, конфликт отменил вставку, а номер не вернулся. «Эко» получает 8. Поэтому по `id` нельзя считать строки или ждать номеров без пропусков.

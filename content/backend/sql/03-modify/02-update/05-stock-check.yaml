title: Списали больше, чем было
type: quiz
kind: single
difficulty: 1
pitfall: Нарушено ограничение хотя бы в одной строке — UPDATE не меняет ни одной.
statement: |
  У ноутбука 1 на складе 5 штук, у ноутбука 2 — 2 штуки, у `stock` есть `CHECK (stock >= 0)`. Что произойдёт?
  ```sql
  UPDATE products
  SET stock = stock - 3
  WHERE id IN (1, 2);
  ```
options:
  - У ноутбука 1 станет 2, у ноутбука 2 — 0
  - У ноутбука 1 станет 2, для ноутбука 2 — ошибка
  - Ошибка, остатки обоих не изменятся
  - У ноутбука 1 станет 2, у ноутбука 2 — −1
answer: [2]
explanation: |
  Для ноутбука 2 новый остаток −1 нарушает `CHECK`, и команда падает с `violates check constraint "products_stock_check"`. Одна команда выполняется целиком или никак, поэтому изменение ноутбука 1 тоже отменено. База не «подрезает» значение до нуля сама — такую логику пишут в условии: `WHERE id IN (1, 2) AND stock >= 3`.

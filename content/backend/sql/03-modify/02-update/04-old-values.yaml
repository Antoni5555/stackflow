title: Цена и остаток в одном SET
type: quiz
kind: single
difficulty: 2
pitfall: Все выражения в SET вычисляются по старым значениям строки.
statement: |
  У коврика для мыши (`id` 7) цена 490.00 и остаток 50. Что окажется в `stock` после запроса?
  ```sql
  UPDATE products
  SET price = price * 2, stock = price
  WHERE id = 7;
  ```
options:
  - "490"
  - "980"
  - "50"
  - Ошибка — нельзя записать цену в целочисленный столбец
answer: [0]
explanation: |
  Выражения в `SET` считаются по строке до изменения, порядок присваиваний не важен: `stock = price` берёт старую цену 490.00, а не удвоенную. `numeric` 490.00 без потерь приводится к `integer`, поэтому ошибки нет. (Дробная цена, например 490.50, округлилась бы до целого.)

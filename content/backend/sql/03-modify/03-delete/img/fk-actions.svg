<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" class="fig" role="img" aria-labelledby="t"><title id="t">Что делает внешний ключ, когда удаляют строку, на которую он ссылается</title>
<style>
.fig text{white-space:pre}
.fig-t{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:14px;fill:#0e0e0e;fill:var(--text,#0e0e0e)}
.fig-c{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:14px;fill:#0e0e0e;fill:var(--text,#0e0e0e)}
.fig-cs{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:12px;fill:#0e0e0e;fill:var(--text,#0e0e0e)}
.fig-h{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:12px;letter-spacing:.04em;text-transform:uppercase;fill:#6e6e6a;fill:var(--muted,#6e6e6a)}
.fig-s{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:12px;fill:#6e6e6a;fill:var(--muted,#6e6e6a)}
.fig-box{fill:#ffffff;fill:var(--surface,#ffffff);stroke:#e0e0dc;stroke:var(--border,#e0e0dc);stroke-width:1.5}
.fig-box2{fill:#ebebe8;fill:var(--surface-2,#ebebe8);stroke:#e0e0dc;stroke:var(--border,#e0e0dc);stroke-width:1.5}
.fig-acc{fill:#dcf25c;fill:var(--accent,#dcf25c)}
.fig-onacc{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:13px;fill:#0e0e0e;fill:var(--on-accent,#0e0e0e)}
.fig-ln{stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5;fill:none}
.fig-lnd{stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.fig-ah{fill:#6e6e6a;fill:var(--muted,#6e6e6a)}
.fig-err{fill:#fdecea;fill:var(--error-bg,#fdecea);stroke:#d93025;stroke:var(--error,#d93025);stroke-width:1.5}
.fig-errt{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:13px;fill:#d93025;fill:var(--error,#d93025)}
.fig-ok{fill:#e7f6ec;fill:var(--success-bg,#e7f6ec);stroke:#1f9d55;stroke:var(--success,#1f9d55);stroke-width:1.5}
.fig-dash{fill:none;stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5;stroke-dasharray:5 4}
.fig-term{fill:#0d0d0f;fill:var(--term-bg,#0d0d0f)}
.fig-tt{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:13px;fill:#e6e6e3;fill:var(--term-text,#e6e6e3)}
.fig-tterr{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:13px;fill:#f87171}
.fig-m1{fill:#dbe4ff;fill:var(--match-1,#dbe4ff)}
.fig-m2{fill:#ffe3e3;fill:var(--match-2,#ffe3e3)}
.fig-m3{fill:#d3f9d8;fill:var(--match-3,#d3f9d8)}
.fig-venn{fill-opacity:.75;stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fig-ah"/></marker></defs>
<text x="20" y="24" text-anchor="start" class="fig-h">ON DELETE</text>
<text x="160" y="24" text-anchor="start" class="fig-h">запрос</text>
<text x="410" y="24" text-anchor="start" class="fig-h">кто ссылается</text>
<text x="626" y="24" text-anchor="start" class="fig-h">результат</text>
<rect x="20" y="36" width="120" height="70" rx="12" class="fig-acc"/>
<text x="80.0" y="76.0" text-anchor="middle" class="fig-onacc">RESTRICT</text>
<rect x="160" y="36" width="220" height="70" rx="12" class="fig-box"/>
<text x="270.0" y="67.0" text-anchor="middle" class="fig-c">DELETE FROM users</text>
<text x="270.0" y="85.0" text-anchor="middle" class="fig-c">WHERE id = 4</text>
<path d="M380 71H406" class="fig-ln" marker-end="url(#a)"/>
<rect x="410" y="36" width="190" height="70" rx="12" class="fig-box2"/>
<text x="505.0" y="76.0" text-anchor="middle" class="fig-cs">orders.user_id</text>
<path d="M600 71H622" class="fig-ln" marker-end="url(#a)"/>
<rect x="626" y="36" width="234" height="70" rx="12" class="fig-err"/>
<text x="743.0" y="67.0" text-anchor="middle" class="fig-errt">ошибка: на покупателя</text>
<text x="743.0" y="85.0" text-anchor="middle" class="fig-errt">ссылаются заказы</text>
<rect x="20" y="126" width="120" height="70" rx="12" class="fig-acc"/>
<text x="80.0" y="166.0" text-anchor="middle" class="fig-onacc">CASCADE</text>
<rect x="160" y="126" width="220" height="70" rx="12" class="fig-box"/>
<text x="270.0" y="157.0" text-anchor="middle" class="fig-c">DELETE FROM orders</text>
<text x="270.0" y="175.0" text-anchor="middle" class="fig-c">WHERE id = 3</text>
<path d="M380 161H406" class="fig-ln" marker-end="url(#a)"/>
<rect x="410" y="126" width="190" height="70" rx="12" class="fig-box2"/>
<text x="505.0" y="166.0" text-anchor="middle" class="fig-cs">order_items.order_id</text>
<path d="M600 161H622" class="fig-ln" marker-end="url(#a)"/>
<rect x="626" y="126" width="234" height="70" rx="12" class="fig-box2"/>
<text x="743.0" y="157.0" text-anchor="middle" class="fig-t">позиции заказа</text>
<text x="743.0" y="175.0" text-anchor="middle" class="fig-t">удалены вместе с ним</text>
<rect x="20" y="216" width="120" height="70" rx="12" class="fig-acc"/>
<text x="80.0" y="256.0" text-anchor="middle" class="fig-onacc">SET NULL</text>
<rect x="160" y="216" width="220" height="70" rx="12" class="fig-box"/>
<text x="270.0" y="247.0" text-anchor="middle" class="fig-c">DELETE FROM promo_codes</text>
<text x="270.0" y="265.0" text-anchor="middle" class="fig-c">WHERE id = 4</text>
<path d="M380 251H406" class="fig-ln" marker-end="url(#a)"/>
<rect x="410" y="216" width="190" height="70" rx="12" class="fig-box2"/>
<text x="505.0" y="256.0" text-anchor="middle" class="fig-cs">orders.promo_code_id</text>
<path d="M600 251H622" class="fig-ln" marker-end="url(#a)"/>
<rect x="626" y="216" width="234" height="70" rx="12" class="fig-ok"/>
<text x="743.0" y="247.0" text-anchor="middle" class="fig-t">заказы остались,</text>
<text x="743.0" y="265.0" text-anchor="middle" class="fig-t">promo_code_id = NULL</text>
<text x="20" y="318" text-anchor="start" class="fig-s">RESTRICT отменяет весь DELETE целиком; CASCADE и SET NULL срабатывают для каждой удалённой строки.</text>
</svg>

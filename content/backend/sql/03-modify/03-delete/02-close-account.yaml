title: Закрыть аккаунт
type: exercise
difficulty: 1
pitfall: Строку, на которую ссылается внешний ключ с RESTRICT, удалить нельзя — покупателей с заказами отключают, а не удаляют.
statement: |
  Покупатель Глеб (`users.id` 4) попросил закрыть аккаунт. Запрос из заготовки падает. Прочитайте ошибку и сделайте, как принято в магазине для покупателей с заказами: аккаунт не удаляют, а отключают — `is_active` становится `false`.
starter_code: |
  DELETE FROM users
  WHERE id = 4;
solution: |
  UPDATE users
  SET is_active = false
  WHERE id = 4;
check:
  type: state
  tables: [users]
hints:
  - "На какую таблицу указывает ошибка и что значит `is still referenced`?"
  - "Удалять не нужно — нужен `UPDATE` одного столбца."
explanation: |
  На покупателя ссылаются его заказы, а внешний ключ `orders.user_id` объявлен `ON DELETE RESTRICT`: база не даст оставить заказы без покупателя. Удалять заказы ради этого нельзя — пропадут продажи из отчётов. Поэтому аккаунт отключают: `UPDATE users SET is_active = false WHERE id = 4`. Сайт не пускает отключённых покупателей, а история заказов остаётся.

title: Удалить ноутбук
type: quiz
kind: single
difficulty: 2
pitfall: Если на строку ссылается хоть один внешний ключ с RESTRICT, не помогут и CASCADE у других — удаление отменяется целиком.
statement: |
  Ноутбук Aster 16 Pro (`products.id` 2) сняли с продажи. У него есть тег в `product_tags` (`ON DELETE CASCADE`) и позиции в двух отменённых заказах в `order_items` (`product_id … ON DELETE RESTRICT`). Что сделает запрос?
  ```sql
  DELETE FROM products WHERE id = 2;
  ```
options:
  - Удалит товар, его теги и позиции заказов
  - Удалит товар и его теги, в позициях заказов `product_id` станет NULL
  - Удалит товар и его теги, позиции заказов останутся со ссылкой на удалённый товар
  - Упадёт с ошибкой, ничего не удалит
answer: [3]
explanation: |
  Позиции заказов ссылаются на товар через внешний ключ с `RESTRICT`, и PostgreSQL отвечает `violates foreign key constraint "order_items_product_id_fkey"`. Команда отменяется целиком, поэтому не удаляются и теги, хотя у `product_tags` `CASCADE`. Ссылка «в никуда» невозможна в принципе — внешний ключ для того и нужен. Товар, который уже покупали, снимают с продажи иначе: например, `stock = 0` или отдельный признак видимости.

title: Копия или факт
type: quiz
kind: multiple
difficulty: 3
pitfall: Снимок данных на момент события — отдельный факт, а не денормализованная копия.
statement: |
  Какие столбцы — денормализованные копии, которые нужно обновлять вместе с исходными данными?
options:
  - "`orders.total` — сумма позиций заказа"
  - "`products.reviews_count` — число отзывов товара"
  - "`order_items.price` — цена, по которой купили товар"
  - "`orders.delivery_address` — адрес, по которому отправили заказ"
  - "`products.rating_avg` — средняя оценка товара"
answer: [0, 1, 4]
explanation: |
  Сумма заказа, число отзывов и средняя оценка вычисляются из других таблиц — это копии, и при изменении позиций или отзывов их надо пересчитать. Цена покупки и адрес доставки — снимки момента заказа: если покупатель переехал, а товар подорожал, уже оформленный заказ меняться не должен.

title: Плата за денормализацию
type: quiz
kind: single
difficulty: 2
pitfall: Денормализация ускоряет чтение ценой риска расхождений и усложнения записи.
statement: |
  Магазин добавил `products.reviews_count`, чтобы каталог не считал отзывы для каждой карточки. Какая новая проблема появилась?
options:
  - Каталог стал открываться медленнее
  - При добавлении и удалении отзыва нужно обновлять и счётчик, иначе он разойдётся с реальным числом отзывов
  - Нельзя больше удалять отзывы
  - Отзывы теперь нельзя соединять с товарами
answer: [1]
explanation: |
  Число отзывов теперь хранится дважды: в виде строк `reviews` и в счётчике. Каждое изменение отзывов должно обновлять счётчик в той же транзакции (или триггером), а на случай ошибок нужен проверочный запрос. Чтение каталога как раз ускорилось — ради этого всё и делалось.

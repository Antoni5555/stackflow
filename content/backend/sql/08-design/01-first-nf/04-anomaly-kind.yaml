title: Какая аномалия
type: quiz
kind: single
difficulty: 2
pitfall: Аномалия удаления — когда вместе со строкой пропадает факт, который хранился в ней попутно.
statement: |
  Заказы хранятся в одной таблице `orders_flat (order_id, customer_email, customer_name, products, total)`. У Егора был один заказ; его удалили по просьбе покупателя, и теперь у магазина нет ни почты, ни имени Егора. Как называется эта проблема?
options:
  - Аномалия обновления
  - Аномалия вставки
  - Аномалия удаления
  - Нарушение внешнего ключа
answer: [2]
explanation: |
  Данные покупателя хранились только попутно — внутри заказа, поэтому удаление заказа унесло и их. Это аномалия удаления. Обратная ситуация — нельзя записать покупателя, пока нет заказа, — аномалия вставки; разные имена у одной почты после частичного изменения — аномалия обновления. Отдельная таблица `users` убирает все три.

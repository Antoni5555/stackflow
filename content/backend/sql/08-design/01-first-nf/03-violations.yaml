title: Где нарушена 1НФ
type: quiz
kind: multiple
difficulty: 2
pitfall: 1НФ нарушают списки в ячейке и повторяющиеся группы столбцов, а не любое длинное значение.
statement: |
  Какие столбцы нарушают первую нормальную форму?
options:
  - "`orders.product_ids text` со значением `'1,4,7'`"
  - "`users.phone1`, `users.phone2`, `users.phone3`"
  - "`reviews.text text` — текст отзыва в несколько абзацев"
  - "`products.tags text` со значением `'хит, скидка'`"
  - "`users.email text`"
answer: [0, 1, 3]
explanation: |
  Номера товаров и теги через запятую — списки в ячейке: по ним ищут и их связывают, а внешний ключ их не проверит. `phone1–3` — повторяющаяся группа столбцов. Текст отзыва длинный, но это одно значение: его не делят на части для поиска и связей. Email — тоже одно значение.

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" class="fig" role="img" aria-labelledby="t"><title id="t">Плоская таблица повторяет покупателя и склеивает товары; после нормализации каждый факт хранится один раз</title>
<style>
.fig text{white-space:pre}
.fig-t{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:14px;fill:#0e0e0e;fill:var(--text,#0e0e0e)}
.fig-c{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:14px;fill:#0e0e0e;fill:var(--text,#0e0e0e)}
.fig-cs{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:12px;fill:#0e0e0e;fill:var(--text,#0e0e0e)}
.fig-h{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:12px;letter-spacing:.04em;text-transform:uppercase;fill:#6e6e6a;fill:var(--muted,#6e6e6a)}
.fig-s{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:12px;fill:#6e6e6a;fill:var(--muted,#6e6e6a)}
.fig-box{fill:#ffffff;fill:var(--surface,#ffffff);stroke:#e0e0dc;stroke:var(--border,#e0e0dc);stroke-width:1.5}
.fig-box2{fill:#ebebe8;fill:var(--surface-2,#ebebe8);stroke:#e0e0dc;stroke:var(--border,#e0e0dc);stroke-width:1.5}
.fig-acc{fill:#dcf25c;fill:var(--accent,#dcf25c)}
.fig-onacc{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:13px;fill:#0e0e0e;fill:var(--on-accent,#0e0e0e)}
.fig-ln{stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5;fill:none}
.fig-lnd{stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.fig-ah{fill:#6e6e6a;fill:var(--muted,#6e6e6a)}
.fig-err{fill:#fdecea;fill:var(--error-bg,#fdecea);stroke:#d93025;stroke:var(--error,#d93025);stroke-width:1.5}
.fig-errt{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:13px;fill:#d93025;fill:var(--error,#d93025)}
.fig-ok{fill:#e7f6ec;fill:var(--success-bg,#e7f6ec);stroke:#1f9d55;stroke:var(--success,#1f9d55);stroke-width:1.5}
.fig-dash{fill:none;stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5;stroke-dasharray:5 4}
.fig-term{fill:#0d0d0f;fill:var(--term-bg,#0d0d0f)}
.fig-tt{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:13px;fill:#e6e6e3;fill:var(--term-text,#e6e6e3)}
.fig-tterr{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:13px;fill:#f87171}
.fig-m1{fill:#dbe4ff;fill:var(--match-1,#dbe4ff)}
.fig-m2{fill:#ffe3e3;fill:var(--match-2,#ffe3e3)}
.fig-m3{fill:#d3f9d8;fill:var(--match-3,#d3f9d8)}
.fig-venn{fill-opacity:.75;stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fig-ah"/></marker></defs>
<text x="20" y="22" text-anchor="start" class="fig-h">orders_flat</text>
<rect x="20" y="30" width="80" height="30" rx="4" class="fig-box2"/>
<text x="60.0" y="50.0" text-anchor="middle" class="fig-c">order_id</text>
<rect x="100" y="30" width="150" height="30" rx="4" class="fig-box2"/>
<text x="175.0" y="50.0" text-anchor="middle" class="fig-c">customer</text>
<rect x="250" y="30" width="250" height="30" rx="4" class="fig-box2"/>
<text x="375.0" y="50.0" text-anchor="middle" class="fig-c">products</text>
<rect x="20" y="60" width="80" height="30" rx="4" class="fig-m1"/>
<text x="60.0" y="80.0" text-anchor="middle" class="fig-c">1</text>
<rect x="100" y="60" width="150" height="30" rx="4" class="fig-m1"/>
<text x="175.0" y="80.0" text-anchor="middle" class="fig-c">Анна Смирнова</text>
<rect x="250" y="60" width="250" height="30" rx="4" class="fig-m1"/>
<text x="375.0" y="80.0" text-anchor="middle" class="fig-c">Ноутбук, Мышь, Коврик</text>
<rect x="20" y="90" width="80" height="30" rx="4" class="fig-m1"/>
<text x="60.0" y="110.0" text-anchor="middle" class="fig-c">6</text>
<rect x="100" y="90" width="150" height="30" rx="4" class="fig-m1"/>
<text x="175.0" y="110.0" text-anchor="middle" class="fig-c">Анна Смирнова</text>
<rect x="250" y="90" width="250" height="30" rx="4" class="fig-m1"/>
<text x="375.0" y="110.0" text-anchor="middle" class="fig-c">Книга, Книга</text>
<rect x="20" y="120" width="80" height="30" rx="4" class="fig-m2"/>
<text x="60.0" y="140.0" text-anchor="middle" class="fig-c">8</text>
<rect x="100" y="120" width="150" height="30" rx="4" class="fig-m2"/>
<text x="175.0" y="140.0" text-anchor="middle" class="fig-c">Егор Лебедев</text>
<rect x="250" y="120" width="250" height="30" rx="4" class="fig-m2"/>
<text x="375.0" y="140.0" text-anchor="middle" class="fig-c">Веб-камера, Мышь, Мышь</text>
<text x="20" y="180" text-anchor="start" class="fig-s">Покупатель повторяется в каждом заказе, товары — текстом через запятую.</text>
<path d="M520 90H560" class="fig-ln" marker-end="url(#a)"/>
<rect x="570" y="30" width="290" height="56" rx="8" class="fig-box2"/>
<text x="715.0" y="54.0" text-anchor="middle" class="fig-cs">users</text>
<text x="715.0" y="72.0" text-anchor="middle" class="fig-cs">id, name, email</text>
<rect x="570" y="100" width="290" height="56" rx="8" class="fig-box2"/>
<text x="715.0" y="124.0" text-anchor="middle" class="fig-cs">orders</text>
<text x="715.0" y="142.0" text-anchor="middle" class="fig-cs">id, user_id → users</text>
<rect x="570" y="170" width="290" height="56" rx="8" class="fig-acc"/>
<text x="715.0" y="194.0" text-anchor="middle" class="fig-onacc">order_items</text>
<text x="715.0" y="212.0" text-anchor="middle" class="fig-onacc">order_id, product_id, quantity</text>
<text x="20" y="260" text-anchor="start" class="fig-s">Имя меняется в одном месте, покупатель существует без заказов, количество и ссылка на товар — у позиции.</text>
</svg>

title: Избранное флагом
type: quiz
kind: single
difficulty: 2
pitfall: Связь пользователя с объектом не хранится флагом у объекта — нужна таблица связи.
statement: |
  Разработчик предлагает сделать избранное столбцом `products.is_favorite boolean`. Что не так?
options:
  - Ничего — так даже быстрее
  - Флаг один на товар, а избранное у каждого покупателя своё; нужна таблица `(user_id, product_id)`
  - Тип `boolean` нельзя индексировать
  - Нужен `integer` вместо `boolean`, чтобы считать число добавлений
answer: [1]
explanation: |
  Избранное — связь «покупатель — товар»: у одного товара много покупателей, у покупателя много товаров. Флаг у товара хранит одно значение на всех: Анна добавила — товар «в избранном» у Бориса. Счётчик вместо флага тоже не скажет, у кого именно. Нужна связка с ключом из пары.

title: Порядок проектирования
type: quiz
kind: order
difficulty: 2
pitfall: Ограничения и индексы выводят из сущностей, связей и запросов, а не наоборот.
statement: |
  Расставьте шаги проектирования новой функции в разумном порядке.
options:
  - Выписать сущности из описания функции
  - Определить связи между ними и их вид (1:N, N:M)
  - Выбрать столбцы и типы
  - Выбрать ключи
  - Перевести правила описания в ограничения
  - Проверить схему на главных запросах приложения
answer: [0, 1, 2, 3, 4, 5]
explanation: |
  Сначала — что хранить (сущности) и как оно связано: от вида связи зависит, нужна ли таблица-связка. Потом — столбцы, типы и ключи, затем правила из описания превращаются в `NOT NULL`, `UNIQUE`, `CHECK`, внешние ключи. Последний шаг — написать основные запросы: если они сложные или медленные, схему пересматривают.

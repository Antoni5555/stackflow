title: Название в позиции
type: quiz
kind: single
difficulty: 2
pitfall: Столбец, зависящий от части составного ключа, нарушает 2НФ.
statement: |
  Таблица `order_items_wide (order_id, product_id, product_name, quantity)`, первичный ключ — `(order_id, product_id)`. Какая нормальная форма нарушена?
options:
  - 1НФ — в ячейке несколько значений
  - 2НФ — `product_name` зависит только от `product_id`, части ключа
  - 3НФ — `quantity` зависит от `product_name`
  - Ничего не нарушено
answer: [1]
explanation: |
  Название определяется товаром, а не парой «заказ — товар»: это частичная зависимость, нарушение 2НФ. Название повторяется в каждой позиции с этим товаром, и при переименовании старые позиции надо обновлять. `quantity` зависит от всей пары — с ним всё в порядке.

title: Регион у покупателя
type: quiz
kind: single
difficulty: 2
pitfall: Неключевой столбец, который определяется другим неключевым, — транзитивная зависимость, нарушение 3НФ.
statement: |
  В `customers (id, name, city, region)` регион всегда определяется городом. Что не так с таблицей и как это исправить?
options:
  - Нарушена 1НФ — разделить `region` на части
  - Нарушена 2НФ — сделать ключ составным `(id, city)`
  - Нарушена 3НФ — вынести города с регионами в `cities`, у покупателя оставить `city_id`
  - Всё в порядке — регион нужен в отчётах
answer: [2]
explanation: |
  `id → city → region`: регион зависит от покупателя не напрямую, а через город. Это транзитивная зависимость, нарушение 3НФ: у всех покупателей из одного города регион повторяется и может разойтись. Справочник `cities` хранит его один раз, а для отчёта регион получают соединением.

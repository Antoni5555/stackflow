title: Цена в позиции заказа
type: quiz
kind: single
difficulty: 3
pitfall: Цена на момент покупки — факт о покупке, а не копия цены товара.
statement: |
  В конспекте сказано: «`order_items.price` зависит только от `product_id` — нарушение 2НФ, перенесите цену в `products`». Верно ли это для магазина?
options:
  - Верно — цена товара должна храниться в одном месте
  - Неверно — в позиции хранится цена на момент покупки; она зависит от пары «заказ — товар» и отличается от текущей
  - Верно, но только для отменённых заказов
  - Неверно — цена вообще не должна храниться в базе
answer: [1]
explanation: |
  Мышь (товар 4) в заказе 1 стоила 1290.00, в заказе 14 — 1499.00: цена позиции зависит от того, **когда** её купили, то есть от пары «заказ — товар». Если перенести её в `products`, старые чеки и отчёты изменятся вместе с прайсом. Текущая цена (`products.price`) и цена покупки (`order_items.price`) — разные факты.

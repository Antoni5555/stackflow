title: Товары заказа строкой
type: quiz
kind: multiple
difficulty: 2
pitfall: Список в одной ячейке нельзя проверить внешним ключом, дополнить количеством и удобно искать.
statement: |
  Новичок предлагает хранить товары заказа прямо в `orders`: столбец `product_ids text` со значением `'1,4,7'`. Какие проблемы это создаст?
options:
  - База не проверит, что товары 1, 4 и 7 существуют
  - Некуда записать количество и цену каждого товара
  - Запрос «все заказы с товаром 4» придётся писать поиском по тексту, и индекс по товару не построить
  - В PostgreSQL нельзя хранить запятые в `text`
  - Нельзя будет удалить заказ
answer: [0, 1, 2]
explanation: |
  Внешний ключ проверяет одно значение, а не список внутри строки; количество и цена относятся к паре «заказ — товар», и им нужна своя строка; поиск по `'1,4,7'` превращается в разбор текста (и `'14'` легко спутать с `'4'`). Запятые в `text` хранить можно, удалению заказа это не мешает. Решение — связка `order_items`.

title: Где ставить внешний ключ
type: quiz
kind: single
difficulty: 1
pitfall: При связи один-ко-многим внешний ключ хранится на стороне «многих».
statement: |
  У товара может быть много отзывов, у отзыва — ровно один товар. Где хранить связь?
options:
  - "Столбец `reviews.product_id` со ссылкой на `products.id`"
  - "Столбец `products.review_id` со ссылкой на `reviews.id`"
  - "Столбец `products.review_ids` со списком номеров отзывов"
  - Отдельная таблица-связка `product_reviews`
answer: [0]
explanation: |
  Связь 1:N: у каждого отзыва один товар — значит, номер товара помещается в строку отзыва. `products.review_id` разрешил бы товару только один отзыв, список в ячейке не проверяется внешним ключом, а связка нужна только для N:M. Так и устроена `reviews` в учебной базе.

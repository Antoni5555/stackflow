- title: "Категории без товаров"
  text: |
    Выведите `id` и `name` категорий, к которым не привязан ни один товар.
  answer: |
    Ответ:
    ```sql
    SELECT c.id, c.name
    FROM categories c
    LEFT JOIN products p ON p.category_id = c.id
    WHERE p.id IS NULL
    ORDER BY c.id;
    ```
    Результат:
    ```
     id |    name
    ----+------------
      2 | Компьютеры
      8 | Обувь
    (2 rows)
    ```
    «Компьютеры» — родитель для ноутбуков и аксессуаров, но сами товаров не содержат.
- title: "Профиль у каждого"
  text: |
    Для покупателей 1–6 выведите `id`, `name` и телефон `phone` из профиля; у покупателей без профиля телефон пустой.
  answer: |
    Ответ:
    ```sql
    SELECT u.id, u.name, pr.phone
    FROM users u
    LEFT JOIN profiles pr ON pr.user_id = u.id
    WHERE u.id <= 6
    ORDER BY u.id;
    ```
    Результат:
    ```
     id |      name      |    phone
    ----+----------------+--------------
      1 | Анна Смирнова  | +79001112233
      2 | Борис Иванов   | +79002223344
      3 | Вера Кузнецова | +79003334455
      4 | Глеб Попов     | +79004445566
      5 | Дарья Соколова |
      6 | Егор Лебедев   |
    (6 rows)
    ```
    У Дарьи (5) профиля нет, у Егора (6) профиль есть, но телефон не указан — в обоих случаях пусто.
- title: "Теги, которых нет у товаров"
  text: |
    Выведите `name` тегов, которые не присвоены ни одному товару.
  answer: |
    Ответ:
    ```sql
    SELECT t.name
    FROM tags t
    LEFT JOIN product_tags pt ON pt.tag_id = t.id
    WHERE pt.tag_id IS NULL;
    ```
    Результат:
    ```
        name
    ------------
     распродажа
    (1 row)
    ```
    Шаблон «нет пары»: `LEFT JOIN` и `IS NULL` по столбцу правой таблицы.
- title: "Отменённые заказы покупателей"
  text: |
    Для покупателей из Москвы выведите `name` и `id` их отменённых заказов в колонке `order_id`; у кого отмен нет — пусто. По имени.
  hint: |
    Условие на статус — в `ON`.
  answer: |
    Ответ:
    ```sql
    SELECT u.name, o.id AS order_id
    FROM users u
    LEFT JOIN orders o
        ON o.user_id = u.id AND o.status = 'cancelled'
    WHERE u.city = 'Москва'
    ORDER BY u.name;
    ```
    Результат:
    ```
          name      | order_id
    ----------------+----------
     Анна Смирнова  |
     Вера Кузнецова |        3
     Жанна Козлова  |       24
     Максим Фёдоров |       15
    (4 rows)
    ```
    В `WHERE` условие на статус выбросило бы москвичей без отмен.

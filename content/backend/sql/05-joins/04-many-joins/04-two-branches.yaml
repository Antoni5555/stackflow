title: Теги и отзывы вместе
type: quiz
kind: single
difficulty: 2
pitfall: Две независимые таблицы «многих» в одном запросе дают все сочетания строк.
statement: |
  У книги «Python с нуля» (товар 19) два тега и два отзыва. Сколько строк вернёт запрос?
  ```sql
  SELECT t.name, r.rating
  FROM products p
  JOIN product_tags pt ON pt.product_id = p.id
  JOIN tags t ON t.id = pt.tag_id
  JOIN reviews r ON r.product_id = p.id
  WHERE p.id = 19;
  ```
options:
  - "2"
  - "4"
  - "3"
  - "1"
answer: [1]
explanation: |
  Теги и отзывы присоединены к товару независимо, поэтому каждая строка тега сочетается с каждой строкой отзыва: 2 × 2 = 4. Если по такому результату посчитать отзывы, получится 4 вместо 2. Теги и отзывы нужно получать отдельными запросами или сворачивать каждую ветку до соединения.

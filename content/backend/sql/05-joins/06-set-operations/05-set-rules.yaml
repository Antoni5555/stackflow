title: Правила UNION
type: quiz
kind: multiple
difficulty: 2
pitfall: Результат UNION называется по первому запросу, сортируется одним ORDER BY в конце и сравнивает строки целиком.
statement: |
  Что верно для `запрос1 UNION запрос2`?
options:
  - Имена столбцов результата берутся из первого запроса
  - "`ORDER BY` в конце сортирует весь результат"
  - Строки считаются повторами, только если совпадают все столбцы
  - "`UNION` оставляет повторы внутри одного запроса — убирает только одинаковые строки из разных запросов"
  - Типы столбцов на одних местах могут быть любыми — PostgreSQL приведёт всё к тексту
answer: [0, 1, 2]
explanation: |
  Имена — из первого запроса, `ORDER BY` — один на весь результат, повтор — совпадение всей строки. `UNION` убирает любые повторы, в том числе внутри одного запроса, — как `DISTINCT`. Автоматически к тексту ничего не приводится: `text` и `integer` на одном месте — ошибка `UNION types text and integer cannot be matched`.

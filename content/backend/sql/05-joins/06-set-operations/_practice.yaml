- title: "Москва или Казань"
  text: |
    Выведите `id` покупателей из Москвы и `id` покупателей из Казани одним списком через `UNION`, по возрастанию.
  answer: |
    Ответ:
    ```sql
    SELECT id FROM users WHERE city = 'Москва'
    UNION
    SELECT id FROM users WHERE city = 'Казань'
    ORDER BY id;
    ```
    Результат:
    ```
     id
    ----
      1
      3
      4
      7
     11
     12
    (6 rows)
    ```
    То же можно было написать через `IN` — здесь задача на синтаксис `UNION`.
- title: "Писали отзывы, но не покупали"
  text: |
    Выведите `user_id` пользователей, которые оставляли отзывы, но не делали заказов.
  answer: |
    Ответ:
    ```sql
    SELECT user_id FROM reviews
    EXCEPT
    SELECT user_id FROM orders;
    ```
    Результат:
    ```
     user_id
    ---------
           9
    (1 row)
    ```
    `EXCEPT` — строки первого запроса, которых нет во втором.
- title: "И покупали, и оценивали"
  text: |
    Выведите `product_id` товаров, которые заказывали в оплаченных или отправленных заказах и на которые есть отзывы с оценкой 5, по возрастанию.
  answer: |
    Ответ:
    ```sql
    SELECT oi.product_id
    FROM order_items oi
    JOIN orders o ON o.id = oi.order_id
    WHERE o.status IN ('paid', 'shipped')
    INTERSECT
    SELECT product_id FROM reviews
    WHERE rating = 5
    ORDER BY product_id;
    ```
    Результат:
    ```
     product_id
    ------------
              1
              5
              6
             10
             15
             19
             20
    (7 rows)
    ```
    Каждая часть может быть полноценным запросом с `JOIN` и `WHERE`.

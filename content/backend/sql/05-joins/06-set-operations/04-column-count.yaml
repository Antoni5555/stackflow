title: Склеить почту и телефоны
type: quiz
kind: single
difficulty: 1
pitfall: Запросы в UNION должны возвращать одинаковое число столбцов совместимых типов.
statement: |
  Что вернёт запрос?
  ```sql
  SELECT id, email FROM users WHERE city = 'Казань'
  UNION
  SELECT phone FROM profiles WHERE user_id IN (4, 11);
  ```
options:
  - Почту и телефоны в одном столбце
  - Почту в первом столбце, телефоны — во втором
  - "Ошибку: в запросах разное число столбцов"
  - Строки первого запроса, второй будет пропущен
answer: [2]
explanation: |
  `UNION` складывает строки друг под другом, поэтому у них должно быть одинаковое число столбцов: `each UNION query must have the same number of columns`. Если убрать `id`, запрос сработает: почта и телефоны окажутся в одном столбце с именем `email` — имя берётся из первого запроса.

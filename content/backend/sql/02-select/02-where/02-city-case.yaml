title: Петербуржцы не нашлись
type: exercise
difficulty: 1
pitfall: Строки сравниваются с учётом регистра — 'санкт-петербург' и 'Санкт-Петербург' разные значения.
statement: |
  Выведите `id` и `name` активных покупателей из Санкт-Петербурга. Заготовка возвращает пустой результат — найдите причину. Порядок строк не важен.
starter_code: |
  SELECT id, name
  FROM users
  WHERE city = 'санкт-петербург' AND is_active;
solution: |
  SELECT id, name
  FROM users
  WHERE city = 'Санкт-Петербург' AND is_active;
check:
  type: result
  order_matters: false
hints:
  - Как город записан в таблице? Посмотрите `SELECT city FROM users`.
explanation: |
  `=` для строк сравнивает буква в букву, с учётом регистра. В базе город записан с заглавных: `'Санкт-Петербург'`. Если значение вводит человек и регистр заранее неизвестен, сравнивают `lower(city) = lower('…')` или используют `ILIKE` из следующей темы.

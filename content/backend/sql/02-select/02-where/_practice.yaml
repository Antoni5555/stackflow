- title: "Москвичи"
  text: |
    Выведите `id` и `name` покупателей из Москвы.
  answer: |
    Ответ:
    ```sql
    SELECT id, name
    FROM users
    WHERE city = 'Москва';
    ```
    Результат:
    ```
     id |      name
    ----+----------------
      1 | Анна Смирнова
      3 | Вера Кузнецова
      7 | Жанна Козлова
     12 | Максим Фёдоров
    (4 rows)
    ```
    Строки в условии — в одинарных кавычках и с учётом регистра.
- title: "Нет в наличии"
  text: |
    Выведите `id` и `name` товаров, которых нет на складе (`stock` равен 0).
  answer: |
    Ответ:
    ```sql
    SELECT id, name
    FROM products
    WHERE stock = 0;
    ```
    Результат:
    ```
     id |           name
    ----+--------------------------
      3 | Ноутбук Nimbus Air
      8 | USB-хаб на 4 порта
     17 | Футболка с принтом
     21 | Книга «Алгоритмы просто»
    (4 rows)
    ```
    Сравнение — один знак `=`.
- title: "Дорогие и в наличии"
  text: |
    Выведите `id`, `name` и `price` товаров дороже 20 000 ₽, которые есть на складе.
  answer: |
    Ответ:
    ```sql
    SELECT id, name, price
    FROM products
    WHERE price > 20000 AND stock > 0;
    ```
    Результат:
    ```
     id |          name          |  price
    ----+------------------------+----------
      1 | Ноутбук Aster 14       | 64990.00
      2 | Ноутбук Aster 16 Pro   | 89990.00
     10 | Смартфон Pixelon 8     | 39990.00
     11 | Смартфон Pixelon 8 Max | 49990.00
     12 | Смартфон Lumo S        | 24990.00
    (5 rows)
    ```
    `AND` требует обоих условий: Nimbus Air дорогой, но его нет на складе.
- title: "Активные из двух городов"
  text: |
    Выведите `id` и `email` активных покупателей из Казани или Новосибирска.
  hint: |
    Условие на города возьмите в скобки.
  answer: |
    Ответ:
    ```sql
    SELECT id, email
    FROM users
    WHERE is_active
      AND (city = 'Казань' OR city = 'Новосибирск');
    ```
    Результат:
    ```
     id |          email
    ----+--------------------------
      4 | gleb.popov@example.com
      6 | egor.lebedev@example.com
    (2 rows)
    ```
    Без скобок в записи `city = 'Казань' OR city = 'Новосибирск' AND is_active` условие на активность относилось бы только к Новосибирску, и в ответ попала бы неактивная Лидия из Казани.

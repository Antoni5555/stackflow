title: Отчёт за март
type: exercise
difficulty: 2
pitfall: BETWEEN с датой для timestamptz обрезает последний день — правая граница означает полночь.
statement: |
  Бухгалтерия сверяет заказы за март 2026. Выведите `id` всех заказов, созданных в марте 2026 года. В заготовке один заказ потерялся — найдите какой и почему. Порядок строк не важен.
setup: |
  INSERT INTO orders (user_id, status, created_at)
  VALUES (4, 'paid', '2026-03-31 18:30+03');
starter_code: |
  SELECT id
  FROM orders
  WHERE created_at BETWEEN '2026-03-01' AND '2026-03-31';
solution: |
  SELECT id
  FROM orders
  WHERE created_at >= '2026-03-01' AND created_at < '2026-04-01';
check:
  type: result
  order_matters: false
hints:
  - Посмотрите на заказы за 31 марта — во сколько они созданы?
  - "`'2026-03-31'` для `timestamptz` — это `2026-03-31 00:00:00`."
explanation: |
  Строка `'2026-03-31'` превращается в момент 31 марта, 00:00. `BETWEEN` берёт всё до этой полуночи включительно, и заказ, сделанный 31-го вечером, в отчёт не попал. Периоды задают полуоткрытым интервалом: `>= '2026-03-01' AND < '2026-04-01'` — весь март, сколько бы ни было в нём дней.

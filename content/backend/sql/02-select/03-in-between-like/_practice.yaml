- title: "Три категории"
  text: |
    Выведите `id`, `name` и `category_id` товаров из категорий 1, 6 и 9.
  answer: |
    Ответ:
    ```sql
    SELECT id, name, category_id
    FROM products
    WHERE category_id IN (1, 6, 9);
    ```
    Результат:
    ```
     id |           name            | category_id
    ----+---------------------------+-------------
     14 | Зарядное устройство 65 Вт |           1
     19 | Книга «Python с нуля»     |           9
     20 | Книга «SQL на практике»   |           9
     21 | Книга «Алгоритмы просто»  |           9
     22 | Носки, 3 пары             |           6
    (5 rows)
    ```
    `IN` короче трёх условий через `OR`.
- title: "Средний ценовой сегмент"
  text: |
    Выведите `id`, `name` и `price` товаров стоимостью от 2000 до 6000 ₽ включительно.
  answer: |
    Ответ:
    ```sql
    SELECT id, name, price
    FROM products
    WHERE price BETWEEN 2000 AND 6000;
    ```
    Результат:
    ```
     id |           name            |  price
    ----+---------------------------+---------
      6 | Механическая клавиатура   | 5490.00
      9 | Веб-камера                | 3990.00
     14 | Зарядное устройство 65 Вт | 2490.00
     18 | Лонгслив                  | 2190.00
    (4 rows)
    ```
    `BETWEEN` включает обе границы.
- title: "Все смартфоны"
  text: |
    Выведите `id` и `name` товаров, название которых начинается со слова «Смартфон».
  answer: |
    Ответ:
    ```sql
    SELECT id, name
    FROM products
    WHERE name LIKE 'Смартфон%';
    ```
    Результат:
    ```
     id |          name
    ----+------------------------
     10 | Смартфон Pixelon 8
     11 | Смартфон Pixelon 8 Max
     12 | Смартфон Lumo S
    (3 rows)
    ```
    `%` в конце — «дальше что угодно». «Чехол для смартфона» не попал: у него слово не в начале и с маленькой буквы.
- title: "Буква z в почте"
  text: |
    Выведите `id` и `email` покупателей, у которых в имени почты (до `@`) есть латинская буква `z`.
  hint: |
    Шаблон `%z%@%`.
  answer: |
    Ответ:
    ```sql
    SELECT id, email
    FROM users
    WHERE email LIKE '%z%@%';
    ```
    Результат:
    ```
     id |            email
    ----+-----------------------------
      3 | vera.kuznetsova@example.com
      7 | zhanna.kozlova@example.com
      8 | zakhar.novikov@example.com
      9 | irina.morozova@example.com
    (4 rows)
    ```
    `%` по обе стороны `z` — «где угодно до `@`».
- title: "Заказы первой недели апреля"
  text: |
    Выведите `id` и `created_at` заказов с 1 по 7 апреля 2026 включительно.
  hint: |
    Полуоткрытый интервал: до начала 8 апреля.
  answer: |
    Ответ:
    ```sql
    SELECT id, created_at
    FROM orders
    WHERE created_at >= '2026-04-01'
      AND created_at < '2026-04-08';
    ```
    Результат:
    ```
     id |       created_at
    ----+------------------------
     28 | 2026-04-02 08:50:00+03
     29 | 2026-04-05 13:35:00+03
    (2 rows)
    ```
    `BETWEEN '2026-04-01' AND '2026-04-07'` потерял бы заказы 7 апреля после полуночи.

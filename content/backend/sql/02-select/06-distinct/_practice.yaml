- title: "Статусы заказов"
  text: |
    Выведите список всех статусов заказов без повторов, по алфавиту.
  answer: |
    Ответ:
    ```sql
    SELECT DISTINCT status
    FROM orders
    ORDER BY status;
    ```
    Результат:
    ```
      status
    -----------
     cancelled
     new
     paid
     shipped
    (4 rows)
    ```
    Четыре статуса из 34 заказов.
- title: "Категории с товарами"
  text: |
    Выведите `category_id` категорий, в которых есть товары, — каждую один раз, по возрастанию.
  answer: |
    Ответ:
    ```sql
    SELECT DISTINCT category_id
    FROM products
    ORDER BY category_id;
    ```
    Результат:
    ```
     category_id
    -------------
               1
               3
               4
               5
               6
               7
               9
    (7 rows)
    ```
    Категорий 2 и 8 нет: в них товаров нет — к категории «Компьютеры» товары не привязаны напрямую.
- title: "Кто ставил пятёрки"
  text: |
    Выведите `user_id` покупателей, которые ставили оценку 5, — без повторов, по возрастанию.
  answer: |
    Ответ:
    ```sql
    SELECT DISTINCT user_id
    FROM reviews
    WHERE rating = 5
    ORDER BY user_id;
    ```
    Результат:
    ```
     user_id
    ---------
           1
           2
           3
           4
           8
          12
    (6 rows)
    ```
    `WHERE` отбирает строки до того, как `DISTINCT` убирает повторы.

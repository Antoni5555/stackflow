<text x="20" y="36" text-anchor="start" class="fig-h">строки после ORDER BY price, id</text>
<path d="M20 116H294" class="fig-ln"/>
<text x="20" y="138" text-anchor="start" class="fig-s">OFFSET 5 — пропустить страницу 1</text>
<path d="M300 116H574" class="fig-ln"/>
<text x="300" y="138" text-anchor="start" class="fig-s">LIMIT 5 — взять страницу 2</text>
<text x="580" y="138" text-anchor="start" class="fig-s">страница 3 — OFFSET 10</text>
<text x="20" y="186" text-anchor="start" class="fig-s">OFFSET = (номер страницы − 1) × размер страницы. Без ORDER BY порядок строк не гарантирован,</text>
<text x="20" y="206" text-anchor="start" class="fig-s">и одна и та же строка может попасть на две страницы.</text>

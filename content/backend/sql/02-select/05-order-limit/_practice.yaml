- title: "Самые дешёвые"
  text: |
    Выведите `name` и `price` трёх самых дешёвых товаров.
  answer: |
    Ответ:
    ```sql
    SELECT name, price
    FROM products
    ORDER BY price, id
    LIMIT 3;
    ```
    Результат:
    ```
          name       | price
    -----------------+--------
     Коврик для мыши | 490.00
     Проводная мышь  | 590.00
     Носки, 3 пары   | 590.00
    (3 rows)
    ```
    `id` в сортировке делает порядок однозначным: проводная мышь и носки стоят одинаково.
- title: "Новые покупатели"
  text: |
    Выведите `id`, `name` и `created_at` пяти покупателей, зарегистрированных последними.
  answer: |
    Ответ:
    ```sql
    SELECT id, name, created_at
    FROM users
    ORDER BY created_at DESC
    LIMIT 5;
    ```
    Результат:
    ```
     id |      name      |       created_at
    ----+----------------+------------------------
     13 | Нина Орлова    | 2026-03-20 16:40:00+03
     12 | Максим Фёдоров | 2025-11-03 20:05:00+03
     11 | Лидия Павлова  | 2025-10-25 13:15:00+03
     10 | Кирилл Волков  | 2025-10-12 08:30:00+03
      9 | Ирина Морозова | 2025-10-01 19:55:00+03
    (5 rows)
    ```
    `DESC` — от новых к старым.
- title: "Каталог по алфавиту"
  text: |
    Выведите `name` товаров категории 4 по алфавиту.
  answer: |
    Ответ:
    ```sql
    SELECT name
    FROM products
    WHERE category_id = 4
    ORDER BY name;
    ```
    Результат:
    ```
              name
    -------------------------
     USB-хаб на 4 порта
     Беспроводная мышь
     Веб-камера
     Коврик для мыши
     Механическая клавиатура
     Проводная мышь
    (6 rows)
    ```
    Название на латинице идёт первым: строки сравниваются по кодам символов, а латинские буквы — раньше кириллицы.
- title: "Третья страница"
  text: |
    Каталог показывает по 4 товара, отсортированных по `id`. Выведите `id` и `name` товаров третьей страницы.
  hint: |
    Пропустить две страницы — `OFFSET 8`.
  answer: |
    Ответ:
    ```sql
    SELECT id, name
    FROM products
    ORDER BY id
    LIMIT 4 OFFSET 8;
    ```
    Результат:
    ```
     id |          name
    ----+------------------------
      9 | Веб-камера
     10 | Смартфон Pixelon 8
     11 | Смартфон Pixelon 8 Max
     12 | Смартфон Lumo S
    (4 rows)
    ```
    Страница `p` — `OFFSET (p - 1) * размер`.

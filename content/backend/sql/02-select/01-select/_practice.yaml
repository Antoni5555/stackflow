- title: "Все промокоды"
  text: |
    Выведите код и размер скидки (`code`, `discount_percent`) всех промокодов.
  answer: |
    Ответ:
    ```sql
    SELECT code, discount_percent
    FROM promo_codes;
    ```
    Результат:
    ```
        code     | discount_percent
    -------------+------------------
     WELCOME10   |               10
     SUMMER25    |               25
     VIP15       |               15
     BLACKFRIDAY |               30
     NEWYEAR20   |               20
    (5 rows)
    ```
    Порядок строк без `ORDER BY` не гарантирован — сортировку разберём в теме 5.
- title: "Сколько платит покупатель"
  text: |
    Для каждого промокода выведите код и сколько процентов цены покупатель заплатит с ним, в колонке `pay_percent`.
  hint: |
    Это 100 минус скидка.
  answer: |
    Ответ:
    ```sql
    SELECT code, 100 - discount_percent AS pay_percent
    FROM promo_codes;
    ```
    Результат:
    ```
        code     | pay_percent
    -------------+-------------
     WELCOME10   |          90
     SUMMER25    |          75
     VIP15       |          85
     BLACKFRIDAY |          70
     NEWYEAR20   |          80
    (5 rows)
    ```
    Выражению дали имя через `AS`, иначе колонка называлась бы `?column?`.
- title: "Константа в каждой строке"
  text: |
    Выведите `id` и `name` тегов и третью колонку `kind`, в которой у каждой строки написано `tag`.
  answer: |
    Ответ:
    ```sql
    SELECT id, name, 'tag' AS kind
    FROM tags;
    ```
    Результат:
    ```
     id |     name     | kind
    ----+--------------+------
      1 | хит          | tag
      2 | новинка      | tag
      3 | скидка       | tag
      4 | подарок      | tag
      5 | беспроводное | tag
      6 | распродажа   | tag
    (6 rows)
    ```
    Константа в `SELECT` повторяется в каждой строке результата.
- title: "Стоимость остатков"
  text: |
    Выведите `id`, `price`, `stock` всех товаров и стоимость их остатка на складе (`price * stock`) в колонке `stock_value`.
  answer: |
    Ответ:
    ```sql
    SELECT id, price, stock,
           price * stock AS stock_value
    FROM products;
    ```
    Результат:
    ```
     id |  price   | stock | stock_value
    ----+----------+-------+-------------
      1 | 64990.00 |     5 |   324950.00
      2 | 89990.00 |     2 |   179980.00
      3 | 54990.00 |     0 |        0.00
      4 |  1499.00 |    12 |    17988.00
      5 |   590.00 |    30 |    17700.00
      6 |  5490.00 |     7 |    38430.00
      7 |   490.00 |    50 |    24500.00
      8 |  1499.00 |     0 |        0.00
      9 |  3990.00 |     9 |    35910.00
     10 | 39990.00 |     6 |   239940.00
     11 | 49990.00 |     3 |   149970.00
     12 | 24990.00 |    10 |   249900.00
     13 |   990.00 |    40 |    39600.00
     14 |  2490.00 |    15 |    37350.00
     15 |  1290.00 |    25 |    32250.00
     16 |  1290.00 |    18 |    23220.00
     17 |  1790.00 |     0 |        0.00
     18 |  2190.00 |     8 |    17520.00
     19 |  1890.00 |    14 |    26460.00
     20 |  1590.00 |     9 |    14310.00
     21 |  1890.00 |     0 |        0.00
     22 |   590.00 |    60 |    35400.00
    (22 rows)
    ```
    Выражение считается для каждой строки; у товаров с нулевым остатком стоимость `0.00`.

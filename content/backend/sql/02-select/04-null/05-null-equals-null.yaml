title: NULL равно NULL?
type: quiz
kind: single
difficulty: 1
pitfall: Два неизвестных значения не равны и не различны — сравнение с NULL даёт NULL.
statement: |
  Что вернёт запрос `SELECT NULL = NULL AS same;`?
options:
  - "`t` — значения одинаковые"
  - "`f` — NULL ничему не равен"
  - NULL — результат сравнения неизвестен
  - Ошибку — NULL нельзя сравнивать
answer: [2]
explanation: |
  Любое сравнение с NULL возвращает NULL: «неизвестно» не равно и не различно другому «неизвестно». Именно поэтому для проверки пишут `IS NULL`, а `IS NOT DISTINCT FROM` сравнивает значения, считая два NULL равными.

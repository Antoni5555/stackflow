title: Все, кроме москвичей
type: exercise
difficulty: 2
pitfall: Условие <> не возвращает строки с NULL — покупатели без города выпадают из «не из Москвы».
statement: |
  Для рассылки о доставке в регионы нужны все покупатели, кроме москвичей, — в том числе те, у кого город не указан. Выведите `id` и `name`. Порядок строк не важен.
starter_code: |
  SELECT id, name
  FROM users
  WHERE city <> 'Москва';
solution: |
  SELECT id, name
  FROM users
  WHERE city <> 'Москва' OR city IS NULL;
check:
  type: result
  order_matters: false
hints:
  - Посчитайте, сколько строк вернула заготовка, и сравните с числом покупателей не из Москвы.
explanation: |
  Для покупателя без города `city <> 'Москва'` даёт NULL — «неизвестно, может, и Москва», — и строка отбрасывается. Если такие строки нужны, их добавляют явно: `OR city IS NULL`. Ту же ловушку содержит `NOT IN (…)`.

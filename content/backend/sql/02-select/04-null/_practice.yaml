- title: "Профили без телефона"
  text: |
    Выведите `user_id` профилей, в которых не указан телефон.
  answer: |
    Ответ:
    ```sql
    SELECT user_id
    FROM profiles
    WHERE phone IS NULL;
    ```
    Результат:
    ```
     user_id
    ---------
           6
    (1 row)
    ```
    Для проверки на пустоту — только `IS NULL`.
- title: "Отзывы с текстом"
  text: |
    Выведите `id` и `rating` отзывов, у которых есть текст.
  answer: |
    Ответ:
    ```sql
    SELECT id, rating
    FROM reviews
    WHERE text IS NOT NULL;
    ```
    Результат:
    ```
     id | rating
    ----+--------
      1 |      5
      3 |      5
      4 |      3
      5 |      4
      7 |      5
      8 |      4
      9 |      2
     11 |      3
     14 |      5
     16 |      5
     18 |      4
     20 |      5
    (12 rows)
    ```
    `IS NOT NULL` — значение есть.
- title: "Заказы без промокода"
  text: |
    Выведите `id` заказов покупателя 1, оформленных без промокода.
  answer: |
    Ответ:
    ```sql
    SELECT id
    FROM orders
    WHERE user_id = 1 AND promo_code_id IS NULL;
    ```
    Результат:
    ```
     id
    ----
      6
     14
     28
     34
    (4 rows)
    ```
    Условие на NULL сочетается с другими через `AND`, как обычное.
- title: "Дата рождения или прочерк"
  text: |
    Для профилей покупателей 6, 7 и 8 выведите `user_id` и дату рождения текстом в колонке `birth`, а вместо пустой даты — строку `не указана`.
  hint: |
    `COALESCE` и приведение даты к тексту `::text`.
  answer: |
    Ответ:
    ```sql
    SELECT user_id,
           COALESCE(birth_date::text, 'не указана') AS birth
    FROM profiles
    WHERE user_id IN (6, 7, 8);
    ```
    Результат:
    ```
     user_id |   birth
    ---------+------------
           6 | 1990-09-09
           7 | 1985-05-17
           8 | не указана
    (3 rows)
    ```
    У `COALESCE` все аргументы одного типа: дату приводим к тексту, чтобы рядом могла стоять строка.

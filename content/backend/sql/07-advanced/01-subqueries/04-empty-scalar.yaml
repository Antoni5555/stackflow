title: Подзапрос без строк
type: quiz
kind: single
difficulty: 2
pitfall: Скалярный подзапрос без строк даёт NULL, а сравнение с NULL не пропускает ни одной строки.
statement: |
  Товара с `id` 99 в базе нет. Что вернёт запрос?
  ```sql
  SELECT id, name
  FROM products
  WHERE price > (SELECT price FROM products WHERE id = 99);
  ```
options:
  - Все товары
  - Ни одной строки, без ошибки
  - Ошибку — подзапрос не вернул строк
  - Ошибку — нельзя сравнивать цену с подзапросом
answer: [1]
explanation: |
  Пустой скалярный подзапрос — это NULL. `price > NULL` для каждой строки «неизвестно», и `WHERE` не пропускает ни одной. Ошибки нет — поэтому опечатку в условии подзапроса легко не заметить: просто пустой результат.

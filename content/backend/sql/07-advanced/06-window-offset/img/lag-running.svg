<text x="20" y="190" text-anchor="start" class="fig-s">Выручка ноября (113520) в строке декабря стала lag — значением прошлой строки.</text>
<text x="520" y="50" text-anchor="start" class="fig-cs">lag(revenue) OVER (ORDER BY month):</text>

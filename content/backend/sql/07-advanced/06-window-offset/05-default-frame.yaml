title: Окно без ORDER BY
type: quiz
kind: single
difficulty: 3
pitfall: Без ORDER BY в окне рамка — всё окно, и sum даёт общую сумму в каждой строке.
statement: |
  Помесячная выручка — 6 строк. Чем отличаются колонки `a` и `b`?
  ```sql
  SELECT month,
         sum(revenue) OVER () AS a,
         sum(revenue) OVER (ORDER BY month) AS b
  FROM monthly;
  ```
options:
  - Ничем — обе нарастающий итог
  - "`a` — общая выручка за все месяцы в каждой строке, `b` — нарастающий итог"
  - "`a` — нарастающий итог, `b` — общая выручка"
  - "`a` — ошибка: окно без `ORDER BY` не допускается"
answer: [1]
explanation: |
  Без `ORDER BY` все строки окна равноправны, и рамка — всё окно: `a` в каждой строке — сумма за шесть месяцев (613 415). С `ORDER BY` рамка по умолчанию — от начала до текущей строки, получается нарастающий итог. Это удобно для доли: `revenue / sum(revenue) OVER ()`.

title: В JSONB или в столбец
type: quiz
kind: multiple
difficulty: 2
pitfall: В JSONB нет ограничений и внешних ключей — обязательные и связанные данные хранят в столбцах.
statement: |
  Какие данные товара разумно хранить в `attributes jsonb`, а не в отдельных столбцах?
options:
  - Цвет и размер одежды
  - Цену товара
  - Объём памяти смартфона
  - Ссылку на категорию товара
  - Остаток на складе
answer: [0, 2]
explanation: |
  Цвет, размер, память — характеристики, которые есть не у всех товаров и различаются по категориям: для них JSONB удобен. Цена, остаток и категория есть у каждого товара, по ним фильтруют и сортируют каталог, и им нужны ограничения: `CHECK (price >= 0)`, `CHECK (stock >= 0)`, внешний ключ на `categories`. В JSONB этого не сделать.

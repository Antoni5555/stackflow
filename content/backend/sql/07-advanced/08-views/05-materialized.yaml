title: Когда материализовать
type: quiz
kind: multiple
difficulty: 3
pitfall: Материализованное представление ускоряет чтение ценой свежести данных.
statement: |
  Что верно про материализованное представление в PostgreSQL?
options:
  - Чтение из него не выполняет исходный запрос заново
  - Данные обновляются автоматически при изменении таблиц
  - На нём можно построить индекс
  - "`REFRESH MATERIALIZED VIEW CONCURRENTLY` не блокирует чтение, но требует уникального индекса"
  - Оно подходит для данных, которые должны быть свежими до секунды, например остатка на странице товара
answer: [0, 2, 3]
explanation: |
  Материализованное представление хранит результат как таблицу: читать быстро, можно строить индексы. Само оно не обновляется — только командой `REFRESH`, обычно по расписанию. Поэтому для остатка на странице товара, где важна каждая продажа, оно не годится: там читают таблицу или обычное представление.

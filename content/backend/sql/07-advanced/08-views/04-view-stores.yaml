title: Что хранит представление
type: quiz
kind: single
difficulty: 2
pitfall: Обычное представление хранит только запрос и выполняет его при каждом чтении.
statement: |
  Создали `CREATE VIEW category_revenue AS SELECT …` (выручка по категориям). Потом изменили количество в одной позиции заказа. Что покажет `SELECT * FROM category_revenue`?
options:
  - Выручку на момент создания представления
  - Новую выручку — запрос выполнится заново
  - Ошибку — представление нужно пересоздать после изменения таблиц
  - Новую выручку, но только после `REFRESH VIEW`
answer: [1]
explanation: |
  Обычное представление не хранит данные — только текст запроса, который выполняется при каждом обращении. Поэтому результат всегда соответствует текущим таблицам. Хранит результат и требует `REFRESH` только материализованное представление; команды `REFRESH VIEW` не существует.

title: Вверх или вниз
type: quiz
kind: single
difficulty: 2
pitfall: Направление обхода дерева задаёт условие соединения рекурсивной части.
statement: |
  Стартовая часть — категория «Ноутбуки» (`id` 3). Рекурсивная часть:
  ```sql
  SELECT c.id, c.name, c.parent_id
  FROM categories c
  JOIN path p ON c.id = p.parent_id
  ```
  Что соберёт запрос?
options:
  - Ноутбуки и все их подкатегории
  - Ноутбуки, Компьютеры, Электроника — путь к корню
  - Только Ноутбуки
  - Все категории каталога
answer: [1]
explanation: |
  `c.id = p.parent_id` ищет категорию, чей `id` — родитель найденной, то есть идёт вверх: Ноутбуки → Компьютеры → Электроника. У Электроники `parent_id` — NULL, следующий шаг пуст. Для обхода вниз условие обратное: `c.parent_id = p.id`.

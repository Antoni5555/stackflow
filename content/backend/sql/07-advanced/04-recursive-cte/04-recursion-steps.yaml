title: Что видит рекурсивная часть
type: quiz
kind: single
difficulty: 3
pitfall: Рекурсивная часть работает только со строками прошлого шага и останавливается, когда шаг пуст.
statement: |
  В рекурсивном CTE «все подкатегории Электроники» стартовая часть вернула «Электронику», первый шаг рекурсии — «Компьютеры» и «Смартфоны». С какими строками `tree` работает второй шаг?
options:
  - Со всеми найденными строками — Электроника, Компьютеры, Смартфоны
  - Только с Компьютерами и Смартфонами
  - Только с Электроникой
  - Со всеми строками таблицы `categories`
answer: [1]
explanation: |
  На каждом шаге рекурсивная часть видит только строки, добавленные на прошлом шаге. Второй шаг ищет детей «Компьютеров» и «Смартфонов» — находит «Ноутбуки» и «Аксессуары». Третий шаг ищет их детей, не находит — и рекурсия заканчивается. Если бы шаг видел все строки, «Электроника» снова и снова находила бы своих детей.

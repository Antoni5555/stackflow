title: Где цикл
type: quiz
kind: single
difficulty: 1
pitfall: SQL описывает результат, а не шаги его получения — перебор строк выбирает СУБД.
statement: |
  Запрос `SELECT name FROM products WHERE stock = 0;` возвращает товары, которых нет на складе. Кто решает, как именно искать такие строки — перебрать всю таблицу или взять индекс?
options:
  - Программист — порядок перебора задаётся порядком слов в запросе
  - СУБД — запрос говорит, что нужно, а план поиска строит она сама
  - Django — он перебирает строки перед отправкой запроса
  - Никто — SQL всегда перебирает все строки по порядку
answer: [1]
hints:
  - SQL — декларативный язык.
explanation: |
  В SQL описывают результат: какие столбцы, из какой таблицы, при каком условии. Как его получить, решает планировщик PostgreSQL: если по `stock` есть индекс и подходящих строк мало, он возьмёт индекс, иначе прочитает таблицу. Увидеть выбранный план поможет `EXPLAIN` — о нём в разделе про производительность.

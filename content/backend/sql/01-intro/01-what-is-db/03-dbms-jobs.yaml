title: Что берёт на себя СУБД
type: quiz
kind: multiple
difficulty: 1
pitfall: "СУБД — не просто хранилище: она проверяет правила данных и выполняет изменения целиком или никак."
statement: |
  Что из этого PostgreSQL делает сам, без кода в приложении? Отметьте все верные варианты.
options:
  - Не даёт записать заказ с `user_id` несуществующего покупателя, если объявлен внешний ключ
  - Откатывает «создать заказ и списать остатки» целиком, если на середине произошла ошибка внутри транзакции
  - Сохраняет оба заказа, если они пришли одновременно
  - Проверяет, что email покупателя действительно существует и ему можно написать
  - Сам строит HTML-страницу каталога из таблицы products
answer: [0, 1, 2]
explanation: |
  Внешние ключи, транзакции и одновременная работа — задачи СУБД. Проверить, что почтовый ящик существует, база не может: это делают письмом с подтверждением. Страницы строит приложение (Django): оно получает строки от СУБД и подставляет их в шаблон.

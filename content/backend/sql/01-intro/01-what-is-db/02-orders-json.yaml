title: Заказы в JSON-файле
type: quiz
kind: single
difficulty: 1
pitfall: Файл не защищает от одновременной записи — два процесса затирают изменения друг друга.
statement: |
  Стартап хранит заказы в `orders.json`: при каждом заказе сайт читает файл, добавляет заказ в список и записывает файл обратно. В «чёрную пятницу» часть заказов пропала, хотя покупатели видели «Заказ оформлен». Что произошло?
options:
  - JSON не умеет хранить больше тысячи записей
  - Два запроса прочитали файл одновременно, каждый дописал свой заказ и перезаписал файл — второй затёр заказ первого
  - Файл повредился из-за кириллицы в названиях товаров
  - Браузер покупателя не дождался ответа сервера
answer: [1]
explanation: |
  Классическая гонка: оба процесса прочитали один и тот же список, каждый добавил свой заказ, а записанным остался список того, кто писал последним. СУБД выстраивает одновременные изменения так, что ни одно не теряется, и подтверждает запись, только когда данные действительно сохранены.

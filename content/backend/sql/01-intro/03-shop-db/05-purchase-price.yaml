title: По какой цене купили
type: quiz
kind: single
difficulty: 2
pitfall: Цена товара в каталоге и цена в заказе — разные данные; цена покупки хранится в позиции заказа.
statement: |
  Покупательница вернула мышь из заказа 1 и просит вернуть деньги. С тех пор цена в каталоге изменилась. Где взять сумму, которую она заплатила за мышь?
options:
  - "`products.price` — цена товара"
  - "`order_items.price` — цена в позиции заказа"
  - "`orders` — там хранится сумма заказа"
  - "`promo_codes.discount_percent` — цену надо вычислить по скидке"
answer: [1]
explanation: |
  `order_items.price` — цена на момент покупки, она не меняется вместе с каталогом. В заказе 1 мышь куплена за 1290.00, а в каталоге она сейчас стоит 1499.00. В `orders` нет суммы — её считают по позициям.

title: Какие теги у товаров
type: exercise
difficulty: 2
pitfall: Связь «многие ко многим» хранится в отдельной таблице-связке, а не в столбце товара.
statement: |
  У товара может быть несколько тегов, а один тег стоит у многих товаров. Выведите таблицу, в которой хранится, какой тег у какого товара, — целиком. Порядок строк не важен.
solution: |
  SELECT * FROM product_tags;
check:
  type: result
  order_matters: false
hints:
  - В `products` столбца с тегами нет, в `tags` — только названия.
  - Ищите таблицу с двумя внешними ключами.
explanation: |
  `product_tags` — таблица-связка: каждая строка — пара (`product_id`, `tag_id`). Список тегов в одном столбце товара («хит, новинка») нельзя было бы проверить внешним ключом и неудобно искать. Так устроена любая связь «многие ко многим».

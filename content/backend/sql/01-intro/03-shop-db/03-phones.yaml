title: Телефоны покупателей
type: exercise
difficulty: 1
pitfall: Данные одной сущности могут лежать в нескольких таблицах — телефона нет в users, он в profiles (связь 1:1).
statement: |
  Менеджер просит телефоны покупателей. Найдите в «Схеме базы» таблицу, где хранится телефон, и выведите её целиком: все столбцы и все строки. Порядок строк не важен.
solution: |
  SELECT * FROM profiles;
check:
  type: result
  order_matters: false
hints:
  - В `users` столбца с телефоном нет. Какая таблица ссылается на `users` и хранит контакты?
explanation: |
  Телефон и дата рождения — в `profiles`: у каждого покупателя не больше одного профиля, а ключ профиля `user_id` одновременно первичный и внешний ключ на `users`. Профиль есть не у всех: у покупателей 5, 9, 10 и 13 его нет. Связь 1:1 подробно разберём в разделе про связи.

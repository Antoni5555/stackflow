- title: "Метки товаров"
  text: |
    Выведите все метки товаров. Какой `id` у метки «скидка»?
  answer: |
    Ответ:
    ```sql
    SELECT * FROM tags;
    ```
    Результат:
    ```
     id |     name
    ----+--------------
      1 | хит
      2 | новинка
      3 | скидка
      4 | подарок
      5 | беспроводное
      6 | распродажа
    (6 rows)
    ```
    У метки «скидка» `id` = 3. Названия меток не повторяются: у столбца `name` ограничение `UNIQUE`.
- title: "Профили"
  text: |
    Выведите все профили покупателей. У скольких покупателей есть профиль и у кого в профиле не указан телефон?
  answer: |
    Ответ:
    ```sql
    SELECT * FROM profiles;
    ```
    Результат:
    ```
     user_id |    phone     | birth_date
    ---------+--------------+------------
           1 | +79001112233 | 1994-03-12
           2 | +79002223344 | 1988-11-30
           3 | +79003334455 | 2001-07-04
           4 | +79004445566 | 1997-01-21
           6 |              | 1990-09-09
           7 | +79007778899 | 1985-05-17
           8 | +79008889900 |
          11 | +79001234567 | 1999-12-01
          12 | +79009990011 | 2003-02-28
    (9 rows)
    ```
    Профилей 9 из 13 покупателей. Пустая ячейка — NULL: у покупателя 6 нет телефона, у покупателя 8 — даты рождения.
- title: "Метки товара"
  text: |
    Какие метки (названиями) стоят на товаре 1? Выведите таблицу-связку `product_tags` и таблицу `tags` и найдите ответ глазами.
  hint: |
    В `product_tags` каждая строка — пара «товар — метка» по `id`.
  answer: |
    Ответ:
    ```sql
    SELECT * FROM product_tags;

    SELECT * FROM tags;
    ```
    Результат:
    ```
     product_id | tag_id
    ------------+--------
              1 |      1
              1 |      2
              2 |      2
              4 |      1
              4 |      5
              6 |      1
              9 |      2
             10 |      1
             10 |      2
             11 |      2
             12 |      3
             13 |      4
             15 |      1
             15 |      3
             16 |      3
             19 |      1
             19 |      4
             20 |      4
    (18 rows)
     id |     name
    ----+--------------
      1 | хит
      2 | новинка
      3 | скидка
      4 | подарок
      5 | беспроводное
      6 | распродажа
    (6 rows)
    ```
    У товара 1 две строки в связке — метки 1 и 2, то есть «хит» и «новинка». Собирать такие ответы одним запросом научит раздел «Связи и JOIN».

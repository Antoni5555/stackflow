title: Что не пропустит база
type: quiz
kind: multiple
difficulty: 2
pitfall: Ограничения схемы проверяются на каждой записи — неверные данные не попадают в базу, откуда бы ни пришли.
statement: |
  В `users` первичный ключ `id`, а `email` объявлен `NOT NULL UNIQUE`. В `orders` внешний ключ `user_id integer NOT NULL REFERENCES users (id)`. В базе есть покупатели с `id` от 1 до 13. Какие записи PostgreSQL отклонит ошибкой?
options:
  - Новый покупатель с email, который уже есть у покупателя 1
  - Заказ с `user_id = 14`
  - Новый покупатель без города (`city` — NULL)
  - Заказ с `user_id` — NULL
  - Второй заказ покупателя 1
answer: [0, 1, 3]
explanation: |
  `UNIQUE` не пускает повтор почты, внешний ключ — ссылку на несуществующего покупателя 14, `NOT NULL` — заказ без покупателя. `city` разрешает NULL, а у одного покупателя может быть сколько угодно заказов: внешний ключ не требует уникальности.

title: Почта в каждом заказе
type: quiz
kind: single
difficulty: 1
pitfall: Копия данных в каждой строке расходится с оригиналом; ссылка по ключу — нет.
statement: |
  Чтобы «не делать лишних запросов», в `orders` предлагают хранить не `user_id`, а `user_email` и `user_name` — копию данных покупателя. У Анны 4 заказа. Она сменила почту в профиле. Что будет?
options:
  - Почта обновится во всех заказах сама
  - В заказах останется старая почта, если не обновить каждый заказ отдельно — данные о покупателе разойдутся
  - База запретит смену почты, пока есть заказы
  - Ничего — заказы не связаны с покупателем
answer: [1]
explanation: |
  Копия не знает об оригинале: новая почта записалась в `users`, а в четырёх заказах лежит старая. Где-то обновят, где-то забудут — и письмо о доставке уйдёт на старый адрес. С `user_id` покупатель хранится в одном месте, а заказы находят его по ключу. Получить заказ вместе с почтой одним запросом позволяет JOIN.

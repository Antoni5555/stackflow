title: Заказ без промокода
type: quiz
kind: single
difficulty: 1
pitfall: Внешний ключ без NOT NULL разрешает «связи нет» — это и есть необязательная связь.
statement: |
  В `orders` два внешних ключа: `user_id integer NOT NULL REFERENCES users (id)` и `promo_code_id integer REFERENCES promo_codes (id)`. Что из этого верно?
options:
  - Заказ можно сохранить без промокода (`promo_code_id` — NULL), но не без покупателя
  - Оба столбца обязательны — внешний ключ не бывает NULL
  - В `promo_code_id` можно записать 999, даже если такого промокода нет — столбец ведь необязательный
  - "`user_id` может быть NULL, потому что у внешнего ключа нет своих значений"
answer: [0]
explanation: |
  Внешний ключ проверяет только непустые значения: если `promo_code_id` заполнен, промокод с таким `id` обязан существовать, а NULL означает «промокода нет». Обязательность задаёт `NOT NULL`: у `user_id` он есть, поэтому заказ без покупателя база не примет.

title: Почта вместо id
type: quiz
kind: single
difficulty: 2
pitfall: Первичный ключ не должен меняться — данные вроде email для него не годятся.
statement: |
  Коллега предлагает убрать из `users` столбец `id` и сделать первичным ключом `email`: «он и так уникальный». На `users` ссылаются `orders`, `reviews` и `profiles`. Чем это плохо?
options:
  - Ничем — уникальный email подходит для ключа не хуже числа
  - Email меняется — при смене почты пришлось бы переписывать ссылки во всех заказах, отзывах и профилях
  - Первичный ключ может быть только числом
  - Email может быть NULL
answer: [1]
explanation: |
  Ключ — постоянный адрес строки: на него ссылаются внешние ключи других таблиц. Покупатель сменит почту — и пришлось бы обновить её во всех `orders.user_id`, `reviews.user_id`, `profiles.user_id`. Суррогатный `id` ничего не значит, поэтому никогда не меняется. Уникальность email при этом обеспечивает отдельное ограничение `UNIQUE`. Первичный ключ может быть и текстом, но для связей числовой `id` удобнее.

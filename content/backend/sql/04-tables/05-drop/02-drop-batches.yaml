title: Партии больше не нужны
type: exercise
difficulty: 2
pitfall: На таблицу ссылается внешний ключ — DROP падает; CASCADE удаляет ключ, а ссылающаяся таблица остаётся.
statement: |
  Импорт закончен. Таблица партий `import_batches` больше не нужна, а строки из `import_rows` ещё понадобятся — вместе со столбцом `batch_id`, но уже без ссылки на партии. Удалите `import_batches`.

  Запрос из заготовки падает. Прочитайте ошибку и подсказку под ней.
setup: |
  CREATE TABLE import_batches (
      id          integer     GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      file_name   text        NOT NULL,
      uploaded_at timestamptz NOT NULL DEFAULT now()
  );
  CREATE TABLE import_rows (
      id       integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      batch_id integer NOT NULL REFERENCES import_batches (id) ON DELETE CASCADE,
      name     text    NOT NULL,
      price    numeric(10,2)
  );
  INSERT INTO import_batches (file_name) VALUES ('supplier-2026-04.csv');
  INSERT INTO import_rows (batch_id, name, price) VALUES (1, 'Кеды', 3490.00), (1, 'Сланцы', 790.00);
starter_code: |
  DROP TABLE import_batches;
solution: |
  DROP TABLE import_batches CASCADE;
check:
  type: schema
  tables: [import_rows, import_batches]
hints:
  - Что зависит от `import_batches`, судя по строке DETAIL?
  - "HINT предлагает `CASCADE`. Что именно он удалит — таблицу `import_rows` или только ограничение?"
explanation: |
  На `import_batches` ссылается внешний ключ `import_rows_batch_id_fkey`, и `DROP` без `CASCADE` отказывается. `DROP TABLE import_batches CASCADE` удаляет таблицу и этот внешний ключ, а `import_rows` со всеми строками и столбцом `batch_id` остаётся — номер партии просто перестаёт проверяться. То же самое по шагам: `ALTER TABLE import_rows DROP CONSTRAINT import_rows_batch_id_fkey;`, потом `DROP TABLE import_batches;`.

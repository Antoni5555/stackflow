<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" class="fig" role="img" aria-labelledby="t"><title id="t">Тип столбца выбирают по смыслу значения</title>
<style>
.fig text{white-space:pre}
.fig-t{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:14px;fill:#0e0e0e;fill:var(--text,#0e0e0e)}
.fig-c{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:14px;fill:#0e0e0e;fill:var(--text,#0e0e0e)}
.fig-cs{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:12px;fill:#0e0e0e;fill:var(--text,#0e0e0e)}
.fig-h{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:12px;letter-spacing:.04em;text-transform:uppercase;fill:#6e6e6a;fill:var(--muted,#6e6e6a)}
.fig-s{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:12px;fill:#6e6e6a;fill:var(--muted,#6e6e6a)}
.fig-box{fill:#ffffff;fill:var(--surface,#ffffff);stroke:#e0e0dc;stroke:var(--border,#e0e0dc);stroke-width:1.5}
.fig-box2{fill:#ebebe8;fill:var(--surface-2,#ebebe8);stroke:#e0e0dc;stroke:var(--border,#e0e0dc);stroke-width:1.5}
.fig-acc{fill:#dcf25c;fill:var(--accent,#dcf25c)}
.fig-onacc{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:13px;fill:#0e0e0e;fill:var(--on-accent,#0e0e0e)}
.fig-ln{stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5;fill:none}
.fig-lnd{stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.fig-ah{fill:#6e6e6a;fill:var(--muted,#6e6e6a)}
.fig-err{fill:#fdecea;fill:var(--error-bg,#fdecea);stroke:#d93025;stroke:var(--error,#d93025);stroke-width:1.5}
.fig-errt{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:13px;fill:#d93025;fill:var(--error,#d93025)}
.fig-ok{fill:#e7f6ec;fill:var(--success-bg,#e7f6ec);stroke:#1f9d55;stroke:var(--success,#1f9d55);stroke-width:1.5}
.fig-dash{fill:none;stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5;stroke-dasharray:5 4}
.fig-term{fill:#0d0d0f;fill:var(--term-bg,#0d0d0f)}
.fig-tt{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:13px;fill:#e6e6e3;fill:var(--term-text,#e6e6e3)}
.fig-tterr{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:13px;fill:#f87171}
.fig-m1{fill:#dbe4ff;fill:var(--match-1,#dbe4ff)}
.fig-m2{fill:#ffe3e3;fill:var(--match-2,#ffe3e3)}
.fig-m3{fill:#d3f9d8;fill:var(--match-3,#d3f9d8)}
.fig-venn{fill-opacity:.75;stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fig-ah"/></marker></defs>
<text x="20" y="24" text-anchor="start" class="fig-h">значение</text>
<text x="310" y="24" text-anchor="start" class="fig-h">тип</text>
<text x="540" y="24" text-anchor="start" class="fig-h">не так</text>
<rect x="20" y="34" width="270" height="31" rx="6" class="fig-box"/>
<text x="155.0" y="54.5" text-anchor="middle" class="fig-t">цена, сумма, скидка в рублях</text>
<path d="M290 49H306" class="fig-ln" marker-end="url(#a)"/>
<rect x="310" y="34" width="210" height="31" rx="6" class="fig-acc"/>
<text x="415.0" y="54.5" text-anchor="middle" class="fig-onacc">numeric(10,2)</text>
<text x="540" y="54" text-anchor="start" class="fig-s">real — погрешность: 0.1 + 0.2 ≠ 0.3</text>
<rect x="20" y="71" width="270" height="31" rx="6" class="fig-box"/>
<text x="155.0" y="91.5" text-anchor="middle" class="fig-t">количество, остаток, ключ</text>
<path d="M290 86H306" class="fig-ln" marker-end="url(#a)"/>
<rect x="310" y="71" width="210" height="31" rx="6" class="fig-acc"/>
<text x="415.0" y="91.5" text-anchor="middle" class="fig-onacc">integer / bigint</text>
<text x="540" y="91" text-anchor="start" class="fig-s">numeric — лишняя точность</text>
<rect x="20" y="108" width="270" height="31" rx="6" class="fig-box"/>
<text x="155.0" y="128.5" text-anchor="middle" class="fig-t">название, email, адрес</text>
<path d="M290 123H306" class="fig-ln" marker-end="url(#a)"/>
<rect x="310" y="108" width="210" height="31" rx="6" class="fig-acc"/>
<text x="415.0" y="128.5" text-anchor="middle" class="fig-onacc">text</text>
<text x="540" y="128" text-anchor="start" class="fig-s">varchar(255) — лимит без смысла</text>
<rect x="20" y="145" width="270" height="31" rx="6" class="fig-box"/>
<text x="155.0" y="165.5" text-anchor="middle" class="fig-t">да / нет</text>
<path d="M290 160H306" class="fig-ln" marker-end="url(#a)"/>
<rect x="310" y="145" width="210" height="31" rx="6" class="fig-acc"/>
<text x="415.0" y="165.5" text-anchor="middle" class="fig-onacc">boolean</text>
<text x="540" y="165" text-anchor="start" class="fig-s">'yes' / 'no', 0 / 1</text>
<rect x="20" y="182" width="270" height="31" rx="6" class="fig-box"/>
<text x="155.0" y="202.5" text-anchor="middle" class="fig-t">день без времени</text>
<path d="M290 197H306" class="fig-ln" marker-end="url(#a)"/>
<rect x="310" y="182" width="210" height="31" rx="6" class="fig-acc"/>
<text x="415.0" y="202.5" text-anchor="middle" class="fig-onacc">date</text>
<text x="540" y="202" text-anchor="start" class="fig-s">text — сортировка по алфавиту</text>
<rect x="20" y="219" width="270" height="31" rx="6" class="fig-box"/>
<text x="155.0" y="239.5" text-anchor="middle" class="fig-t">момент события</text>
<path d="M290 234H306" class="fig-ln" marker-end="url(#a)"/>
<rect x="310" y="219" width="210" height="31" rx="6" class="fig-acc"/>
<text x="415.0" y="239.5" text-anchor="middle" class="fig-onacc">timestamptz</text>
<text x="540" y="239" text-anchor="start" class="fig-s">timestamp — неизвестен пояс</text>
<rect x="20" y="256" width="270" height="31" rx="6" class="fig-box"/>
<text x="155.0" y="276.5" text-anchor="middle" class="fig-t">разные характеристики</text>
<path d="M290 271H306" class="fig-ln" marker-end="url(#a)"/>
<rect x="310" y="256" width="210" height="31" rx="6" class="fig-acc"/>
<text x="415.0" y="276.5" text-anchor="middle" class="fig-onacc">jsonb</text>
<text x="540" y="276" text-anchor="start" class="fig-s">столбец на каждый ключ</text>
</svg>

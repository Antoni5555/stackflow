title: Что хранит timestamptz
type: quiz
kind: single
difficulty: 2
pitfall: timestamptz не хранит часовой пояс — он хранит момент и показывает его в поясе сессии.
statement: |
  Заказ записан в `orders.created_at` (`timestamptz`) как `'2026-04-15 12:00+03'`. Сервер отчётов работает в поясе `Asia/Novosibirsk` (UTC+7). Что он увидит в `created_at`?
options:
  - "`2026-04-15 12:00:00+03` — пояс сохранён вместе со временем"
  - "`2026-04-15 16:00:00+07` — тот же момент в поясе сессии"
  - "`2026-04-15 12:00:00+07` — время то же, пояс сессии"
  - "`2026-04-15 09:00:00+00` — всегда в UTC"
answer: [1]
explanation: |
  `timestamptz` при записи переводит время в UTC (09:00) и хранит только момент, без исходного пояса. При чтении момент показывается в поясе сессии: в Новосибирске — 16:00+07. Это тот же самый момент, что 12:00 по Москве. Если исходный пояс важен (например, где был покупатель), его хранят отдельным столбцом.

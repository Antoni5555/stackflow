title: Какая буква ACID
type: quiz
kind: single
difficulty: 2
pitfall: Атомарность — это «всё или ничего» для группы изменений.
statement: |
  Оформление заказа — три запроса без транзакции. После второго (позиция добавлена) сервер упал, и остаток товара не списался. Какое свойство транзакции защитило бы от этого?
options:
  - Atomicity — все три изменения выполнились бы целиком или не выполнились бы вовсе
  - Consistency — база проверила бы остаток
  - Isolation — другие покупатели не увидели бы заказ
  - Durability — данные записались бы на диск
answer: [0]
explanation: |
  Проблема — «полузаказ»: часть изменений сохранилась, часть нет. От этого защищает атомарность: изменения транзакции до `COMMIT` не зафиксированы, и при сбое база откатывает их все. Durability говорит о другом — о том, что зафиксированное после `COMMIT` не пропадёт.

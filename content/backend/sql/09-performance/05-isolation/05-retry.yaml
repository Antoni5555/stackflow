title: Ошибка сериализации
type: quiz
kind: single
difficulty: 3
pitfall: Ошибки сериализации на Repeatable Read и Serializable — штатная ситуация, транзакцию повторяют.
statement: |
  На уровне Serializable транзакция оформления заказа иногда завершается ошибкой `could not serialize access due to read/write dependencies among transactions`. Что должно сделать приложение?
options:
  - Показать покупателю «Ошибка базы данных» и ничего не делать
  - Выполнить ROLLBACK и повторить транзакцию целиком
  - Повторить только последний запрос транзакции
  - Понизить уровень изоляции до Read Uncommitted
answer: [1]
explanation: |
  Serializable гарантирует корректность, прерывая одну из конфликтующих транзакций. Это ожидаемое поведение: транзакцию откатывают и выполняют заново целиком — с новыми чтениями, ведь данные изменились. Повтор одного запроса невозможен: транзакция уже прервана. Read Uncommitted в PostgreSQL — это Read Committed, и он защиту просто уберёт.

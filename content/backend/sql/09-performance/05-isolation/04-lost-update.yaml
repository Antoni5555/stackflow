title: Последний ноутбук
type: quiz
kind: multiple
difficulty: 3
pitfall: Чтение, вычисление в коде и запись по прочитанному значению на Read Committed теряет параллельное обновление.
statement: |
  Код оформления заказа: `SELECT stock FROM products WHERE id = 3`, в Python `if stock >= 1: new = stock - 1`, затем `UPDATE products SET stock = new WHERE id = 3`. Двое одновременно покупают последний ноутбук. Какие способы защищают от двойной продажи?
options:
  - "Списывать одной командой: `UPDATE products SET stock = stock - 1 WHERE id = 3 AND stock >= 1` и проверять, что изменена одна строка"
  - "Читать остаток через `SELECT … FOR UPDATE` в той же транзакции, что и запись"
  - Обернуть те же запросы в `BEGIN … COMMIT` на уровне Read Committed
  - "Выполнять транзакцию на уровне Serializable и повторять её при ошибке сериализации"
answer: [0, 1, 3]
explanation: |
  Атомарный `UPDATE` с условием перепроверяет остаток по актуальной версии строки: второй покупатель получит `UPDATE 0`. `FOR UPDATE` блокирует строку при чтении — второй будет ждать, пока первый завершит транзакцию, и прочитает уже 0. Serializable обнаружит конфликт и прервёт одну из транзакций. А просто `BEGIN … COMMIT` на Read Committed не помогает: оба прочитают 1 и оба запишут 0.

title: Повторное чтение
type: quiz
kind: single
difficulty: 3
pitfall: Read Committed берёт снимок на каждый запрос, Repeatable Read — один на транзакцию.
statement: |
  Сессия A: `BEGIN ISOLATION LEVEL REPEATABLE READ; SELECT stock FROM products WHERE id = 1;` → 5. Сессия B (autocommit): `UPDATE products SET stock = 15 WHERE id = 1;`. Сессия A снова: `SELECT stock FROM products WHERE id = 1;`. Что она увидит — и что увидела бы на Read Committed?
options:
  - Repeatable Read — 15, Read Committed — 5
  - Repeatable Read — 5, Read Committed — 15
  - Оба уровня — 15
  - Оба уровня — 5
answer: [1]
explanation: |
  На Repeatable Read снимок сделан при первом запросе транзакции, и все чтения видят его — 5. На Read Committed каждый запрос берёт свежий снимок и видит зафиксированное изменение сессии B — 15 (неповторяющееся чтение). Если бы сессия A на Repeatable Read попробовала изменить эту строку, получила бы ошибку сериализации.

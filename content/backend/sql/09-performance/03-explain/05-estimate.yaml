title: Ожидание и факт
type: quiz
kind: single
difficulty: 3
pitfall: Большое расхождение ожидаемых и фактических строк в плане — признак устаревшей статистики.
statement: |
  В `EXPLAIN ANALYZE` после массовой загрузки данных видно: `(cost=… rows=12 …) (actual … rows=184000 …)`, и планировщик выбрал `Nested Loop`, который выполняется долго. Что сделать в первую очередь?
options:
  - Добавить ещё индексов на все столбцы
  - Выполнить `ANALYZE` для таблицы, чтобы обновить статистику, и посмотреть план снова
  - Переписать запрос без JOIN
  - Увеличить `LIMIT`
answer: [1]
explanation: |
  Планировщик ожидал 12 строк, а пришло 184 000: он выбирал план по неверной статистике — вложенный цикл хорош для десятка строк и ужасен для сотен тысяч. После массовой загрузки статистика ещё не собрана; `ANALYZE таблица` её обновляет, и план обычно исправляется сам.

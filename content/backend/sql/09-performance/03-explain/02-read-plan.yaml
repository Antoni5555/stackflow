title: Что делает план
type: quiz
kind: single
difficulty: 2
pitfall: План читают изнутри наружу; Filter — проверка каждой прочитанной строки, Index Cond — поиск по индексу.
statement: |
  Что делает база по этому плану?
  ```
   Aggregate  (cost=4276.50..4276.51 rows=1 width=8)
     ->  Seq Scan on page_views  (cost=0.00..4274.00 rows=1000 width=0)
           Filter: ((viewed_at)::date = '2026-02-01'::date)
  ```
options:
  - Находит по индексу 1000 строк и считает их
  - Читает всю таблицу, у каждой строки вычисляет дату и проверяет условие, подошедшие строки считает
  - Считает строки за 4276 миллисекунд
  - Сначала считает все строки, потом фильтрует результат
answer: [1]
explanation: |
  Вложенный узел `Seq Scan` выполняется первым: таблица читается целиком, условие из `Filter` проверяется у каждой строки. Подходящие строки поднимаются в `Aggregate`, который считает `count(*)`. `cost` — условные единицы, а не миллисекунды; `rows=1000` — оценка, сколько строк пройдёт фильтр.

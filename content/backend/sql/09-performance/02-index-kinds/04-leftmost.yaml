title: Левый префикс
type: quiz
kind: multiple
difficulty: 2
pitfall: Составной индекс эффективно работает только для условий, начинающихся с его первого столбца.
statement: |
  Есть индекс `(user_id, status, created_at)` на `orders`. Каким условиям он эффективно помогает найти строки?
options:
  - "`WHERE user_id = 1`"
  - "`WHERE user_id = 1 AND status = 'paid'`"
  - "`WHERE status = 'paid'`"
  - "`WHERE user_id = 1 AND status = 'paid' AND created_at >= '2026-01-01'`"
  - "`WHERE created_at >= '2026-01-01'`"
answer: [0, 1, 3]
explanation: |
  Индекс упорядочен по `user_id`, внутри — по `status`, внутри — по `created_at`. Условия, начинающиеся с `user_id`, находят нужный участок индекса сразу. Без `user_id` значения `status` и `created_at` разбросаны по всему индексу — база может прочитать его целиком, но это уже не поиск.

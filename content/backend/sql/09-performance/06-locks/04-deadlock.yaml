title: Взаимная блокировка
type: quiz
kind: single
difficulty: 3
pitfall: Deadlock возникает, когда транзакции блокируют одни и те же строки в разном порядке.
statement: |
  Две транзакции списывают товары из двух корзин:
  - A: `UPDATE … WHERE id = 1;` затем `UPDATE … WHERE id = 2;`
  - B: `UPDATE … WHERE id = 2;` затем `UPDATE … WHERE id = 1;`

  Иногда одна из них падает с `deadlock detected`. Как надёжно это исправить?
options:
  - Увеличить `deadlock_timeout`
  - Во всех транзакциях менять товары в одном порядке — по возрастанию `id`
  - Перейти на уровень Read Uncommitted
  - Убрать транзакции — каждое списание отдельным запросом
answer: [1]
explanation: |
  A держит товар 1 и ждёт 2, B держит 2 и ждёт 1 — цикл, который база разрывает, прерывая одну из транзакций. Если все берут строки в одном порядке, цикл невозможен: B будет ждать товар 1, ещё ничего не заблокировав. Таймаут лишь меняет, как скоро цикл обнаружат; без транзакций пропадёт атомарность заказа.

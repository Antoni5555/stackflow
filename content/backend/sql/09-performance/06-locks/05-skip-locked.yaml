title: Очередь писем
type: quiz
kind: single
difficulty: 3
pitfall: SKIP LOCKED позволяет нескольким обработчикам брать разные строки очереди без ожидания друг друга.
statement: |
  Таблица `email_queue` — письма на отправку. Три обработчика одновременно берут по 10 писем: `SELECT … ORDER BY id LIMIT 10 FOR UPDATE`. Обработчики работают медленно: второй и третий всё время ждут первого. Что поменять?
options:
  - Убрать `FOR UPDATE` — тогда никто не будет ждать
  - Добавить `SKIP LOCKED` — каждый обработчик возьмёт свободные письма, пропустив занятые
  - Добавить `NOWAIT` — обработчики будут быстрее
  - Поставить уровень Serializable
answer: [1]
explanation: |
  `FOR UPDATE` блокирует первые 10 писем, и остальные обработчики ждут именно их. `SKIP LOCKED` пропускает заблокированные строки: второй получит письма 11–20, третий — 21–30. Без `FOR UPDATE` двое отправят одно и то же письмо, а `NOWAIT` вместо ожидания будет падать с ошибкой.

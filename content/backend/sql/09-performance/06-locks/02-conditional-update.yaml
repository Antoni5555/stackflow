title: Списать, что есть
type: exercise
difficulty: 3
pitfall: Условие наличия — в самом UPDATE; иначе нехватка одной позиции роняет команду, а вычисление в коде теряет параллельные покупки.
statement: |
  Корзина покупателя: по 2 штуки товаров 5, 8 и 9 (проводная мышь, USB-хаб, веб-камера). Спишите по 2 штуки только у тех из них, у кого остаток не меньше 2, и верните `id` и новый `stock` списанных товаров. Порядок строк не важен.

  Запрос из заготовки падает. Исправьте его.
starter_code: |
  UPDATE products
  SET stock = stock - 2
  WHERE id IN (5, 8, 9)
  RETURNING id, stock;
solution: |
  UPDATE products
  SET stock = stock - 2
  WHERE id IN (5, 8, 9) AND stock >= 2
  RETURNING id, stock;
check:
  type: result
  order_matters: false
hints:
  - Сколько USB-хабов на складе?
  - Проверку остатка поставьте в `WHERE` той же команды.
explanation: |
  USB-хабов на складе 0: `stock - 2` нарушает `CHECK (stock >= 0)`, и команда отменяется целиком — не списываются и мыши с камерой. Условие `stock >= 2` в `WHERE` списывает только то, что есть, а `RETURNING` показывает, что именно: приложение сравнит две строки с тремя позициями корзины и решит, что делать с недостающей. При параллельных покупках та же команда безопасна: вторая транзакция дождётся первой и перепроверит условие по новому остатку.

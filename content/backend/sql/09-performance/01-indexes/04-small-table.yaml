title: Индекс есть, а Seq Scan
type: quiz
kind: single
difficulty: 2
pitfall: На маленькой таблице чтение подряд дешевле индекса, и планировщик это знает.
statement: |
  На таблицу `categories` (9 строк) создали индекс по `parent_id`, но `EXPLAIN SELECT * FROM categories WHERE parent_id = 2` всё равно показывает `Seq Scan`. Почему?
options:
  - Индекс создан с ошибкой — его нужно пересоздать
  - Планировщик считает, что прочитать 9 строк подряд дешевле, чем идти через индекс
  - PostgreSQL не использует индексы для столбцов, которые могут быть NULL
  - Индекс начнёт работать только после перезапуска базы
answer: [1]
explanation: |
  Девять строк лежат на одной странице диска: прочитать её целиком — одно действие, а через индекс — чтение индекса плюс чтение той же страницы. Планировщик оценивает стоимость и выбирает дешёвый путь. Индекс понадобится, когда строк станет много; проверять его работу нужно на реальном объёме.

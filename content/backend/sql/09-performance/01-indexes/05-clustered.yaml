title: Кластеризованный индекс
type: quiz
kind: single
difficulty: 3
pitfall: «Кластеризованный индекс» — понятие MySQL и SQL Server; в PostgreSQL таблица хранится отдельно от индексов.
statement: |
  В статье про индексы написано: «Первичный ключ автоматически создаёт кластеризованный индекс, который физически упорядочивает строки таблицы». Верно ли это для PostgreSQL?
options:
  - Верно — строки всегда лежат в порядке первичного ключа
  - Неверно — первичный ключ создаёт обычный B-tree, а строки таблицы лежат отдельно и без порядка; `CLUSTER` упорядочивает их один раз
  - Верно, если первичный ключ — `GENERATED ALWAYS AS IDENTITY`
  - Неверно — в PostgreSQL у первичного ключа нет индекса
answer: [1]
explanation: |
  В MySQL (InnoDB) и SQL Server строки хранятся внутри индекса первичного ключа — это и есть «кластеризованный» индекс. В PostgreSQL таблица (heap) хранится отдельно, все индексы, включая первичный ключ, ссылаются на строки по их адресу. Команда `CLUSTER` переписывает таблицу в порядке индекса, но новые и изменённые строки этот порядок не поддерживают.

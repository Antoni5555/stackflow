title: Сортировка из адреса
type: quiz
kind: single
difficulty: 3
pitfall: Параметр — это значение, а не имя столбца; имена берут из белого списка.
statement: |
  Каталог сортирует товары по полю из адреса `?sort=price`. Разработчик пишет `cur.execute("SELECT id, name, price FROM products ORDER BY %s", (sort,))`. Что получится?
options:
  - Товары отсортируются по цене — параметр подставит имя столбца
  - Сортировки по цене не будет — подставится строковая константа `'price'`, одинаковая для всех строк
  - SQL-инъекция — параметр с именем столбца небезопасен
  - Ошибка — в ORDER BY нельзя использовать параметры
answer: [1]
explanation: |
  Параметр — всегда значение: запрос становится `ORDER BY 'price'`, а сортировка по одинаковой константе ничего не меняет. Имя столбца нельзя передать параметром. Правильно — выбрать его из белого списка (`{"price": "price", "name": "name"}.get(sort, "id")`) или собрать через `psycopg.sql.Identifier`. Вставлять `sort` f-строкой нельзя — это инъекция.

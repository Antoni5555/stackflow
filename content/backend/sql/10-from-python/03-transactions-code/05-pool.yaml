title: Зачем пул
type: quiz
kind: multiple
difficulty: 2
pitfall: Соединение с PostgreSQL — отдельный серверный процесс; их число ограничено, а открытие стоит времени.
statement: |
  Что верно про соединения с PostgreSQL и пул соединений?
options:
  - Каждое соединение — отдельный процесс на сервере базы
  - Пул держит открытые соединения и выдаёт их коду на время работы
  - Открывать новое соединение на каждый запрос — так же быстро, как брать из пула
  - Число одновременных соединений ограничено настройкой `max_connections`
  - Пул нужен только для SQLite
answer: [0, 1, 3]
explanation: |
  На каждое соединение PostgreSQL запускает процесс, а подключение требует сети и авторизации — это миллисекунды на каждый раз. Пул открывает соединения заранее и переиспользует их, заодно ограничивая их число в пределах `max_connections` (по умолчанию 100). Для SQLite пул почти не нужен — там нет сервера.

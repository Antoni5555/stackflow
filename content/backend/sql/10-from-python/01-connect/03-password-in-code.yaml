title: Пароль в репозитории
type: fix
difficulty: 1
pitfall: Строка подключения с паролем в коде попадает в git; параметры подключения берут из окружения.
statement: |
  Скрипт работает, но на ревью его не пропустили: пароль от базы записан прямо в коде, а код лежит в публичном репозитории. Берите строку подключения из переменной окружения `DATABASE_URL`.
files:
  stock.py: |
    import psycopg

    DSN = "postgresql://shop:Sup3rSecret@db:5432/shop"

    with psycopg.connect(DSN) as conn:
        count = conn.execute("SELECT count(*) FROM products WHERE stock = 0").fetchone()[0]
        print(f"Нет в наличии: {count}")
check:
  type: rules
  rules:
    - must_not_match: 'Sup3rSecret'
      fail: Пароль всё ещё в коде.
    - must_match: '^[^#\n]*(?:os\.environ\s*\[\s*["'']DATABASE_URL["'']\s*\]|os\.environ\.get\(\s*["'']DATABASE_URL["'']|os\.getenv\(\s*["'']DATABASE_URL["''])'
      fail: Возьмите строку подключения из переменной окружения DATABASE_URL.
    - must_match: '^\s*import\s+os\b|^\s*from\s+os\s+import'
      fail: Для работы с окружением нужен модуль os.
solution:
  stock.py: |
    import os

    import psycopg

    DSN = os.environ["DATABASE_URL"]

    with psycopg.connect(DSN) as conn:
        count = conn.execute("SELECT count(*) FROM products WHERE stock = 0").fetchone()[0]
        print(f"Нет в наличии: {count}")
hints:
  - Где хранят секреты, которые не должны попасть в git?
  - "`os.environ[\"DATABASE_URL\"]`."
explanation: |
  Всё, что попало в git, остаётся в истории навсегда, даже если строку потом удалить, — пароль придётся менять. Строку подключения кладут в переменную окружения (на сервере — в `.env`, который в git не попадает) и читают `os.environ["DATABASE_URL"]`. Квадратные скобки упадут с `KeyError`, если переменной нет, — это лучше, чем молча подключиться не туда.

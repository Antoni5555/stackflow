title: "Покупатели без оплат пропали"
type: exercise
difficulty: 2
pitfall: "filter по связи убирает объекты без подходящих строк; Count(…, filter=Q(…)) считает по условию и оставляет всех."
statement: |
  Отчёт `/buyers/` показывает у каждого покупателя число оплаченных и отправленных заказов. Покупателя без таких заказов (Глеба) в отчёте нет, а нужен — с нулём. Исправьте view: все покупатели по имени.
files:
  models.py: |
    from django.contrib.auth.models import User
    from django.db import models
    from django.utils import timezone


    class Category(models.Model):
        name = models.CharField(max_length=100)

        def __str__(self):
            return self.name


    class Product(models.Model):
        category = models.ForeignKey(
            Category, on_delete=models.PROTECT, related_name="products"
        )
        name = models.CharField(max_length=200)
        price = models.DecimalField(max_digits=10, decimal_places=2)
        stock = models.PositiveIntegerField(default=0)

        def __str__(self):
            return self.name


    class Order(models.Model):
        class Status(models.TextChoices):
            NEW = "new", "Новый"
            PAID = "paid", "Оплачен"
            SHIPPED = "shipped", "Отправлен"
            CANCELLED = "cancelled", "Отменён"

        user = models.ForeignKey(
            User, on_delete=models.PROTECT, related_name="orders"
        )
        number = models.CharField(max_length=20)
        status = models.CharField(
            max_length=10, choices=Status, default=Status.NEW
        )
        created_at = models.DateTimeField(default=timezone.now)

        def __str__(self):
            return self.number


    class OrderItem(models.Model):
        order = models.ForeignKey(
            Order, on_delete=models.CASCADE, related_name="items"
        )
        product = models.ForeignKey(
            Product, on_delete=models.PROTECT, related_name="order_items"
        )
        quantity = models.PositiveIntegerField()
        price = models.DecimalField(max_digits=10, decimal_places=2)


    class Review(models.Model):
        product = models.ForeignKey(
            Product, on_delete=models.CASCADE, related_name="reviews"
        )
        user = models.ForeignKey(User, on_delete=models.CASCADE)
        rating = models.PositiveSmallIntegerField()
  views.py: |
    from django.contrib.auth.models import User
    from django.db.models import Count
    from django.shortcuts import render



    def buyers(request):
        users = (
            User.objects.filter(orders__status__in=["paid", "shipped"])
            .annotate(paid=Count("orders"))
            .order_by("username")
        )
        return render(request, "shop/buyers.html", {"users": users})
  urls.py: |
    from django.urls import path

    from . import views

    urlpatterns = [
        path("buyers/", views.buyers),
    ]
  templates/shop/buyers.html: |
    <ul>
      {% for u in users %}
        <li>{{ u.username }}: {{ u.paid }}</li>
      {% endfor %}
    </ul>

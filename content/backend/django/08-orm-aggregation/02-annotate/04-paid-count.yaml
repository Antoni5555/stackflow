solution:
  views.py: |
    from django.contrib.auth.models import User
    from django.db.models import Count, Q
    from django.shortcuts import render



    def buyers(request):
        paid = Q(orders__status__in=["paid", "shipped"])
        users = User.objects.annotate(
            paid=Count("orders", filter=paid)
        ).order_by("username")
        return render(request, "shop/buyers.html", {"users": users})
check:
  type: django
  tests:
    - code: |
        html = client.get("/buyers/").content.decode()
        assert "gleb: 0" in html
      fail: "Глеб должен быть в отчёте с нулём."
    - code: |
        html = client.get("/buyers/").content.decode()
        for row in ["anna: 2", "boris: 1", "vera: 1"]:
            assert row in html
      fail: "Считаются только оплаченные и отправленные заказы: у Анны 2, у Бориса и Веры по 1."
hints:
  - "Что делает `filter(orders__…)` с покупателями, у которых нет подходящих заказов?"
  - "`Count(\"orders\", filter=Q(orders__status__in=[…]))`."
explanation: |
  `filter(orders__status__in=…)` превращается в `INNER JOIN` с условием — покупатели без подходящих заказов исчезают из выборки целиком. Условие внутри агрегата — `Count("orders", filter=Q(…))`, в SQL `COUNT(…) FILTER (WHERE …)` — считает только подходящие заказы, а `LEFT OUTER JOIN` оставляет всех покупателей: у Глеба `0`.

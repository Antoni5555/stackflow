solution:
  views.py: |
    from django.db.models import Count
    from django.shortcuts import render

    from .models import Product


    def popular(request):
        products = (
            Product.objects.annotate(n=Count("reviews"))
            .filter(n__gte=1)
            .order_by("-n", "id")
        )
        return render(request, "shop/popular.html", {"products": products})
check:
  type: django
  tests:
    - code: |
        html = client.get("/popular/").content.decode()
        assert "Игровая" not in html and "Подставка" not in html
      fail: "Товары без отзывов в блок попадать не должны."
    - code: |
        html = client.get("/popular/").content.decode()
        assert html.index("Беспроводная мышь (3)") < html.index("Ноутбук Aster 14 (1)") < html.index("Коврик для мыши (1)")
      fail: "Порядок — по числу отзывов, при равенстве по id: беспроводная мышь, Aster 14, коврик."
hints:
  - "По аннотации можно фильтровать так же, как по полю."
  - "`.filter(n__gte=1)`."
explanation: |
  Аннотация ведёт себя как поле: `filter(n__gte=1)` после `annotate` Django переводит в `HAVING COUNT("shop_review"."id") >= 1` — условие проверяется после группировки. `filter(reviews__isnull=False)` тоже убрал бы товары без отзывов, но через второй JOIN.

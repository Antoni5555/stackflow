solution:
  views.py: |
    from decimal import Decimal

    from django.db.models import F, Sum
    from django.db.models.functions import Coalesce
    from django.shortcuts import render

    from .models import OrderItem


    def month(request, year, month):
        items = OrderItem.objects.filter(
            order__status__in=["paid", "shipped"],
            order__created_at__year=year,
            order__created_at__month=month,
        )
        revenue = items.aggregate(
            t=Coalesce(Sum(F("price") * F("quantity")), Decimal("0"))
        )["t"]
        return render(request, "shop/month.html", {"revenue": revenue})
check:
  type: django
  tests:
    - code: |
        html = client.get("/month/2026/9/").content.decode()
        assert "Выручка: 0 ₽" in html
      fail: "За сентябрь заказов нет — должно быть «0 ₽», а не «None ₽»."
    - code: |
        html = client.get("/month/2026/11/").content.decode()
        assert "Выручка: 4470 ₽" in html
      fail: "Выручка за ноябрь — 4470 ₽."
hints:
  - "Что возвращает SUM, если строк нет?"
  - "`Coalesce(Sum(…), Decimal(\"0\"))` — ноль того же типа, что сумма денег."
explanation: |
  Агрегаты, кроме `Count`, на пустой выборке дают `NULL` → `None`, и шаблон выводит «None». `Coalesce(Sum(…), Decimal("0"))` подставляет ноль прямо в запросе. Ноль должен быть `Decimal`: с целым `0` Django не знает тип результата — `FieldError: Expression contains mixed types`. Подойдёт и `… ["t"] or 0` в Python.

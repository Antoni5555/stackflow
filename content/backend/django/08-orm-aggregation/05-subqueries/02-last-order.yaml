solution:
  views.py: |
    from django.contrib.auth.models import User
    from django.db.models import OuterRef, Subquery
    from django.shortcuts import render

    from .models import Order


    def customers(request):
        orders = Order.objects.filter(user=OuterRef("pk")).order_by(
            "-created_at"
        )
        users = User.objects.annotate(
            last_number=Subquery(orders.values("number")[:1])
        ).order_by("username")
        return render(request, "shop/customers.html", {"users": users})
check:
  type: django
  tests:
    - code: |
        html = client.get("/customers/").content.decode()
        assert "anna: A-13" in html and "boris: A-14" in html and "vera: A-15" in html
      fail: "Последние заказы: у Анны A-13, у Бориса A-14, у Веры A-15."
    - code: |
        html = client.get("/customers/").content.decode()
        assert "gleb: —" in html
      fail: "У Глеба заказов нет — прочерк."
    - code: |
        o = Order.objects.create(user=User.objects.get(username="anna"), number="A-09")
        Order.objects.filter(pk=o.pk).update(created_at=Order.objects.get(number="A-10").created_at.replace(month=9))
        html = client.get("/customers/").content.decode()
        assert "anna: A-13" in html
      fail: "Последний — по дате заказа, а не по номеру или id."
    - code: |
        with max_queries(1):
            client.get("/customers/")
      fail: "Номер последнего заказа должен приходить в том же запросе — подзапросом."
hints:
  - "В каком порядке подзапрос возвращает заказы?"
  - "`.order_by(\"-created_at\")` у подзапроса."
explanation: |
  `[:1]` берёт первую строку подзапроса, но без `order_by` «первая» — любая: SQLite отдал самый старый заказ. Нужна сортировка `order_by("-created_at")` — тогда `LIMIT 1` вернёт последний. Подзапрос выполняется для каждого покупателя, `OuterRef("pk")` подставляет его `id`; у Глеба строк нет — `None`, шаблон выводит прочерк.

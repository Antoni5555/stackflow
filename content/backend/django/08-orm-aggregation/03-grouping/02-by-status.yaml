title: "Статусы повторяются"
type: exercise
difficulty: 2
pitfall: "order_by по полю вне группировки добавляет его в GROUP BY — группы дробятся."
statement: |
  Блок «Заказы по статусам» на `/statuses/` должен показывать каждый статус один раз с числом заказов, по алфавиту статусов. Сейчас статусы повторяются, а у всех по одному заказу. Исправьте view.
files:
  models.py: |
    from django.contrib.auth.models import User
    from django.db import models
    from django.utils import timezone


    class Category(models.Model):
        name = models.CharField(max_length=100)

        def __str__(self):
            return self.name


    class Product(models.Model):
        category = models.ForeignKey(
            Category, on_delete=models.PROTECT, related_name="products"
        )
        name = models.CharField(max_length=200)
        price = models.DecimalField(max_digits=10, decimal_places=2)
        stock = models.PositiveIntegerField(default=0)

        def __str__(self):
            return self.name


    class Order(models.Model):
        class Status(models.TextChoices):
            NEW = "new", "Новый"
            PAID = "paid", "Оплачен"
            SHIPPED = "shipped", "Отправлен"
            CANCELLED = "cancelled", "Отменён"

        user = models.ForeignKey(
            User, on_delete=models.PROTECT, related_name="orders"
        )
        number = models.CharField(max_length=20)
        status = models.CharField(
            max_length=10, choices=Status, default=Status.NEW
        )
        created_at = models.DateTimeField(default=timezone.now)

        def __str__(self):
            return self.number


    class OrderItem(models.Model):
        order = models.ForeignKey(
            Order, on_delete=models.CASCADE, related_name="items"
        )
        product = models.ForeignKey(
            Product, on_delete=models.PROTECT, related_name="order_items"
        )
        quantity = models.PositiveIntegerField()
        price = models.DecimalField(max_digits=10, decimal_places=2)


    class Review(models.Model):
        product = models.ForeignKey(
            Product, on_delete=models.CASCADE, related_name="reviews"
        )
        user = models.ForeignKey(User, on_delete=models.CASCADE)
        rating = models.PositiveSmallIntegerField()
  views.py: |
    from django.db.models import Count
    from django.shortcuts import render

    from .models import Order


    def statuses(request):
        rows = (
            Order.objects.values("status")
            .annotate(n=Count("id"))
            .order_by("created_at")
        )
        return render(request, "shop/statuses.html", {"rows": rows})
  urls.py: |
    from django.urls import path

    from . import views

    urlpatterns = [
        path("statuses/", views.statuses),
    ]
  templates/shop/statuses.html: |
    <ul>
      {% for row in rows %}
        <li>{{ row.status }}: {{ row.n }}</li>
      {% endfor %}
    </ul>
setup: |
  from datetime import datetime
  from django.utils import timezone

  laptops = Category.objects.create(name="Ноутбуки")
  mice = Category.objects.create(name="Мыши")
  pads = Category.objects.create(name="Коврики")
  aster = Product.objects.create(category=laptops, name="Ноутбук Aster 14", price="64990.00", stock=3)
  mouse = Product.objects.create(category=mice, name="Беспроводная мышь", price="1499.00", stock=40)
  gaming = Product.objects.create(category=mice, name="Игровая мышь", price="3490.00", stock=0)
  pad = Product.objects.create(category=pads, name="Коврик для мыши", price="490.00", stock=25)
  stand = Product.objects.create(category=laptops, name="Подставка для ноутбука", price="2190.00", stock=7)
  anna = User.objects.create_user("anna", "anna@shop.example")
  boris = User.objects.create_user("boris", "boris@shop.example")
  vera = User.objects.create_user("vera", "vera@shop.example")
  gleb = User.objects.create_user("gleb", "gleb@shop.example")
  orders = [
      ("A-10", anna, "shipped", (2026, 10, 3, 14), [(aster, 1), (mouse, 1)]),
      ("A-11", boris, "cancelled", (2026, 10, 12, 9), [(gaming, 1)]),
      ("A-12", vera, "paid", (2026, 10, 28, 19), [(mouse, 2), (pad, 2)]),
      ("A-13", anna, "paid", (2026, 11, 2, 11), [(pad, 1)]),
      ("A-14", boris, "shipped", (2026, 11, 5, 16), [(gaming, 1), (pad, 1)]),
      ("A-15", vera, "new", (2026, 11, 9, 20), [(aster, 1)]),
  ]
  for number, user, status, when, items in orders:
      order = Order.objects.create(
          user=user, number=number, status=status,
          created_at=timezone.make_aware(datetime(*when)),
      )
      for product, qty in items:
          OrderItem.objects.create(order=order, product=product, quantity=qty, price=product.price)
  Review.objects.create(product=mouse, user=anna, rating=5)
  Review.objects.create(product=mouse, user=vera, rating=4)
  Review.objects.create(product=mouse, user=boris, rating=2)
  Review.objects.create(product=aster, user=anna, rating=5)
  Review.objects.create(product=pad, user=vera, rating=4)
solution:
  views.py: |
    from django.db.models import Count
    from django.shortcuts import render

    from .models import Order


    def statuses(request):
        rows = (
            Order.objects.values("status")
            .annotate(n=Count("id"))
            .order_by("status")
        )
        return render(request, "shop/statuses.html", {"rows": rows})
check:
  type: django
  tests:
    - code: |
        html = client.get("/statuses/").content.decode()
        assert html.count("paid:") == 1 and html.count("shipped:") == 1
      fail: "Каждый статус должен быть в списке один раз."
    - code: |
        html = client.get("/statuses/").content.decode()
        assert "paid: 2" in html and "shipped: 2" in html and "new: 1" in html
      fail: "Число заказов в статусе: paid — 2, shipped — 2, new — 1, cancelled — 1."
    - code: |
        html = client.get("/statuses/").content.decode()
        assert html.index("cancelled") < html.index("new") < html.index("paid") < html.index("shipped")
      fail: "Статусы — по алфавиту."
hints:
  - "Посмотрите на GROUP BY в журнале SQL."
  - "`.order_by(\"status\")`."
explanation: |
  `order_by("created_at")` в запросе с группировкой добавляет `created_at` в `GROUP BY`: группа — пара «статус + дата», а даты у всех заказов разные. Сортировать нужно по полю группировки (`status`) или по агрегату (`-n`).

solution:
  views.py: |
    from django.db.models import F, Sum
    from django.shortcuts import render

    from .models import OrderItem


    def top(request):
        paid = OrderItem.objects.filter(order__status__in=["paid", "shipped"])
        rows = (
            paid.values(username=F("order__user__username"))
            .annotate(spent=Sum(F("price") * F("quantity")))
            .order_by("-spent")
        )
        return render(request, "shop/top.html", {"rows": rows})
check:
  type: django
  tests:
    - code: |
        html = client.get("/top/").content.decode()
        assert html.count("anna:") == 1 and html.count("vera:") == 1
      fail: "Каждый покупатель должен быть в отчёте один раз."
    - code: |
        html = client.get("/top/").content.decode()
        assert html.index("anna: 66979 ₽") < html.index("boris: 3980 ₽") < html.index("vera: 3978 ₽")
      fail: "Суммы: Анна — 66979 ₽, Борис — 3980 ₽, Вера — 3978 ₽, от большей к меньшей."
hints:
  - "Что задаёт группу — `values` до `annotate` или после?"
  - "`paid.values(username=F(\"order__user__username\")).annotate(spent=…)`."
explanation: |
  `annotate` до `values` считает сумму для каждой **позиции** (группа — объект `OrderItem`), а `values` потом только выбирает колонки — строк столько же, сколько позиций. `values(username=…)` перед `annotate` задаёт группировку по покупателю: `GROUP BY` по `auth_user.username`, сумма — по всем его позициям.

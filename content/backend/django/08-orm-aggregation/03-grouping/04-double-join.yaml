solution:
  views.py: |
    from django.db.models import Count
    from django.shortcuts import render

    from .models import Product


    def cards(request):
        products = Product.objects.annotate(
            reviews_n=Count("reviews", distinct=True),
            orders_n=Count("order_items", distinct=True),
        ).order_by("id")
        return render(request, "shop/cards.html", {"products": products})
check:
  type: django
  tests:
    - code: |
        html = client.get("/cards/").content.decode()
        assert "Беспроводная мышь: отзывов 3, в заказах 2" in html
      fail: "У беспроводной мыши 3 отзыва и 2 позиции заказов."
    - code: |
        html = client.get("/cards/").content.decode()
        assert "Коврик для мыши: отзывов 1, в заказах 3" in html
        assert "Подставка для ноутбука: отзывов 0, в заказах 0" in html
      fail: "У коврика 1 отзыв и 3 позиции; у подставки — нули."
    - code: |
        with max_queries(1):
            client.get("/cards/")
      fail: "Посчитайте оба числа в одном запросе."
hints:
  - "Сколько строк получается для мыши после двух JOIN: 3 отзыва и 2 позиции?"
  - "`Count(\"reviews\", distinct=True)` и `Count(\"order_items\", distinct=True)`."
explanation: |
  Обе связи присоединяются в один запрос: строки отзывов соединяются с каждой позицией — 3 × 2 = 6, и оба `COUNT` считают эти 6 строк. `distinct=True` превращает счётчик в `COUNT(DISTINCT id)` — каждый отзыв и каждая позиция считаются один раз. Для суммы (`Sum("order_items__quantity")`) `distinct` не поможет — её считают подзапросом.

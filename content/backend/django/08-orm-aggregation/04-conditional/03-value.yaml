solution:
  views.py: |
    from django.db.models import Case, Value, When
    from django.shortcuts import render

    from .models import Product


    def stock(request):
        products = Product.objects.annotate(
            avail=Case(
                When(stock=0, then=Value("нет в наличии")),
                default=Value("в наличии"),
            )
        ).order_by("id")
        return render(request, "shop/stock.html", {"products": products})
check:
  type: django
  tests:
    - code: |
        assert client.get("/stock/").status_code == 200
      fail: "Страница падает: `FieldError: Cannot resolve keyword 'нет в наличии' into field` — строку Django принял за имя поля."
    - code: |
        html = client.get("/stock/").content.decode()
        assert "Игровая мышь — нет в наличии" in html and "Коврик для мыши — в наличии" in html
      fail: "Игровой мыши нет на складе, остальные товары — в наличии."
hints:
  - "Как Django понимает строку в `then` — как текст или как поле?"
  - "`then=Value(\"нет в наличии\")`, `default=Value(\"в наличии\")`."
explanation: |
  В выражениях ORM строка означает имя поля — `then="name"` подставил бы название товара. Поля «нет в наличии» нет — `FieldError`. Текстовую константу оборачивают в `Value(…)`, тогда в SQL она становится `'нет в наличии'`.

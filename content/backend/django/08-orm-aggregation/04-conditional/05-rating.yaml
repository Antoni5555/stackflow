solution:
  views.py: |
    from django.db.models import Avg, Value
    from django.db.models.functions import Coalesce
    from django.shortcuts import render

    from .models import Product


    def rating(request):
        products = Product.objects.annotate(
            rating=Coalesce(Avg("reviews__rating"), Value(0.0))
        ).order_by("-rating", "id")
        return render(request, "shop/rating.html", {"products": products})
check:
  type: django
  tests:
    - code: |
        html = client.get("/rating/").content.decode()
        assert "Игровая мышь: 0,0" in html and "Подставка для ноутбука: 0,0" in html
      fail: "У товаров без отзывов — 0,0, а не пусто."
    - code: |
        html = client.get("/rating/").content.decode()
        assert html.index("Ноутбук Aster 14: 5,0") < html.index("Коврик для мыши: 4,0") < html.index("Игровая мышь: 0,0") < html.index("Подставка")
      fail: "Порядок — по рейтингу от высокого к низкому, товары без отзывов — в конце."
    - code: |
        with max_queries(1) as queries:
            client.get("/rating/")
        assert "COALESCE" in queries[0]["sql"]
      fail: "Подставьте ноль в запросе — через Coalesce, а не в Python или шаблоне."
hints:
  - "`Avg` возвращает дробное число — каким должен быть ноль?"
  - "`Coalesce(Avg(\"reviews__rating\"), Value(0.0))`."
explanation: |
  У товара без отзывов `AVG` — `NULL`, и `floatformat` выводит пустую строку. `Coalesce(Avg(…), Value(0.0))` подставляет `0.0` прямо в запросе, и по нему же идёт сортировка — в PostgreSQL `NULL` при `DESC` стоял бы первым. Ноль должен быть дробным: `Coalesce(Avg(…), 0)` — `FieldError: Expression contains mixed types: FloatField, IntegerField`.

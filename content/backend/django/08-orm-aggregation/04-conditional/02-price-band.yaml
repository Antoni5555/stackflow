  Review.objects.create(product=mouse, user=boris, rating=2)
  Review.objects.create(product=aster, user=anna, rating=5)
  Review.objects.create(product=pad, user=vera, rating=4)
solution:
  views.py: |
    from django.db.models import Case, Value, When
    from django.shortcuts import render

    from .models import Product


    def catalog(request):
        products = Product.objects.annotate(
            band=Case(
                When(price__lt=2000, then=Value("дёшево")),
                When(price__lt=10000, then=Value("средне")),
                default=Value("дорого"),
            )
        ).order_by("price")
        return render(request, "shop/catalog.html", {"products": products})
check:
  type: django
  tests:
    - code: |
        html = client.get("/catalog/").content.decode()
        assert "Коврик для мыши — дёшево" in html and "Беспроводная мышь — дёшево" in html
      fail: "Коврик (490 ₽) и беспроводная мышь (1499 ₽) — «дёшево»."
    - code: |
        html = client.get("/catalog/").content.decode()
        assert "Подставка для ноутбука — средне" in html and "Ноутбук Aster 14 — дорого" in html
      fail: "Подставка (2190 ₽) — «средне», Aster 14 — «дорого»."
hints:
  - "Какая ветка срабатывает для товара за 490 ₽?"
  - "Поменяйте ветки местами: сначала `price__lt=2000`."
explanation: |
  `Case` проверяет `When` сверху вниз и берёт первую подходящую ветку. Коврик дешевле 10000 — первая ветка «средне» срабатывает, до «дёшево» очередь не доходит. Узкое условие ставят первым; тогда вторая ветка ловит только то, что не подошло под первую, и `price__gte=2000` не нужен.

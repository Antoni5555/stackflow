solution:
  models.py: |
    from django.db import models
    from django.urls import reverse
    from django.utils.text import slugify


    class ProductQuerySet(models.QuerySet):
        def in_stock(self):
            return self.filter(stock__gt=0)

        def cheap(self, limit=2000):
            return self.filter(price__lt=limit)


    class Category(models.Model):
        name = models.CharField(max_length=100)

        def __str__(self):
            return self.name


    class Product(models.Model):
        category = models.ForeignKey(
            Category, on_delete=models.PROTECT, related_name="products"
        )
        name = models.CharField(max_length=200)
        slug = models.SlugField(unique=True, blank=True)
        price = models.DecimalField(max_digits=10, decimal_places=2)
        stock = models.PositiveIntegerField(default=0)
        is_active = models.BooleanField(default=True)

        objects = ProductQuerySet.as_manager()

        def __str__(self):
            return self.name

        def save(self, *args, **kwargs):
            if not self.slug:
                self.slug = slugify(self.name, allow_unicode=True)
            super().save(*args, **kwargs)


    class Order(models.Model):
        number = models.CharField(max_length=20, unique=True)
        email = models.EmailField()
        total = models.DecimalField(max_digits=10, decimal_places=2, default=0)

        def __str__(self):
            return self.number


    class OrderItem(models.Model):
        order = models.ForeignKey(
            Order, on_delete=models.CASCADE, related_name="items"
        )
        product = models.ForeignKey(
            Product, on_delete=models.PROTECT, related_name="order_items"
        )
        quantity = models.PositiveIntegerField()
        price = models.DecimalField(max_digits=10, decimal_places=2)
check:
  type: django
  tests:
    - code: |
        r = client.post("/add/", {"name": "Mouse Pad XL", "price": "990.00"})
        assert Product.objects.filter(slug="mouse-pad-xl").exists()
      fail: "Товар должен сохраняться в базе: в save() нет вызова super().save()."
    - code: |
        r = client.post("/add/", {"name": "Коврик XL", "price": "990.00"})
        assert r.content.decode() == "коврик-xl" and Product.objects.filter(slug="коврик-xl").exists()
      fail: "Для русского названия slug — «коврик-xl»: slugify без allow_unicode=True возвращает пустую строку."
    - code: |
        client.post("/add/", {"name": "Коврик XL", "price": "990.00"})
        client.post("/add/", {"name": "Подставка", "price": "1490.00"})
        assert Product.objects.filter(slug="подставка").exists()
      fail: "Второй русский товар тоже должен сохраняться со своим slug."
hints:
  - "Что сохраняет объект в базу, если save() переопределён?"
  - "`slugify(self.name, allow_unicode=True)` и `super().save(*args, **kwargs)` в конце."
explanation: |
  Переопределённый `save()` заменяет родительский: без `super().save(*args, **kwargs)` запроса в базу нет вовсе. `*args, **kwargs` передают дальше то, с чем вызвали `save()` (`create()` передаёт `force_insert`). `slugify` по умолчанию оставляет только латиницу — у «Коврик XL» получится `"xl"`, у «Подставки» — пустая строка; `allow_unicode=True` сохраняет кириллицу.

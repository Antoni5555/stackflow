solution:
  models.py: |
    from django.db import models
    from django.urls import reverse


    class ProductQuerySet(models.QuerySet):
        def in_stock(self):
            return self.filter(stock__gt=0)

        def cheap(self, limit=2000):
            return self.filter(price__lt=limit)


    class ActiveManager(models.Manager):
        def get_queryset(self):
            return super().get_queryset().filter(is_active=True)


    class Category(models.Model):
        name = models.CharField(max_length=100)

        def __str__(self):
            return self.name


    class Product(models.Model):
        category = models.ForeignKey(
            Category, on_delete=models.PROTECT, related_name="products"
        )
        name = models.CharField(max_length=200)
        slug = models.SlugField(unique=True)
        price = models.DecimalField(max_digits=10, decimal_places=2)
        stock = models.PositiveIntegerField(default=0)
        is_active = models.BooleanField(default=True)

        objects = ProductQuerySet.as_manager()
        active = ActiveManager()

        def __str__(self):
            return self.name


    class Order(models.Model):
        number = models.CharField(max_length=20, unique=True)
        email = models.EmailField()
        total = models.DecimalField(max_digits=10, decimal_places=2, default=0)

        def __str__(self):
            return self.number


    class OrderItem(models.Model):
        order = models.ForeignKey(
            Order, on_delete=models.CASCADE, related_name="items"
        )
        product = models.ForeignKey(
            Product, on_delete=models.PROTECT, related_name="order_items"
        )
        quantity = models.PositiveIntegerField()
        price = models.DecimalField(max_digits=10, decimal_places=2)
check:
  type: django
  tests:
    - code: |
        pk = Category.objects.get(name="Мыши").pk
        html = client.get(f"/stock/{pk}/").content.decode()
        assert "Коврик для мыши" in html
      fail: "На складе должны быть все товары категории, включая снятый коврик."
    - code: |
        html = client.get("/showcase/").content.decode()
        assert "Коврик" not in html and "Беспроводная мышь" in html
      fail: "Витрина (Product.active) показывает только активные товары."
hints:
  - "Какой менеджер Django считает менеджером по умолчанию?"
  - "Объявите `objects` первым, `active` — после него."
explanation: |
  Менеджер по умолчанию — первый объявленный в классе. Его использует обратная связь `category.products` (а ещё админка и `dumpdata`), поэтому фильтр `is_active=True` спрятал коврик и там. Первым оставляют неотфильтрованный `objects`, фильтрующие менеджеры — после; `Product.active` продолжит работать.

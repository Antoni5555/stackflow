title: "Свои методы выборки"
type: exercise
difficulty: 2
pitfall: "Методы-условия пишут в QuerySet и подключают as_manager(), тогда они сцепляются."
statement: |
  Views каталога уже используют `Product.objects.in_stock().cheap()` и `Product.objects.filter(…).cheap(5000)`, но у модели таких методов нет — страницы падают. Добавьте в `models.py` свой QuerySet: `in_stock()` — остаток больше нуля, `cheap(limit=2000)` — цена меньше `limit`.
files:

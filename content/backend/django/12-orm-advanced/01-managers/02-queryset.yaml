  views.py: |
    from django.shortcuts import render

    from .models import Product


    def catalog(request):
        products = Product.objects.in_stock().cheap().order_by("name")
        return render(request, "shop/catalog.html", {"products": products})


    def cheap_mice(request):
        products = Product.objects.filter(category__name="Мыши").cheap(5000).order_by("name")
        return render(request, "shop/catalog.html", {"products": products})

solution:
  views.py: |
    from django.core.mail import send_mail
    from django.db import transaction
    from django.http import HttpResponse

    from .models import Order


    def create_order(request):
        number = request.POST["number"]
        try:
            with transaction.atomic():
                Order.objects.create(number=number, email="vera@shop.example")
                transaction.on_commit(
                    lambda: send_mail(f"Заказ {number}", "Спасибо!", "shop@shop.example", ["vera@shop.example"])
                )
                if request.POST.get("fail"):
                    raise ValueError("оплата не прошла")
        except ValueError as e:
            return HttpResponse(str(e), status=400)
        return HttpResponse("ok")
check:
  type: django
  tests:
    - code: |
        from django.core import mail
        from django.test import TestCase
        mail.outbox = []
        with TestCase.captureOnCommitCallbacks(execute=True):
            r = client.post("/orders/create/", {"number": "A-21", "fail": "1"})
        assert r.status_code == 400 and not Order.objects.filter(number="A-21").exists()
        assert len(mail.outbox) == 0
      fail: "Заказ откатился — письма быть не должно: отправляйте его в transaction.on_commit."
    - code: |
        from django.core import mail
        from django.test import TestCase
        mail.outbox = []
        with TestCase.captureOnCommitCallbacks(execute=True):
            r = client.post("/orders/create/", {"number": "A-20"})
        assert r.status_code == 200 and len(mail.outbox) == 1 and mail.outbox[0].subject == "Заказ A-20"
      fail: "Успешный заказ — одно письмо «Заказ A-20»."
hints:
  - "Как выполнить действие только после коммита транзакции?"
  - "`transaction.on_commit(lambda: send_mail(...))` внутри блока."
explanation: |
  Письмо уходит сразу, а откат транзакции его не вернёт. `transaction.on_commit(функция)` откладывает вызов до успешного коммита и забывает о нём при откате. В тестах Django каждый тест — в транзакции, которая не коммитится, поэтому колбэки запускают `captureOnCommitCallbacks(execute=True)`.

title: "Полузаказ"
type: exercise
difficulty: 2
pitfall: "Связанные записи объединяют transaction.atomic(): ошибка посередине откатывает всё."
statement: |
  POST на `/checkout/` оформляет заказ: `number` и `cart` вида `wireless-mouse:2,aster-14:5`. Если на каком-то товаре не хватает остатка, ответ — 400, но заказ уже создан, а остатки первых товаров списаны. Исправьте функцию `place`: при ошибке не должно остаться ни заказа, ни списаний.
files:
  models.py: |
    from django.db import models
    from django.urls import reverse


    class ProductQuerySet(models.QuerySet):
        def in_stock(self):
            return self.filter(stock__gt=0)

        def cheap(self, limit=2000):
            return self.filter(price__lt=limit)


    class Category(models.Model):
        name = models.CharField(max_length=100)

        def __str__(self):
            return self.name


    class Product(models.Model):
        category = models.ForeignKey(
            Category, on_delete=models.PROTECT, related_name="products"
        )
        name = models.CharField(max_length=200)
        slug = models.SlugField(unique=True)
        price = models.DecimalField(max_digits=10, decimal_places=2)
        stock = models.PositiveIntegerField(default=0)
        is_active = models.BooleanField(default=True)

        objects = ProductQuerySet.as_manager()

        def __str__(self):
            return self.name


    class Order(models.Model):
        number = models.CharField(max_length=20, unique=True)
        email = models.EmailField()
        total = models.DecimalField(max_digits=10, decimal_places=2, default=0)

        def __str__(self):
            return self.number


    class OrderItem(models.Model):
        order = models.ForeignKey(
            Order, on_delete=models.CASCADE, related_name="items"
        )
        product = models.ForeignKey(
            Product, on_delete=models.PROTECT, related_name="order_items"
        )
        quantity = models.PositiveIntegerField()
        price = models.DecimalField(max_digits=10, decimal_places=2)
  views.py: |
    from django.db import transaction
    from django.db.models import F
    from django.http import HttpResponse

    from .models import Order, OrderItem, Product


    def checkout(request):
        number = request.POST["number"]
        cart = [line.split(":") for line in request.POST["cart"].split(",")]
        cart = [(slug, int(qty)) for slug, qty in cart]
        try:
            place(number, cart)
        except ValueError as e:
            return HttpResponse(str(e), status=400)
        return HttpResponse("Заказ оформлен")


    def place(number, cart):
        order = Order.objects.create(number=number, email="vera@shop.example")
        for slug, qty in cart:
            product = Product.objects.select_for_update().get(slug=slug)
            if product.stock < qty:
                raise ValueError(f"Нет столько: {product.name}")
            Product.objects.filter(pk=product.pk).update(stock=F("stock") - qty)
            OrderItem.objects.create(order=order, product=product, quantity=qty, price=product.price)

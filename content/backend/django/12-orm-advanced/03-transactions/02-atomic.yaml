solution:
  views.py: |
    from django.db import transaction
    from django.db.models import F
    from django.http import HttpResponse

    from .models import Order, OrderItem, Product


    def checkout(request):
        number = request.POST["number"]
        cart = [line.split(":") for line in request.POST["cart"].split(",")]
        cart = [(slug, int(qty)) for slug, qty in cart]
        try:
            place(number, cart)
        except ValueError as e:
            return HttpResponse(str(e), status=400)
        return HttpResponse("Заказ оформлен")


    def place(number, cart):
        with transaction.atomic():
            order = Order.objects.create(number=number, email="vera@shop.example")
            for slug, qty in cart:
                product = Product.objects.select_for_update().get(slug=slug)
                if product.stock < qty:
                    raise ValueError(f"Нет столько: {product.name}")
                Product.objects.filter(pk=product.pk).update(stock=F("stock") - qty)
                OrderItem.objects.create(order=order, product=product, quantity=qty, price=product.price)
check:
  type: django
  tests:
    - code: |
        r = client.post("/checkout/", {"number": "A-21", "cart": "wireless-mouse:2,aster-14:5"})
        assert r.status_code == 400
        assert not Order.objects.filter(number="A-21").exists()
        assert Product.objects.get(slug="wireless-mouse").stock == 40
      fail: "При нехватке остатка заказа A-21 быть не должно, а мыши — не списаны (40)."
    - code: |
        r = client.post("/checkout/", {"number": "A-20", "cart": "wireless-mouse:2,aster-14:1"})
        assert r.status_code == 200 and Order.objects.get(number="A-20").items.count() == 2
        assert Product.objects.get(slug="wireless-mouse").stock == 38
      fail: "Обычный заказ оформляется: две позиции, остаток мыши 38."
hints:
  - "Как сделать несколько запросов «всё или ничего»?"
  - "`with transaction.atomic():` вокруг всего тела `place`."
explanation: |
  В режиме autocommit каждый запрос фиксируется сразу: заказ и списание первых товаров остаются, даже если на третьем — исключение. `transaction.atomic()` объединяет запросы: исключение внутри блока — `ROLLBACK`. Заодно `select_for_update()` начинает работать (в PostgreSQL — блокирует строки товаров до конца транзакции).

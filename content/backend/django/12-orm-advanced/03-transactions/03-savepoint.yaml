solution:
  views.py: |
    from django.db import IntegrityError, transaction
    from django.http import HttpResponse

    from .models import Promo


    def import_promos(request):
        added = 0
        with transaction.atomic():
            for code in request.POST["codes"].split(","):
                try:
                    with transaction.atomic():
                        Promo.objects.create(code=code, discount=10)
                    added += 1
                except IntegrityError:
                    pass
        return HttpResponse(f"Добавлено: {added}")
check:
  type: django
  tests:
    - code: |
        Promo.objects.create(code="SALE10", discount=10)
        r = client.post("/promos/import/", {"codes": "NEW1,SALE10,NEW2"})
        assert r.content.decode() == "Добавлено: 2"
        assert sorted(Promo.objects.values_list("code", flat=True)) == ["NEW1", "NEW2", "SALE10"]
      fail: "Дубль SALE10 пропускается, NEW1 и NEW2 добавляются: «Добавлено: 2»."
    - code: |
        r = client.post("/promos/import/", {"codes": "A,B"})
        assert r.content.decode() == "Добавлено: 2"
      fail: "Без дублей добавляются все коды."
hints:
  - "Что происходит с транзакцией после ошибки базы внутри atomic()?"
  - "Оберните `create()` во вложенный `with transaction.atomic():` внутри `try`."
explanation: |
  После ошибки базы внутри `atomic()` транзакция помечена как сломанная: следующий запрос — `TransactionManagementError: An error occurred in the current transaction…`. Вложенный `atomic()` — точка сохранения: при `IntegrityError` откатывается только он, внешняя транзакция продолжается.

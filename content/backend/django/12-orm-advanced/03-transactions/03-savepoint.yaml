title: "Дубль ломает импорт"
type: exercise
difficulty: 3
pitfall: "Пойманная ошибка базы внутри atomic() ломает транзакцию; опасную операцию оборачивают во вложенный atomic()."
statement: |
  Импорт промокодов (POST на `/promos/import/`, `codes` через запятую) должен пропускать уже существующие коды и добавлять остальные. Если в списке есть дубль, страница падает с `TransactionManagementError`. Исправьте view: дубли пропускаются, остальные добавляются, ответ — «Добавлено: N».
files:
  models.py: |
    from django.db import models
    from django.urls import reverse


    class ProductQuerySet(models.QuerySet):
        def in_stock(self):
            return self.filter(stock__gt=0)

        def cheap(self, limit=2000):
            return self.filter(price__lt=limit)


    class Category(models.Model):
        name = models.CharField(max_length=100)

        def __str__(self):
            return self.name


    class Product(models.Model):
        category = models.ForeignKey(
            Category, on_delete=models.PROTECT, related_name="products"
        )
        name = models.CharField(max_length=200)
        slug = models.SlugField(unique=True)
        price = models.DecimalField(max_digits=10, decimal_places=2)
        stock = models.PositiveIntegerField(default=0)
        is_active = models.BooleanField(default=True)

        objects = ProductQuerySet.as_manager()

        def __str__(self):
            return self.name


    class Order(models.Model):
        number = models.CharField(max_length=20, unique=True)
        email = models.EmailField()
        total = models.DecimalField(max_digits=10, decimal_places=2, default=0)

        def __str__(self):
            return self.number


    class OrderItem(models.Model):
        order = models.ForeignKey(
            Order, on_delete=models.CASCADE, related_name="items"
        )
        product = models.ForeignKey(
            Product, on_delete=models.PROTECT, related_name="order_items"
        )
        quantity = models.PositiveIntegerField()
        price = models.DecimalField(max_digits=10, decimal_places=2)


    class Promo(models.Model):
        code = models.CharField(max_length=20, unique=True)
        discount = models.PositiveSmallIntegerField()
  views.py: |
    from django.db import IntegrityError, transaction
    from django.http import HttpResponse

    from .models import Promo


    def import_promos(request):
        added = 0
        with transaction.atomic():
            for code in request.POST["codes"].split(","):
                try:
                    Promo.objects.create(code=code, discount=10)
                    added += 1
                except IntegrityError:
                    pass
        return HttpResponse(f"Добавлено: {added}")
  urls.py: |
    from django.urls import path

    from . import views

    urlpatterns = [
        path("promos/import/", views.import_promos, name="import"),
    ]

title: "Продали два, списали один"
type: exercise
difficulty: 2
pitfall: "Прочитать — изменить — сохранить теряет одновременные изменения; уменьшать счётчик нужно в базе через F."
statement: |
  `sell(product)` из `queries.py` списывает один товар. Когда два покупателя оформляют заказ одновременно, каждый со своей копией объекта, со склада уходит только одна единица. Сделайте списание атомарным — одним запросом в базу.
files:
  models.py: |
    from django.db import models


    class Category(models.Model):
        name = models.CharField(max_length=100)

        def __str__(self):
            return self.name


    class Product(models.Model):
        category = models.ForeignKey(
            Category, on_delete=models.PROTECT, related_name="products"
        )
        name = models.CharField(max_length=200)
        slug = models.SlugField(max_length=200, unique=True)
        description = models.TextField(blank=True)
        price = models.DecimalField(max_digits=10, decimal_places=2)
        stock = models.PositiveIntegerField(default=0)
        is_active = models.BooleanField(default=True)
        created_at = models.DateTimeField()

        def __str__(self):
            return self.name
  queries.py: |
    def sell(product):
        product.stock -= 1
        product.save()
  urls.py: |
    from django.urls import path

    urlpatterns = []
setup: |
  from datetime import datetime, timezone as tz
  laptops = Category.objects.create(name="Ноутбуки")
  mice = Category.objects.create(name="Мыши")
  pads = Category.objects.create(name="Коврики")
  rows = [
      (laptops, "Ноутбук Aster 14", "aster-14", "64990.00", 5, True, "2026-03-01"),
      (laptops, "Ноутбук Nimbus Air", "nimbus-air", "54990.00", 0, True, "2026-04-15"),
      (mice, "Беспроводная мышь", "wireless-mouse", "1499.00", 40, True, "2026-01-10"),
      (mice, "Проводная мышь", "wired-mouse", "590.00", 30, False, "2025-11-20"),
      (mice, "Игровая мышь", "gaming-mouse", "3490.00", 3, True, "2026-05-02"),
      (pads, "Коврик для мыши", "mouse-pad", "490.00", 100, True, "2025-12-05"),
  ]
  for cat, name, slug, price, stock, active, day in rows:
      Product.objects.create(
          category=cat, name=name, slug=slug, price=price, stock=stock,
          is_active=active,
          created_at=datetime.fromisoformat(day + "T12:00").replace(tzinfo=tz.utc),
      )
solution:
  queries.py: |
    from django.db.models import F

    from .models import Product


    def sell(product):
        Product.objects.filter(pk=product.pk).update(stock=F("stock") - 1)
check:
  type: django
  tests:
    - code: |
        from shop.queries import sell
        first = Product.objects.get(slug="aster-14")
        second = Product.objects.get(slug="aster-14")
        sell(first)
        sell(second)
        assert Product.objects.get(slug="aster-14").stock == 3
      fail: "Два заказа на копиях одного товара должны списать 2 штуки (было 5, станет 3) — считайте остаток в базе, а не в Python."
    - code: |
        from shop.queries import sell
        product = Product.objects.get(slug="aster-14")
        with max_queries(1):
            sell(product)
      fail: "Списание — одним запросом UPDATE."
hints:
  - "Откуда `product.stock -= 1` берёт текущий остаток — из базы или из объекта, прочитанного раньше?"
  - "`Product.objects.filter(pk=product.pk).update(stock=F(\"stock\") - 1)`."
explanation: |
  Обе копии прочитали остаток 5; каждая уменьшила своё число до 4 и записала 4 — одно списание потерялось. `F("stock") - 1` превращается в `SET stock = stock - 1`: база вычитает из значения, которое в ней прямо сейчас, и два запроса дают 3. К тому же `save()` переписывал все поля, а `update()` трогает только остаток.

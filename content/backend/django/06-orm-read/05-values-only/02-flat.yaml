title: "Список slug для карты сайта"
type: exercise
difficulty: 1
pitfall: "values_list с одним полем без flat=True даёт кортежи из одного элемента."
statement: |
  `active_slugs()` из `queries.py` собирает slug активных товаров для карты сайта, по алфавиту. Генератор карты падает: ему приходят кортежи `("aster-14",)` вместо строк. Верните список строк, загрузив из базы только slug.
files:
  models.py: |
    from django.db import models


    class Category(models.Model):
        name = models.CharField(max_length=100)

        def __str__(self):
            return self.name


    class Product(models.Model):
        category = models.ForeignKey(
            Category, on_delete=models.PROTECT, related_name="products"
        )
        name = models.CharField(max_length=200)
        slug = models.SlugField(max_length=200, unique=True)
        description = models.TextField(blank=True)
        price = models.DecimalField(max_digits=10, decimal_places=2)
        stock = models.PositiveIntegerField(default=0)
        is_active = models.BooleanField(default=True)
        created_at = models.DateTimeField()

        def __str__(self):
            return self.name
  queries.py: |
    from .models import Product


    def active_slugs():
        qs = Product.objects.filter(is_active=True).order_by("slug")
        return list(qs.values_list("slug"))
  urls.py: |
    from django.urls import path

    urlpatterns = []
setup: |
  from datetime import datetime, timezone as tz
  laptops = Category.objects.create(name="Ноутбуки")
  mice = Category.objects.create(name="Мыши")
  pads = Category.objects.create(name="Коврики")
  rows = [
      (laptops, "Ноутбук Aster 14", "aster-14", "64990.00", 5, True, "2026-03-01"),
      (laptops, "Ноутбук Nimbus Air", "nimbus-air", "54990.00", 0, True, "2026-04-15"),
      (mice, "Беспроводная мышь", "wireless-mouse", "1499.00", 40, True, "2026-01-10"),
      (mice, "Проводная мышь", "wired-mouse", "590.00", 30, False, "2025-11-20"),
      (mice, "Игровая мышь", "gaming-mouse", "3490.00", 3, True, "2026-05-02"),
      (pads, "Коврик для мыши", "mouse-pad", "490.00", 100, True, "2025-12-05"),
  ]
  for cat, name, slug, price, stock, active, day in rows:
      Product.objects.create(
          category=cat, name=name, slug=slug, price=price, stock=stock,
          is_active=active,
          created_at=datetime.fromisoformat(day + "T12:00").replace(tzinfo=tz.utc),
      )
solution:
  queries.py: |
    from .models import Product


    def active_slugs():
        qs = Product.objects.filter(is_active=True).order_by("slug")
        return list(qs.values_list("slug", flat=True))
check:
  type: django
  tests:
    - code: |
        from shop.queries import active_slugs
        assert active_slugs() == ["aster-14", "gaming-mouse", "mouse-pad", "nimbus-air", "wireless-mouse"]
      fail: "Нужен список строк slug, а не кортежей."
    - code: |
        from shop.queries import active_slugs
        with max_queries(1) as queries:
            active_slugs()
        sql = queries[0]["sql"]
        assert "slug" in sql and "description" not in sql
      fail: "Загружайте из базы только slug — без остальных колонок."
hints:
  - "Какой параметр `values_list` убирает кортежи для одного поля?"
  - "`values_list(\"slug\", flat=True)`."
explanation: |
  `values_list("slug")` возвращает кортежи — по элементу на каждое перечисленное поле, даже если поле одно. `flat=True` разрешён только для одного поля и отдаёт сами значения. В SQL уходит только колонка `slug` — для карты сайта на тысячи товаров это заметно дешевле полных объектов.

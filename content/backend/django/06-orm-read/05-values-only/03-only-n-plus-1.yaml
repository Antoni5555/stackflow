title: "only() сделал страницу медленнее"
type: exercise
difficulty: 2
pitfall: "Поле, не перечисленное в only(), догружается отдельным запросом на каждый объект."
statement: |
  Чтобы ускорить каталог, разработчик добавил `only("name")`. Теперь страница делает 7 запросов вместо одного. Исправьте view: один запрос, и из базы не грузится описание.
files:
  models.py: |
    from django.db import models


    class Category(models.Model):
        name = models.CharField(max_length=100)

        def __str__(self):
            return self.name


    class Product(models.Model):
        category = models.ForeignKey(
            Category, on_delete=models.PROTECT, related_name="products"
        )
        name = models.CharField(max_length=200)
        slug = models.SlugField(max_length=200, unique=True)
        description = models.TextField(blank=True)
        price = models.DecimalField(max_digits=10, decimal_places=2)
        stock = models.PositiveIntegerField(default=0)
        is_active = models.BooleanField(default=True)
        created_at = models.DateTimeField()

        def __str__(self):
            return self.name
  views.py: |
    from django.shortcuts import render

    from .models import Product


    def catalog(request):
        products = Product.objects.only("name").order_by("id")
        return render(request, "shop/catalog.html", {"products": products})
  urls.py: |
    from django.urls import path

    from . import views

    urlpatterns = [
        path("catalog/", views.catalog),
    ]
  templates/shop/catalog.html: |
    <ul>
      {% for p in products %}<li>{{ p.name }} — {{ p.price }} ₽</li>{% endfor %}
    </ul>
setup: |
  from datetime import datetime, timezone as tz
  laptops = Category.objects.create(name="Ноутбуки")
  mice = Category.objects.create(name="Мыши")
  pads = Category.objects.create(name="Коврики")
  rows = [
      (laptops, "Ноутбук Aster 14", "aster-14", "64990.00", 5, True, "2026-03-01"),
      (laptops, "Ноутбук Nimbus Air", "nimbus-air", "54990.00", 0, True, "2026-04-15"),
      (mice, "Беспроводная мышь", "wireless-mouse", "1499.00", 40, True, "2026-01-10"),
      (mice, "Проводная мышь", "wired-mouse", "590.00", 30, False, "2025-11-20"),
      (mice, "Игровая мышь", "gaming-mouse", "3490.00", 3, True, "2026-05-02"),
      (pads, "Коврик для мыши", "mouse-pad", "490.00", 100, True, "2025-12-05"),
  ]
  for cat, name, slug, price, stock, active, day in rows:
      Product.objects.create(
          category=cat, name=name, slug=slug, price=price, stock=stock,
          is_active=active,
          created_at=datetime.fromisoformat(day + "T12:00").replace(tzinfo=tz.utc),
      )
solution:
  views.py: |
    from django.shortcuts import render

    from .models import Product


    def catalog(request):
        products = Product.objects.only("name", "price").order_by("id")
        return render(request, "shop/catalog.html", {"products": products})
check:
  type: django
  tests:
    - code: |
        html = client.get("/catalog/").content.decode()
        assert "Ноутбук Aster 14 — 64990,00 ₽" in html
      fail: "В каталоге должны быть названия и цены."
    - code: |
        with max_queries(1) as queries:
            client.get("/catalog/")
        assert "description" not in queries[0]["sql"]
      fail: "Цена догружается отдельным запросом на каждый товар — перечислите в only() все поля, которые выводит шаблон (а description не грузите)."
hints:
  - "Какое поле шаблон берёт у товара, кроме названия?"
  - "`only(\"name\", \"price\")`."
explanation: |
  Шаблон выводит `p.price`, а `only("name")` загрузил только `id` и `name`. На каждое обращение к незагруженному полю Django делает `SELECT "id", "price" … WHERE id = …` — шесть товаров, шесть лишних запросов. В `only` перечисляют всё, что используют код и шаблон; если список часто меняется, проще `defer("description")` — исключить только тяжёлое поле.

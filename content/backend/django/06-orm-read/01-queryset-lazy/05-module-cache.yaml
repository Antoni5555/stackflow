title: "Новинки не обновляются"
type: quiz
kind: single
difficulty: 3
pitfall: "Вычисленный QuerySet хранит результат в кэше — если он живёт на уровне модуля, данные устаревают."
statement: |
  В `views.py`:
  ```python
  NEW = Product.objects.filter(is_active=True).order_by("-created_at")[:5]


  def home(request):
      items = list(NEW)
      return render(request, "shop/home.html", {"new": items})
  ```
  Менеджер добавил новый товар, но на главной он не появляется до перезапуска сервера. Почему?
options:
  - "Django кэширует страницы по умолчанию"
  - "`NEW` вычислился при первом запросе и дальше отдаёт строки из своего кэша"
  - "Срез `[:5]` выполняется при импорте модуля"
  - "`order_by(\"-created_at\")` не видит новых записей"
answer: [1]
explanation: |
  QuerySet ленивый, поэтому при импорте ничего не выполнилось. Но объект `NEW` один на весь процесс: первый `list(NEW)` вычислил его и сохранил строки в кэше, и следующие запросы получают их оттуда. QuerySet строят внутри view — каждый запрос получает новый объект и свежие данные.

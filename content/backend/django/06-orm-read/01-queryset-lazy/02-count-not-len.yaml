title: "Счётчик товаров грузит весь каталог"
type: exercise
difficulty: 1
pitfall: "len(qs) загружает все строки ради числа — считать нужно в базе через count()."
statement: |
  Функция `active_count()` из `queries.py` возвращает число активных товаров для шапки сайта. На большом каталоге она медленная: загружает все товары. Пусть число считает база.
files:
  models.py: |
    from django.db import models


    class Category(models.Model):
        name = models.CharField(max_length=100)

        def __str__(self):
            return self.name


    class Product(models.Model):
        category = models.ForeignKey(
            Category, on_delete=models.PROTECT, related_name="products"
        )
        name = models.CharField(max_length=200)
        slug = models.SlugField(max_length=200, unique=True)
        description = models.TextField(blank=True)
        price = models.DecimalField(max_digits=10, decimal_places=2)
        stock = models.PositiveIntegerField(default=0)
        is_active = models.BooleanField(default=True)
        created_at = models.DateTimeField()

        def __str__(self):
            return self.name
  queries.py: |
    from .models import Product


    def active_count():
        return len(Product.objects.filter(is_active=True))
  urls.py: |
    from django.urls import path

    urlpatterns = []
setup: |
  from datetime import datetime, timezone as tz
  laptops = Category.objects.create(name="Ноутбуки")
  mice = Category.objects.create(name="Мыши")
  pads = Category.objects.create(name="Коврики")
  rows = [
      (laptops, "Ноутбук Aster 14", "aster-14", "64990.00", 5, True, "2026-03-01"),
      (laptops, "Ноутбук Nimbus Air", "nimbus-air", "54990.00", 0, True, "2026-04-15"),
      (mice, "Беспроводная мышь", "wireless-mouse", "1499.00", 40, True, "2026-01-10"),
      (mice, "Проводная мышь", "wired-mouse", "590.00", 30, False, "2025-11-20"),
      (mice, "Игровая мышь", "gaming-mouse", "3490.00", 3, True, "2026-05-02"),
      (pads, "Коврик для мыши", "mouse-pad", "490.00", 100, True, "2025-12-05"),
  ]
  for cat, name, slug, price, stock, active, day in rows:
      Product.objects.create(
          category=cat, name=name, slug=slug, price=price, stock=stock,
          is_active=active,
          created_at=datetime.fromisoformat(day + "T12:00").replace(tzinfo=tz.utc),
      )
solution:
  queries.py: |
    from .models import Product


    def active_count():
        return Product.objects.filter(is_active=True).count()
check:
  type: django
  tests:
    - code: |
        from shop.queries import active_count
        assert active_count() == 5
      fail: "Активных товаров в каталоге — 5."
    - code: |
        from shop.queries import active_count
        with max_queries(1) as queries:
            active_count()
        assert "COUNT(*)" in queries[0]["sql"]
      fail: "Число загружается из таблицы целиком — посчитайте строки в базе: count()."
hints:
  - "Какой метод QuerySet выполняет `SELECT COUNT(*)`?"
  - "`Product.objects.filter(is_active=True).count()`."
explanation: |
  `len()` вычисляет QuerySet: загружает все строки, создаёт объекты и только потом считает их в Python. `count()` отправляет `SELECT COUNT(*)` и получает одно число. Если строки всё равно нужны на этой странице, наоборот, лучше вычислить QuerySet один раз и взять `len()` — без второго запроса.

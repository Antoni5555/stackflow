title: "Проверка «есть ли» загружает всё"
type: exercise
difficulty: 1
pitfall: "bool(qs) и len(qs) > 0 загружают строки; для проверки наличия есть exists() — SELECT 1 … LIMIT 1."
statement: |
  `has_out_of_stock()` из `queries.py` проверяет, есть ли товары с нулевым остатком, — для плашки «пополнить склад» в админке. Сделайте проверку без загрузки строк.
files:
  models.py: |
    from django.db import models


    class Category(models.Model):
        name = models.CharField(max_length=100)

        def __str__(self):
            return self.name


    class Product(models.Model):
        category = models.ForeignKey(
            Category, on_delete=models.PROTECT, related_name="products"
        )
        name = models.CharField(max_length=200)
        slug = models.SlugField(max_length=200, unique=True)
        description = models.TextField(blank=True)
        price = models.DecimalField(max_digits=10, decimal_places=2)
        stock = models.PositiveIntegerField(default=0)
        is_active = models.BooleanField(default=True)
        created_at = models.DateTimeField()

        def __str__(self):
            return self.name
  queries.py: |
    from .models import Product


    def has_out_of_stock():
        return len(Product.objects.filter(stock=0)) > 0
  urls.py: |
    from django.urls import path

    urlpatterns = []
setup: |
  from datetime import datetime, timezone as tz
  laptops = Category.objects.create(name="Ноутбуки")
  mice = Category.objects.create(name="Мыши")
  pads = Category.objects.create(name="Коврики")
  rows = [
      (laptops, "Ноутбук Aster 14", "aster-14", "64990.00", 5, True, "2026-03-01"),
      (laptops, "Ноутбук Nimbus Air", "nimbus-air", "54990.00", 0, True, "2026-04-15"),
      (mice, "Беспроводная мышь", "wireless-mouse", "1499.00", 40, True, "2026-01-10"),
      (mice, "Проводная мышь", "wired-mouse", "590.00", 30, False, "2025-11-20"),
      (mice, "Игровая мышь", "gaming-mouse", "3490.00", 3, True, "2026-05-02"),
      (pads, "Коврик для мыши", "mouse-pad", "490.00", 100, True, "2025-12-05"),
  ]
  for cat, name, slug, price, stock, active, day in rows:
      Product.objects.create(
          category=cat, name=name, slug=slug, price=price, stock=stock,
          is_active=active,
          created_at=datetime.fromisoformat(day + "T12:00").replace(tzinfo=tz.utc),
      )
solution:
  queries.py: |
    from .models import Product


    def has_out_of_stock():
        return Product.objects.filter(stock=0).exists()
check:
  type: django
  tests:
    - code: |
        from shop.queries import has_out_of_stock
        assert has_out_of_stock() is True
      fail: "Товар без остатка есть (Nimbus Air) — функция должна вернуть True."
    - code: |
        from shop.queries import has_out_of_stock
        Product.objects.filter(stock=0).update(stock=1)
        assert has_out_of_stock() is False
      fail: "Когда товаров без остатка нет — False."
    - code: |
        from shop.queries import has_out_of_stock
        with max_queries(1) as queries:
            has_out_of_stock()
        assert "LIMIT 1" in queries[0]["sql"]
      fail: "Функция загружает строки — для «есть ли хоть одна» есть exists()."
hints:
  - "Какой метод QuerySet отвечает на вопрос «есть ли хоть одна строка»?"
  - "`Product.objects.filter(stock=0).exists()`."
explanation: |
  `exists()` отправляет `SELECT 1 AS "a" … LIMIT 1` — база останавливается на первой подходящей строке и ничего не передаёт. `len(...) > 0` загружает все строки и объекты. Если строки после проверки всё равно выводятся, проще один раз вычислить QuerySet: `if products:` и цикл по нему же.

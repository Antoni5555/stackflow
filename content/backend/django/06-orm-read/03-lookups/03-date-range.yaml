title: "Последний день апреля потерялся"
type: exercise
difficulty: 2
pitfall: "range для DateTimeField с датами заканчивается в полночь последнего дня — его товары не попадают."
statement: |
  `april_novelties()` из `queries.py` возвращает slug товаров, добавленных в апреле 2026 (по московскому времени). Товар, добавленный 30 апреля днём, в список не попадает. Исправьте условие.
files:
  models.py: |
    from django.db import models


    class Category(models.Model):
        name = models.CharField(max_length=100)

        def __str__(self):
            return self.name


    class Product(models.Model):
        category = models.ForeignKey(
            Category, on_delete=models.PROTECT, related_name="products"
        )
        name = models.CharField(max_length=200)
        slug = models.SlugField(max_length=200, unique=True)
        description = models.TextField(blank=True)
        price = models.DecimalField(max_digits=10, decimal_places=2)
        stock = models.PositiveIntegerField(default=0)
        is_active = models.BooleanField(default=True)
        created_at = models.DateTimeField()

        def __str__(self):
            return self.name
  queries.py: |
    from .models import Product


    def april_novelties():
        qs = Product.objects.filter(created_at__range=("2026-04-01", "2026-04-30"))
        return sorted(qs.values_list("slug", flat=True))
  urls.py: |
    from django.urls import path

    urlpatterns = []
setup: |
  from datetime import datetime, timezone as tz
  laptops = Category.objects.create(name="Ноутбуки")
  mice = Category.objects.create(name="Мыши")
  pads = Category.objects.create(name="Коврики")
  rows = [
      (laptops, "Ноутбук Aster 14", "aster-14", "64990.00", 5, True, "2026-03-01"),
      (laptops, "Ноутбук Nimbus Air", "nimbus-air", "54990.00", 0, True, "2026-04-15"),
      (mice, "Беспроводная мышь", "wireless-mouse", "1499.00", 40, True, "2026-01-10"),
      (mice, "Проводная мышь", "wired-mouse", "590.00", 30, False, "2025-11-20"),
      (mice, "Игровая мышь", "gaming-mouse", "3490.00", 3, True, "2026-05-02"),
      (pads, "Коврик для мыши", "mouse-pad", "490.00", 100, True, "2025-12-05"),
  ]
  for cat, name, slug, price, stock, active, day in rows:
      Product.objects.create(
          category=cat, name=name, slug=slug, price=price, stock=stock,
          is_active=active,
          created_at=datetime.fromisoformat(day + "T12:00").replace(tzinfo=tz.utc),
      )
  Product.objects.create(
      category=mice, name="Хаб", slug="april-hub", price="990.00",
      created_at=datetime(2026, 4, 30, 12, 0, tzinfo=tz.utc),
  )
solution:
  queries.py: |
    from .models import Product


    def april_novelties():
        qs = Product.objects.filter(
            created_at__date__range=("2026-04-01", "2026-04-30")
        )
        return sorted(qs.values_list("slug", flat=True))
check:
  type: django
  tests:
    - code: |
        from shop.queries import april_novelties
        assert april_novelties() == ["april-hub", "nimbus-air"]
      fail: "Товар от 30 апреля (april-hub) должен попасть: сравнивайте даты, а не момент «30 апреля 00:00»."
hints:
  - "До какого момента идёт диапазон `(\"2026-04-01\", \"2026-04-30\")` для `DateTimeField`?"
  - "Сравните дату: `created_at__date__range=(\"2026-04-01\", \"2026-04-30\")` (или `__lt` на 1 мая)."
explanation: |
  Для `DateTimeField` строка `"2026-04-30"` — это 30 апреля 00:00, поэтому `BETWEEN` останавливается в полночь последнего дня. `__date` берёт дату по часовому поясу сайта, и `range` дат включает весь день 30 апреля. Вариант для больших таблиц, который использует индекс по колонке, — `created_at__gte="2026-04-01", created_at__lt="2026-05-01"`.

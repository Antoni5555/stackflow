<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fig-ah"/></marker></defs>
<text x="380" y="24" text-anchor="middle" class="fig-cs">/orders/1/ (A-12, свой)</text>
<text x="660" y="24" text-anchor="middle" class="fig-cs">/orders/3/ (A-13, Бориса)</text>
<rect x="20" y="40" width="250" height="40" rx="12" class="fig-box2"/>
<text x="145.0" y="65.0" text-anchor="middle" class="fig-cs">LoginRequiredMixin</text>
<rect x="290" y="40" width="180" height="40" rx="12" class="fig-ok"/>
<text x="380.0" y="65.0" text-anchor="middle" class="fig-cs">200</text>
<rect x="490" y="40" width="340" height="40" rx="12" class="fig-err"/>
<text x="660.0" y="65.0" text-anchor="middle" class="fig-cs">200 — уязвимость</text>
<rect x="20" y="96" width="250" height="40" rx="12" class="fig-box2"/>
<text x="145.0" y="121.0" text-anchor="middle" class="fig-cs">get_queryset: user=request.user</text>
<rect x="290" y="96" width="180" height="40" rx="12" class="fig-ok"/>
<text x="380.0" y="121.0" text-anchor="middle" class="fig-cs">200</text>
<rect x="490" y="96" width="340" height="40" rx="12" class="fig-ok"/>
<text x="660.0" y="121.0" text-anchor="middle" class="fig-cs">404</text>
<rect x="20" y="152" width="250" height="40" rx="12" class="fig-box2"/>
<text x="145.0" y="177.0" text-anchor="middle" class="fig-cs">UserPassesTestMixin</text>
<rect x="290" y="152" width="180" height="40" rx="12" class="fig-ok"/>
<text x="380.0" y="177.0" text-anchor="middle" class="fig-cs">200</text>
<rect x="490" y="152" width="340" height="40" rx="12" class="fig-box"/>
<text x="660.0" y="177.0" text-anchor="middle" class="fig-cs">403</text>
<text x="20" y="236" text-anchor="start" class="fig-t">404 не раскрывает, что заказ существует; 403 — подтверждает.</text>

title: "403 или 404"
type: quiz
kind: single
difficulty: 2
pitfall: "Для чужих личных объектов отвечают 404 — 403 подтверждает, что объект существует."
statement: |
  Анна открывает `/orders/3/` — заказ Бориса. Какой ответ лучше и почему?
options:
  - "200 — Анна вошла на сайт"
  - "403 — честно сказать, что доступа нет"
  - "404 — для Анны чужого заказа «не существует», и номер заказа не подтверждается"
  - "302 — отправить на страницу входа"
answer: [2]
explanation: |
  403 сообщает «заказ 3 есть, но не ваш» — подтверждает существование и позволяет перебором узнать число заказов. 404 не отличает «нет» от «чужое». Его даёт поиск среди своих (`filter(user=request.user)`). 403 уместен, когда объект и так виден (товар), а запрещено действие.

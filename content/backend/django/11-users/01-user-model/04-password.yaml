title: "Пароль не подходит"
type: fix
difficulty: 1
pitfall: "Пароль хранят хешем: create_user() или set_password(), а не запись в поле password."
statement: |
  Покупатели регистрируются, но потом не могут войти с тем же паролем, а в базе в колонке `password` видны пароли открытым текстом. Исправьте view.
files:
  shop/views.py: |
    from django.contrib.auth.models import User
    from django.shortcuts import redirect


    def signup(request):
        User.objects.create(
            username=request.POST["username"],
            password=request.POST["password"],
        )
        return redirect("login")
check:
  type: rules
  rules:
    - must_not_match: 'objects\.create\('
      fail: "objects.create() записывает пароль в поле как есть — без хеша."
    - must_match: '^\s*User\.objects\.create_user\(|^\s*\w+\.set_password\('
      fail: "Создайте пользователя через create_user() (или задайте пароль set_password())."
solution:
  shop/views.py: |
    from django.contrib.auth.models import User
    from django.shortcuts import redirect


    def signup(request):
        User.objects.create_user(
            username=request.POST["username"],
            password=request.POST["password"],
        )
        return redirect("login")
hints:
  - "Какой метод менеджера пользователя хеширует пароль?"
  - "`User.objects.create_user(username=…, password=…)`."
explanation: |
  `objects.create(password=…)` записывает строку в колонку как есть: пароль открыт, а `check_password()` при входе ждёт хеш `алгоритм$итерации$соль$хеш` и не совпадает. `create_user()` вызывает `set_password()` — хеш вычисляется, вход работает. Ещё лучше — `UserCreationForm`: она проверит совпадение паролей и валидаторы.

title: "Ссылка для менеджеров"
type: exercise
difficulty: 1
pitfall: "В шаблоне права проверяют через perms.<приложение>.<право>."
statement: |
  В меню `/menu/` ссылку «Цены» должны видеть только пользователи с правом `shop.change_product`. Сейчас её видят все. Исправьте шаблон.
files:
  models.py: |
    from django.contrib.auth.models import User
    from django.db import models


    class Product(models.Model):
        name = models.CharField(max_length=200)
        slug = models.SlugField(unique=True)
        price = models.DecimalField(max_digits=10, decimal_places=2)

        def __str__(self):
            return self.name


    class Order(models.Model):
        user = models.ForeignKey(
            User, on_delete=models.PROTECT, related_name="orders"
        )
        number = models.CharField(max_length=20, unique=True)
        total = models.DecimalField(max_digits=10, decimal_places=2)

        def __str__(self):
            return self.number
  views.py: |
    from django.shortcuts import render


    def menu(request):
        return render(request, "shop/menu.html")
  urls.py: |
    from django.urls import path

    from . import views

    urlpatterns = [
        path("menu/", views.menu, name="menu"),
    ]
  templates/shop/menu.html: |
    <nav>
      <a href="/catalog/">Каталог</a>
      <a href="/manage/prices/">Цены</a>
    </nav>
setup: |
  from django.contrib.auth.models import Group, Permission
  Product.objects.create(name="Ноутбук Aster 14", slug="aster-14", price="64990.00")
  Product.objects.create(name="Беспроводная мышь", slug="wireless-mouse", price="1499.00")
  anna = User.objects.create_user("anna", "anna@shop.example", "anna-pass-1")
  boris = User.objects.create_user("boris", "boris@shop.example", "boris-pass-1")
  olga = User.objects.create_user("olga", "olga@shop.example", "olga-pass-1")
  managers = Group.objects.create(name="Менеджеры")
  managers.permissions.add(Permission.objects.get(codename="change_product"))
  olga.groups.add(managers)
  Order.objects.create(user=anna, number="A-12", total="66489.00")
  Order.objects.create(user=anna, number="A-14", total="3490.00")
  Order.objects.create(user=boris, number="A-13", total="980.00")
solution:
  templates/shop/menu.html: |
    <nav>
      <a href="/catalog/">Каталог</a>
      {% if perms.shop.change_product %}<a href="/manage/prices/">Цены</a>{% endif %}
    </nav>
check:
  type: django
  tests:
    - code: |
        client.force_login(User.objects.get(username="anna"))
        html = client.get("/menu/").content.decode()
        assert "Цены" not in html and "Каталог" in html
      fail: "Покупательница Анна не должна видеть ссылку «Цены»."
    - code: |
        assert "Цены" not in client.get("/menu/").content.decode()
      fail: "Гость тоже не видит ссылку."
    - code: |
        client.force_login(User.objects.get(username="olga"))
        assert "Цены" in client.get("/menu/").content.decode()
      fail: "Менеджер Ольга видит ссылку «Цены»."
hints:
  - "Какая переменная шаблона знает права пользователя?"
  - "`{% if perms.shop.change_product %}…{% endif %}`."
explanation: |
  Контекст-процессор `auth` кладёт в каждый шаблон `user` и `perms`; `perms.shop.change_product` — то же, что `user.has_perm("shop.change_product")`. Скрытая ссылка — только удобство: сама страница `/manage/prices/` должна проверять право во view.

title: "Снова просят войти"
type: exercise
difficulty: 2
pitfall: "permission_required без raise_exception отправляет на вход даже вошедшего; для него нужен 403."
statement: |
  Страница `/manage/prices/` — только для тех, у кого есть право `shop.change_product`. Покупательница Анна уже вошла, но при открытии её снова отправляет на страницу входа. Сделайте так: гость — на вход, вошедший без права — 403.
files:
  models.py: |
    from django.contrib.auth.models import User
    from django.db import models


    class Product(models.Model):
        name = models.CharField(max_length=200)
        slug = models.SlugField(unique=True)
        price = models.DecimalField(max_digits=10, decimal_places=2)

        def __str__(self):
            return self.name


    class Order(models.Model):
        user = models.ForeignKey(
            User, on_delete=models.PROTECT, related_name="orders"
        )
        number = models.CharField(max_length=20, unique=True)
        total = models.DecimalField(max_digits=10, decimal_places=2)

        def __str__(self):
            return self.number
  views.py: |
    from django.contrib.auth.decorators import permission_required
    from django.http import HttpResponse


    @permission_required("shop.change_product")
    def manage_prices(request):
        return HttpResponse("цены")
  urls.py: |
    from django.urls import path

    from . import views

    urlpatterns = [
        path("manage/prices/", views.manage_prices, name="prices"),
    ]
setup: |
  from django.contrib.auth.models import Group, Permission
  Product.objects.create(name="Ноутбук Aster 14", slug="aster-14", price="64990.00")
  Product.objects.create(name="Беспроводная мышь", slug="wireless-mouse", price="1499.00")
  anna = User.objects.create_user("anna", "anna@shop.example", "anna-pass-1")
  boris = User.objects.create_user("boris", "boris@shop.example", "boris-pass-1")
  olga = User.objects.create_user("olga", "olga@shop.example", "olga-pass-1")
  managers = Group.objects.create(name="Менеджеры")
  managers.permissions.add(Permission.objects.get(codename="change_product"))
  olga.groups.add(managers)
  Order.objects.create(user=anna, number="A-12", total="66489.00")
  Order.objects.create(user=anna, number="A-14", total="3490.00")
  Order.objects.create(user=boris, number="A-13", total="980.00")
solution:
  views.py: |
    from django.contrib.auth.decorators import login_required, permission_required
    from django.http import HttpResponse


    @login_required
    @permission_required("shop.change_product", raise_exception=True)
    def manage_prices(request):
        return HttpResponse("цены")
check:
  type: django
  tests:
    - code: |
        client.force_login(User.objects.get(username="anna"))
        assert client.get("/manage/prices/").status_code == 403
      fail: "Вошедшей Анне без права нужно отвечать 403, а не отправлять на вход."
    - code: |
        r = client.get("/manage/prices/")
        assert r.status_code == 302 and r["Location"].startswith("/accounts/login/")
      fail: "Гостя — на страницу входа."
    - code: |
        client.force_login(User.objects.get(username="olga"))
        assert client.get("/manage/prices/").status_code == 200
      fail: "Менеджер Ольга (группа «Менеджеры») — допускается."
hints:
  - "Какой параметр permission_required включает ответ 403?"
  - "`@login_required` над `@permission_required(\"shop.change_product\", raise_exception=True)`."
explanation: |
  `@permission_required` по умолчанию при отказе всегда ведёт на `LOGIN_URL` — и вошедший попадает в круг «войдите ещё раз». `raise_exception=True` вызывает `PermissionDenied` → 403, но тогда и гость получил бы 403; поэтому сверху — `@login_required`: гостя он перенаправит на вход раньше проверки права.

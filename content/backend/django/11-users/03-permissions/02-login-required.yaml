title: "500 у гостя"
type: exercise
difficulty: 1
pitfall: "У AnonymousUser нет связей пользователя; страницы для вошедших закрывают login_required."
statement: |
  Страница «Мои заказы» `/orders/` у вошедшего работает, а у гостя падает с ошибкой 500 (`'AnonymousUser' object has no attribute 'orders'`). Сделайте так, чтобы гостя отправляло на вход (`/accounts/login/`) с возвратом на эту страницу.
files:
  models.py: |
    from django.contrib.auth.models import User
    from django.db import models


    class Product(models.Model):
        name = models.CharField(max_length=200)
        slug = models.SlugField(unique=True)
        price = models.DecimalField(max_digits=10, decimal_places=2)

        def __str__(self):
            return self.name


    class Order(models.Model):
        user = models.ForeignKey(
            User, on_delete=models.PROTECT, related_name="orders"
        )
        number = models.CharField(max_length=20, unique=True)
        total = models.DecimalField(max_digits=10, decimal_places=2)

        def __str__(self):
            return self.number
  views.py: |
    from django.shortcuts import render


    def orders(request):
        orders = request.user.orders.order_by("number")
        return render(request, "shop/orders.html", {"orders": orders})
  urls.py: |
    from django.urls import path

    from . import views

    urlpatterns = [
        path("orders/", views.orders, name="orders"),
    ]
  templates/shop/orders.html: |
    <ul>{% for o in orders %}<li>{{ o.number }}</li>{% endfor %}</ul>
setup: |
  from django.contrib.auth.models import Group, Permission
  Product.objects.create(name="Ноутбук Aster 14", slug="aster-14", price="64990.00")
  Product.objects.create(name="Беспроводная мышь", slug="wireless-mouse", price="1499.00")
  anna = User.objects.create_user("anna", "anna@shop.example", "anna-pass-1")
  boris = User.objects.create_user("boris", "boris@shop.example", "boris-pass-1")
  olga = User.objects.create_user("olga", "olga@shop.example", "olga-pass-1")
  managers = Group.objects.create(name="Менеджеры")
  managers.permissions.add(Permission.objects.get(codename="change_product"))
  olga.groups.add(managers)
  Order.objects.create(user=anna, number="A-12", total="66489.00")
  Order.objects.create(user=anna, number="A-14", total="3490.00")
  Order.objects.create(user=boris, number="A-13", total="980.00")
solution:
  views.py: |
    from django.contrib.auth.decorators import login_required
    from django.shortcuts import render


    @login_required
    def orders(request):
        orders = request.user.orders.order_by("number")
        return render(request, "shop/orders.html", {"orders": orders})
check:
  type: django
  tests:
    - code: |
        r = client.get("/orders/")
        assert r.status_code == 302 and r["Location"] == "/accounts/login/?next=/orders/"
      fail: "Гостя нужно перенаправить на /accounts/login/?next=/orders/."
    - code: |
        client.force_login(User.objects.get(username="anna"))
        html = client.get("/orders/").content.decode()
        assert "A-12" in html and "A-14" in html and "A-13" not in html
      fail: "Вошедшая Анна видит свои заказы."
hints:
  - "Какой декоратор пускает только вошедших?"
  - "`@login_required` из `django.contrib.auth.decorators`."
explanation: |
  Для гостя `request.user` — `AnonymousUser`: у него нет id, заказов и связей, отсюда `AttributeError`. `@login_required` проверяет `is_authenticated` до view и перенаправляет на `LOGIN_URL` с `?next=` — после входа пользователь вернётся на `/orders/`.

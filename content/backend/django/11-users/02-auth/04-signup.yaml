    <form method="post">{% csrf_token %}{{ form.as_p }}<button>Зарегистрироваться</button></form>
setup: |
  from django.contrib.auth.models import Group, Permission
  Product.objects.create(name="Ноутбук Aster 14", slug="aster-14", price="64990.00")
  Product.objects.create(name="Беспроводная мышь", slug="wireless-mouse", price="1499.00")
  anna = User.objects.create_user("anna", "anna@shop.example", "anna-pass-1")
  boris = User.objects.create_user("boris", "boris@shop.example", "boris-pass-1")
  olga = User.objects.create_user("olga", "olga@shop.example", "olga-pass-1")
  managers = Group.objects.create(name="Менеджеры")
  managers.permissions.add(Permission.objects.get(codename="change_product"))
  olga.groups.add(managers)
  Order.objects.create(user=anna, number="A-12", total="66489.00")
  Order.objects.create(user=anna, number="A-14", total="3490.00")
  Order.objects.create(user=boris, number="A-13", total="980.00")
solution:
  views.py: |
    from django.contrib.auth import login
    from django.contrib.auth.forms import UserCreationForm
    from django.contrib.auth.models import User
    from django.http import HttpResponse
    from django.shortcuts import redirect, render


    def signup(request):
        form = UserCreationForm(request.POST or None)
        if request.method == "POST" and form.is_valid():
            user = form.save()
            login(request, user)
            return redirect("me")
        return render(request, "shop/signup.html", {"form": form})


    def me(request):
        if request.user.is_authenticated:
            return HttpResponse(f"Вы вошли как {request.user.username}")
        return HttpResponse("Гость")
check:
  type: django
  tests:
    - code: |
        from django.contrib.auth import authenticate
        r = client.post("/signup/", {"username": "vera", "password1": "vera-pass-1", "password2": "vera-pass-1"})
        assert r.status_code == 302 and client.get("/me/").content.decode() == "Вы вошли как vera"
        assert authenticate(username="vera", password="vera-pass-1") is not None
      fail: "После регистрации пользователь должен войти, а пароль — подходить для входа (храниться хешем)."
    - code: |
        r = client.post("/signup/", {"username": "vera", "password1": "vera-pass-1", "password2": "other"})
        assert r.status_code == 200 and "Введенные пароли не совпадают." in r.content.decode()
        assert not User.objects.filter(username="vera").exists()
      fail: "При разных паролях — ошибка «Введенные пароли не совпадают.», пользователь не создаётся."
    - code: |
        r = client.post("/signup/", {"username": "anna", "password1": "x-pass-123", "password2": "x-pass-123"})
        assert "Пользователь с таким именем уже существует." in r.content.decode()
      fail: "Занятое имя — ошибка «Пользователь с таким именем уже существует.»."
hints:
  - "Какая готовая форма Django регистрирует пользователя?"
  - "`form = UserCreationForm(request.POST or None)`, `form.is_valid()`, `user = form.save()`, `login(request, user)`."
explanation: |
  `UserCreationForm` — ModelForm пользователя с двумя полями пароля: проверяет уникальность имени, совпадение паролей и `AUTH_PASSWORD_VALIDATORS`, а `save()` вызывает `set_password()` — в базе хеш. `objects.create(password=…)` пишет пароль как есть, и `authenticate` его не принимает.

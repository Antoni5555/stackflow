title: "Регистрация"
type: exercise
difficulty: 2
pitfall: "UserCreationForm проверяет имя и пароли и сохраняет пароль хешем."
statement: |
  Регистрация `/signup/` принимает `username`, `password1`, `password2`. Сейчас пароль сохраняется открытым текстом (войти потом нельзя), а разные пароли и занятое имя не проверяются. Перепишите view на `UserCreationForm`: при ошибках — та же страница с ошибками, при успехе — вход и переход на `/me/`.
files:
  models.py: |
    from django.contrib.auth.models import User
    from django.db import models


    class Product(models.Model):
        name = models.CharField(max_length=200)
        slug = models.SlugField(unique=True)
        price = models.DecimalField(max_digits=10, decimal_places=2)

        def __str__(self):
            return self.name


    class Order(models.Model):
        user = models.ForeignKey(
            User, on_delete=models.PROTECT, related_name="orders"
        )
        number = models.CharField(max_length=20, unique=True)
        total = models.DecimalField(max_digits=10, decimal_places=2)

        def __str__(self):
            return self.number
  views.py: |
    from django.contrib.auth import login
    from django.contrib.auth.models import User
    from django.http import HttpResponse
    from django.shortcuts import redirect, render


    def signup(request):
        if request.method == "POST":
            user = User.objects.create(
                username=request.POST["username"],
                password=request.POST["password1"],
            )
            login(request, user)
            return redirect("me")
        return render(request, "shop/signup.html", {"form": None})


    def me(request):
        if request.user.is_authenticated:
            return HttpResponse(f"Вы вошли как {request.user.username}")
        return HttpResponse("Гость")
  urls.py: |
    from django.urls import path

    from . import views

    urlpatterns = [
        path("signup/", views.signup, name="signup"),
        path("me/", views.me, name="me"),
    ]

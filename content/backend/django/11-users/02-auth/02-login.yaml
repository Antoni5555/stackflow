  Product.objects.create(name="Ноутбук Aster 14", slug="aster-14", price="64990.00")
  Product.objects.create(name="Беспроводная мышь", slug="wireless-mouse", price="1499.00")
  anna = User.objects.create_user("anna", "anna@shop.example", "anna-pass-1")
  boris = User.objects.create_user("boris", "boris@shop.example", "boris-pass-1")
  olga = User.objects.create_user("olga", "olga@shop.example", "olga-pass-1")
  managers = Group.objects.create(name="Менеджеры")
  managers.permissions.add(Permission.objects.get(codename="change_product"))
  olga.groups.add(managers)
  Order.objects.create(user=anna, number="A-12", total="66489.00")
  Order.objects.create(user=anna, number="A-14", total="3490.00")
  Order.objects.create(user=boris, number="A-13", total="980.00")
solution:
  views.py: |
    from django.contrib.auth import authenticate, login
    from django.http import HttpResponse
    from django.shortcuts import redirect, render


    def sign_in(request):
        error = ""
        if request.method == "POST":
            user = authenticate(
                request,
                username=request.POST["username"],
                password=request.POST["password"],
            )
            if user is None:
                error = "Неверное имя или пароль."
            else:
                login(request, user)
                return redirect("me")
        return render(request, "shop/login.html", {"error": error})


    def me(request):
        if request.user.is_authenticated:
            return HttpResponse(f"Вы вошли как {request.user.username}")
        return HttpResponse("Гость")
check:
  type: django
  tests:
    - code: |
        r = client.post("/login/", {"username": "anna", "password": "anna-pass-1"})
        assert r.status_code == 302
        assert client.get("/me/").content.decode() == "Вы вошли как anna"
      fail: "После верного пароля пользователь должен быть в сессии: на /me/ — «Вы вошли как anna»."
    - code: |
        r = client.post("/login/", {"username": "anna", "password": "wrong"})
        assert "Неверное имя или пароль." in r.content.decode()
        assert client.get("/me/").content.decode() == "Гость"
      fail: "С неверным паролем — сообщение об ошибке, вход не выполняется."
hints:
  - "Какая функция записывает пользователя в сессию?"
  - "`login(request, user)` перед redirect."
explanation: |
  `authenticate()` сверяет имя и пароль и возвращает пользователя — но ничего не запоминает. `login(request, user)` кладёт его id в сессию, и следующий запрос с cookie `sessionid` получает этого пользователя в `request.user`.

title: "Пароль верный, но не вошёл"
type: exercise
difficulty: 1
pitfall: "authenticate только проверяет пароль; в сессию пользователя записывает login()."
statement: |
  Форма входа `/login/` принимает верный пароль и перенаправляет на `/me/`, но там по-прежнему «Гость». Исправьте view.
files:
  models.py: |
    from django.contrib.auth.models import User
    from django.db import models


    class Product(models.Model):
        name = models.CharField(max_length=200)
        slug = models.SlugField(unique=True)
        price = models.DecimalField(max_digits=10, decimal_places=2)

        def __str__(self):
            return self.name


    class Order(models.Model):
        user = models.ForeignKey(
            User, on_delete=models.PROTECT, related_name="orders"
        )
        number = models.CharField(max_length=20, unique=True)
        total = models.DecimalField(max_digits=10, decimal_places=2)

        def __str__(self):
            return self.number
  views.py: |
    from django.contrib.auth import authenticate, login
    from django.http import HttpResponse
    from django.shortcuts import redirect, render


    def sign_in(request):
        error = ""
        if request.method == "POST":
            user = authenticate(
                request,
                username=request.POST["username"],
                password=request.POST["password"],
            )
            if user is None:
                error = "Неверное имя или пароль."
            else:
                return redirect("me")
        return render(request, "shop/login.html", {"error": error})


    def me(request):
        if request.user.is_authenticated:
            return HttpResponse(f"Вы вошли как {request.user.username}")
        return HttpResponse("Гость")
  urls.py: |
    from django.urls import path

    from . import views

    urlpatterns = [
        path("login/", views.sign_in, name="login"),
        path("me/", views.me, name="me"),
    ]
  templates/shop/login.html: |
    <form method="post">{% csrf_token %}<input name="username"><input name="password" type="password"><button>Войти</button></form>
    {% if error %}<p>{{ error }}</p>{% endif %}

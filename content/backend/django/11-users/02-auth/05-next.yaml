solution:
  views.py: |
    from django.contrib.auth import authenticate, login
    from django.http import HttpResponse
    from django.shortcuts import redirect, render
    from django.utils.http import url_has_allowed_host_and_scheme


    def sign_in(request):
        if request.method == "POST":
            user = authenticate(
                request,
                username=request.POST["username"],
                password=request.POST["password"],
            )
            if user is not None:
                login(request, user)
                next_url = request.POST.get("next", "")
                if url_has_allowed_host_and_scheme(
                    next_url, allowed_hosts={request.get_host()}
                ):
                    return redirect(next_url)
                return redirect("me")
        return render(request, "shop/login.html")


    def me(request):
        if request.user.is_authenticated:
            return HttpResponse(f"Вы вошли как {request.user.username}")
        return HttpResponse("Гость")


    def orders(request):
        return HttpResponse("заказы")
check:
  type: django
  tests:
    - code: |
        r = client.post("/login/", {"username": "anna", "password": "anna-pass-1", "next": "/orders/"})
        assert r.status_code == 302 and r["Location"] == "/orders/"
      fail: "С next=/orders/ после входа — переход на /orders/."
    - code: |
        r = client.post("/login/", {"username": "anna", "password": "anna-pass-1", "next": "https://evil.example/"})
        assert r["Location"] == "/me/"
      fail: "Чужой адрес в next нельзя использовать — это открытый редирект; ведите на /me/."
    - code: |
        r = client.post("/login/", {"username": "anna", "password": "anna-pass-1"})
        assert r["Location"] == "/me/"
      fail: "Без next — переход на /me/."
hints:
  - "Как проверить, что адрес ведёт на ваш сайт?"
  - "`url_has_allowed_host_and_scheme(next_url, allowed_hosts={request.get_host()})` из `django.utils.http`."
explanation: |
  `redirect(request.POST["next"])` без проверки — открытый редирект: письмо со ссылкой `…/login/?next=https://evil.example/` приведёт пользователя после настоящего входа на фишинговую копию. `url_has_allowed_host_and_scheme` пропускает относительные адреса и адреса с разрешённым хостом. `LoginView` делает эту проверку сам.

title: "Вернуть туда, куда шёл"
type: exercise
difficulty: 3
pitfall: "Адрес next проверяют url_has_allowed_host_and_scheme — иначе открытый редирект на чужой сайт."
statement: |
  Гостя со страницы `/orders/` отправляют на вход `/login/` с полем `next=/orders/`, но после входа он всегда попадает на `/me/`. Сделайте переход на `next`, если это адрес вашего сайта; чужой адрес (`https://evil.example/`) — игнорировать и вести на `/me/`.

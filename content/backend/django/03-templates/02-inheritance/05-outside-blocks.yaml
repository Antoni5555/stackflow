title: Баннер не появился
type: quiz
kind: single
difficulty: 2
pitfall: В шаблоне-наследнике всё, что вне блоков, Django отбрасывает.
statement: |
  ```html
  {% extends "shop/base.html" %}

  <p class="banner">Скидка 10% по WELCOME10</p>

  {% block content %}
    <h1>Каталог</h1>
  {% endblock %}
  ```
  В `base.html` блоки `title` и `content`. Где на странице окажется баннер?
options:
  - "Перед `<h1>Каталог</h1>` внутри `<main>`"
  - "В самом начале страницы, до `<!doctype html>`"
  - "Нигде — текст вне блоков в наследнике игнорируется"
  - "Нигде — страница упадёт с `TemplateSyntaxError`"
answer: [2]
explanation: |
  Наследник не выводит свой текст напрямую: Django берёт каркас родителя и подставляет в него блоки наследника. Всё, что не в блоке, просто отбрасывается, без ошибки. Баннер нужно положить внутрь `{% block content %}` или завести для него отдельный блок в `base.html`.

- title: Список заказов
  text: |
    View передаёт список заказов. Выведите нумерованный список «Заказ №… — … ₽», у отменённого добавьте «(отменён)», у последнего в списке — «— последний».
    ```python
    ORDERS = [
        {"id": 12, "status": "paid", "total": 2998},
        {"id": 13, "status": "cancelled", "total": 490},
        {"id": 14, "status": "new", "total": 64990},
    ]
    ```
  hint: |
    Последний проход цикла — `forloop.last`.
  answer: |
    Ответ:

    Файл `templates/shop/orders.html`:
    ```html
    <ol>
      {% for order in orders %}
        <li>
          Заказ №{{ order.id }} — {{ order.total }} ₽
          {% if order.status == "cancelled" %}(отменён){% endif %}
          {% if forloop.last %}— последний{% endif %}
        </li>
      {% endfor %}
    </ol>
    ```
    View — `render(request, "shop/orders.html", {"orders": ORDERS})`.

    Результат (пустые строки убраны):
    ```
    <ol>
        <li>
          Заказ №12 — 2998 ₽
        </li>
        <li>
          Заказ №13 — 490 ₽
          (отменён)
        </li>
        <li>
          Заказ №14 — 64990 ₽
          — последний
        </li>
    </ol>
    ```
- title: Остатки и метка
  text: |
    Выведите остатки из словаря «название → количество»: при нуле — «нет», иначе «N шт.». Если в списке меток есть «хит», над списком — «Хит продаж».
    ```python
    STOCK = {"Ноутбук Aster 14": 5, "USB-хаб": 0}
    tags = ["хит", "новинка"]
    ```
  answer: |
    Ответ:

    Файл `templates/shop/stock.html`:
    ```html
    {% if "хит" in tags %}<p>Хит продаж</p>{% endif %}
    <ul>
      {% for name, qty in stock.items %}
        <li>{{ name }}: {% if qty %}{{ qty }} шт.{% else %}нет{% endif %}</li>
      {% endfor %}
    </ul>
    ```
    Результат:
    ```
    <p>Хит продаж</p>
    <ul>
        <li>Ноутбук Aster 14: 5 шт.</li>
        <li>USB-хаб: нет</li>
    </ul>
    ```
    `stock.items` — метод словаря без скобок; `0` в `{% if %}` — ложь, как в Python.
- title: Заголовок вкладки из контекста
  text: |
    Где нужно ошибиться, чтобы страница вывела пустой заголовок без всякой ошибки? Проверьте в песочнице: передайте `{"title": "Каталог"}` и выведите `{{ titel }}`.
  answer: |
    Выведется пустая строка, ответ — 200. Шаблон заменяет несуществующую переменную пустотой и не сообщает об опечатке. Когда значение «пропало», сначала сверьте имя в шаблоне и в контексте; в тренажёре видно, что ответ собран из нужного шаблона, — значит, дело в имени.

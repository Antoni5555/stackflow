title: Цена пропала
type: quiz
kind: single
difficulty: 1
pitfall: Несуществующая переменная в шаблоне выводится пустой строкой без всякой ошибки.
statement: |
  View передаёт в шаблон `{"product": {"name": "Мышь", "price": 1499}}`, а шаблон выводит `<p>{{ product.name }} — {{ prodcut.price }} ₽</p>`. Что увидит покупатель?
options:
  - "Ошибку 500: `VariableDoesNotExist`"
  - "«Мышь — 1499 ₽»"
  - "«Мышь —  ₽» — цена пустая"
  - "«Мышь — None ₽»"
answer: [2]
explanation: |
  Шаблон не находит переменную `prodcut` и подставляет пустую строку — без ошибки и без предупреждения на странице. Так задумано, чтобы страница не падала из-за необязательных данных, но опечатки из-за этого незаметны. Если значение «пропало», сначала сверьте имя в шаблоне с ключом контекста.

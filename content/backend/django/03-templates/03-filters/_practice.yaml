- title: Да или нет
  text: |
    Выведите «В наличии: да/нет» и «подарочная упаковка: да/нет» из булевых значений, а длинное название, набранное капсом, — с заглавной буквы и только первые 3 слова.
    ```python
    context = {
        "in_stock": True,
        "gift": False,
        "title": "БЕСПРОВОДНАЯ МЫШЬ ДЛЯ ОФИСА И ДОМА",
    }
    ```
  answer: |
    Ответ:

    Файл `templates/shop/flags.html`:
    ```html
    <p>В наличии: {{ in_stock|yesno:"да,нет" }}, подарочная упаковка: {{ gift|yesno:"да,нет" }}</p>
    <p>{{ title|lower|capfirst|truncatewords:3 }}</p>
    ```
    Результат:
    ```
    <p>В наличии: да, подарочная упаковка: нет</p>
    <p>Беспроводная мышь для …</p>
    ```
    Фильтры в цепочке применяются слева направо: сначала строчные буквы, потом заглавная первая, потом обрезка.
- title: Русские окончания
  text: |
    Напишите фильтр `plural_ru`, который по числу выбирает форму слова: `{{ n|plural_ru:"отзыв,отзыва,отзывов" }}`. Проверьте на 1, 3, 5, 11 и 22.
  hint: |
    Форма зависит от последней цифры и от двух последних: 11–14 — всегда «отзывов».
  answer: |
    Ответ:

    Файл `templatetags/shop_extras.py` (рядом — пустой `templatetags/__init__.py`):
    ```python
    from django import template

    register = template.Library()


    @register.filter
    def plural_ru(n, forms):
        one, few, many = forms.split(",")
        if n % 10 == 1 and n % 100 != 11:
            return one
        if 2 <= n % 10 <= 4 and not 12 <= n % 100 <= 14:
            return few
        return many
    ```

    Файл `templates/shop/reviews.html`:
    ```html
    {% load shop_extras %}
    {% for n in counts %}{{ n }} {{ n|plural_ru:"отзыв,отзыва,отзывов" }}; {% endfor %}
    ```
    Результат (`counts = [1, 3, 5, 11, 22]`):
    ```
    1 отзыв; 3 отзыва; 5 отзывов; 11 отзывов; 22 отзыва;
    ```
    Фильтр получает один аргумент — поэтому три формы переданы одной строкой через запятую.
- title: Время по Москве
  text: |
    В контексте `created_at = datetime(2026, 11, 18, 21, 5, tzinfo=timezone.utc)`. Что выведет `{{ created_at|date:"d.m.Y H:i" }}` на сайте с `TIME_ZONE = "Europe/Moscow"`?
  answer: |
    `19.11.2026 00:05` — фильтр переводит время из UTC в московское (+3 часа), и дата меняется на следующую. Если бы во view отформатировали `strftime`, на странице было бы `18.11.2026 21:05` — и заказ «сменил» бы день.

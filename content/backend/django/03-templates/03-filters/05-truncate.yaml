title: Сколько символов останется
type: quiz
kind: single
difficulty: 1
pitfall: Многоточие truncatechars входит в заданную длину.
statement: |
  `{{ name|truncatechars:10 }}`, где `name` — «Беспроводная мышь». Что выведется?
options:
  - "«Беспроводн…» — 10 букв и многоточие"
  - "«Беспровод…» — 9 букв и многоточие, всего 10 символов"
  - "«Беспроводная мышь» — фильтр обрезает только по словам"
  - "«Беспроводн» — без многоточия"
answer: [1]
explanation: |
  `truncatechars:N` ограничивает **итоговую** длину N символами, и многоточие `…` — один из них. Остаётся 9 символов текста. Если резать нужно по словам, есть `truncatewords:N`.

title: "Тесты каталога"
type: exercise
difficulty: 1
pitfall: "Проверка «страница открывается (200)» почти ничего не ловит — проверяйте содержимое."
statement: |
  Каталог `/catalog/` показывает активные товары с названием категории в скобках («Мышь (Мыши)») и не показывает снятые с продажи. Сейчас тест проверяет только статус 200. Перепишите тесты так, чтобы они ловили ошибки в каталоге.
files:
  models.py: |
    from django.contrib.auth.models import User
    from django.db import models


    class Category(models.Model):
        name = models.CharField(max_length=100)

        def __str__(self):
            return self.name


    class Product(models.Model):
        category = models.ForeignKey(
            Category, on_delete=models.PROTECT, related_name="products"
        )
        name = models.CharField(max_length=200)
        slug = models.SlugField(unique=True)
        price = models.DecimalField(max_digits=10, decimal_places=2)
        is_active = models.BooleanField(default=True)

        def __str__(self):
            return self.name


    class Order(models.Model):
        user = models.ForeignKey(
            User, on_delete=models.PROTECT, related_name="orders"
        )
        number = models.CharField(max_length=20, unique=True)

        def __str__(self):
            return self.number

        def total(self):
            return sum(i.price * i.quantity for i in self.items.all())


    class OrderItem(models.Model):
        order = models.ForeignKey(
            Order, on_delete=models.CASCADE, related_name="items"
        )
        product = models.ForeignKey(Product, on_delete=models.PROTECT)
        quantity = models.PositiveIntegerField()
        price = models.DecimalField(max_digits=10, decimal_places=2)
  views.py: |
    from django.contrib.auth.decorators import login_required
    from django.shortcuts import get_object_or_404, render

    from .models import Order, Product


    def catalog(request):
        products = (
            Product.objects.filter(is_active=True)
            .select_related("category")
            .order_by("name")
        )
        return render(request, "shop/catalog.html", {"products": products})


    @login_required
    def order_detail(request, number):
        order = get_object_or_404(Order, number=number, user=request.user)
        return render(request, "shop/order.html", {"order": order})
  urls.py: |
    from django.urls import path

    from . import views

    urlpatterns = [
        path("catalog/", views.catalog, name="catalog"),
        path("orders/<str:number>/", views.order_detail, name="order"),
    ]
  templates/shop/catalog.html: |
    <ul>{% for p in products %}<li>{{ p.name }} ({{ p.category.name }})</li>{% endfor %}</ul>

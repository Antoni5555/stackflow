    from django.contrib.auth.models import User
    from django.test import TestCase

    from .models import Category, Order, Product


    class PagesTests(TestCase):
        @classmethod
        def setUpTestData(cls):
            cat = Category.objects.create(name="Мыши")
            Product.objects.create(category=cat, name="Мышь", slug="mouse", price="1499.00")
            Product.objects.create(
                category=cat, name="Старая", slug="old", price="1.00", is_active=False
            )
            cls.anna = User.objects.create_user("anna")
            cls.boris = User.objects.create_user("boris")
            Order.objects.create(user=cls.anna, number="A-12")
            Order.objects.create(user=cls.boris, number="A-13")

        def test_catalog_opens(self):
            r = self.client.get("/catalog/")
            self.assertEqual(r.status_code, 200)
solution:
  tests.py: |
    from django.contrib.auth.models import User
    from django.test import TestCase

    from .models import Category, Order, Product


    class PagesTests(TestCase):
        @classmethod
        def setUpTestData(cls):
            cat = Category.objects.create(name="Мыши")
            Product.objects.create(category=cat, name="Мышь", slug="mouse", price="1499.00")
            Product.objects.create(
                category=cat, name="Старая", slug="old", price="1.00", is_active=False
            )
            cls.anna = User.objects.create_user("anna")
            cls.boris = User.objects.create_user("boris")
            Order.objects.create(user=cls.anna, number="A-12")
            Order.objects.create(user=cls.boris, number="A-13")

        def test_catalog_shows_active_with_category(self):
            r = self.client.get("/catalog/")
            self.assertContains(r, "Мышь (Мыши)")

        def test_catalog_hides_inactive(self):
            self.assertNotContains(self.client.get("/catalog/"), "Старая")

        def test_catalog_template(self):
            self.assertTemplateUsed(self.client.get("/catalog/"), "shop/catalog.html")
check:
  type: django
  mutants:
    - files:
        views.py: |
          from django.contrib.auth.decorators import login_required
          from django.shortcuts import get_object_or_404, render

          from .models import Order, Product


          def catalog(request):
              products = (
                  Product.objects.all()
                  .select_related("category")
                  .order_by("name")
              )
              return render(request, "shop/catalog.html", {"products": products})


          @login_required
          def order_detail(request, number):
              order = get_object_or_404(Order, number=number, user=request.user)
              return render(request, "shop/order.html", {"order": order})
      fail: "Ваши тесты не замечают, что в каталоге появились снятые с продажи товары."
    - files:
        templates/shop/catalog.html: |
          <ul>{% for p in products %}<li>{{ p.name }}</li>{% endfor %}</ul>
      fail: "Ваши тесты не замечают, что пропало название категории."
    - files:
        views.py: |
          from django.contrib.auth.decorators import login_required
          from django.shortcuts import get_object_or_404, render

          from .models import Order, Product


          def catalog(request):
              products = (
                  Product.objects.filter(is_active=False)
                  .select_related("category")
                  .order_by("name")
              )
              return render(request, "shop/catalog.html", {"products": products})


          @login_required
          def order_detail(request, number):
              order = get_object_or_404(Order, number=number, user=request.user)
              return render(request, "shop/order.html", {"order": order})
      fail: "Ваши тесты не замечают, что каталог показывает не те товары."
hints:
  - "Что покупатель должен и не должен видеть в каталоге?"
  - "`assertContains(r, \"Мышь (Мыши)\")` и `assertNotContains(r, \"Старая\")`."
explanation: |
  Статус 200 возвращает и каталог со снятыми товарами, и каталог без категорий, и пустой. `assertContains` проверяет, что нужное есть, `assertNotContains` — что лишнего нет; вместе они ловят и «показали лишнее», и «потеряли нужное».

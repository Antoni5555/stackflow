solution:
  tests.py: |
    from django.contrib.auth.models import User
    from django.test import TestCase

    from .models import Category, Order, Product


    class PagesTests(TestCase):
        @classmethod
        def setUpTestData(cls):
            cat = Category.objects.create(name="Мыши")
            Product.objects.create(category=cat, name="Мышь", slug="mouse", price="1499.00")
            Product.objects.create(
                category=cat, name="Старая", slug="old", price="1.00", is_active=False
            )
            cls.anna = User.objects.create_user("anna")
            cls.boris = User.objects.create_user("boris")
            Order.objects.create(user=cls.anna, number="A-12")
            Order.objects.create(user=cls.boris, number="A-13")

        def test_own_order(self):
            self.client.force_login(self.anna)
            self.assertContains(self.client.get("/orders/A-12/"), "Заказ A-12")

        def test_foreign_order_404(self):
            self.client.force_login(self.anna)
            self.assertEqual(self.client.get("/orders/A-13/").status_code, 404)

        def test_guest_redirected_to_login(self):
            r = self.client.get("/orders/A-12/")
            self.assertRedirects(
                r, "/accounts/login/?next=/orders/A-12/", fetch_redirect_response=False
            )
check:
  type: django
  mutants:
    - files:
        views.py: |
          from django.contrib.auth.decorators import login_required
          from django.shortcuts import get_object_or_404, render

          from .models import Order, Product


          def catalog(request):
              products = (
                  Product.objects.filter(is_active=True)
                  .select_related("category")
                  .order_by("name")
              )
              return render(request, "shop/catalog.html", {"products": products})


          @login_required
          def order_detail(request, number):
              order = get_object_or_404(Order, number=number)
              return render(request, "shop/order.html", {"order": order})
      fail: "Ваши тесты не замечают, что покупатель открывает чужой заказ."
    - files:
        views.py: |
          from django.contrib.auth.decorators import login_required
          from django.shortcuts import get_object_or_404, render

          from .models import Order, Product


          def catalog(request):
              products = (
                  Product.objects.filter(is_active=True)
                  .select_related("category")
                  .order_by("name")
              )
              return render(request, "shop/catalog.html", {"products": products})


          def order_detail(request, number):
              if not request.user.is_authenticated:
                  return render(request, "shop/order.html", {"order": None})
              order = get_object_or_404(Order, number=number, user=request.user)
              return render(request, "shop/order.html", {"order": order})
      fail: "Ваши тесты не замечают, что гостя больше не отправляют на страницу входа."
hints:
  - "Какие три вида посетителей есть у страницы заказа?"
  - "Тест чужого заказа (`force_login(self.anna)`, `/orders/A-13/` → 404) и тест гостя (`assertRedirects(…, fetch_redirect_response=False)`)."
explanation: |
  Тест «владелец видит свой заказ» проходит и тогда, когда фильтр по пользователю убран, — это самая опасная поломка, и её ловит только тест на чужой заказ. Редирект гостя проверяет `assertRedirects`; `fetch_redirect_response=False` — потому что страницы входа в учебном проекте нет.

title: "Что видит второй тест"
type: quiz
kind: single
difficulty: 2
pitfall: "Каждый тест TestCase — в транзакции с откатом: видны только данные setUpTestData и свои."
statement: |
  В `setUpTestData` создан один товар. `test_a` создаёт ещё один и проверяет, что товаров два. Что увидит `test_b` в `Product.objects.count()`, если он запустится после `test_a`?
options:
  - "2 — товар из `test_a` остался"
  - "1 — изменения `test_a` откатились"
  - "0 — база очищается перед каждым тестом"
  - "зависит от порядка запуска тестов"
answer: [1]
explanation: |
  `django.test.TestCase` оборачивает каждый тест в транзакцию и откатывает её, а данные `setUpTestData` создаются один раз во внешней транзакции и остаются. Даже изменённый в памяти объект из `setUpTestData` в следующем тесте снова исходный. Проверено в тренажёре.

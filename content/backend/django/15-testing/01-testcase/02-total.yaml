hints:
  - "Какие данные заказа нужны, чтобы ошибка в количестве или цене изменила сумму?"
  - "Позиция с `quantity=2`; позиция с ценой, отличной от цены товара; заказ из двух позиций."
explanation: |
  Тест ловит ошибку, только если входные данные её проявляют: при `quantity=1` «забыть количество» незаметно, при цене позиции, равной цене товара, — «взять цену товара», при одной позиции — «посчитать только первую». Поэтому эталон проверяет количество 2, цену позиции 999.00 при цене товара 1499.00 и сумму двух позиций. Каждый тест — одно поведение, его имя говорит, какое.

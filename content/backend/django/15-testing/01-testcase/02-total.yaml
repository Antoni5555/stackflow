solution:
  tests.py: |
    from decimal import Decimal

    from django.contrib.auth.models import User
    from django.test import TestCase

    from .models import Category, Order, OrderItem, Product


    class OrderTotalTests(TestCase):
        @classmethod
        def setUpTestData(cls):
            cat = Category.objects.create(name="Мыши")
            cls.mouse = Product.objects.create(
                category=cat, name="Мышь", slug="mouse", price="1499.00"
            )
            cls.user = User.objects.create_user("anna")

        def setUp(self):
            self.order = Order.objects.create(user=self.user, number="A-12")

        def test_empty_order_total_is_zero(self):
            self.assertEqual(self.order.total(), 0)

        def test_total_counts_quantity(self):
            OrderItem.objects.create(
                order=self.order, product=self.mouse, quantity=2, price="1499.00"
            )
            self.assertEqual(self.order.total(), Decimal("2998.00"))

        def test_total_uses_price_from_item(self):
            OrderItem.objects.create(
                order=self.order, product=self.mouse, quantity=1, price="999.00"
            )
            self.assertEqual(self.order.total(), Decimal("999.00"))

        def test_total_sums_all_items(self):
            pad = Product.objects.create(
                category=self.mouse.category, name="Коврик", slug="pad", price="490.00"
            )
            OrderItem.objects.create(order=self.order, product=self.mouse, quantity=1, price="1499.00")
            OrderItem.objects.create(order=self.order, product=pad, quantity=1, price="490.00")
            self.assertEqual(self.order.total(), Decimal("1989.00"))

title: "Тест на N+1 с одним товаром"
type: quiz
kind: single
difficulty: 2
pitfall: "Чтобы тест ловил N+1, в базе должно быть несколько объектов."
statement: |
  В тесте создан **один** товар, страница каталога правильно делает 1 запрос, тест — `assertNumQueries(2)`. Разработчик убрал `select_related`, и каталог стал делать N+1. Что покажет тест?
options:
  - "Упадёт: стало больше запросов"
  - "Тест пройдёт: с одним товаром «1 + N» — это 2, как и ожидалось, а изначально тест был неверным"
  - "Упадёт с ERROR"
  - "Тест не запустится"
answer: [1]
explanation: |
  С одним товаром N+1 даёт ровно два запроса — не отличить от двух нормальных. Тест с ожиданием 2 и был неверным: правильная страница делала 1. В тренажёре: без `select_related` и одном активном товаре — «2 queries executed, 1 expected». Создавайте 3–5 объектов и закрепляйте точное число.

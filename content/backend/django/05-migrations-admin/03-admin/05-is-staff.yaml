title: Покупатель стучится в админку
type: quiz
kind: single
difficulty: 1
pitfall: Войти в админку может только пользователь с is_staff — правильного пароля мало.
statement: |
  Покупатель Анна вводит на `/admin/login/` свой логин и правильный пароль от магазина. Что произойдёт?
options:
  - "Войдёт и увидит все разделы"
  - "Войдёт, но разделов не будет"
  - "Не войдёт: форма ответит, как на неверный пароль, — у Анны нет флага `is_staff`"
  - "Получит ошибку 403"
answer: [2]
explanation: |
  Форма входа админки пускает только пользователей с `is_staff=True`, а остальным отвечает так же, как на неверный пароль, — не подсказывая, что учётная запись существует. Сотрудникам ставят `is_staff` и выдают права на нужные модели; всё сразу умеет только `is_superuser`.

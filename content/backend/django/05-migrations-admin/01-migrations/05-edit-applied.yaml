title: Поправить старую миграцию
type: quiz
kind: single
difficulty: 2
pitfall: Применённую миграцию Django не выполняет повторно — изменения в её файле дойдут только до новых баз.
statement: |
  Миграция `0003_product_slug` уже применена у всех разработчиков и на сервере. В ней ошиблись — `max_length=50` вместо 200. Как правильно исправить?
options:
  - "Исправить число в `0003_product_slug.py` и запустить `migrate`"
  - "Поменять `max_length` в модели и создать новую миграцию `makemigrations`"
  - "Удалить `0003` и создать её заново"
  - "Выполнить `ALTER TABLE` вручную на сервере"
answer: [1]
explanation: |
  `0003` отмечена применённой в `django_migrations` — `migrate` её не тронет, и изменение в файле дойдёт только до новых баз, а на существующих колонка останется `varchar(50)`. Новая миграция с `AlterField` применится везде одинаково. Ручной `ALTER` рассинхронизирует базу с историей миграций.

</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fig-ah"/></marker></defs>
<rect x="20" y="30" width="220" height="80" rx="12" class="fig-box2"/>
<text x="36" y="56" text-anchor="start" class="fig-c">models.py</text>
<text x="36" y="82" text-anchor="start" class="fig-cs">+ stock = …Field()</text>
<path d="M240 70H346" class="fig-ln" marker-end="url(#a)"/>
<text x="248" y="60" text-anchor="start" class="fig-s">makemigrations</text>
<rect x="350" y="30" width="220" height="80" rx="12" class="fig-box"/>
<text x="366" y="56" text-anchor="start" class="fig-cs">0002_product_stock.py</text>
<text x="366" y="82" text-anchor="start" class="fig-cs">AddField(…)</text>
<text x="350" y="128" text-anchor="start" class="fig-s">файл в git — у всех одинаковый</text>
<path d="M570 70H626" class="fig-ln" marker-end="url(#a)"/>
<text x="578" y="60" text-anchor="start" class="fig-s">migrate</text>
<rect x="630" y="30" width="210" height="80" rx="12" class="fig-acc"/>
<text x="646" y="56" text-anchor="start" class="fig-onacc">база</text>
<text x="646" y="82" text-anchor="start" class="fig-onacc">ALTER TABLE … ADD</text>
<path d="M735 110V166" class="fig-ln" marker-end="url(#a)"/>
<rect x="560" y="170" width="280" height="60" rx="12" class="fig-ok"/>
<text x="576" y="194" text-anchor="start" class="fig-cs">django_migrations</text>
<text x="576" y="216" text-anchor="start" class="fig-cs">catalog | 0002_product_stock</text>
<text x="20" y="200" text-anchor="start" class="fig-s">showmigrations — что уже применено [X];</text>
<text x="20" y="222" text-anchor="start" class="fig-s">sqlmigrate — какой SQL выполнится, без применения.</text>
<text x="20" y="282" text-anchor="start" class="fig-t">Модель — как должно быть; миграции — путь базы от состояния к состоянию.</text>
</svg>

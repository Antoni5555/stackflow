title: Новое поле от ноутбука до сервера
type: quiz
kind: order
difficulty: 1
pitfall: Без makemigrations изменения модели не попадут ни в базу, ни к коллегам, ни на сервер.
statement: |
  Разработчик добавил товару поле `weight_g`. Расставьте шаги по порядку, чтобы колонка появилась и у него, и на сервере.
options:
  - "`python manage.py migrate` у себя"
  - "Изменить `models.py`"
  - "Закоммитить модель вместе с файлом миграции и выложить"
  - "`python manage.py makemigrations`"
  - "`python manage.py migrate` на сервере (шаг деплоя)"
answer: [1, 3, 0, 2, 4]
explanation: |
  Сначала модель, потом файл миграции по её изменениям (`makemigrations`), потом применение к своей базе (`migrate`). Файл миграции — часть кода: его коммитят вместе с моделью, и на сервере `migrate` применяет ту же миграцию. Перед выкладкой полезно посмотреть её SQL — `sqlmigrate`.

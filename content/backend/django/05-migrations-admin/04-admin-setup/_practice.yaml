- title: Только чтение
  text: |
    Время создания заказа менеджер должен видеть на странице заказа, но не менять. Как?
  answer: |
    `readonly_fields = ["created_at"]` в `OrderAdmin`. Поле с `auto_now_add` в форму не попадает вовсе (оно нередактируемое), а `readonly_fields` показывает его значение текстом. Так же показывают вычисляемые методы.
- title: Фильтр по дате
  text: |
    Какой `list_filter` даст менеджеру быстрые фильтры «Сегодня», «Последние 7 дней», «Этот месяц» для заказов?
  answer: |
    `list_filter = ["created_at"]` — для `DateField`/`DateTimeField` админка сама строит такие варианты. Иерархия «год → месяц → день» над списком — `date_hierarchy = "created_at"`.
- title: Поиск по номеру точно
  text: |
    Поиск по заказам ищет `A-1` и находит `A-12`, `A-13`, `A-100`… Как искать номер точно?
  answer: |
    `search_fields = ["=number"]` — префикс `=` включает точное совпадение без учёта регистра (`iexact`) вместо вхождения (`icontains`). Другие префиксы: `^` — «начинается с».

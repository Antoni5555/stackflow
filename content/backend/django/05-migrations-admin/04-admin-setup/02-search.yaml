title: Поиск товара по названию
type: exercise
difficulty: 1
pitfall: Без search_fields в админке нет поиска — параметр ?q= просто игнорируется.
statement: |
  В каталоге сотни товаров, и менеджер листает страницы в поисках нужного. Добавьте в список товаров поиск по названию и по названию категории.
files:
  models.py: |
    from django.db import models


    class Category(models.Model):
        name = models.CharField(max_length=100)

        def __str__(self):
            return self.name


    class Product(models.Model):
        category = models.ForeignKey(Category, on_delete=models.PROTECT)
        name = models.CharField(max_length=200)
        price = models.DecimalField(max_digits=10, decimal_places=2)
        is_active = models.BooleanField(default=True)

        def __str__(self):
            return self.name
  admin.py: |
    from django.contrib import admin

    from .models import Product


    @admin.register(Product)
    class ProductAdmin(admin.ModelAdmin):
        list_display = ["name", "category", "price"]
  urls.py: |
    from django.contrib import admin
    from django.urls import path

    urlpatterns = [
        path("admin/", admin.site.urls),
    ]
setup: |
  mice = Category.objects.create(name="Мыши")
  pads = Category.objects.create(name="Коврики")
  Product.objects.create(category=mice, name="Беспроводная мышь", price="1499.00")
  Product.objects.create(category=pads, name="Коврик для мыши", price="490.00")
solution:
  admin.py: |
    from django.contrib import admin

    from .models import Product


    @admin.register(Product)
    class ProductAdmin(admin.ModelAdmin):
        list_display = ["name", "category", "price"]
        search_fields = ["name", "category__name"]
check:
  type: django
  tests:
    - code: |
        client.force_login(User.objects.create_superuser("admin", "admin@shop.example", "x"))
        html = client.get("/admin/shop/product/", {"q": "Беспровод"}).content.decode()
        assert "Беспроводная мышь" in html and "Коврик для мыши" not in html
      fail: "Поиск по названию не работает — задайте search_fields."
    - code: |
        client.force_login(User.objects.create_superuser("admin", "admin@shop.example", "x"))
        html = client.get("/admin/shop/product/", {"q": "Коврики"}).content.decode()
        assert "Коврик для мыши" in html and "Беспроводная мышь" not in html
      fail: "Поиск должен находить товары и по названию категории — поле через связь: category__name."
hints:
  - "Какой атрибут `ModelAdmin` включает поле поиска над списком?"
  - "`search_fields = [\"name\", \"category__name\"]`."
explanation: |
  `search_fields` добавляет поле поиска: Django ищет вхождение без учёта регистра (`icontains`) в каждом перечисленном поле и объединяет условия через «или». Поле связанной модели — через двойное подчёркивание `category__name`, тогда к запросу добавится `JOIN`. На больших таблицах такой поиск медленный — для точных значений есть префикс `=`. В тренажёре база — SQLite, и в ней `icontains` различает регистр русских букв; в PostgreSQL поиск «беспровод» найдёт и «Беспроводную мышь».

title: Когда нужен --fake
type: quiz
kind: single
difficulty: 2
pitfall: --fake меняет только историю миграций — если база не в том состоянии, следующие миграции упадут.
statement: |
  В каком случае уместен `python manage.py migrate catalog 0005 --fake`?
options:
  - "Миграция `0005` падает с ошибкой — пусть Django пропустит её"
  - "Изменения из `0005` уже внесены в базу вручную (или база восстановлена из копии, где они есть), а в `django_migrations` её нет"
  - "Нужно быстрее применить большую миграцию"
  - "Чтобы проверить миграцию, не меняя базу"
answer: [1]
explanation: |
  `--fake` записывает (или удаляет) отметку в `django_migrations`, не выполняя SQL. Это нужно, когда структура уже соответствует миграции, а история — нет. Если миграция падает, `--fake` спрячет проблему: база останется без изменений, а Django будет считать их сделанными. Проверить SQL без применения — `sqlmigrate`.

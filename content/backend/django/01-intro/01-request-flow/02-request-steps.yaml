title: Путь запроса по шагам
type: quiz
kind: order
difficulty: 1
pitfall: View вызывается только после того, как в urls.py нашёлся подходящий маршрут.
statement: |
  Покупатель открыл `/catalog/`. Расставьте шаги обработки запроса в Django по порядку.
options:
  - Django ищет в `urls.py` первый маршрут, подходящий к `catalog/`
  - Django создаёт объект `request` из пришедшего HTTP-запроса
  - View собирает HTML из шаблона с данными
  - Django вызывает view найденного маршрута и передаёт ей `request`
  - Ответ `HttpResponse` уходит браузеру
answer: [1, 0, 3, 2, 4]
explanation: |
  Сначала из HTTP-запроса получается объект `request`, затем по адресу выбирается маршрут — и только потом вызывается его view. View возвращает готовый ответ, Django отправляет его браузеру. Если маршрут не нашёлся, до view дело не доходит: сразу 404.

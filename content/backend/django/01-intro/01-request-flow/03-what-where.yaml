title: Где это лежит
type: quiz
kind: single
difficulty: 1
pitfall: Расчёты и решения — во view, шаблон только показывает готовые данные.
statement: |
  На странице корзины нужно посчитать сумму со скидкой и показать её покупателю. Где по схеме MTV считают сумму?
options:
  - В шаблоне — там, где сумма выводится
  - Во view (или в модели), а шаблон получает готовое значение
  - В `urls.py` — рядом с маршрутом корзины
  - В браузере покупателя
answer: [1]
explanation: |
  Шаблон отвечает за вид страницы и только выводит готовые данные. Логику — расчёт суммы, проверку промокода — держат во view или в модели. Там её можно протестировать и использовать повторно, например в письме с заказом. `urls.py` лишь выбирает view по адресу, а браузеру нельзя доверять расчёт цены.

title: Пароль базы в settings.py
type: fix
difficulty: 2
pitfall: settings.py попадает в git — пароль базы в нём видят все, у кого есть доступ к репозиторию.
statement: |
  Магазин переезжает на PostgreSQL, и настройки базы записали прямо в `settings.py`, вместе с паролем. Берите пароль из переменной окружения `DB_PASSWORD`, остальное оставьте.
files:
  config/settings.py: |
    import os

    DATABASES = {
        "default": {
            "ENGINE": "django.db.backends.postgresql",
            "NAME": "shop",
            "USER": "shop",
            "PASSWORD": "Sup3rSecret",
            "HOST": "localhost",
            "PORT": "5432",
        }
    }
check:
  type: rules
  rules:
    - must_not_match: 'Sup3rSecret'
      fail: Пароль всё ещё записан в коде.
    - must_match: '^\s*["'']PASSWORD["'']\s*:\s*os\.(environ\[\s*["'']DB_PASSWORD["'']\s*\]|environ\.get\(\s*["'']DB_PASSWORD["'']|getenv\(\s*["'']DB_PASSWORD["''])'
      fail: "Значение PASSWORD возьмите из переменной окружения DB_PASSWORD."
    - must_match: '^\s*["'']ENGINE["'']\s*:\s*["'']django\.db\.backends\.postgresql["'']'
      fail: База остаётся PostgreSQL — ENGINE менять не нужно.
solution:
  config/settings.py: |
    import os

    DATABASES = {
        "default": {
            "ENGINE": "django.db.backends.postgresql",
            "NAME": "shop",
            "USER": "shop",
            "PASSWORD": os.environ["DB_PASSWORD"],
            "HOST": "localhost",
            "PORT": "5432",
        }
    }
hints:
  - "`settings.py` — обычный модуль Python: в нём можно читать переменные окружения."
  - "`\"PASSWORD\": os.environ[\"DB_PASSWORD\"]`."
explanation: |
  `settings.py` лежит в репозитории, поэтому секреты в нём видят все и они остаются в истории git навсегда. Пароль базы, `SECRET_KEY` и ключи внешних сервисов берут из переменных окружения — на сервере их задают в `.env`, который в git не попадает. `os.environ["…"]` упадёт с `KeyError`, если переменную забыли задать, — это лучше, чем молча подключиться без пароля. Подробнее о настройках по окружениям — раздел «Настройки и безопасность».

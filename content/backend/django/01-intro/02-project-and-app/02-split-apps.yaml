title: Как разложить магазин
type: quiz
kind: single
difficulty: 1
pitfall: Всё в одном приложении — через полгода views.py на тысячу строк и непонятно, что от чего зависит.
statement: |
  В магазине будут каталог товаров, корзина, заказы и личный кабинет покупателя. Как обычно устраивают такой Django-проект?
options:
  - Один проект на каждую часть — четыре проекта со своими settings.py
  - Один проект и одно приложение, все модели и view — в нём
  - Один проект и несколько приложений — по одному на область (`catalog`, `cart`, `orders`, `accounts`)
  - Приложения не нужны — модели и view можно писать прямо в пакете настроек
answer: [2]
explanation: |
  Проект — это сайт целиком с общими настройками и маршрутами. Приложение — одна область со своими моделями, view и шаблонами: так код легче читать, тестировать и менять по частям. Четыре проекта — четыре отдельных сайта с разными базами. Одно приложение на всё быстро превращается в огромные файлы.

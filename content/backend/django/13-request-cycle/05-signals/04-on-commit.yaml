solution:
  models.py: |
    from django.core.mail import send_mail
    from django.db import models, transaction
    from django.db.models.signals import post_save, pre_save
    from django.dispatch import receiver


    class Product(models.Model):
        name = models.CharField(max_length=200)
        slug = models.SlugField(unique=True)
        price = models.DecimalField(max_digits=10, decimal_places=2)
        stock = models.PositiveIntegerField(default=0)

        def __str__(self):
            return self.name


    class Order(models.Model):
        class Status(models.TextChoices):
            NEW = "new", "Новый"
            PAID = "paid", "Оплачен"

        number = models.CharField(max_length=20, unique=True)
        email = models.EmailField()
        status = models.CharField(max_length=10, choices=Status, default=Status.NEW)

        def __str__(self):
            return self.number


    @receiver(post_save, sender=Order)
    def order_saved(sender, instance, **kwargs):
        if instance.status == Order.Status.PAID:
            transaction.on_commit(
                lambda: send_mail(f"Заказ {instance.number} оплачен", "Спасибо!", "shop@shop.example", [instance.email])
            )
check:
  type: django
  tests:
    - code: |
        from django.core import mail
        from django.test import TestCase
        mail.outbox = []
        with TestCase.captureOnCommitCallbacks(execute=True):
            r = client.post("/orders/create/", {"number": "A-21", "fail": "1"})
        assert r.status_code == 400 and not Order.objects.filter(number="A-21").exists()
        assert len(mail.outbox) == 0
      fail: "Транзакция откатилась — письма быть не должно."
    - code: |
        from django.core import mail
        from django.test import TestCase
        mail.outbox = []
        with TestCase.captureOnCommitCallbacks(execute=True):
            client.post("/orders/create/", {"number": "A-20"})
        assert [m.subject for m in mail.outbox] == ["Заказ A-20 оплачен"]
      fail: "Успешный заказ — одно письмо «Заказ A-20 оплачен»."
hints:
  - "Когда выполняется приёмник post_save относительно транзакции?"
  - "В приёмнике — `transaction.on_commit(lambda: send_mail(...))`."
explanation: |
  Приёмник вызывается прямо из `save()`, внутри открытой транзакции; откат базы не отменяет отправленное письмо. `transaction.on_commit()` откладывает отправку до коммита и отбрасывает её при откате.

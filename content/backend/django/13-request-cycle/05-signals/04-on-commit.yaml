title: "Письмо об отменённой оплате"
type: exercise
difficulty: 2
pitfall: "Приёмник сигнала выполняется внутри транзакции; внешние действия — через transaction.on_commit."
statement: |
  POST на `/orders/create/` создаёт оплаченный заказ в транзакции; если банк отклонил платёж (`fail=1`), транзакция откатывается. Но приёмник `post_save` уже отправил письмо «оплачен». Исправьте приёмник: письмо — только если заказ действительно сохранён.
files:
  models.py: |
    from django.core.mail import send_mail
    from django.db import models
    from django.db.models.signals import post_save, pre_save
    from django.dispatch import receiver


    class Product(models.Model):
        name = models.CharField(max_length=200)
        slug = models.SlugField(unique=True)
        price = models.DecimalField(max_digits=10, decimal_places=2)
        stock = models.PositiveIntegerField(default=0)

        def __str__(self):
            return self.name


    class Order(models.Model):
        class Status(models.TextChoices):
            NEW = "new", "Новый"
            PAID = "paid", "Оплачен"

        number = models.CharField(max_length=20, unique=True)
        email = models.EmailField()
        status = models.CharField(max_length=10, choices=Status, default=Status.NEW)

        def __str__(self):
            return self.number


    @receiver(post_save, sender=Order)
    def order_saved(sender, instance, **kwargs):
        if instance.status == Order.Status.PAID:
            send_mail(f"Заказ {instance.number} оплачен", "Спасибо!", "shop@shop.example", [instance.email])
  views.py: |
    from django.db import transaction
    from django.http import HttpResponse

    from .models import Order


    def create_paid(request):
        try:
            with transaction.atomic():
                Order.objects.create(number=request.POST["number"], email="vera@shop.example", status="paid")
                if request.POST.get("fail"):
                    raise ValueError("банк отклонил платёж")
        except ValueError as e:
            return HttpResponse(str(e), status=400)
        return HttpResponse("ok")
  urls.py: |
    from django.urls import path

    from . import views

    urlpatterns = [
        path("orders/create/", views.create_paid, name="create"),
    ]

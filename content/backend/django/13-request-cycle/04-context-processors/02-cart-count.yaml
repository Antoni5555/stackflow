title: "Корзина в шапке"
type: exercise
difficulty: 2
pitfall: "Контекст-процессор — функция (request) → dict; её переменные есть во всех шаблонах с request."
statement: |
  В шапке каждой страницы — «Корзина: N», где N — сумма количеств товаров в корзине из сессии (`{slug: количество}`). Views в контекст ничего не передают. Допишите контекст-процессор `cart` (он уже подключён).
files:
  models.py: |
    from django.db import models


    class Product(models.Model):
        name = models.CharField(max_length=200)
        slug = models.SlugField(unique=True)
        price = models.DecimalField(max_digits=10, decimal_places=2)
        stock = models.PositiveIntegerField(default=0)

        def __str__(self):
            return self.name


    class Order(models.Model):
        class Status(models.TextChoices):
            NEW = "new", "Новый"
            PAID = "paid", "Оплачен"

        number = models.CharField(max_length=20, unique=True)
        email = models.EmailField()
        status = models.CharField(max_length=10, choices=Status, default=Status.NEW)

        def __str__(self):
            return self.number
  views.py: |
    from django.shortcuts import render


    def add(request, slug):
        from django.http import HttpResponse
        cart = request.session.get("cart", {})
        cart[slug] = cart.get(slug, 0) + 1
        request.session["cart"] = cart
        return HttpResponse("ok")


    def home(request):
        return render(request, "shop/home.html")


    def about(request):
        return render(request, "shop/about.html")
  urls.py: |
    from django.urls import path

    from . import views

    urlpatterns = [
        path("add/<slug:slug>/", views.add, name="add"),
        path("", views.home, name="home"),
        path("about/", views.about, name="about"),
    ]
  context_processors.py: |
    def cart(request):
        return {}
  templates/shop/home.html: |
    <header>Корзина: {{ cart_count|default:0 }}</header>
    <h1>Главная</h1>
  templates/shop/about.html: |
    <header>Корзина: {{ cart_count|default:0 }}</header>
    <h1>О магазине</h1>
setup: |
  Product.objects.create(name="Ноутбук Aster 14", slug="aster-14", price="64990.00", stock=3)
  Product.objects.create(name="Беспроводная мышь", slug="wireless-mouse", price="1499.00", stock=40)
  Product.objects.create(name="Коврик для мыши", slug="mouse-pad", price="490.00", stock=25)
  User.objects.create_user("anna", "anna@shop.example", "anna-pass-1")
  Order.objects.create(number="A-12", email="anna@shop.example")
solution:
  context_processors.py: |
    def cart(request):
        cart = request.session.get("cart", {})
        return {"cart_count": sum(cart.values())}
check:
  type: django
  tests:
    - code: |
        client.post("/add/wireless-mouse/"); client.post("/add/wireless-mouse/"); client.post("/add/mouse-pad/")
        assert "Корзина: 3" in client.get("/").content.decode()
        assert "Корзина: 3" in client.get("/about/").content.decode()
      fail: "В шапке любой страницы — сумма количеств: 3."
    - code: |
        assert "Корзина: 0" in client.get("/").content.decode()
      fail: "Пустая корзина — 0."
hints:
  - "Что должна вернуть функция контекст-процессора?"
  - "`cart = request.session.get(\"cart\", {})` и `return {\"cart_count\": sum(cart.values())}`."
explanation: |
  Процессор вызывается при каждой отрисовке шаблона с `request`; возвращённый словарь добавляется к контексту. Так `cart_count` появляется во всех шаблонах без изменения views. Считать нужно сумму значений — количество штук, а не число разных товаров.
settings:
  CONTEXT_PROCESSORS:
    - "shop.context_processors.cart"

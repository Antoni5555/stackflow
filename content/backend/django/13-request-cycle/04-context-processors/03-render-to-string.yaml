title: "Пустая шапка на одной странице"
type: exercise
difficulty: 2
pitfall: "Процессоры работают только при отрисовке с request; render_to_string без request их не вызывает."
statement: |
  На всех страницах шапка «Корзина: N» работает, а на главной `/` всегда «Корзина: 0». Процессор в порядке. Исправьте view главной.
files:
  models.py: |
    from django.db import models


    class Product(models.Model):
        name = models.CharField(max_length=200)
        slug = models.SlugField(unique=True)
        price = models.DecimalField(max_digits=10, decimal_places=2)
        stock = models.PositiveIntegerField(default=0)

        def __str__(self):
            return self.name


    class Order(models.Model):
        class Status(models.TextChoices):
            NEW = "new", "Новый"
            PAID = "paid", "Оплачен"

        number = models.CharField(max_length=20, unique=True)
        email = models.EmailField()
        status = models.CharField(max_length=10, choices=Status, default=Status.NEW)

        def __str__(self):
            return self.number
  views.py: |
    from django.http import HttpResponse
    from django.shortcuts import render
    from django.template.loader import render_to_string


    def add(request, slug):
        cart = request.session.get("cart", {})
        cart[slug] = cart.get(slug, 0) + 1
        request.session["cart"] = cart
        return HttpResponse("ok")


    def home(request):
        return HttpResponse(render_to_string("shop/home.html"))
  urls.py: |
    from django.urls import path

    from . import views

    urlpatterns = [
        path("add/<slug:slug>/", views.add, name="add"),
        path("", views.home, name="home"),
    ]
  context_processors.py: |
    def cart(request):
        cart = request.session.get("cart", {})
        return {"cart_count": sum(cart.values())}
  templates/shop/home.html: |
    <header>Корзина: {{ cart_count|default:0 }}</header>
    <h1>Главная</h1>
setup: |
  Product.objects.create(name="Ноутбук Aster 14", slug="aster-14", price="64990.00", stock=3)
  Product.objects.create(name="Беспроводная мышь", slug="wireless-mouse", price="1499.00", stock=40)
  Product.objects.create(name="Коврик для мыши", slug="mouse-pad", price="490.00", stock=25)
  User.objects.create_user("anna", "anna@shop.example", "anna-pass-1")
  Order.objects.create(number="A-12", email="anna@shop.example")
solution:
  views.py: |
    from django.http import HttpResponse
    from django.shortcuts import render
    from django.template.loader import render_to_string


    def add(request, slug):
        cart = request.session.get("cart", {})
        cart[slug] = cart.get(slug, 0) + 1
        request.session["cart"] = cart
        return HttpResponse("ok")


    def home(request):
        return render(request, "shop/home.html")
check:
  type: django
  tests:
    - code: |
        client.post("/add/wireless-mouse/"); client.post("/add/mouse-pad/")
        assert "Корзина: 2" in client.get("/").content.decode()
      fail: "На главной должна быть «Корзина: 2»: шаблон рисуется без request."
hints:
  - "Получает ли render_to_string запрос?"
  - "`return render(request, \"shop/home.html\")` (или `render_to_string(..., request=request)`)."
explanation: |
  Контекст-процессоры вызываются только для `RequestContext` — когда при отрисовке есть `request`. `render_to_string("…")` без `request=` рисует шаблон с обычным контекстом, и `cart_count` пуст. `render(request, …)` передаёт запрос.
settings:
  CONTEXT_PROCESSORS:
    - "shop.context_processors.cart"

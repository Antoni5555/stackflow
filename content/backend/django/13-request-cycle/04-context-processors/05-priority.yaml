title: "Чья переменная победит"
type: quiz
kind: single
difficulty: 3
pitfall: "Контекст view перекрывает переменные контекст-процессоров с тем же именем."
statement: |
  Процессор возвращает `{"count": 3}` (товаров в корзине), а view — `render(request, "shop/catalog.html", {"count": 120})` (товаров в каталоге). Что выведет `{{ count }}`?
options:
  - "`3`"
  - "`120`"
  - "ошибку: конфликт имён"
  - "пустую строку"
answer: [1]
explanation: |
  Процессоры добавляются в контекст «ниже» словаря view, поэтому значение view перекрывает их. Ошибки нет — шапка просто покажет 120 вместо 3. Переменные процессоров называют однозначно: `cart_count`, а не `count`.

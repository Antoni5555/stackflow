title: "Без CsrfViewMiddleware"
type: quiz
kind: single
difficulty: 2
pitfall: "Удалённый CsrfViewMiddleware выключает защиту от CSRF для всего сайта — ошибок нет, POST без токена проходит."
statement: |
  Разработчик убрал `CsrfViewMiddleware` из `MIDDLEWARE`, «потому что формы не отправлялись». Что произойдёт?
options:
  - "Сайт не запустится: системная проверка"
  - "Все POST-запросы будут отклоняться с 403"
  - "POST без токена будет приниматься — чужой сайт сможет отправлять формы от имени пользователя"
  - "Django включит CSRF-защиту автоматически"
answer: [2]
explanation: |
  Ошибок нет: проверку просто никто не делает. В тренажёре POST без токена с проверяющим клиентом — 403 с middleware и 200 без него. Формы «не отправлялись» из-за отсутствующего `{% csrf_token %}` — чинить нужно шаблон.

title: "DoesNotExist — это 404"
type: exercise
difficulty: 3
pitfall: "process_exception вызывается при исключении во view; вернул ответ — он уйдёт вместо 500."
statement: |
  Старые view используют `Model.objects.get(…)` без `get_object_or_404`, и несуществующий заказ даёт 500. Добавьте в `NotFoundMiddleware` обработку: любое `ObjectDoesNotExist` во view — ответ 404 с текстом «Не найдено». Другие ошибки не трогать.
files:
  models.py: |
    from django.db import models


    class Product(models.Model):
        name = models.CharField(max_length=200)
        slug = models.SlugField(unique=True)
        price = models.DecimalField(max_digits=10, decimal_places=2)
        stock = models.PositiveIntegerField(default=0)

        def __str__(self):
            return self.name


    class Order(models.Model):
        class Status(models.TextChoices):
            NEW = "new", "Новый"
            PAID = "paid", "Оплачен"

        number = models.CharField(max_length=20, unique=True)
        email = models.EmailField()
        status = models.CharField(max_length=10, choices=Status, default=Status.NEW)

        def __str__(self):
            return self.number
  views.py: |
    from django.http import HttpResponse

    from .models import Order


    def order(request, number):
        order = Order.objects.get(number=number)
        return HttpResponse(f"заказ {order.number}")


    def broken(request):
        raise ValueError("сбой")
  urls.py: |
    from django.urls import path

    from . import views

    urlpatterns = [
        path("orders/<str:number>/", views.order, name="order"),
        path("broken/", views.broken, name="broken"),
    ]
  middleware.py: |
    from django.core.exceptions import ObjectDoesNotExist
    from django.http import HttpResponseNotFound


    class NotFoundMiddleware:
        def __init__(self, get_response):
            self.get_response = get_response

        def __call__(self, request):
            return self.get_response(request)
setup: |
  Product.objects.create(name="Ноутбук Aster 14", slug="aster-14", price="64990.00", stock=3)
  Product.objects.create(name="Беспроводная мышь", slug="wireless-mouse", price="1499.00", stock=40)
  Product.objects.create(name="Коврик для мыши", slug="mouse-pad", price="490.00", stock=25)
  User.objects.create_user("anna", "anna@shop.example", "anna-pass-1")
  Order.objects.create(number="A-12", email="anna@shop.example")
solution:
  middleware.py: |
    from django.core.exceptions import ObjectDoesNotExist
    from django.http import HttpResponseNotFound


    class NotFoundMiddleware:
        def __init__(self, get_response):
            self.get_response = get_response

        def __call__(self, request):
            return self.get_response(request)

        def process_exception(self, request, exception):
            if isinstance(exception, ObjectDoesNotExist):
                return HttpResponseNotFound("Не найдено")
check:
  type: django
  tests:
    - code: |
        r = client.get("/orders/A-99/")
        assert r.status_code == 404 and r.content.decode() == "Не найдено"
      fail: "Несуществующий заказ — 404 «Не найдено»."
    - code: |
        assert client.get("/orders/A-12/").content.decode() == "заказ A-12"
      fail: "Существующий заказ открывается."
    - code: |
        from django.test import Client
        r = Client(raise_request_exception=False).get("/broken/")
        assert r.status_code == 500
      fail: "Другие исключения не превращаются в 404 — остаётся 500."
hints:
  - "Какой хук middleware получает исключение из view?"
  - "`def process_exception(self, request, exception)`: `isinstance(exception, ObjectDoesNotExist)` → `HttpResponseNotFound(\"Не найдено\")`."
explanation: |
  `process_exception` вызывается, только если view выбросил исключение. `Order.DoesNotExist` и все `Model.DoesNotExist` наследуются от `ObjectDoesNotExist`. Вернули ответ — Django отдаёт его; вернули `None` — исключение обрабатывается дальше (500). Правильнее, конечно, `get_object_or_404` во view; middleware — страховка для старого кода.
settings:
  MIDDLEWARE:
    - "shop.middleware.NotFoundMiddleware"

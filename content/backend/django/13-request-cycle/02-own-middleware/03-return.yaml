title: "Все страницы — 500"
type: exercise
difficulty: 1
pitfall: "__call__ middleware обязан вернуть ответ — иначе верхние слои получают None."
statement: |
  После подключения `AuditMiddleware`, которое пишет в журнал метод, адрес и статус каждого запроса, все страницы отвечают ошибкой 500. Исправьте middleware.
files:
  models.py: |
    from django.db import models


    class Product(models.Model):
        name = models.CharField(max_length=200)
        slug = models.SlugField(unique=True)
        price = models.DecimalField(max_digits=10, decimal_places=2)
        stock = models.PositiveIntegerField(default=0)

        def __str__(self):
            return self.name


    class Order(models.Model):
        class Status(models.TextChoices):
            NEW = "new", "Новый"
            PAID = "paid", "Оплачен"

        number = models.CharField(max_length=20, unique=True)
        email = models.EmailField()
        status = models.CharField(max_length=10, choices=Status, default=Status.NEW)

        def __str__(self):
            return self.number
  views.py: |
    from django.http import HttpResponse


    def product(request, slug):
        return HttpResponse(f"товар {slug}")
  urls.py: |
    from django.urls import path

    from . import views

    urlpatterns = [
        path("p/<slug:slug>/", views.product, name="product"),
    ]
  middleware.py: |
    import logging

    logger = logging.getLogger("shop.audit")


    class AuditMiddleware:
        def __init__(self, get_response):
            self.get_response = get_response

        def __call__(self, request):
            response = self.get_response(request)
            logger.info("%s %s %s", request.method, request.path, response.status_code)

  Product.objects.create(name="Ноутбук Aster 14", slug="aster-14", price="64990.00", stock=3)
  Product.objects.create(name="Беспроводная мышь", slug="wireless-mouse", price="1499.00", stock=40)
  Product.objects.create(name="Коврик для мыши", slug="mouse-pad", price="490.00", stock=25)
  User.objects.create_user("anna", "anna@shop.example", "anna-pass-1")
  Order.objects.create(number="A-12", email="anna@shop.example")
solution:
  middleware.py: |
    import logging

    logger = logging.getLogger("shop.audit")


    class AuditMiddleware:
        def __init__(self, get_response):
            self.get_response = get_response

        def __call__(self, request):
            response = self.get_response(request)
            logger.info("%s %s %s", request.method, request.path, response.status_code)
            return response
check:
  type: django
  tests:
    - code: |
        r = client.get("/p/aster-14/")
        assert r.status_code == 200 and r.content.decode() == "товар aster-14"
      fail: "Страница должна отвечать 200: __call__ не возвращает ответ."
hints:
  - "Что возвращает __call__, если в нём нет return?"
  - "`return response` в конце `__call__`."
explanation: |
  Функция без `return` возвращает `None`. Middleware выше получают `None` вместо ответа и падают на первом обращении к нему (`'NoneType' object has no attribute 'status_code'`). Каждый `__call__` должен вернуть ответ — полученный от `get_response` или свой.
settings:
  MIDDLEWARE:
    - "shop.middleware.AuditMiddleware"

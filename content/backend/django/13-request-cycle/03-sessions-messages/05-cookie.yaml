title: "Что в cookie sessionid"
type: quiz
kind: single
difficulty: 1
pitfall: "В браузере — только случайный ключ сессии, данные — на сервере."
statement: |
  В корзине гостя лежат 2 мыши и коврик. Что хранится в cookie `sessionid` в браузере (настройки по умолчанию)?
options:
  - "Словарь корзины в JSON"
  - "Случайный ключ, по которому сервер находит запись в таблице `django_session`"
  - "Подписанный словарь корзины"
  - "id пользователя"
answer: [1]
explanation: |
  С движком по умолчанию (`django.contrib.sessions.backends.db`) данные лежат в таблице `django_session`, а браузер хранит только ключ. Хранить данные в самой cookie можно движком `signed_cookies` — они подписаны (не подделать), но видны пользователю. У гостя пользователя нет вовсе.

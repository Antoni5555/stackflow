title: "Товар добавлен"
type: exercise
difficulty: 1
pitfall: "Сообщение ставят перед redirect, показывают на следующей странице — один раз."
statement: |
  После добавления товара покупатель должен увидеть на странице корзины сообщение «<название> добавлен в корзину» (уровень success). Сообщение показывается один раз. Шаблон уже выводит `messages`.
files:
  models.py: |
    from django.db import models


    class Product(models.Model):
        name = models.CharField(max_length=200)
        slug = models.SlugField(unique=True)
        price = models.DecimalField(max_digits=10, decimal_places=2)
        stock = models.PositiveIntegerField(default=0)

        def __str__(self):
            return self.name


    class Order(models.Model):
        class Status(models.TextChoices):
            NEW = "new", "Новый"
            PAID = "paid", "Оплачен"

        number = models.CharField(max_length=20, unique=True)
        email = models.EmailField()
        status = models.CharField(max_length=10, choices=Status, default=Status.NEW)

        def __str__(self):
            return self.number
  views.py: |
    from django.contrib import messages
    from django.shortcuts import get_object_or_404, redirect, render

    from .models import Product


    def add_to_cart(request, slug):
        product = get_object_or_404(Product, slug=slug)
        cart = request.session.get("cart", {})
        cart[slug] = cart.get(slug, 0) + 1
        request.session["cart"] = cart
        return redirect("cart")


    def cart(request):
        cart = request.session.get("cart", {})
        return render(request, "shop/cart.html", {"cart": cart})
  urls.py: |
    from django.urls import path

    from . import views

    urlpatterns = [
        path("cart/add/<slug:slug>/", views.add_to_cart, name="add"),
        path("cart/", views.cart, name="cart"),
    ]
  templates/shop/cart.html: |
    {% for m in messages %}<p class="{{ m.tags }}">{{ m }}</p>{% endfor %}
    <ul>{% for slug, qty in cart.items %}<li>{{ slug }}: {{ qty }}</li>{% endfor %}</ul>
setup: |
  Product.objects.create(name="Ноутбук Aster 14", slug="aster-14", price="64990.00", stock=3)
  Product.objects.create(name="Беспроводная мышь", slug="wireless-mouse", price="1499.00", stock=40)
  Product.objects.create(name="Коврик для мыши", slug="mouse-pad", price="490.00", stock=25)
  User.objects.create_user("anna", "anna@shop.example", "anna-pass-1")
  Order.objects.create(number="A-12", email="anna@shop.example")
solution:
  views.py: |
    from django.contrib import messages
    from django.shortcuts import get_object_or_404, redirect, render

    from .models import Product


    def add_to_cart(request, slug):
        product = get_object_or_404(Product, slug=slug)
        cart = request.session.get("cart", {})
        cart[slug] = cart.get(slug, 0) + 1
        request.session["cart"] = cart
        messages.success(request, f"{product.name} добавлен в корзину")
        return redirect("cart")


    def cart(request):
        cart = request.session.get("cart", {})
        return render(request, "shop/cart.html", {"cart": cart})
check:
  type: django
  tests:
    - code: |
        r = client.post("/cart/add/wireless-mouse/", follow=True)
        html = r.content.decode()
        assert '<p class="success">Беспроводная мышь добавлен в корзину</p>' in html
      fail: "После добавления — сообщение success «Беспроводная мышь добавлен в корзину»."
    - code: |
        client.post("/cart/add/wireless-mouse/", follow=True)
        assert "добавлен в корзину" not in client.get("/cart/").content.decode()
      fail: "Сообщение показывается один раз — на следующем открытии корзины его нет."
hints:
  - "Какой модуль Django хранит одноразовые уведомления?"
  - "`messages.success(request, f\"{product.name} добавлен в корзину\")` перед redirect."
explanation: |
  `messages.success` кладёт сообщение в хранилище; после redirect страница корзины перебирает `messages` в шаблоне, и сообщение помечается прочитанным — на следующей странице его уже нет. `m.tags` — уровень (`success`) для CSS-класса.

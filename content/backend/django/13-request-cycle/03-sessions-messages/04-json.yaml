title: "Недавно просмотренные"
type: exercise
difficulty: 2
pitfall: "Сессия хранит JSON: Decimal и объекты моделей не сериализуются — храните строки и числа."
statement: |
  Блок «Вы смотрели» хранит в сессии последние товары: slug, название и цену. Страница товара `/products/<slug>/` падает с ошибкой 500 (`TypeError: Object of type Decimal is not JSON serializable`). Исправьте view: цена в сессии — строкой, как её показывает база («1499.00»).
files:
  models.py: |
    from django.db import models


    class Product(models.Model):
        name = models.CharField(max_length=200)
        slug = models.SlugField(unique=True)
        price = models.DecimalField(max_digits=10, decimal_places=2)
        stock = models.PositiveIntegerField(default=0)

        def __str__(self):
            return self.name


    class Order(models.Model):
        class Status(models.TextChoices):
            NEW = "new", "Новый"
            PAID = "paid", "Оплачен"

        number = models.CharField(max_length=20, unique=True)
        email = models.EmailField()
        status = models.CharField(max_length=10, choices=Status, default=Status.NEW)

        def __str__(self):
            return self.number
  views.py: |
    from django.shortcuts import get_object_or_404, render

    from .models import Product


    def product(request, slug):
        product = get_object_or_404(Product, slug=slug)
        seen = request.session.get("seen", [])
        seen = [s for s in seen if s["slug"] != slug][-4:]
        seen.append({"slug": slug, "name": product.name, "price": product.price})
        request.session["seen"] = seen
        return render(request, "shop/product.html", {"product": product, "seen": seen})
  urls.py: |
    from django.urls import path

    from . import views

    urlpatterns = [
        path("products/<slug:slug>/", views.product, name="product"),
    ]
  templates/shop/product.html: |
    <h1>{{ product.name }}</h1>
    <ul>{% for s in seen %}<li>{{ s.name }} — {{ s.price }}</li>{% endfor %}</ul>
setup: |
  Product.objects.create(name="Ноутбук Aster 14", slug="aster-14", price="64990.00", stock=3)
  Product.objects.create(name="Беспроводная мышь", slug="wireless-mouse", price="1499.00", stock=40)
  Product.objects.create(name="Коврик для мыши", slug="mouse-pad", price="490.00", stock=25)
  User.objects.create_user("anna", "anna@shop.example", "anna-pass-1")
  Order.objects.create(number="A-12", email="anna@shop.example")
solution:
  views.py: |
    from django.shortcuts import get_object_or_404, render

    from .models import Product


    def product(request, slug):
        product = get_object_or_404(Product, slug=slug)
        seen = request.session.get("seen", [])
        seen = [s for s in seen if s["slug"] != slug][-4:]
        seen.append({"slug": slug, "name": product.name, "price": str(product.price)})
        request.session["seen"] = seen
        return render(request, "shop/product.html", {"product": product, "seen": seen})
check:
  type: django
  tests:
    - code: |
        r = client.get("/products/wireless-mouse/")
        assert r.status_code == 200
      fail: "Страница падает: Decimal нельзя сохранить в сессии."
    - code: |
        client.get("/products/wireless-mouse/")
        html = client.get("/products/aster-14/").content.decode()
        assert "Беспроводная мышь — 1499.00" in html
        assert client.session["seen"][0] == {"slug": "wireless-mouse", "name": "Беспроводная мышь", "price": "1499.00"}
      fail: "В сессии — цена строкой «1499.00», на странице — «Беспроводная мышь — 1499.00»."
hints:
  - "В каком формате сессия сохраняет данные?"
  - "`\"price\": str(product.price)`."
explanation: |
  По умолчанию сессия сериализуется в JSON (`JSONSerializer`): строки, числа, списки, словари. `Decimal`, даты и объекты моделей — `TypeError … is not JSON serializable`. Цену храните строкой (а для оформления заказа всё равно берите её из базы), объект — его `id` или `slug`.

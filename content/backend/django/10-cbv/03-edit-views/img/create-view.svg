<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" class="fig" role="img" aria-labelledby="t"><title id="t">CreateView: GET — пустая форма, POST — проверка, form_valid или form_invalid</title>
<style>

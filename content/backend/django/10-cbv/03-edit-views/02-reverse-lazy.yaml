title: "Циклический импорт"
type: exercise
difficulty: 2
pitfall: "В атрибутах класса адрес по имени — reverse_lazy: reverse() выполнится до загрузки маршрутов."
statement: |
  После добавления `ReviewUpdate` проект перестал запускаться: «The included URLconf 'shop.urls' does not appear to have any patterns in it». Исправьте view: после сохранения — переход в каталог.
files:
  models.py: |
    from django.core.validators import MaxValueValidator, MinValueValidator
    from django.db import models
    from django.urls import reverse


    class Category(models.Model):
        name = models.CharField(max_length=100)

        def __str__(self):
            return self.name


    class Product(models.Model):
        category = models.ForeignKey(
            Category, on_delete=models.PROTECT, related_name="products"
        )
        name = models.CharField(max_length=200)
        slug = models.SlugField(unique=True)
        price = models.DecimalField(max_digits=10, decimal_places=2)
        stock = models.PositiveIntegerField(default=0)

        def __str__(self):
            return self.name

        def get_absolute_url(self):
            return reverse("product", kwargs={"slug": self.slug})


    class Review(models.Model):
        product = models.ForeignKey(
            Product, on_delete=models.CASCADE, related_name="reviews"
        )
        author = models.CharField(max_length=100)
        rating = models.PositiveSmallIntegerField(
            validators=[MinValueValidator(1), MaxValueValidator(5)]
        )
        text = models.TextField(blank=True)

        def __str__(self):
            return f"{self.author}: {self.rating}"
  views.py: |
    from django.urls import reverse
    from django.views.generic import UpdateView

    from .models import Review


    class ReviewUpdate(UpdateView):
        model = Review
        fields = ["rating", "text"]
        success_url = reverse("catalog")
  urls.py: |
    from django.http import HttpResponse
    from django.urls import path

    from . import views

    urlpatterns = [
        path("catalog/", lambda request: HttpResponse("каталог"), name="catalog"),
        path("reviews/<int:pk>/edit/", views.ReviewUpdate.as_view(), name="review_edit"),
    ]
  templates/shop/review_form.html: |
    <form method="post">{% csrf_token %}{{ form.as_p }}<button>Сохранить</button></form>
setup: |
  laptops = Category.objects.create(name="Ноутбуки")
  mice = Category.objects.create(name="Мыши")
  Product.objects.create(category=laptops, name="Ноутбук Aster 14", slug="aster-14", price="64990.00", stock=3)
  mouse = Product.objects.create(category=mice, name="Беспроводная мышь", slug="wireless-mouse", price="1499.00", stock=40)
  Product.objects.create(category=mice, name="Игровая мышь", slug="gaming-mouse", price="3490.00", stock=0)
  Product.objects.create(category=mice, name="Коврик для мыши", slug="mouse-pad", price="490.00", stock=25)
  Product.objects.create(category=laptops, name="Подставка для ноутбука", slug="laptop-stand", price="2190.00", stock=7)
  Review.objects.create(product=mouse, author="Анна", rating=5, text="Удобная")
solution:
  views.py: |
    from django.urls import reverse_lazy
    from django.views.generic import UpdateView

    from .models import Review


    class ReviewUpdate(UpdateView):
        model = Review
        fields = ["rating", "text"]
        success_url = reverse_lazy("catalog")
check:
  type: django
  tests:
    - code: |
        r = Review.objects.get(author="Анна")
        resp = client.post(f"/reviews/{r.pk}/edit/", {"rating": "3", "text": "Шумная"})
        assert resp.status_code == 302 and resp["Location"] == "/catalog/"
      fail: "После сохранения — редирект на /catalog/."
    - code: |
        r = Review.objects.get(author="Анна")
        client.post(f"/reviews/{r.pk}/edit/", {"rating": "3", "text": "Шумная"})
        r.refresh_from_db()
        assert r.rating == 3
      fail: "Изменения отзыва должны сохраняться."
hints:
  - "Когда выполняется выражение в атрибуте класса?"
  - "`success_url = reverse_lazy(\"catalog\")`."
explanation: |
  `urls.py` импортирует `views.py`, и при этом выполняется тело класса — `reverse("catalog")` пытается найти маршрут в ещё не загруженном `urls.py`. Django видит модуль без `urlpatterns` и сообщает о вероятном циклическом импорте. `reverse_lazy` откладывает поиск до первого использования адреса — при редиректе.

title: "Отзыв без товара"
type: exercise
difficulty: 2
pitfall: "Поля, которых нет в форме CreateView, заполняют в form_valid до super().form_valid()."
statement: |
  Форма отзыва `/products/<slug>/review/` на `CreateView` при отправке падает: `NOT NULL constraint failed: shop_review.product_id`. Исправьте view: отзыв сохраняется у товара из адреса, после — переход на карточку товара.
files:
  models.py: |
    from django.core.validators import MaxValueValidator, MinValueValidator
    from django.db import models
    from django.urls import reverse


    class Category(models.Model):
        name = models.CharField(max_length=100)

        def __str__(self):
            return self.name


    class Product(models.Model):
        category = models.ForeignKey(
            Category, on_delete=models.PROTECT, related_name="products"
        )
        name = models.CharField(max_length=200)
        slug = models.SlugField(unique=True)
        price = models.DecimalField(max_digits=10, decimal_places=2)
        stock = models.PositiveIntegerField(default=0)

        def __str__(self):
            return self.name

        def get_absolute_url(self):
            return reverse("product", kwargs={"slug": self.slug})


    class Review(models.Model):
        product = models.ForeignKey(
            Product, on_delete=models.CASCADE, related_name="reviews"
        )
        author = models.CharField(max_length=100)
        rating = models.PositiveSmallIntegerField(
            validators=[MinValueValidator(1), MaxValueValidator(5)]
        )
        text = models.TextField(blank=True)

        def __str__(self):
            return f"{self.author}: {self.rating}"
  views.py: |
    from django.shortcuts import get_object_or_404
    from django.views.generic import CreateView

    from .models import Product, Review


    class ReviewCreate(CreateView):
        model = Review
        fields = ["author", "rating", "text"]

        def get_success_url(self):
            return self.object.product.get_absolute_url()
  urls.py: |
    from django.urls import path

    from . import views

    urlpatterns = [
        path("products/<slug:slug>/", views.ReviewCreate.as_view(), name="product"),
        path("products/<slug:slug>/review/", views.ReviewCreate.as_view(), name="review_add"),
    ]
  templates/shop/review_form.html: |
    <form method="post">{% csrf_token %}{{ form.as_p }}<button>Сохранить</button></form>
setup: |
  laptops = Category.objects.create(name="Ноутбуки")
  mice = Category.objects.create(name="Мыши")
  Product.objects.create(category=laptops, name="Ноутбук Aster 14", slug="aster-14", price="64990.00", stock=3)
  mouse = Product.objects.create(category=mice, name="Беспроводная мышь", slug="wireless-mouse", price="1499.00", stock=40)
  Product.objects.create(category=mice, name="Игровая мышь", slug="gaming-mouse", price="3490.00", stock=0)
  Product.objects.create(category=mice, name="Коврик для мыши", slug="mouse-pad", price="490.00", stock=25)
  Product.objects.create(category=laptops, name="Подставка для ноутбука", slug="laptop-stand", price="2190.00", stock=7)
  Review.objects.create(product=mouse, author="Анна", rating=5, text="Удобная")
solution:
  views.py: |
    from django.shortcuts import get_object_or_404
    from django.views.generic import CreateView

    from .models import Product, Review


    class ReviewCreate(CreateView):
        model = Review
        fields = ["author", "rating", "text"]

        def form_valid(self, form):
            form.instance.product = get_object_or_404(
                Product, slug=self.kwargs["slug"]
            )
            return super().form_valid(form)

        def get_success_url(self):
            return self.object.product.get_absolute_url()
check:
  type: django
  tests:
    - code: |
        r = client.post("/products/aster-14/review/", {"author": "Борис", "rating": "4", "text": ""})
        assert r.status_code == 302 and r["Location"] == "/products/aster-14/"
      fail: "После отправки — редирект на карточку товара /products/aster-14/."
    - code: |
        client.post("/products/aster-14/review/", {"author": "Борис", "rating": "4", "text": ""})
        assert Review.objects.filter(author="Борис", product__slug="aster-14").exists()
      fail: "Отзыв должен сохраниться у товара из адреса."
    - code: |
        r = client.post("/products/nope/review/", {"author": "Борис", "rating": "4", "text": ""})
        assert r.status_code == 404
      fail: "Для несуществующего товара — 404."
hints:
  - "Какой метод CreateView вызывается, когда форма прошла проверку?"
  - "`form_valid(self, form)`: `form.instance.product = …`, затем `return super().form_valid(form)`."
explanation: |
  `super().form_valid(form)` сохраняет `form.save()` — объект из полей формы, а товара среди них нет. В `form_valid` объект доступен как `form.instance`: ставим товар по `self.kwargs["slug"]` (несуществующий — 404) и вызываем родителя, который сохранит и перенаправит на `get_success_url()`.

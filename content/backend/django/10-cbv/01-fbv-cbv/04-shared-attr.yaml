title: "Чужие просмотры"
type: exercise
difficulty: 3
pitfall: "Атрибут класса view — один на все запросы и всех пользователей; данные пользователя — в сессии."
statement: |
  На странице товара `/products/<slug>/` блок «Вы смотрели» показывает товары, которые открывал посетитель. Новый посетитель уже видит в нём чужие товары. Исправьте view: у каждого посетителя — свой список (храните его в `request.session`).
files:
  models.py: |
    from django.core.validators import MaxValueValidator, MinValueValidator
    from django.db import models
    from django.urls import reverse


    class Category(models.Model):
        name = models.CharField(max_length=100)

        def __str__(self):
            return self.name


    class Product(models.Model):
        category = models.ForeignKey(
            Category, on_delete=models.PROTECT, related_name="products"
        )
        name = models.CharField(max_length=200)
        slug = models.SlugField(unique=True)
        price = models.DecimalField(max_digits=10, decimal_places=2)
        stock = models.PositiveIntegerField(default=0)

        def __str__(self):
            return self.name

        def get_absolute_url(self):
            return reverse("product", kwargs={"slug": self.slug})


    class Review(models.Model):
        product = models.ForeignKey(
            Product, on_delete=models.CASCADE, related_name="reviews"
        )
        author = models.CharField(max_length=100)
        rating = models.PositiveSmallIntegerField(
            validators=[MinValueValidator(1), MaxValueValidator(5)]
        )
        text = models.TextField(blank=True)

        def __str__(self):
            return f"{self.author}: {self.rating}"
  views.py: |
    from django.shortcuts import get_object_or_404, render
    from django.views import View

    from .models import Product


    class ProductPage(View):
        recent = []

        def get(self, request, slug):
            product = get_object_or_404(Product, slug=slug)
            shown = list(self.recent)
            if product.name not in self.recent:
                self.recent.append(product.name)
            return render(request, "shop/product.html", {"product": product, "recent": shown})
  urls.py: |
    from django.urls import path

    from . import views

    urlpatterns = [
        path("products/<slug:slug>/", views.ProductPage.as_view(), name="product"),
    ]
  templates/shop/product.html: |
    <h1>{{ product.name }}</h1>
    <p>Вы смотрели: {% for name in recent %}{{ name }}; {% endfor %}</p>
setup: |
  laptops = Category.objects.create(name="Ноутбуки")
  mice = Category.objects.create(name="Мыши")
  Product.objects.create(category=laptops, name="Ноутбук Aster 14", slug="aster-14", price="64990.00", stock=3)
  mouse = Product.objects.create(category=mice, name="Беспроводная мышь", slug="wireless-mouse", price="1499.00", stock=40)
  Product.objects.create(category=mice, name="Игровая мышь", slug="gaming-mouse", price="3490.00", stock=0)
  Product.objects.create(category=mice, name="Коврик для мыши", slug="mouse-pad", price="490.00", stock=25)
  Product.objects.create(category=laptops, name="Подставка для ноутбука", slug="laptop-stand", price="2190.00", stock=7)
  Review.objects.create(product=mouse, author="Анна", rating=5, text="Удобная")
solution:
  views.py: |
    from django.shortcuts import get_object_or_404, render
    from django.views import View

    from .models import Product


    class ProductPage(View):
        def get(self, request, slug):
            product = get_object_or_404(Product, slug=slug)
            recent = request.session.get("recent", [])
            shown = list(recent)
            if product.name not in recent:
                recent.append(product.name)
            request.session["recent"] = recent
            return render(request, "shop/product.html", {"product": product, "recent": shown})
check:
  type: django
  tests:
    - code: |
        from django.test import Client
        Client().get("/products/aster-14/")
        html = Client().get("/products/mouse-pad/").content.decode()
        assert "Вы смотрели: </p>" in html
      fail: "Новый посетитель видит товары, которые смотрел другой: список хранится в атрибуте класса, общем для всех."
    - code: |
        client.get("/products/aster-14/")
        client.get("/products/mouse-pad/")
        html = client.get("/products/laptop-stand/").content.decode()
        assert "Вы смотрели: Ноутбук Aster 14; Коврик для мыши; </p>" in html
      fail: "Свои просмотренные товары посетитель должен видеть по порядку."
hints:
  - "Сколько раз создаётся список `recent = []` в классе?"
  - "Список — в `request.session.get(\"recent\", [])`, после изменения — `request.session[\"recent\"] = recent`."
explanation: |
  Объект view новый на каждый запрос, но атрибут класса `recent = []` создан один раз при импорте модуля и общий для всех запросов и посетителей. Данные посетителя хранят в сессии: она своя у каждого браузера. Список изменили — присвоили обратно в `request.session`, чтобы сессия сохранилась.

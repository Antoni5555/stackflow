title: "Каталог по страницам"
type: exercise
difficulty: 2
pitfall: "paginate_by делит список на страницы по ?page=; без ordering порядок между страницами не гарантирован."
statement: |
  Каталог `/catalog/` должен показывать по 2 товара на странице, от дешёвых к дорогим; номер страницы — `?page=N`. Сейчас все товары выводятся одним списком в порядке добавления.
files:
  models.py: |
    from django.core.validators import MaxValueValidator, MinValueValidator
    from django.db import models
    from django.urls import reverse


    class Category(models.Model):
        name = models.CharField(max_length=100)

        def __str__(self):
            return self.name


    class Product(models.Model):
        category = models.ForeignKey(
            Category, on_delete=models.PROTECT, related_name="products"
        )
        name = models.CharField(max_length=200)
        slug = models.SlugField(unique=True)
        price = models.DecimalField(max_digits=10, decimal_places=2)
        stock = models.PositiveIntegerField(default=0)

        def __str__(self):
            return self.name

        def get_absolute_url(self):
            return reverse("product", kwargs={"slug": self.slug})


    class Review(models.Model):
        product = models.ForeignKey(
            Product, on_delete=models.CASCADE, related_name="reviews"
        )
        author = models.CharField(max_length=100)
        rating = models.PositiveSmallIntegerField(
            validators=[MinValueValidator(1), MaxValueValidator(5)]
        )
        text = models.TextField(blank=True)

        def __str__(self):
            return f"{self.author}: {self.rating}"
  views.py: |
    from django.views.generic import ListView

    from .models import Product


    class ProductList(ListView):
        model = Product
  urls.py: |
    from django.urls import path

    from . import views

    urlpatterns = [
        path("catalog/", views.ProductList.as_view(), name="catalog"),
    ]
  templates/shop/product_list.html: |
    <ul>
      {% for p in product_list %}
        <li>{{ p.name }}</li>
      {% endfor %}
    </ul>
setup: |
  laptops = Category.objects.create(name="Ноутбуки")
  mice = Category.objects.create(name="Мыши")
  Product.objects.create(category=laptops, name="Ноутбук Aster 14", slug="aster-14", price="64990.00", stock=3)
  mouse = Product.objects.create(category=mice, name="Беспроводная мышь", slug="wireless-mouse", price="1499.00", stock=40)
  Product.objects.create(category=mice, name="Игровая мышь", slug="gaming-mouse", price="3490.00", stock=0)
  Product.objects.create(category=mice, name="Коврик для мыши", slug="mouse-pad", price="490.00", stock=25)
  Product.objects.create(category=laptops, name="Подставка для ноутбука", slug="laptop-stand", price="2190.00", stock=7)
  Review.objects.create(product=mouse, author="Анна", rating=5, text="Удобная")
solution:
  views.py: |
    from django.views.generic import ListView

    from .models import Product


    class ProductList(ListView):
        model = Product
        paginate_by = 2
        ordering = ["price"]
check:
  type: django
  tests:
    - code: |
        html = client.get("/catalog/").content.decode()
        assert html.index("Коврик для мыши") < html.index("Беспроводная мышь")
        assert "Подставка" not in html and "Aster" not in html
      fail: "На первой странице — два самых дешёвых товара: коврик и беспроводная мышь."
    - code: |
        html = client.get("/catalog/?page=3").content.decode()
        assert "Ноутбук Aster 14" in html and "мышь" not in html
      fail: "На третьей странице — самый дорогой товар, Aster 14."
    - code: |
        assert client.get("/catalog/?page=9").status_code == 404
      fail: "Несуществующая страница — 404."
hints:
  - "Какие два атрибута ListView задают страницы и порядок?"
  - "`paginate_by = 2` и `ordering = [\"price\"]`."
explanation: |
  `paginate_by` включает `Paginator`: в `product_list` — только товары текущей страницы, номер — из `?page=`, неверный номер — 404. `ordering` нужен обязательно: без порядка база вправе возвращать строки по-разному, и товары будут повторяться или пропадать между страницами (Django предупреждает `UnorderedObjectListWarning`).

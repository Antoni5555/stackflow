</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fig-ah"/></marker></defs>
<text x="20" y="24" text-anchor="start" class="fig-cs">ListView: model = Product</text>
<rect x="20" y="36" width="390" height="38" rx="12" class="fig-box2"/>
<text x="215.0" y="60.0" text-anchor="middle" class="fig-cs">get_queryset(): Product.objects.all() + ordering</text>
<rect x="20" y="82" width="390" height="38" rx="12" class="fig-box2"/>
<text x="215.0" y="106.0" text-anchor="middle" class="fig-cs">шаблон shop/product_list.html</text>
<rect x="20" y="128" width="390" height="38" rx="12" class="fig-box2"/>
<text x="215.0" y="152.0" text-anchor="middle" class="fig-cs">контекст: product_list, object_list, page_obj</text>
<text x="450" y="24" text-anchor="start" class="fig-cs">DetailView: model = Product</text>
<rect x="450" y="36" width="390" height="38" rx="12" class="fig-box2"/>
<text x="645.0" y="60.0" text-anchor="middle" class="fig-cs">slug из адреса → поиск в get_queryset()</text>
<rect x="450" y="82" width="390" height="38" rx="12" class="fig-box2"/>
<text x="645.0" y="106.0" text-anchor="middle" class="fig-cs">нет → 404; есть → shop/product_detail.html</text>
<rect x="450" y="128" width="390" height="38" rx="12" class="fig-ok"/>
<text x="645.0" y="152.0" text-anchor="middle" class="fig-cs">контекст: product, object</text>
<text x="20" y="210" text-anchor="start" class="fig-t">Свой запрос — get_queryset(), свои данные — get_context_data() с super().</text>
<text x="20" y="238" text-anchor="start" class="fig-s">Другие имена — template_name, context_object_name, slug_url_kwarg.</text>
</svg>

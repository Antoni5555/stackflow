title: add() для позиции заказа
type: exercise
difficulty: 2
pitfall: add() у связи через модель-связку не знает значений её полей — IntegrityError на NOT NULL.
statement: |
  `add_to_order(order, product, quantity)` из `queries.py` падает: `IntegrityError: NOT NULL constraint failed: shop_orderitem.quantity`. Исправьте функцию: позиция создаётся с переданным количеством и текущей ценой товара.
files:
  models.py: |
    from django.db import models


    class Product(models.Model):
        name = models.CharField(max_length=200)
        price = models.DecimalField(max_digits=10, decimal_places=2)


    class Order(models.Model):
        number = models.CharField(max_length=20, unique=True)
        products = models.ManyToManyField(Product, through="OrderItem")


    class OrderItem(models.Model):
        order = models.ForeignKey(
            Order, on_delete=models.CASCADE, related_name="items"
        )
        product = models.ForeignKey(Product, on_delete=models.PROTECT)
        quantity = models.PositiveIntegerField()
        price = models.DecimalField(max_digits=10, decimal_places=2)
  queries.py: |
    def add_to_order(order, product, quantity):
        order.products.add(product)
  urls.py: |
    from django.urls import path

    urlpatterns = []
setup: |
  Product.objects.create(name="Беспроводная мышь", price="1499.00")
  Order.objects.create(number="A-12")
solution:
  queries.py: |
    from .models import OrderItem


    def add_to_order(order, product, quantity):
        OrderItem.objects.create(
            order=order, product=product,
            quantity=quantity, price=product.price,
        )
check:
  type: django
  tests:
    - code: |
        from decimal import Decimal
        from shop.queries import add_to_order
        order, mouse = Order.objects.get(), Product.objects.get()
        add_to_order(order, mouse, 3)
        item = order.items.get()
        assert (item.product, item.quantity, item.price) == (mouse, 3, Decimal("1499.00"))
      fail: "Позиция должна появиться с количеством 3 и ценой товара 1499.00 — add() не знает значений полей OrderItem."
hints:
  - "Кто знает про `quantity` и `price` — менеджер `order.products` или модель `OrderItem`?"
  - "`OrderItem.objects.create(order=…, product=…, quantity=…, price=product.price)` (или `add(…, through_defaults={…})`)."
explanation: |
  Для связи через `through` менеджер `order.products` умеет только записать пару «заказ — товар», а `quantity` и `price` — обязательные поля модели-связки. Позицию создают через саму модель `OrderItem` — так видно все её поля. Вариант с `add(product, through_defaults={"quantity": quantity, "price": product.price})` тоже работает.

title: Профиль или поля
type: quiz
kind: single
difficulty: 2
pitfall: Связь 1:1 — лишний запрос при каждом обращении; без причины её не заводят.
statement: |
  В модели `Product` (своя модель магазина) нужно хранить вес и габариты для расчёта доставки — они есть у каждого товара и нужны на каждой странице оформления заказа. Как лучше?
options:
  - "Модель `ProductDimensions` с `OneToOneField` на товар"
  - "Поля `weight`, `width`, `height`, `depth` прямо в `Product`"
  - "`ManyToManyField` на модель `Dimensions`"
  - "JSON-строка в `TextField` товара"
answer: [1]
explanation: |
  Данные есть у каждого товара и нужны часто, а модель `Product` — своя, её можно менять. Значит, это обычные поля: без лишней таблицы и лишнего запроса. `OneToOneField` нужен, когда основную модель менять нельзя (`User`), когда данные нужны редко или есть не у всех объектов. JSON лишает базу типов и проверок.

title: Электронные и обычные товары
type: quiz
kind: single
difficulty: 2
pitfall: Многотабличное наследование нужно, только когда подтипы должны быть в одном общем списке; иначе это лишний JOIN.
statement: |
  У электронных книг есть размер файла и ссылка на скачивание, у обычных товаров — вес. В каталоге, корзине и заказах электронные и обычные товары должны быть **в одном списке** и ссылаться на них должна одна позиция заказа. Что подходит?
options:
  - "Абстрактная модель `BaseProduct` и две отдельные модели `EBook` и `PhysicalProduct`"
  - "Многотабличное наследование: `Product` и наследник `EBook` со своими полями"
  - "Прокси-модель `EBook` с полями `file_size_mb` и `download_url`"
  - "Две несвязанные модели и два списка в каталоге"
answer: [1]
explanation: |
  Общий список и одна связь из `OrderItem` — значит, нужна общая таблица товаров: при абстрактной модели таблиц две, и позиция заказа не сможет ссылаться на «любой товар» одним `ForeignKey`. У прокси нельзя добавить поля. Многотабличное наследование даёт общий `Product` и отдельную таблицу со своими полями книги — ценой `JOIN` при чтении книг.

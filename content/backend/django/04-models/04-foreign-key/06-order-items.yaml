title: Позиции удалённого заказа
type: quiz
kind: single
difficulty: 1
pitfall: Позиция без заказа не имеет смысла — ей подходит CASCADE, а справочникам — PROTECT.
statement: |
  `OrderItem` — позиция заказа: товар, количество, цена. Какое `on_delete` выбрать для поля `order = models.ForeignKey(Order, …)`?
options:
  - "`CASCADE` — удалить позиции вместе с заказом"
  - "`PROTECT` — нельзя удалить заказ с позициями"
  - "`SET_NULL` — позиции останутся без заказа"
  - "`DO_NOTHING` — пусть решает база"
answer: [0]
explanation: |
  Позиция — часть заказа и без него не нужна: `CASCADE`. `PROTECT` заставил бы удалять позиции вручную перед каждым заказом. `SET_NULL` оставил бы «ничьи» строки, которые никто не покажет. А вот у поля `product` в той же позиции — `PROTECT`: товар, который уже покупали, удалять нельзя — его снимают с продажи.

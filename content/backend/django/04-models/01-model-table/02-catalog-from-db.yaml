title: Каталог не видит новых товаров
type: exercise
difficulty: 1
pitfall: Список в коде не знает о строках в базе — страница показывает устаревшие данные.
statement: |
  Менеджер добавил в базу коврик для мыши, но каталог его не показывает: view до сих пор берёт товары из списка в коде. Выводите товары из модели `Product`.
files:
  models.py: |
    from django.db import models


    class Product(models.Model):
        name = models.CharField(max_length=200)
        price = models.DecimalField(max_digits=10, decimal_places=2)
        stock = models.PositiveIntegerField(default=0)
  views.py: |
    from django.shortcuts import render

    PRODUCTS = [
        {"name": "Беспроводная мышь", "price": 1499},
    ]


    def catalog(request):
        return render(request, "shop/catalog.html", {"products": PRODUCTS})
  urls.py: |
    from django.urls import path

    from . import views

    urlpatterns = [
        path("catalog/", views.catalog),
    ]
  templates/shop/catalog.html: |
    <ul>
      {% for product in products %}
        <li>{{ product.name }} — {{ product.price }} ₽</li>
      {% endfor %}
    </ul>
setup: |
  Product.objects.create(name="Беспроводная мышь", price="1499.00", stock=40)
  Product.objects.create(name="Коврик для мыши", price="490.00", stock=100)
solution:
  views.py: |
    from django.shortcuts import render

    from .models import Product


    def catalog(request):
        products = Product.objects.all()
        return render(request, "shop/catalog.html", {"products": products})
check:
  type: django
  tests:
    - code: |
        assert "Коврик для мыши" in client.get("/catalog/").content.decode()
      fail: "Коврика в каталоге нет — товары берутся не из базы, а из списка в коде."
    - code: |
        with max_queries(1):
            client.get("/catalog/")
      fail: Каталогу хватит одного SQL-запроса.
hints:
  - "Какой менеджер у модели `Product` возвращает все строки таблицы?"
  - "`from .models import Product` и `Product.objects.all()`."
explanation: |
  `Product.objects.all()` — один `SELECT` по таблице `shop_product`: страница показывает то, что сейчас в базе, включая товары, добавленные после выкладки кода. Шаблон не меняется: `product.name` работает и для словаря, и для объекта модели.

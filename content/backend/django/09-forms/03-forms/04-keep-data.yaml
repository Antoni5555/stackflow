solution:
  views.py: |
    from django.shortcuts import redirect, render

    from .forms import FeedbackForm


    def feedback(request):
        if request.method == "POST":
            form = FeedbackForm(request.POST)
            if form.is_valid():
                return redirect("thanks")
        else:
            form = FeedbackForm()
        return render(request, "shop/feedback.html", {"form": form})


    def thanks(request):
        return render(request, "shop/thanks.html")
check:
  type: django
  tests:
    - code: |
        r = client.post("/feedback/", {"name": "Анна", "email": "anna@", "message": "Где мой заказ?"})
        html = r.content.decode()
        assert "Введите правильный адрес электронной почты." in html
      fail: "При неверной почте на странице должно быть сообщение об ошибке."
    - code: |
        r = client.post("/feedback/", {"name": "Анна", "email": "anna@", "message": "Где мой заказ?"})
        html = r.content.decode()
        assert 'value="Анна"' in html and "Где мой заказ?" in html
      fail: "Введённые значения должны остаться в полях."
    - code: |
        assert client.post("/feedback/", {"name": "Анна", "email": "anna@shop.example", "message": "Где мой заказ?"}).status_code == 302
      fail: "Верная форма по-прежнему перенаправляет на /thanks/."
hints:
  - "Какой объект формы попадает в шаблон, если is_valid() вернул False?"
  - "Уберите `form = FeedbackForm()` из ветки POST."
explanation: |
  Ошибки и введённые значения хранит объект формы, созданный из `request.POST` и проверенный `is_valid()`. Новый `FeedbackForm()` — пустая несвязанная форма. При ошибках в шаблон передают ту же форму, которую проверяли.

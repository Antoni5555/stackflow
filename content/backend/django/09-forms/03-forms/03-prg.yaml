solution:
  views.py: |
    from django.shortcuts import redirect, render

    from .forms import FeedbackForm


    def feedback(request):
        if request.method == "POST":
            form = FeedbackForm(request.POST)
            if form.is_valid():
                return redirect("thanks")
        else:
            form = FeedbackForm()
        return render(request, "shop/feedback.html", {"form": form})


    def thanks(request):
        return render(request, "shop/thanks.html")
check:
  type: django
  tests:
    - code: |
        r = client.post("/feedback/", {"name": "Анна", "email": "anna@shop.example", "message": "Где мой заказ?"})
        assert r.status_code == 302 and r["Location"] == "/thanks/"
      fail: "После верного POST должен быть редирект 302 на /thanks/."
    - code: |
        assert "Спасибо" in client.get("/thanks/").content.decode()
      fail: "Страница /thanks/ должна показывать «Спасибо»."
    - code: |
        r = client.post("/feedback/", {"name": "", "email": "anna@", "message": "x"})
        assert r.status_code == 200 and "Обязательное поле." in r.content.decode()
      fail: "При ошибках — та же страница с формой и сообщениями, без редиректа."
hints:
  - "Что делает браузер при обновлении страницы, полученной в ответ на POST?"
  - "`return redirect(\"thanks\")`."
explanation: |
  Страница, полученная ответом на POST, при обновлении повторяет POST. Паттерн Post/Redirect/Get: после успешной обработки сервер отвечает 302, браузер делает GET на `/thanks/` — обновление этой страницы безопасно.

  mice = Category.objects.create(name="Мыши")
  aster = Product.objects.create(category=laptops, name="Ноутбук Aster 14", slug="aster-14", price="64990.00", stock=3)
  mouse = Product.objects.create(category=mice, name="Беспроводная мышь", slug="wireless-mouse", price="1499.00", stock=40)
  gaming = Product.objects.create(category=mice, name="Игровая мышь", slug="gaming-mouse", price="3490.00", stock=0)
  order = Order.objects.create(number="A-12", email="anna@shop.example")
  OrderItem.objects.create(order=order, product=aster, quantity=1)
  OrderItem.objects.create(order=order, product=mouse, quantity=2)
  Promo.objects.create(code="SALE10", discount=10, valid_until="2099-12-31")
  Promo.objects.create(code="OLD5", discount=5, valid_until="2026-01-31")
  Review.objects.create(product=mouse, author="Анна", rating=5, text="Удобная")
solution:
  templates/shop/feedback.html: |
    <h1>Обратная связь</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button>Отправить</button>
    </form>
check:
  type: django
  tests:
    - code: |
        import re
        html = csrf_client.get("/feedback/").content.decode()
        found = re.search(r'name="csrfmiddlewaretoken" value="([^"]+)"', html)
        assert found
        data = {"name": "Анна", "email": "anna@shop.example", "message": "Где мой заказ?", "csrfmiddlewaretoken": found.group(1)}
        r = csrf_client.post("/feedback/", data)
        assert r.status_code == 302
      fail: "В форме нет скрытого поля csrfmiddlewaretoken — POST отклоняется с 403."
hints:
  - "Какой тег шаблона добавляет скрытое поле с токеном?"
  - "`{% csrf_token %}` внутри `<form method=\"post\">`."
explanation: |
  `CsrfViewMiddleware` пропускает POST, только если в нём есть токен, совпадающий с cookie. `{% csrf_token %}` выводит скрытое поле `csrfmiddlewaretoken` и заодно ставит cookie. Без него браузер честного пользователя получает 403 так же, как поддельный запрос с чужого сайта.

solution:
  views.py: |
    from django.shortcuts import get_object_or_404, redirect, render

    from .forms import ReviewForm
    from .models import Review


    def edit(request, pk):
        review = get_object_or_404(Review, pk=pk)
        if request.method == "POST":
            form = ReviewForm(request.POST, instance=review)
            if form.is_valid():
                form.save()
                return redirect("edit", pk=pk)
        else:
            form = ReviewForm(instance=review)
        return render(request, "shop/edit.html", {"form": form})
check:
  type: django
  tests:
    - code: |
        r = Review.objects.get(author="Анна")
        client.post(f"/reviews/{r.pk}/edit/", {"author": "Анна", "rating": "4", "text": "Удобная, но шумная"})
        assert Review.objects.count() == 1
        r.refresh_from_db()
        assert r.rating == 4 and r.text == "Удобная, но шумная"
      fail: "Отзыв должен измениться, а не скопироваться: отзывов по-прежнему один."
    - code: |
        r = Review.objects.get(author="Анна")
        html = client.get(f"/reviews/{r.pk}/edit/").content.decode()
        assert 'value="Анна"' in html and "Удобная" in html
      fail: "Форма редактирования показывает текущие значения отзыва."
hints:
  - "Как форма узнаёт, какой объект обновлять?"
  - "`ReviewForm(request.POST, instance=review)`."
explanation: |
  ModelForm без `instance` создаёт новый объект — `save()` делает `INSERT`. С `instance=review` форма заполняет поля существующего отзыва, и `save()` делает `UPDATE` по его `pk`. `instance` нужен в обеих ветках: в GET — чтобы показать текущие значения, в POST — чтобы обновить.

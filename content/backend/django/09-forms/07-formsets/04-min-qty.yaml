solution:
  forms.py: |
    from django import forms
    from django.forms import inlineformset_factory

    from .models import Order, OrderItem


    class ItemForm(forms.ModelForm):
        quantity = forms.IntegerField(min_value=1)

        class Meta:
            model = OrderItem
            fields = ["quantity"]


    ItemFormSet = inlineformset_factory(
        Order, OrderItem, form=ItemForm, extra=0, can_delete=True
    )
check:
  type: django
  tests:
    - code: |
        data = {"items-TOTAL_FORMS": "2", "items-INITIAL_FORMS": "2", "items-0-id": "1", "items-0-quantity": "0", "items-1-id": "2", "items-1-quantity": "3"}
        r = client.post("/cart/A-12/", data)
        assert r.status_code == 200 and "Убедитесь, что это значение больше либо равно 1." in r.content.decode()
        assert OrderItem.objects.get(pk=2).quantity == 2
      fail: "При количестве 0 — ошибка «Убедитесь, что это значение больше либо равно 1.» и ничего не сохраняется."
    - code: |
        data = {"items-TOTAL_FORMS": "2", "items-INITIAL_FORMS": "2", "items-0-id": "1", "items-0-quantity": "1", "items-1-id": "2", "items-1-quantity": "3"}
        r = client.post("/cart/A-12/", data)
        assert r.status_code == 302 and OrderItem.objects.get(pk=2).quantity == 3
      fail: "Количество от 1 сохраняется."
    - code: |
        data = {"items-TOTAL_FORMS": "2", "items-INITIAL_FORMS": "2", "items-0-id": "1", "items-0-quantity": "1", "items-1-id": "2", "items-1-quantity": "3", "items-0-DELETE": "on"}
        r = client.post("/cart/A-12/", data)
        assert r.status_code == 302 and not OrderItem.objects.filter(pk=1).exists()
      fail: "Флажок удаления должен работать."
hints:
  - "Как задать свою форму для набора?"
  - "Своя `ModelForm` с `quantity = forms.IntegerField(min_value=1)` и `inlineformset_factory(…, form=ItemForm, …)`."
explanation: |
  Поле формы строится из `PositiveIntegerField` — граница `min_value=0`. Своя форма с `IntegerField(min_value=1)` переопределяет поле, и `inlineformset_factory(…, form=ItemForm)` строит набор из неё. Отмеченные `DELETE` формы не проверяются — удаление работает и с нулём.

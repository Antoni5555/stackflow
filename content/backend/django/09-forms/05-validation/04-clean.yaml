solution:
  forms.py: |
    from django import forms


    class DeliveryForm(forms.Form):
        pickup = forms.BooleanField(label="Самовывоз", required=False)
        address = forms.CharField(label="Адрес", required=False)

        def clean(self):
            cleaned = super().clean()
            if not cleaned.get("pickup") and not cleaned.get("address"):
                raise forms.ValidationError("Укажите адрес или выберите самовывоз.")
            return cleaned
check:
  type: django
  tests:
    - code: |
        r = client.post("/delivery/", {})
        assert r.status_code == 200 and "Укажите адрес или выберите самовывоз." in r.content.decode()
      fail: "Без адреса и самовывоза — та же страница с ошибкой «Укажите адрес или выберите самовывоз.»."
    - code: |
        assert client.post("/delivery/", {"pickup": "on"}).status_code == 302
        assert client.post("/delivery/", {"address": "Москва, ул. Ленина, 1"}).status_code == 302
      fail: "С самовывозом или с адресом форма проходит."
hints:
  - "В каком порядке Django вызывает clean_pickup и clean_address?"
  - "Метод `clean(self)`: `cleaned = super().clean()`, `cleaned.get(\"pickup\")`, `cleaned.get(\"address\")`."
explanation: |
  `clean_<поле>` вызываются по порядку полей: в `clean_pickup` поля `address` в `cleaned_data` ещё нет — `KeyError`. Правило для нескольких полей — в `clean()`: он вызывается после всех полей. Значения берут через `.get()` — поле, не прошедшее свою проверку, в `cleaned_data` отсутствует. Ошибка из `clean()` — общая для формы, `{{ form.as_p }}` выводит её над полями.

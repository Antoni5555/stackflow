<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="860" height="280" class="fig" role="img" aria-labelledby="t"><title id="t">Порядок проверок в is_valid(): каждое поле, затем clean() формы</title>

solution:
  forms.py: |
    from django import forms
    from django.utils import timezone

    from .models import Promo


    class PromoForm(forms.Form):
        code = forms.CharField(label="Промокод", max_length=20)

        def clean_code(self):
            code = self.cleaned_data["code"].strip().upper()
            promo = Promo.objects.filter(code=code).first()
            if promo is None:
                raise forms.ValidationError("Такого промокода нет.")
            if promo.valid_until < timezone.localdate():
                raise forms.ValidationError("Срок действия промокода истёк.")
            return code
check:
  type: django
  tests:
    - code: |
        html = client.post("/promo/", {"code": " sale10 "}).content.decode()
        assert "Скидка 10%" in html
      fail: "Код « sale10 » должен работать как SALE10 — скидка 10%."
    - code: |
        html = client.post("/promo/", {"code": "OLD5"}).content.decode()
        assert "Срок действия промокода истёк." in html and "Скидка" not in html
      fail: "Для просроченного OLD5 — ошибка «Срок действия промокода истёк.», без скидки."
    - code: |
        html = client.post("/promo/", {"code": "FREE"}).content.decode()
        assert "Такого промокода нет." in html and "Скидка" not in html
      fail: "Для неизвестного кода — ошибка «Такого промокода нет.»."
hints:
  - "Где в форме проверяют одно поле?"
  - "Метод `clean_code(self)`: `strip().upper()`, поиск промокода, сравнение с `timezone.localdate()`, `return code`."
explanation: |
  `clean_code` вызывается после встроенных проверок поля. Ошибка — `raise forms.ValidationError(…)`, она встаёт у поля, и `is_valid()` возвращает `False` — view до скидки не доходит. Возвращённое значение (`SALE10` в верхнем регистре) попадает в `cleaned_data`, поэтому поиск во view находит промокод. Сегодняшняя дата — `timezone.localdate()`, в часовом поясе проекта.

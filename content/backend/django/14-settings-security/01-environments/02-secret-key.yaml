title: "Ключ в репозитории"
type: fix
difficulty: 1
pitfall: "SECRET_KEY не хранят в коде — он попадает в историю git; берут из переменной окружения."
statement: |
  В `config/settings/prod.py` записан настоящий `SECRET_KEY` продакшена, а файл лежит в публичном репозитории. Берите ключ из переменной окружения `DJANGO_SECRET_KEY`; если её нет, сервер не должен стартовать.
files:
  config/settings/prod.py: |
    import os

    from .base import *  # noqa: F403

    DEBUG = False
    SECRET_KEY = "k#8v!2m@x9q$w7z&p4r^t6y*u1i(o3e)s5d-f0g+h=j_l"
    ALLOWED_HOSTS = os.environ["DJANGO_ALLOWED_HOSTS"].split(",")
check:
  type: rules
  rules:
    - must_not_match: 'k#8v!2m@x9q'
      fail: "Ключ всё ещё записан в коде."
    - must_match: '^\s*SECRET_KEY\s*=\s*os\.environ\[\s*["\'']DJANGO_SECRET_KEY["\'']\s*\]'
      fail: "Возьмите ключ из os.environ[\"DJANGO_SECRET_KEY\"] — без значения по умолчанию."
solution:
  config/settings/prod.py: |
    import os

    from .base import *  # noqa: F403

    DEBUG = False
    SECRET_KEY = os.environ["DJANGO_SECRET_KEY"]
    ALLOWED_HOSTS = os.environ["DJANGO_ALLOWED_HOSTS"].split(",")
hints:
  - "Как прочитать переменную окружения так, чтобы её отсутствие было ошибкой?"
  - "`SECRET_KEY = os.environ[\"DJANGO_SECRET_KEY\"]`."
explanation: |
  Всё, что попало в git, остаётся в истории — и после удаления строки ключ можно найти в старых коммитах; его нужно сменить. `os.environ["…"]` при отсутствии переменной даёт `KeyError: 'DJANGO_SECRET_KEY'` уже при старте. `os.environ.get(…, "")` запустил бы сервер с пустым ключом, который упал бы позже: `ImproperlyConfigured: The SECRET_KEY setting must not be empty.`

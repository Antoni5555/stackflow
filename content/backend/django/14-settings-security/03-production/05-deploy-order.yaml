title: "Порядок выкатки"
type: quiz
kind: order
difficulty: 2
pitfall: "Миграции применяют до запуска нового кода — иначе новый код обращается к колонкам, которых ещё нет."
statement: |
  Расставьте шаги выкатки новой версии магазина на сервер по порядку.
options:
  - "Перезапустить Gunicorn с новым кодом"
  - "Установить зависимости `pip install -r requirements.txt`"
  - "Проверить, что сайт отвечает"
  - "Применить миграции `python manage.py migrate`"
answer: [1, 3, 0, 2]
explanation: |
  Сначала зависимости (без них не запустится и `manage.py`), затем миграции — схема базы готова до того, как новый код начнёт к ней обращаться, — потом перезапуск, потом проверка. Миграции — отдельным шагом, а не при старте каждого воркера.

title: "runserver на сервере"
type: fix
difficulty: 1
pitfall: "В продакшене приложение запускают сервером приложения (Gunicorn) за Nginx, а не runserver."
statement: |
  Скрипт запуска магазина на сервере стартует `runserver` на всех интерфейсах. Замените запуск на Gunicorn с WSGI-приложением проекта (`config.wsgi:application`), тремя воркерами, на `127.0.0.1:8000` — снаружи к нему ходит Nginx.
files:
  start.sh: |
    #!/bin/sh
    set -e
    pip install -r requirements.txt
    python manage.py collectstatic --noinput
    python manage.py migrate
    python manage.py runserver 0.0.0.0:8000
check:
  type: rules
  rules:
    - must_not_match: '^\s*python manage\.py runserver'
      fail: "runserver не для продакшена — уберите его."
    - must_match: '^\s*(exec\s+)?gunicorn\s+config\.wsgi:application\b'
      fail: "Запуск — gunicorn config.wsgi:application."
    - must_match: '^\s*(exec\s+)?gunicorn\b.*--bind[ =]127\.0\.0\.1:8000'
      fail: "Gunicorn слушает 127.0.0.1:8000 (--bind 127.0.0.1:8000)."
    - must_match: '^\s*(exec\s+)?gunicorn\b.*(--workers[ =]|-w\s*)3\b'
      fail: "Три воркера: --workers 3."
solution:
  start.sh: |
    #!/bin/sh
    set -e
    pip install -r requirements.txt
    python manage.py collectstatic --noinput
    python manage.py migrate
    gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers 3
hints:
  - "Где у Django WSGI-приложение?"
  - "`gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers 3`."
explanation: |
  `runserver` — сервер разработки: однопроцессный, без защиты от медленных клиентов, не проверен на безопасность. Gunicorn запускает несколько процессов-воркеров с Django (`config.wsgi:application` — модуль и переменная `application`). `127.0.0.1` — чтобы снаружи сервер приложения был недоступен напрямую, а HTTPS и статику обслуживал Nginx.

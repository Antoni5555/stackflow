title: "mark_safe с подстановкой"
type: exercise
difficulty: 2
pitfall: "mark_safe(f\"…{value}…\") помечает безопасным и подставленное значение; format_html экранирует подстановки."
statement: |
  Бейдж `/badge/?name=…` выводит имя покупателя жирным: `mark_safe(f"<b>{name}</b>")`. С именем `<script>alert(1)</script>` скрипт выполняется. Исправьте view: тег `<b>` остаётся разметкой, имя — экранированным текстом.
files:
  models.py: |
    from django.db import models


    class Product(models.Model):
        name = models.CharField(max_length=200)
        slug = models.SlugField(unique=True)

        def __str__(self):
            return self.name


    class Review(models.Model):
        product = models.ForeignKey(
            Product, on_delete=models.CASCADE, related_name="reviews"
        )
        author = models.CharField(max_length=100)
        text = models.TextField()
  views.py: |
    from django.utils.safestring import mark_safe
    from django.http import HttpResponse


    def badge(request):
        name = request.GET.get("name", "")
        return HttpResponse(mark_safe(f"<b>{name}</b>"))
  urls.py: |
    from django.urls import path

    from . import views

    urlpatterns = [
        path("badge/", views.badge, name="badge"),
    ]
setup: |
  aster = Product.objects.create(name="Ноутбук Aster 14", slug="aster-14")
  Review.objects.create(product=aster, author="Анна", text="Отличный <b>экран</b>")
  Review.objects.create(product=aster, author="<script>alert('xss')</script>", text="<img src=x onerror=alert(1)>")
solution:
  views.py: |
    from django.utils.html import format_html
    from django.http import HttpResponse


    def badge(request):
        name = request.GET.get("name", "")
        return HttpResponse(format_html("<b>{}</b>", name))
check:
  type: django
  tests:
    - code: |
        r = client.get("/badge/", {"name": "<script>alert(1)</script>"})
        assert r.content.decode() == "<b>&lt;script&gt;alert(1)&lt;/script&gt;</b>"
      fail: "Имя должно быть экранировано, а <b> — остаться тегом: <b>&lt;script&gt;…</b>."
    - code: |
        assert client.get("/badge/", {"name": "Анна"}).content.decode() == "<b>Анна</b>"
      fail: "Обычное имя — жирным: <b>Анна</b>."
hints:
  - "Какая функция Django собирает HTML и экранирует подстановки?"
  - "`format_html(\"<b>{}</b>\", name)` из `django.utils.html`."
explanation: |
  `mark_safe` помечает безопасной всю строку, включая то, что подставила f-строка. `format_html` работает как `str.format`, но каждый аргумент экранирует (если он сам не помечен безопасным) — разметка шаблона строки остаётся разметкой, данные — текстом.

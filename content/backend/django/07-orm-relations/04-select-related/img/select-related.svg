</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fig-ah"/></marker></defs>
<text x="20" y="24" text-anchor="start" class="fig-cs">Order.objects.select_related(&quot;user&quot;)</text>
<rect x="20" y="40" width="340" height="88" rx="12" class="fig-box2"/>
<text x="34" y="62" text-anchor="start" class="fig-c">строка результата</text>
<text x="34" y="88" text-anchor="start" class="fig-cs">shop_order.id, number, user_id</text>
<text x="34" y="112" text-anchor="start" class="fig-cs">auth_user.id, username, email …</text>
<path d="M360 70H446" class="fig-ln" marker-end="url(#a)"/>
<rect x="450" y="40" width="180" height="50" rx="12" class="fig-ok"/>
<text x="540.0" y="70.0" text-anchor="middle" class="fig-cs">order</text>
<path d="M360 94H446" class="fig-ln" marker-end="url(#a)"/>
<rect x="450" y="100" width="180" height="50" rx="12" class="fig-ok"/>
<text x="540.0" y="130.0" text-anchor="middle" class="fig-cs">order.user</text>
<text x="650" y="70" text-anchor="start" class="fig-s">объект заказа</text>
<text x="650" y="130" text-anchor="start" class="fig-s">уже загружен — запроса нет</text>
<text x="20" y="200" text-anchor="start" class="fig-t">Для FK и OneToOne: обязательная связь — INNER JOIN, null=True — LEFT OUTER JOIN.</text>
<text x="20" y="228" text-anchor="start" class="fig-s">Цепочки — &quot;order__user&quot;; для M2M и обратных связей — FieldError, нужен prefetch_related.</text>
</svg>

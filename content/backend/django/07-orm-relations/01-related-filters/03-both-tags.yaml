  anna = User.objects.create_user("anna", "anna@shop.example")
  boris = User.objects.create_user("boris", "boris@shop.example")
  vera = User.objects.create_user("vera", "vera@shop.example")
  for number, user, items in [
      ("A-12", anna, [(aster, 1), (mouse, 1)]),
      ("A-13", boris, [(pad, 2)]),
      ("A-14", anna, [(gaming, 1)]),
      ("A-15", vera, [(mouse, 2), (pad, 1)]),
  ]:
      order = Order.objects.create(user=user, number=number)
      for product, qty in items:
          OrderItem.objects.create(order=order, product=product, quantity=qty)
  Review.objects.create(product=mouse, user=anna, rating=5)
  Review.objects.create(product=mouse, user=boris, rating=4)
  Review.objects.create(product=mouse, user=vera, rating=2, is_published=False)
  Review.objects.create(product=aster, user=vera, rating=5)
solution:
  views.py: |
    from django.shortcuts import render

    from .models import Product


    def hot_new(request):
        products = (
            Product.objects.filter(tags__name="хит")
            .filter(tags__name="новинка")
            .order_by("id")
        )
        return render(request, "shop/hot_new.html", {"products": products})
check:
  type: django
  tests:
    - code: |
        html = client.get("/hot-new/").content.decode()
        assert "Ноутбук Aster 14" in html
      fail: "Ноутбук Aster 14 — с метками «хит» и «новинка» — должен быть на странице."
    - code: |
        html = client.get("/hot-new/").content.decode()
        assert "мышь" not in html
      fail: "У мышей только одна из двух меток — их на странице быть не должно."
    - code: |
        t = Tag.objects.create(name="эко")
        Product.objects.get(name="Игровая мышь").tags.add(t)
        html = client.get("/hot-new/").content.decode()
        assert "Игровая мышь" not in html
      fail: "Условие должно требовать именно метки «хит» и «новинка», а не любые две."
hints:
  - "`__in` значит «хотя бы одна из». Как сказать «есть и та, и другая»?"
  - "Каждый `filter()` по многозначной связи добавляет свой JOIN."
explanation: |
  `tags__name__in` — «хотя бы одна метка из списка». Условие «есть обе» — два `filter()`: каждый присоединяет связку заново, и первое условие проверяется на одной метке товара, второе — на другой. Одним `filter(tags__name="хит", tags__name="новинка")` не написать (повтор аргумента — `SyntaxError`), а `filter(Q(tags__name="хит") & Q(tags__name="новинка"))` требует, чтобы **одна** метка называлась сразу двумя именами, — пусто. Дублей здесь нет: каждое условие совпадает с одной меткой.

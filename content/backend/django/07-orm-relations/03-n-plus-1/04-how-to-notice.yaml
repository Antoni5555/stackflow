title: "Как поймать N+1"
type: quiz
kind: single
difficulty: 1
pitfall: "N+1 не виден на маленьких данных по времени — смотрят на число запросов при росте данных."
statement: |
  Страница каталога на учебной базе из 5 товаров открывается за 30 мс. Как надёжнее всего проверить, что в ней нет N+1?
options:
  - "Замерить время ещё раз: 30 мс — значит, всё в порядке"
  - "Добавить в базу ещё объектов и сравнить число SQL-запросов"
  - "Включить кэширование страницы"
  - "Посчитать строки кода во view"
answer: [1]
explanation: |
  Признак N+1 — число запросов растёт вместе с числом объектов. На 5 товарах лишние 5 запросов не видны по времени, но на 5000 станут секундами. Правильная страница делает одинаковое число запросов на 5 и на 500 товаров. Кэш только прячет проблему.

      {% for p in products %}
        <li>{{ p.name }} ({{ p.category.name }}): {% for t in p.tags.all %}{{ t.name }} {% endfor %}</li>
      {% endfor %}
    </ul>
setup: |
  electronics = Category.objects.create(name="Электроника")

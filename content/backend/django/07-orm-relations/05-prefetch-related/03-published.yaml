solution:
  views.py: |
    from django.shortcuts import render

    from django.db.models import Prefetch

    from .models import Product, Review


    def ratings(request):
        published = Review.objects.filter(is_published=True)
        products = Product.objects.prefetch_related(
            Prefetch("reviews", queryset=published, to_attr="published")
        ).order_by("id")
        rows = [(p, p.published) for p in products]
        return render(request, "shop/ratings.html", {"rows": rows})
check:
  type: django
  tests:
    - code: |
        html = client.get("/ratings/").content.decode()
        assert "Ноутбук Aster 14: 5 <" in html
        assert "2 " not in html
      fail: "На странице — оценки только опубликованных отзывов (у беспроводной мыши — 5 и 4, без 2)."
    - code: |
        with max_queries(2):
            client.get("/ratings/")
      fail: "Отзывы снова загружаются по запросу на товар: filter() по предзагруженной связи идёт в базу. Отберите опубликованные в самой предзагрузке."
hints:
  - "Что делает `p.reviews.filter(…)`, если отзывы уже предзагружены?"
  - "`Prefetch(\"reviews\", queryset=Review.objects.filter(is_published=True), to_attr=\"published\")`."
explanation: |
  Кэш `prefetch_related("reviews")` используется только для `p.reviews.all()`; `p.reviews.filter(is_published=True)` — новый запрос на каждый товар: 2 + 4 = 6. Условие переносят в предзагрузку: `Prefetch("reviews", queryset=…, to_attr="published")` выполняет один запрос `… WHERE is_published AND product_id IN (…)` и кладёт каждому товару готовый список `p.published`.

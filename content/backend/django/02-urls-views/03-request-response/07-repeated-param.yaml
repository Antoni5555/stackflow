title: Два тега в адресе
type: quiz
kind: single
difficulty: 2
pitfall: QueryDict.get при повторяющемся параметре возвращает последнее значение; все — getlist.
statement: |
  Фильтр каталога по меткам: покупатель открыл `/catalog/?tag=хит&tag=новинка`. Что вернёт `request.GET.get("tag")`?
options:
  - "`\"хит\"`"
  - "`\"новинка\"`"
  - "`[\"хит\", \"новинка\"]`"
  - "`MultiValueDictKeyError`"
answer: [1]
explanation: |
  `QueryDict` хранит для ключа все значения, но `get` и `request.GET["tag"]` возвращают последнее — `"новинка"`, и первая метка тихо теряется. Все значения — `request.GET.getlist("tag")` → `["хит", "новинка"]`. Такие адреса получаются из формы с несколькими галочками с одним `name`.

title: Что не дойдёт до сервера
type: quiz
kind: single
difficulty: 1
pitfall: Фрагмент после # браузер оставляет себе — сервер его не получает.
statement: |
  Покупатель открыл ссылку:
  ```text
  https://shop.example/catalog/?sort=price#page=3
  ```
  Разработчик ждёт, что сервер покажет третью страницу каталога. Почему она не открывается?
options:
  - Сервер получил `page=3`, но не умеет его читать
  - Часть после `#` — фрагмент, браузер не отправляет её на сервер
  - Параметр `sort` перекрыл `page`
  - Порт не указан, поэтому запрос ушёл не туда
answer: [1]
hints:
  - Какие части URL браузер кладёт в строку запроса `GET …`?
explanation: |
  На сервер уйдёт только `GET /catalog/?sort=price`. Фрагмент `#page=3` остаётся в браузере. Номер страницы нужно передавать в query: `?sort=price&page=3`.

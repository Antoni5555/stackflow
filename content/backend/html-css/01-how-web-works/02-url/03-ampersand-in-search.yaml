title: Поиск с амперсандом
type: quiz
kind: single
difficulty: 2
pitfall: Служебные символы внутри значения (& = # ?) нужно кодировать, иначе они меняют смысл URL.
statement: |
  Ссылку на поиск собирают склейкой строк:
  ```text
  "/search/?q=" + query
  ```
  Покупатель ищет `кофе&чай`, а сервер ищет только «кофе». Что получил сервер в query?
options:
  - "`q` = `кофе&чай`"
  - "`q` = `кофе`, и ещё параметр `чай` без значения"
  - "`q` = `кофе чай`"
  - Ничего — запрос с `&` браузер не отправит
answer: [1]
hints:
  - Чем в query разделяются параметры?
explanation: |
  `&` разделяет параметры, поэтому `q=кофе&чай` читается как два параметра: `q=кофе` и `чай`. Значение нужно закодировать (`urlencode`): `&` превратится в `%26`, и сервер получит `q` целиком.

title: Где кончаются заголовки
type: quiz
kind: single
difficulty: 1
pitfall: Заголовки от тела отделяет пустая строка — без неё тело читается как заголовок.
statement: |
  Как сервер понимает, что заголовки HTTP-запроса закончились и дальше идёт тело?
options:
  - По заголовку `Content-Length`
  - По пустой строке после последнего заголовка
  - Тело всегда начинается с `{`
  - По заголовку `Body:`
answer: [1]
explanation: |
  Пустая строка (`\r\n\r\n` подряд) — граница заголовков. `Content-Length` говорит, **сколько** байт тела прочитать после неё, но не где оно начинается.

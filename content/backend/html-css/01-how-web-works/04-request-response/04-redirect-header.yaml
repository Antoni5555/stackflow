title: Куда ведёт редирект
type: quiz
kind: single
difficulty: 1
pitfall: Адрес перехода при редиректе передаётся заголовком Location, а не телом.
statement: |
  Сервер ответил:
  ```http
  HTTP/1.1 302 Found
  Location: /orders/1042/
  Content-Length: 0
  ```
  Что сделает браузер?
options:
  - Покажет пустую страницу — тела нет
  - Сам отправит `GET /orders/1042/` и покажет эту страницу
  - Повторит предыдущий запрос
  - Покажет ошибку — у ответа нет HTML
answer: [1]
explanation: |
  Код 3xx — редирект, а заголовок `Location` говорит, куда идти. Браузер автоматически делает новый GET-запрос по этому адресу, тело редиректа ему не нужно.

title: Собрать запрос
type: quiz
kind: order
difficulty: 1
pitfall: У HTTP-сообщения строгий порядок частей — стартовая строка, заголовки, пустая строка, тело.
statement: |
  Расставьте строки запроса на добавление отзыва в правильном порядке.
options:
  - "`POST /products/17/reviews/ HTTP/1.1`"
  - "`Host: shop.example`"
  - "`Content-Type: application/x-www-form-urlencoded`"
  - (пустая строка)
  - "`rating=5&text=%D0%9E%D1%82%D0%BB%D0%B8%D1%87%D0%BD%D0%BE`"
answer: [0, 1, 2, 3, 4]
explanation: |
  Стартовая строка с методом и путём, затем заголовки (их порядок между собой не важен), пустая строка и тело с полями формы. Текст отзыва закодирован так же, как значения в URL.

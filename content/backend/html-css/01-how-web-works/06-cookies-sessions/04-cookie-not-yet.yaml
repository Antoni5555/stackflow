title: Когда вернётся cookie
type: quiz
kind: single
difficulty: 1
pitfall: Set-Cookie лишь просит браузер сохранить cookie — на сервер она придёт только со следующим запросом.
statement: |
  Сервер отвечает на первый запрос гостя заголовком `Set-Cookie: theme=dark`. Когда сервер увидит `theme=dark` в заголовке `Cookie`?
options:
  - В этом же запросе
  - Со следующим запросом браузера к этому сайту
  - Только после входа в аккаунт
  - Никогда — cookie видна только браузеру
answer: [1]
explanation: |
  Ответ уже ушёл, браузер только сохраняет cookie. Сервер получит её, когда браузер отправит следующий запрос к `shop.example` и приложит заголовок `Cookie: theme=dark`.

title: Скидка в cookie
type: quiz
kind: single
difficulty: 2
pitfall: Cookie хранится у пользователя — любое значение в ней он может прочитать и изменить.
statement: |
  Чтобы не ходить в базу, разработчик после ввода промокода ставит cookie `discount=10` и при оформлении заказа берёт скидку из неё. Что не так?
options:
  - Ничего — cookie ставит сервер, значит, ей можно доверять
  - Покупатель может поменять cookie на `discount=90`; скидку нужно хранить на сервере (в сессии или заказе)
  - Cookie не может хранить числа
  - Скидка пропадёт при перезагрузке страницы
answer: [1]
hints:
  - Где физически лежит cookie между запросами?
explanation: |
  Сервер только просит браузер сохранить cookie. Хранит её браузер покупателя, и покупатель меняет её в инструментах разработчика. Всё, что влияет на деньги и права, держат на сервере, а в cookie — только номер сессии.

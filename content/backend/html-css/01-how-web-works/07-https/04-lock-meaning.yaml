title: Что значит замок
type: quiz
kind: single
difficulty: 1
pitfall: Замок подтверждает защищённое соединение с доменом, а не честность сайта.
statement: |
  На сайте `shop-example-pay.ru` в адресной строке замок. Что это гарантирует?
options:
  - Это официальный сайт магазина `shop.example`
  - Соединение зашифровано, и сервер действительно владеет доменом `shop-example-pay.ru`
  - Сайт проверен государством
  - На сайте нет вирусов
answer: [1]
explanation: |
  Сертификат выдают любому, кто управляет доменом, — в том числе мошеннику на похожий домен. Замок говорит только «канал защищён и вы говорите именно с этим доменом». Проверять нужно сам домен.

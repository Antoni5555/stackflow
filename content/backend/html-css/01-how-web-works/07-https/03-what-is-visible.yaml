title: Что видит провайдер
type: quiz
kind: multiple
difficulty: 2
pitfall: HTTPS скрывает путь, заголовки и тело, но не домен и IP сервера.
statement: |
  Покупатель открыл по HTTPS `https://shop.example/orders/1042/`. Отметьте, что при этом может узнать провайдер покупателя.
options:
  - IP-адрес сервера
  - Домен `shop.example`
  - Путь `/orders/1042/`
  - Cookie `sessionid`
  - HTML страницы заказа
answer: [0, 1]
explanation: |
  IP виден всегда — по нему идёт соединение. Домен браузер сообщает при установке TLS и запрашивает в DNS. Всё остальное — путь, заголовки с cookies, тело ответа — передаётся внутри шифрованного канала.

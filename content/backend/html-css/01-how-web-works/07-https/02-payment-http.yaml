title: Оплата по HTTP
type: quiz
kind: single
difficulty: 1
pitfall: По HTTP данные формы и cookie идут открытым текстом через все узлы сети.
statement: |
  Форма оплаты отправляется по `http://shop.example/checkout/`. Почему это недопустимо, даже если сервер магазина надёжно защищён?
options:
  - HTTP работает медленнее, покупатель устанет ждать
  - Номер карты и cookie сессии идут открытым текстом — их прочитает любой узел по пути, например точка Wi-Fi
  - По HTTP нельзя отправлять POST-запросы
  - Сервер не примет данные карты без HTTPS
answer: [1]
explanation: |
  Защищённость сервера не помогает, если данные перехватывают по дороге. Без TLS запрос читают и подменяют все устройства между покупателем и сервером. HTTPS шифрует весь путь.

title: Порядок открытия каталога
type: quiz
kind: order
difficulty: 2
pitfall: Стили и картинки браузер запрашивает отдельно — только после того, как получил и разобрал HTML.
statement: |
  Расставьте по порядку, что происходит, когда покупатель открывает каталог.
options:
  - Браузер отправляет запрос `GET /catalog/`
  - Django берёт товары из базы и подставляет их в шаблон
  - Сервер возвращает ответ `200 OK` с HTML
  - Браузер находит в HTML ссылку на `style.css` и запрашивает его
  - Браузер рисует страницу со стилями
answer: [0, 1, 2, 3, 4]
explanation: |
  Сначала запрос, потом сервер собирает страницу и отвечает HTML. Только разобрав HTML, браузер узнаёт, какие ещё файлы нужны (стили, картинки), и запрашивает их отдельно. Страница со стилями появляется в конце.

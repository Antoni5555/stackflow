title: Кто проверит остаток
type: quiz
kind: single
difficulty: 1
pitfall: "Проверка в браузере — подсказка для покупателя, а не защита: настоящее решение принимает сервер."
statement: |
  На карточке товара поле «Количество» не даёт ввести больше, чем есть на складе. Разработчик решил, что на сервере эту проверку можно не делать. Что не так?
options:
  - Всё в порядке — браузер уже проверил количество
  - Покупатель может изменить или обойти проверку в браузере, поэтому сервер должен проверить остаток сам
  - Проверка в браузере не работает в старых браузерах — только поэтому нужна серверная
  - Сервер должен проверять, а браузер — нет, иначе проверка выполнится дважды
answer: [1]
hints:
  - Чей компьютер выполняет проверку в браузере — и кто им управляет?
explanation: |
  Браузер полностью под контролем покупателя: ограничение поля убирается в инструментах разработчика, а запрос можно отправить вообще без браузера. Остатки лежат в базе на сервере — только сервер может проверить их надёжно. Проверка в браузере полезна, но лишь как быстрая подсказка.

title: Работа сервера
type: quiz
kind: multiple
difficulty: 1
pitfall: Всё, что связано с данными магазина и деньгами, делает backend, даже если результат виден в браузере.
statement: |
  Отметьте всё, что в интернет-магазине делает **сервер** (backend).
options:
  - Посчитать итог заказа со скидкой по промокоду
  - Подсветить кнопку «В корзину» при наведении мыши
  - Сохранить заказ в базу данных
  - Нарисовать страницу по полученному HTML и CSS
  - Проверить, что пользователь вошёл в аккаунт, прежде чем показать его заказы
answer: [0, 2, 4]
hints:
  - Где хранятся промокоды, заказы и аккаунты?
explanation: |
  Цены, промокоды, заказы и аккаунты хранятся в базе на сервере, поэтому считать, сохранять и проверять права должен backend. Подсветка кнопки и отрисовка страницы — работа браузера: это frontend.

title: Статика или динамика
type: quiz
kind: multiple
difficulty: 1
pitfall: Динамическая страница зависит от данных или пользователя; одинаковый для всех файл — статика.
statement: |
  Отметьте **динамические** страницы и файлы магазина — те, что сервер собирает заново на каждый запрос.
options:
  - Файл стилей `style.css`
  - Корзина покупателя
  - Логотип `logo.svg`
  - Каталог с ценами и остатками из базы
  - Страница «Мои заказы»
answer: [1, 3, 4]
explanation: |
  Корзина, каталог и «Мои заказы» зависят от данных в базе или от того, кто их открыл, — их собирает Django. Стили и логотип одинаковы для всех: это готовые файлы, которые отдаются как есть.

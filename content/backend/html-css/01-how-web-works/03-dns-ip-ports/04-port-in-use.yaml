title: Второй сервер не запускается
type: quiz
kind: single
difficulty: 1
pitfall: Один порт на одном адресе слушает только одна программа.
statement: |
  В одном терминале уже работает `runserver`. В другом разработчик запускает ещё один проект той же командой и видит:
  ```text
  Error: That port is already in use.
  ```
  Как запустить второй проект, не останавливая первый?
options:
  - Перезагрузить компьютер
  - Запустить на другом порту, например `runserver 8001`
  - Запустить с `sudo`
  - Открыть второй проект в другом браузере
answer: [1]
explanation: |
  Порт 8000 занят первым сервером, а порт на одном адресе может слушать только одна программа. Второму проекту нужен свой порт: `python manage.py runserver 8001` — тогда он откроется на `http://127.0.0.1:8001/`.

title: Сайт переехал, но не для всех
type: quiz
kind: single
difficulty: 2
pitfall: DNS-ответы кэшируются на время TTL, поэтому смена IP расходится не сразу.
statement: |
  Магазин переехал на новый сервер, в DNS поменяли A-запись на новый IP. Через 10 минут часть покупателей видит новый сайт, а часть — старый. В чём причина?
options:
  - Новый сервер работает с ошибками
  - У части покупателей старый IP ещё лежит в кэше DNS (TTL записи не истёк)
  - Браузеры запоминают сайты навсегда, нужно менять домен
  - DNS обновляется только ночью
answer: [1]
explanation: |
  Резолверы провайдеров, система и браузер хранят ответ DNS в кэше на время TTL. Пока он не истёк, клиент идёт на старый IP. Поэтому перед переездом TTL уменьшают заранее, а старый сервер держат включённым, пока все кэши не обновятся.

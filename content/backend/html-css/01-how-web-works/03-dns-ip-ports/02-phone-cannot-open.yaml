title: С телефона не открывается
type: quiz
kind: single
difficulty: 2
pitfall: Сервер, который слушает 127.0.0.1, доступен только с того же компьютера.
statement: |
  Разработчик запустил `python manage.py runserver` (`http://127.0.0.1:8000/`) и хочет проверить вёрстку на телефоне в той же Wi-Fi-сети. Телефон открывает `http://127.0.0.1:8000/` и не находит сайт. Почему?
options:
  - На телефоне не установлен Django
  - Для телефона `127.0.0.1` — это сам телефон; нужно запустить сервер на `0.0.0.0:8000` и открыть IP ноутбука в сети
  - Порт 8000 запрещён на телефонах, нужен порт 80
  - Телефону нужен HTTPS, а `runserver` его не умеет
answer: [1]
hints:
  - Что значит адрес `127.0.0.1` для того устройства, на котором его открыли?
explanation: |
  `127.0.0.1` всегда указывает на устройство, где его открыли. Телефон стучится сам к себе. К тому же `runserver` по умолчанию слушает только этот адрес. `runserver 0.0.0.0:8000` принимает соединения со всех адресов ноутбука, и телефон откроет `http://<IP ноутбука>:8000/`.

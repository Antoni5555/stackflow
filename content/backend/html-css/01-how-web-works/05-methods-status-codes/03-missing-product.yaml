title: Товара нет
type: quiz
kind: single
difficulty: 1
pitfall: Код ответа должен соответствовать смыслу — «такого товара нет» это 404, а не 200 или 500.
statement: |
  Покупатель открыл `/products/999/`, а товара с номером 999 в базе нет. Какой код вернуть?
options:
  - 200 OK со страницей «Товар не найден»
  - 404 Not Found
  - 500 Internal Server Error
  - 302 Found на главную
answer: [1]
explanation: |
  Запрошен несуществующий ресурс — это ошибка запроса, 404. Ответ 200 скажет поисковикам и мониторингу, что страница существует. 500 значит «упал наш код», а сервер отработал правильно. Молчаливый редирект на главную путает покупателя. В Django — `get_object_or_404`.

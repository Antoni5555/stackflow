title: Чья ошибка
type: quiz
kind: multiple
difficulty: 2
pitfall: 4xx — ошибка в запросе клиента, 5xx — ошибка на сервере; неверный ввод не должен давать 500.
statement: |
  Отметьте ситуации, на которые правильный ответ — код из класса **4xx**.
options:
  - Покупатель открыл `/products/abc/`, а номер товара — число
  - Во view опечатка в имени переменной, и он падает с `NameError`
  - Гость отправил форму отзыва, а писать отзывы могут только вошедшие
  - "`GET /orders/` туда, где принимают только POST"
  - База данных недоступна, Django не может выполнить запрос
answer: [0, 2, 3]
explanation: |
  Неверный адрес (404), запрет для гостя (401/403 или редирект на вход) и не тот метод (405) — проблемы запроса. Опечатка в коде и недоступная база — ошибки сервера, это 500: клиент ничего не мог сделать иначе.

title: Метод для отзыва
type: quiz
kind: single
difficulty: 1
pitfall: Всё, что меняет данные на сервере, отправляют POST, а не GET.
statement: |
  Форма отзыва о товаре сохраняет оценку и текст в базу. Каким методом её отправлять?
options:
  - GET — так проще передать данные в адресе
  - POST — запрос создаёт запись, данные идут в теле
  - GET, но с коротким текстом отзыва
  - Не важно — сервер примет любой метод
answer: [1]
hints:
  - Что будет, если ссылку с GET-параметрами отзыва откроют ещё раз из истории браузера?
explanation: |
  Отзыв меняет данные на сервере, поэтому нужен POST. GET попадает в историю, закладки и кэш, его повторяют роботы и предзагрузка браузера — каждый такой повтор создал бы новый отзыв.

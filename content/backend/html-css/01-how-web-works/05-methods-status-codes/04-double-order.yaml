title: Двойной заказ после F5
type: quiz
kind: single
difficulty: 2
pitfall: Если ответить на POST страницей, обновление страницы отправит форму ещё раз.
statement: |
  После оформления заказа сервер в ответ на `POST /orders/` сразу возвращает `200 OK` со страницей «Спасибо за заказ». Покупатель нажал F5, подтвердил «Отправить повторно» — и в базе два одинаковых заказа. Как исправить?
options:
  - Запретить кнопку F5 через JavaScript
  - После сохранения отвечать редиректом `302` на страницу заказа, а её показывать по GET
  - Отвечать кодом 201 вместо 200
  - Отправлять форму методом GET
answer: [1]
hints:
  - Какой запрос повторяет браузер при обновлении страницы?
explanation: |
  F5 повторяет последний запрос, который привёл к странице. Если это POST — форма уходит заново. С PRG (POST → 302 → GET) последней становится GET-страница заказа, и обновление безопасно.

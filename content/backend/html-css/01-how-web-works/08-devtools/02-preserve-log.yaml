title: Пропавший POST
type: quiz
kind: single
difficulty: 2
pitfall: При переходе на новую страницу Network очищает список запросов — POST перед редиректом не виден без Preserve log.
statement: |
  Форма отзыва после отправки возвращает на карточку товара. В Network видна только загрузка карточки, а запроса с отзывом нет. Что сделать, чтобы его увидеть?
options:
  - Переключить фильтр на Img
  - Включить Preserve log и отправить форму ещё раз
  - Открыть вкладку Console
  - Выключить JavaScript
answer: [1]
explanation: |
  POST ушёл, сервер ответил редиректом, и браузер перешёл на новую страницу. Network при переходе очистил список. С Preserve log список сохраняется: видно POST с кодом 302, его поля во вкладке Payload и следующий GET.

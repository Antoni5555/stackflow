title: Стили не обновились
type: quiz
kind: single
difficulty: 1
pitfall: Браузер кэширует статичные файлы — изменения CSS видны не сразу.
statement: |
  Разработчик поменял цвет кнопки в `style.css`, обновил страницу, а кнопка прежняя. В Network у `style.css` в колонке Size написано `memory cache`. В чём дело?
options:
  - Файл не сохранился
  - Браузер взял старую копию файла из кэша — нужно обновить с `Ctrl+Shift+R` или включить Disable cache
  - CSS не работает с кнопками
  - Сервер вернул 404
answer: [1]
explanation: |
  `memory cache` и `disk cache` значат, что запроса к серверу не было — файл взят из кэша. Жёсткое обновление или Disable cache на открытой панели DevTools заставят браузер загрузить свежую версию.

title: Найти сломанную картинку
type: quiz
kind: order
difficulty: 1
pitfall: Network показывает только запросы, сделанные при открытой панели, — сначала открыть, потом обновить.
statement: |
  На странице не загрузилось фото товара. Расставьте шаги поиска причины по порядку.
options:
  - Открыть DevTools (F12) и вкладку Network
  - Обновить страницу
  - Отфильтровать запросы по Img и найти строку с кодом 404
  - Открыть Headers и посмотреть полный Request URL
  - Сравнить адрес с тем, где лежит файл, и исправить путь в HTML
answer: [0, 1, 2, 3, 4]
explanation: |
  Network записывает запросы только при открытой панели, поэтому после открытия страницу обновляют. Дальше — фильтр и красная строка. Полный адрес в Headers показывает, куда на самом деле ходил браузер, и обычно сразу видна ошибка пути.

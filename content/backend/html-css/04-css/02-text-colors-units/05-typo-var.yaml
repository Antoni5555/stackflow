title: Опечатка в переменной
type: quiz
kind: single
difficulty: 1
pitfall: Неизвестная переменная CSS не вызывает ошибку — свойство молча не применяется.
statement: |
  В `:root` объявлено `--accent: #2e7d32;`, а у цены написано `color: var(--acent);`. Цена лежит внутри `body` с `color: #1b1b1b`. Что увидит покупатель?
options:
  - Браузер покажет ошибку в консоли и не отрисует страницу
  - Цена станет зелёной — браузер найдёт похожую переменную
  - "Цена будет цвета #1b1b1b — свойство с неизвестной переменной не сработает, цвет унаследуется"
  - Цена станет прозрачной
answer: [2]
hints:
  - Что происходит со свойством, значение которого браузер не смог вычислить?
explanation: |
  Переменной `--acent` нет, и значение `color` становится недействительным. Свойство ведёт себя так, будто его не задали: `color` наследуется, поэтому цена получает цвет `body`. Ошибок в консоли нет. Защита — запасное значение: `var(--accent, #2e7d32)`, и проверка в DevTools.

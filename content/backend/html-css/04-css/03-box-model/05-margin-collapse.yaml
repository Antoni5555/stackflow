title: Сколько между абзацами
type: quiz
kind: single
difficulty: 2
pitfall: Вертикальные margin соседних блоков схлопываются — берётся больший, а не сумма.
statement: |
  В описании товара два абзаца подряд. У первого `margin-bottom: 16px`, у второго `margin-top: 24px`. Других отступов, рамок и padding нет. Какое расстояние будет между абзацами?
options:
  - 40px — отступы складываются
  - 24px — берётся больший отступ
  - 16px — работает отступ того, кто выше
  - 0px — отступы гасят друг друга
answer: [1]
explanation: |
  Вертикальные `margin` соседних блоков схлопываются: между ними остаётся больший из двух отступов, 24px. Горизонтальные `margin` и отступы флекс-элементов не схлопываются. Поэтому расстояния между блоками часто задают отступом только с одной стороны или через `gap`.

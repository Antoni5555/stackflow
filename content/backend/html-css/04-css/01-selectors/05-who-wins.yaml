title: Кто победит
type: quiz
kind: single
difficulty: 2
pitfall: Порядок правил решает только при равной специфичности.
statement: |
  Разметка: `<p class="price sale" id="total">990 ₽</p>`. Стили в таком порядке:

  ```css
  #total { color: black; }
  .price.sale { color: red; }
  p.price { color: green; }
  ```

  Какого цвета будет цена?
options:
  - Чёрная — у id специфичность 1-0-0
  - Красная — два класса сильнее одного id
  - Зелёная — правило стоит последним
  - Красная — правило с классами всегда сильнее правила с тегом
answer: [0]
explanation: |
  Специфичность: `#total` — 1-0-0, `.price.sale` — 0-2-0, `p.price` — 0-1-1. Сравнение идёт слева направо: один id сильнее любого числа классов. Порядок правил учитывается только при равной специфичности, а здесь она разная.

- title: "Цена зелёным"
  text: |
    Сделайте цену в карточке зелёной (`green`) и жирной (700). Стили — в `style.css`, он уже подключён в `<head>` песочницы.

    Разметка — внутри `<body>`:
    ```html
    <article class="card">
      <h2>Беспроводная мышь</h2>
      <p class="price">1 499 ₽</p>
    </article>
    ```
  answer: |
    Ответ — внутри `<body>` файла `index.html`:
    ```html
    <article class="card">
      <h2>Беспроводная мышь</h2>
      <p class="price">1 499 ₽</p>
    </article>
    ```
    Файл `style.css` целиком:
    ```css
    .price {
      color: green;
      font-weight: 700;
    }
    ```
    Селектор по классу `.price` — оформление по смыслу, а не по тегу: абзацы без класса не изменились.
- title: "Только цены в карточках"
  text: |
    Цена есть и в карточке, и в итоге корзины. Покрасьте в `#2e7d32` только цену внутри карточки.
    ```html
    <article class="card">
      <h2>Беспроводная мышь</h2>
      <p class="price">1 499 ₽</p>
    </article>
    <p class="total">
      Итого: <span class="price">1 499 ₽</span>
    </p>
    ```
  answer: |
    Ответ — внутри `<body>` файла `index.html`:
    ```html
    <article class="card">
      <h2>Беспроводная мышь</h2>
      <p class="price">1 499 ₽</p>
    </article>
    <p class="total">
      Итого: <span class="price">1 499 ₽</span>
    </p>
    ```
    Файл `style.css` целиком:
    ```css
    .card .price {
      color: #2e7d32;
    }
    ```
    `.card .price` — `.price` где угодно внутри `.card`. Цена в итоге осталась чёрной.
- title: "Заголовки одним правилом"
  text: |
    Задайте `h1` и `h2` один цвет `#1b5e20` одним правилом.
    ```html
    <h1>Каталог</h1>
    <h2>Ноутбуки</h2>
    ```
  answer: |
    Ответ — внутри `<body>` файла `index.html`:
    ```html
    <h1>Каталог</h1>
    <h2>Ноутбуки</h2>
    ```
    Файл `style.css` целиком:
    ```css
    h1, h2 {
      color: #1b5e20;
    }
    ```
    Селекторы через запятую — группа: одно правило, два вида элементов.
- title: "Шрифт для всей страницы"
  text: |
    Задайте всей странице шрифт `Arial, sans-serif` и цвет текста `#222`, написав одно правило — не для каждого тега отдельно.
    ```html
    <h1>Каталог</h1>
    <p>Двадцать два товара.</p>
    ```
  hint: |
    Цвет и шрифт наследуются.
  answer: |
    Ответ — внутри `<body>` файла `index.html`:
    ```html
    <h1>Каталог</h1>
    <p>Двадцать два товара.</p>
    ```
    Файл `style.css` целиком:
    ```css
    body {
      font-family: Arial, sans-serif;
      color: #222;
    }
    ```
    `h1` и `p` получили шрифт и цвет от `body` по наследованию. С отступами и фоном так не выйдет — они не наследуются.
- title: "Ссылка под курсором"
  text: |
    Ссылки меню — без подчёркивания, а под курсором — подчёркнутые.
    ```html
    <nav class="menu">
      <a href="/catalog/">Каталог</a>
      <a href="/cart/">Корзина</a>
    </nav>
    ```
  answer: |
    Ответ — внутри `<body>` файла `index.html`:
    ```html
    <nav class="menu">
      <a href="/catalog/">Каталог</a>
      <a href="/cart/">Корзина</a>
    </nav>
    ```
    Файл `style.css` целиком:
    ```css
    .menu a {
      text-decoration: none;
    }

    .menu a:hover {
      text-decoration: underline;
    }
    ```
    `:hover` — состояние: правило действует, пока курсор над ссылкой. Наведите мышь в предпросмотре.

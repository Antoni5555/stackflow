title: Два медиазапроса
type: quiz
kind: single
difficulty: 2
pitfall: Узкий экран подходит под оба условия max-width — побеждает тот медиазапрос, что ниже.
statement: |
  Стили каталога:

  ```css
  .catalog { grid-template-columns: repeat(4, 1fr); }

  @media (max-width: 600px) {
    .catalog { grid-template-columns: 1fr; }
  }

  @media (max-width: 900px) {
    .catalog { grid-template-columns: repeat(2, 1fr); }
  }
  ```

  Сколько колонок будет на телефоне шириной 375px?
options:
  - 1 — сработал самый подходящий медиазапрос
  - 2 — подходят оба медиазапроса, побеждает нижний
  - 4 — основное правило сильнее медиазапросов
  - Ни одной — медиазапросы конфликтуют, и правило отбрасывается
answer: [1]
explanation: |
  375px меньше и 600, и 900 — оба медиазапроса срабатывают. Специфичность одинаковая, поэтому побеждает правило ниже: 2 колонки. При `max-width` более узкие условия пишут последними: сначала 900px, потом 600px.

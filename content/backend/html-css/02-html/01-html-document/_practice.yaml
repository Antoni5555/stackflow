- title: "Каркас корзины"
  text: |
    Напишите `index.html` страницы корзины с нуля: язык — русский, кодировка, заголовок вкладки «Корзина — Магазин», на странице — заголовок первого уровня «Корзина» и абзац «В корзине пока пусто.».
  hint: |
    Порядок: `<!doctype html>`, `<html lang>`, `<head>` с `meta` и `title`, `<body>`.
  answer: |
    Ответ — файл `index.html`:
    ```html
    <!doctype html>
    <html lang="ru">
    <head>
      <meta charset="utf-8">
      <title>Корзина — Магазин</title>
    </head>
    <body>
      <h1>Корзина</h1>
      <p>В корзине пока пусто.</p>
    </body>
    </html>
    ```
    Заголовок вкладки (`title`) и заголовок на странице (`h1`) — разные вещи: первый живёт в `head`, второй видит покупатель.
- title: "Цена в абзаце"
  text: |
    Исправьте вложенность, чтобы цена была выделена внутри абзаца:
    ```html
    <p>Цена: <strong>1 290 ₽</p></strong>
    ```
  hint: |
    Теги закрываются в обратном порядке: сначала внутренний.
  answer: |
    Ответ — внутри `<body>` файла `index.html`:
    ```html
    <p>Цена: <strong>1 290 ₽</strong></p>
    ```
    Сначала закрывается `strong`, открытый последним, потом `p`. Браузер исправил бы ошибку сам, но по-своему — проверьте дерево во вкладке Elements.
- title: "Адрес пункта выдачи"
  text: |
    Выведите адрес пункта выдачи одним абзацем в три строки: «Пункт выдачи», «ул. Ленина, 1», «с 10:00 до 21:00».
  hint: |
    Перенос строки внутри абзаца — пустой элемент без закрывающего тега.
  answer: |
    Ответ — внутри `<body>` файла `index.html`:
    ```html
    <p>
      Пункт выдачи<br>
      ул. Ленина, 1<br>
      с 10:00 до 21:00
    </p>
    ```
    `<br>` — пустой элемент, как `meta`: закрывающего тега у него нет. Переносы в самом тексте HTML браузер заменяет пробелами, поэтому без `<br>` адрес встал бы в одну строку.

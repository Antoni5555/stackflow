title: Опасный отзыв
type: quiz
kind: single
difficulty: 2
pitfall: Текст пользователя, вставленный как HTML, выполняется в браузерах всех посетителей.
statement: |
  Чтобы в отзывах сохранялись переносы строк, разработчик вывел текст в шаблоне так: `{{ review.text|safe }}`. Покупатель оставил отзыв `Супер!<script>/* … */</script>`. Что произойдёт?
options:
  - Ничего — Django сам удалит теги при сохранении в базу
  - Скрипт выполнится в браузере каждого, кто откроет страницу товара
  - Скрипт выполнится только у автора отзыва
  - Страница не откроется с ошибкой 500
answer: [1]
hints:
  - Что делает фильтр safe с автоматическим экранированием?
explanation: |
  `|safe` отключает автоэкранирование: текст попадает в HTML как разметка, и `<script>` становится настоящим тегом. Это XSS — скрипт выполняется у всех посетителей с их cookies. Переносы строк безопасно делает фильтр `linebreaks`: он сначала экранирует текст.

title: Что экранировать
type: quiz
kind: multiple
difficulty: 2
pitfall: В тексте опасны < и &, а внутри значения атрибута — ещё и кавычка.
statement: |
  Имя покупателя выводится в двух местах: в тексте `<p>Здравствуйте, ИМЯ</p>` и в атрибуте `<input value="ИМЯ">`. Отметьте символы, которые **обязательно** экранировать хотя бы в одном из этих мест.
options:
  - "<"
  - "&"
  - "\" (двойная кавычка)"
  - "— (тире)"
  - "₽"
answer: [0, 1, 2]
explanation: |
  `<` начинает тег, `&` — мнемонику. Двойная кавычка закрывает значение атрибута `value="…"`, после неё злоумышленник допишет свой атрибут, например обработчик событий. Тире и ₽ в UTF-8 безопасны. Автоэкранирование Django заменяет все три опасных символа (и одинарную кавычку) сразу.

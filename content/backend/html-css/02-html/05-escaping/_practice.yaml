- title: "Тег в тексте"
  text: |
    В статье блога магазина должна быть фраза «Тег <h1> — главный заголовок страницы.» — с самим тегом в тексте.
  answer: |
    Ответ — внутри `<body>` файла `index.html`:
    ```html
    <p>Тег &lt;h1&gt; — главный заголовок страницы.</p>
    ```
    Без мнемоник браузер прочитал бы `<h1>` как начало заголовка, и половина абзаца стала бы крупным заголовком.
- title: "Чай & кофе"
  text: |
    Выведите заголовок категории «Чай & кофе» правильно записанным амперсандом.
  answer: |
    Ответ — внутри `<body>` файла `index.html`:
    ```html
    <h1>Чай &amp; кофе</h1>
    ```
    Одиночный `&` перед пробелом браузер обычно покажет как есть, но `&` перед буквами он попробует прочитать как мнемонику (`&copy` — ©). Надёжно — всегда `&amp;`.
- title: "Цена без разрыва"
  text: |
    Напишите абзац «Цена: 64 990 ₽» так, чтобы ни число, ни число и «₽» не разъезжались на разные строки.
  hint: |
    Пробелов, которые нельзя разрывать, два.
  answer: |
    Ответ — внутри `<body>` файла `index.html`:
    ```html
    <p>Цена: 64&nbsp;990&nbsp;₽</p>
    ```
    `&nbsp;` выглядит как пробел, но перенос строки на нём запрещён. Проверьте в предпросмотре на ширине телефона.
- title: "Кавычки в атрибуте"
  text: |
    У обложки книги `/static/img/sql-book.jpg` описание: `Книга "SQL на практике"` — с прямыми кавычками внутри значения `alt`.
  answer: |
    Ответ — внутри `<body>` файла `index.html`:
    ```html
    <img src="/static/img/sql-book.jpg"
         alt="Книга &quot;SQL на практике&quot;">
    ```
    Значение атрибута само в двойных кавычках; без `&quot;` первая же кавычка внутри закончила бы его на слове «Книга».

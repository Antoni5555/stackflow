title: Тег в тексте
type: exercise
difficulty: 1
pitfall: Символ < в тексте браузер считает началом тега — показать его можно только мнемоникой &lt;.
statement: |
  В статье блога магазина нужна фраза «Тег <b> делает текст жирным». Сейчас на странице вместо неё видно «Тег делает текст жирным», а остаток абзаца стал жирным. Исправьте разметку так, чтобы тег был виден как текст.
files:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <head>
      <meta charset="utf-8">
      <title>Шпаргалка по HTML</title>
    </head>
    <body>
      <p class="tip">Тег <b> делает текст жирным.</p>
    </body>
    </html>
check:
  type: dom
  rules:
    - selector: .tip b
      exists: false
      fail: Внутри абзаца не должно быть настоящего тега <b> — его нужно показать как текст.
    - selector: .tip
      text: '^Тег <b> делает текст жирным\.$'
      fail: На странице должен быть виден текст «Тег <b> делает текст жирным.».
solution:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <head>
      <meta charset="utf-8">
      <title>Шпаргалка по HTML</title>
    </head>
    <body>
      <p class="tip">Тег &lt;b&gt; делает текст жирным.</p>
    </body>
    </html>
hints:
  - Какой мнемоникой записывается символ «меньше»?
explanation: |
  Встретив `<b>`, браузер создаёт элемент — и текст «<b>» исчезает. Мнемоники `&lt;` и `&gt;` браузер превращает в символы уже после разбора тегов, поэтому они показываются как текст. Так же шаблон Django экранирует любые данные.

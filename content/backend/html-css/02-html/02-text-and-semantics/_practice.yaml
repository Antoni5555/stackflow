- title: "Страница «Доставка»"
  text: |
    Сверстайте текст страницы «Доставка»: главный заголовок и два раздела — «Курьером» («Привезём за 1–2 дня.») и «Самовывоз» («Заберите заказ в пункте выдачи.»), у каждого раздела свой заголовок.
  answer: |
    Ответ — внутри `<body>` файла `index.html`:
    ```html
    <h1>Доставка</h1>
    <section>
      <h2>Курьером</h2>
      <p>Привезём за 1–2 дня.</p>
    </section>
    <section>
      <h2>Самовывоз</h2>
      <p>Заберите заказ в пункте выдачи.</p>
    </section>
    ```
    Один `h1` на страницу, разделы — `h2` внутри `section`: уровни не пропускаем.
- title: "Как оформить заказ"
  text: |
    Опишите оформление заказа тремя шагами по порядку: «Положите товары в корзину», «Укажите адрес», «Оплатите заказ».
  answer: |
    Ответ — внутри `<body>` файла `index.html`:
    ```html
    <ol>
      <li>Положите товары в корзину</li>
      <li>Укажите адрес</li>
      <li>Оплатите заказ</li>
    </ol>
    ```
    Шаги идут по порядку — значит, `ol`: браузер сам пронумерует пункты.
- title: "Важное и акцент"
  text: |
    Напишите абзац «Оплата при получении недоступна для заказов дороже 50 000 ₽.», где важное предупреждение «недоступна» выделено как важное, а сумма — акцентом.
  answer: |
    Ответ — внутри `<body>` файла `index.html`:
    ```html
    <p>
      Оплата при получении <strong>недоступна</strong>
      для заказов дороже <em>50 000 ₽</em>.
    </p>
    ```
    `strong` — важность, `em` — смысловой акцент. Жирный и курсив — только их вид по умолчанию, его меняет CSS.
- title: "Области страницы"
  text: |
    Разметьте каркас страницы каталога: шапка с названием «Магазин», основное содержимое с заголовком «Каталог», подвал с текстом «© Магазин, 2026».
  answer: |
    Ответ — внутри `<body>` файла `index.html`:
    ```html
    <header>
      <p>Магазин</p>
    </header>
    <main>
      <h1>Каталог</h1>
    </main>
    <footer>
      <p>© Магазин, 2026</p>
    </footer>
    ```
    Вместо трёх `div` — смысловые области: экранный доступ даст сразу перейти к `main`, а режим чтения уберёт шапку и подвал.

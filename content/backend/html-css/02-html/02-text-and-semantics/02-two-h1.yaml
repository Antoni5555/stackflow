title: Два главных заголовка
type: exercise
difficulty: 1
pitfall: Уровень заголовка выбирают по смыслу — на странице один h1, разделы — h2.
statement: |
  На странице «О магазине» разделы «Доставка» и «Оплата» тоже свёрстаны как `h1`, а подраздел «Картой онлайн» — как `h4`, «чтобы был поменьше». Расставьте уровни заголовков по смыслу.
files:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <head>
      <meta charset="utf-8">
      <title>О магазине</title>
    </head>
    <body>
      <h1>О магазине</h1>
      <h1>Доставка</h1>
      <p>Привезём за 1 день.</p>
      <h1>Оплата</h1>
      <h4>Картой онлайн</h4>
      <p>Visa, Mastercard, МИР.</p>
    </body>
    </html>
check:
  type: dom
  rules:
    - selector: h1
      count: 1
      fail: На странице один h1 — её главная тема.
    - selector: h1
      text: '^О магазине$'
      fail: h1 — «О магазине».
    - selector: h2
      count: 2
      fail: Разделы «Доставка» и «Оплата» — заголовки второго уровня.
    - selector: h3
      count: 1
      fail: «Картой онлайн» — подраздел «Оплаты», следующий уровень после h2.
    - selector: h4
      exists: false
      fail: Уровни не пропускают — после h2 идёт h3, а не h4.
solution:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <head>
      <meta charset="utf-8">
      <title>О магазине</title>
    </head>
    <body>
      <h1>О магазине</h1>
      <h2>Доставка</h2>
      <p>Привезём за 1 день.</p>
      <h2>Оплата</h2>
      <h3>Картой онлайн</h3>
      <p>Visa, Mastercard, МИР.</p>
    </body>
    </html>
hints:
  - Заголовки — как оглавление книги. Какие пункты в нём вложены в какие?
explanation: |
  Уровни заголовков строят оглавление страницы: `h1` — тема, `h2` — разделы, `h3` — подразделы. Поисковики и экранный доступ навигируют по нему. Размер шрифта — дело CSS: маленький `h3` делается стилем, а не тегом `h4`.

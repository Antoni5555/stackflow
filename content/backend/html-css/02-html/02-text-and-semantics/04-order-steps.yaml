title: Шаги оформления
type: exercise
difficulty: 1
pitfall: Когда порядок важен — нужен ol, и номера пишет браузер, а не автор.
statement: |
  Шаги оформления заказа свёрстаны списком `ul`, а номера вписаны в текст вручную. Исправьте так, чтобы список был нумерованным по смыслу, а номера ставил браузер.
files:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <head>
      <meta charset="utf-8">
      <title>Как заказать</title>
    </head>
    <body>
      <h1>Как заказать</h1>
      <ul>
        <li>1. Положите товар в корзину</li>
        <li>2. Укажите адрес доставки</li>
        <li>3. Выберите способ оплаты</li>
        <li>4. Подтвердите заказ</li>
      </ul>
    </body>
    </html>
check:
  type: dom
  rules:
    - selector: ol > li
      count: 4
      fail: Шаги идут по порядку — это ol с четырьмя li.
    - selector: ul
      exists: false
      fail: ul здесь не нужен.
    - selector: li
      text: '^\D'
      fail: Номер ставит сам ol — уберите цифры из текста пунктов.
solution:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <head>
      <meta charset="utf-8">
      <title>Как заказать</title>
    </head>
    <body>
      <h1>Как заказать</h1>
      <ol>
        <li>Положите товар в корзину</li>
        <li>Укажите адрес доставки</li>
        <li>Выберите способ оплаты</li>
        <li>Подтвердите заказ</li>
      </ol>
    </body>
    </html>
hints:
  - Какой список означает «по порядку»?
explanation: |
  `ol` сообщает, что порядок важен, и сам нумерует пункты. Добавили шаг в середину — номера пересчитаются, а ручные «1.», «2.» пришлось бы править везде.

- title: "Меню магазина"
  text: |
    Сделайте меню из трёх ссылок от корня сайта: «Главная» — `/`, «Каталог» — `/catalog/`, «Корзина» — `/cart/`.
  answer: |
    Ответ — внутри `<body>` файла `index.html`:
    ```html
    <nav>
      <a href="/">Главная</a>
      <a href="/catalog/">Каталог</a>
      <a href="/cart/">Корзина</a>
    </nav>
    ```
    Адреса от корня одинаково работают на любой странице сайта — поэтому меню делают так.
- title: "К разделу страницы"
  text: |
    На странице доставки сделайте ссылку «Как забрать самому», которая ведёт к разделу «Самовывоз» на этой же странице.
  hint: |
    У цели — атрибут `id`, у ссылки — `#` и этот `id`.
  answer: |
    Ответ — внутри `<body>` файла `index.html`:
    ```html
    <p><a href="#pickup">Как забрать самому</a></p>
    <section id="pickup">
      <h2>Самовывоз</h2>
      <p>Пункт выдачи работает с 10:00 до 21:00.</p>
    </section>
    ```
    Ссылка на `#id` не загружает новую страницу, а прокручивает к элементу. Адрес в строке браузера получает окончание `#pickup`.
- title: "Фото товара"
  text: |
    Вставьте фото мыши `/static/img/mouse.jpg` шириной 300 и высотой 200 с описанием для тех, кто картинку не видит.
  answer: |
    Ответ — внутри `<body>` файла `index.html`:
    ```html
    <img src="/static/img/mouse.jpg"
         alt="Беспроводная мышь, чёрная"
         width="300" height="200">
    ```
    Файла в песочнице нет, поэтому предпросмотр покажет на месте картинки значок и текст `alt` — так же её «увидит» экранный доступ. `width` и `height` заранее резервируют место, и текст не прыгает при загрузке.
- title: "Сайт службы доставки"
  text: |
    Добавьте ссылку «Отследить посылку» на внешний сайт `https://delivery.example/track/`, которая открывается в новой вкладке.
  answer: |
    Ответ — внутри `<body>` файла `index.html`:
    ```html
    <a href="https://delivery.example/track/"
       target="_blank" rel="noopener">
      Отследить посылку
    </a>
    ```
    Чужой сайт — абсолютный адрес. `rel="noopener"` не даёт открытой вкладке управлять страницей магазина.

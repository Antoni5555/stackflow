title: Сетка каталога таблицей
type: quiz
kind: single
difficulty: 1
pitfall: Таблица — для табличных данных, а не для раскладки блоков на странице.
statement: |
  Нужно показать каталог: 4 карточки товаров в ряд на компьютере и по одной на телефоне. Разработчик предлагает таблицу: строка — ряд, ячейка — карточка. Что не так?
options:
  - Ничего, таблица лучше всего подходит для рядов
  - Это раскладка, а не табличные данные; таблицу не перестроить в одну колонку на телефоне — сетку делают CSS
  - В ячейку таблицы нельзя положить картинку
  - Таблица не может содержать больше трёх колонок
answer: [1]
explanation: |
  У карточек нет колонок со смыслом «цена», «количество» — это просто блоки в ряд. Таблица жёстко держит число колонок и для экранного доступа выглядит как данные. Ряды, которые перестраиваются на телефоне, делают Flexbox или Grid (раздел «CSS»).

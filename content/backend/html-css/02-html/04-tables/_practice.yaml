- title: "Тарифы доставки"
  text: |
    Сверстайте таблицу «Тарифы доставки» с колонками «Способ», «Срок», «Цена» и двумя строками: курьер — 1–2 дня — 390 ₽, самовывоз — 3 дня — бесплатно.
  answer: |
    Ответ — внутри `<body>` файла `index.html`:
    ```html
    <table>
      <caption>Тарифы доставки</caption>
      <thead>
        <tr>
          <th>Способ</th>
          <th>Срок</th>
          <th>Цена</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Курьер</td>
          <td>1–2 дня</td>
          <td>390 ₽</td>
        </tr>
        <tr>
          <td>Самовывоз</td>
          <td>3 дня</td>
          <td>бесплатно</td>
        </tr>
      </tbody>
    </table>
    ```
    `caption` — подпись таблицы, `th` в `thead` — заголовки колонок, по ним экранный доступ называет значения.
- title: "Итог заказа"
  text: |
    Дана таблица позиций заказа. Добавьте строку итога: «Итого» на три первые колонки и сумму 1 670 ₽ в последней.
    ```html
    <table>
      <thead>
        <tr>
          <th>Товар</th><th>Цена</th>
          <th>Кол-во</th><th>Сумма</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Проводная мышь</td><td>590 ₽</td>
          <td>2</td><td>1 180 ₽</td>
        </tr>
        <tr>
          <td>Коврик для мыши</td><td>490 ₽</td>
          <td>1</td><td>490 ₽</td>
        </tr>
      </tbody>
    </table>
    ```
  hint: |
    Итог — отдельная группа строк после `tbody`; ячейка растягивается атрибутом.
  answer: |
    Ответ — внутри `<body>` файла `index.html`:
    ```html
    <table>
      <thead>
        <tr>
          <th>Товар</th><th>Цена</th>
          <th>Кол-во</th><th>Сумма</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Проводная мышь</td><td>590 ₽</td>
          <td>2</td><td>1 180 ₽</td>
        </tr>
        <tr>
          <td>Коврик для мыши</td><td>490 ₽</td>
          <td>1</td><td>490 ₽</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="3">Итого</td>
          <td>1 670 ₽</td>
        </tr>
      </tfoot>
    </table>
    ```
    В строке итога две ячейки, но с `colspan="3"` их ширина — четыре колонки, как в остальных строках.
- title: "Заказ из двух позиций"
  text: |
    Сверстайте историю заказов с колонками «Заказ», «Товар», «Кол-во»: заказ № 12 — две позиции (Ноутбук Aster 14 — 1, Беспроводная мышь — 1), номер заказа — одной ячейкой на обе строки.
  hint: |
    Ячейка на несколько строк — `rowspan`; во второй строке её уже нет.
  answer: |
    Ответ — внутри `<body>` файла `index.html`:
    ```html
    <table>
      <thead>
        <tr>
          <th>Заказ</th><th>Товар</th><th>Кол-во</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td rowspan="2">№ 12</td>
          <td>Ноутбук Aster 14</td><td>1</td>
        </tr>
        <tr>
          <td>Беспроводная мышь</td><td>1</td>
        </tr>
      </tbody>
    </table>
    ```
    Во второй строке две ячейки: первую колонку занимает ячейка из строки выше.

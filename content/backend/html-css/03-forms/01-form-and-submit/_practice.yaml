- title: "Поиск по каталогу"
  text: |
    Сделайте форму поиска: поле, значение которого уходит на `/search/` под именем `q`, и кнопка «Найти». Результат поиска должно быть можно сохранить ссылкой. В предпросмотре песочницы формы не отправляются — проверяйте разметку.
  answer: |
    Ответ — внутри `<body>` файла `index.html`:
    ```html
    <form action="/search/" method="get">
      <input name="q">
      <button>Найти</button>
    </form>
    ```
    Поля GET-формы уходят в адрес: `/search/?q=…` — такую ссылку можно сохранить и отправить. `method="get"` можно и не писать: это значение по умолчанию.
- title: "Подписка на новости"
  text: |
    Форма подписки: почта уходит на `/subscribe/` в теле запроса под именем `email`, кнопка — «Подписаться».
  answer: |
    Ответ — внутри `<body>` файла `index.html`:
    ```html
    <form action="/subscribe/" method="post">
      <input name="email">
      <button>Подписаться</button>
    </form>
    ```
    Подписка меняет данные на сервере — значит, POST: поля уходят в тело, а не в адрес.
- title: "Две кнопки"
  text: |
    В форме корзины (`/checkout/`, POST) две кнопки: «Оформить заказ» отправляет форму, «Очистить поле» форму не отправляет (её позже оживит JavaScript).
  hint: |
    Кнопка внутри формы по умолчанию — отправка.
  answer: |
    Ответ — внутри `<body>` файла `index.html`:
    ```html
    <form action="/checkout/" method="post">
      <input name="promo">
      <button type="button">Очистить поле</button>
      <button>Оформить заказ</button>
    </form>
    ```
    Без `type="button"` обе кнопки отправляли бы форму.
- title: "Что уйдёт в адрес"
  text: |
    Добавьте в форму поиска второе поле `city`. Какой адрес откроется, если ввести «мышь» и «Казань»?
  answer: |
    Ответ — внутри `<body>` файла `index.html`:
    ```html
    <form action="/search/" method="get">
      <input name="q">
      <input name="city">
      <button>Найти</button>
    </form>
    ```
    `/search/?q=мышь&city=Казань` — пары `name=значение` через `&`, в порядке полей. В самом запросе русские буквы закодированы (`%D0%BC…`), адресная строка показывает их раскодированными.

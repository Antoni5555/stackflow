title: Откуда у чужой формы сессия
type: quiz
kind: single
difficulty: 2
pitfall: Cookie прикладывает браузер жертвы — злоумышленнику не нужно её знать.
statement: |
  Злоумышленник не знает `sessionid` покупателя. Почему его скрытая форма на `evil.example` всё равно выполняется в магазине от имени покупателя (если защиты нет)?
options:
  - Злоумышленник угадывает sessionid перебором
  - Браузер покупателя сам прикладывает cookie shop.example к запросу в shop.example, откуда бы тот ни был начат
  - Cookies доступны всем сайтам
  - Форма отправляется с сервера злоумышленника
answer: [1]
explanation: |
  Запрос уходит из браузера жертвы, а браузер добавляет к запросу в `shop.example` его cookies. Прочитать их злоумышленник не может, но ему и не нужно. Поэтому сервер должен проверить то, чего чужая страница не знает, — CSRF-токен.

title: Что защищает от CSRF
type: quiz
kind: multiple
difficulty: 2
pitfall: От CSRF защищают токен, POST для изменений и SameSite — HTTPS и скрытые поля без секрета не помогают.
statement: |
  Отметьте меры, которые действительно помогают против CSRF-атак на магазин.
options:
  - CSRF-токен в каждой POST-форме
  - Перевод сайта на HTTPS
  - Изменение данных только через POST, а не по GET-ссылкам
  - Атрибут SameSite=Lax у cookie сессии
  - Скрытое поле с id товара в форме
answer: [0, 2, 3]
explanation: |
  Токен — то, чего не знает чужой сайт. POST для изменений нужен потому, что GET токеном не прикрыт. `SameSite=Lax` не даёт браузеру приложить cookie к POST с чужого сайта. HTTPS защищает канал, но запрос уходит из браузера самой жертвы. Скрытое поле с id товара злоумышленник впишет сам — секрета в нём нет.

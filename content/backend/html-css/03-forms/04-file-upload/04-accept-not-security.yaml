title: accept как защита
type: quiz
kind: single
difficulty: 2
pitfall: accept фильтрует только окно выбора файла — тип и размер проверяет сервер.
statement: |
  У поля фото стоит `accept="image/*"`. Разработчик решил, что сервер может сохранять загруженные файлы без проверки — «всё равно это картинки». Чем это опасно?
options:
  - Ничем — браузер не отправит файл другого типа
  - Покупатель выберет «Все файлы» или соберёт запрос сам и загрузит что угодно — сервер должен проверить тип и размер
  - Картинки будут слишком маленькими
  - accept не работает в Chrome
answer: [1]
explanation: |
  `accept` только фильтрует окно выбора, и фильтр снимается одним кликом. Запрос можно собрать руками с любым содержимым и любым заголовком `Content-Type`. Сервер ограничивает размер и проверяет, что файл действительно картинка: в Django это делает `ImageField`.

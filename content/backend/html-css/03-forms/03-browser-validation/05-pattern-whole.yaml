title: Что пропустит pattern
type: quiz
kind: multiple
difficulty: 2
pitfall: pattern сравнивает значение целиком, а пустое поле пропускает без required.
statement: |
  Поле: `<input name="postcode" pattern="\d{6}">` (без `required`). Отметьте значения, с которыми форма **отправится**.
options:
  - "`101000`"
  - "`1010001`"
  - (пустое поле)
  - "`10100`"
  - "`abc123`"
answer: [0, 2]
explanation: |
  `pattern` должен совпасть со всем значением, поэтому 7 и 5 цифр не проходят, буквы — тоже. Пустое значение `pattern` не проверяет — это делает `required`. Без него пустой индекс уйдёт на сервер.

title: Ограничения уже есть
type: quiz
kind: single
difficulty: 1
pitfall: Ограничения в HTML снимаются за секунды — сервер обязан проверить данные сам.
statement: |
  У поля количества стоят `min="1" max="99" required`. Коллега предлагает не проверять количество во view: «браузер не даст отправить неверное». Что ответить?
options:
  - Согласиться — так меньше кода
  - Не согласиться — атрибуты убираются в DevTools, а запрос можно отправить через curl; сервер проверяет сам
  - Согласиться, если сайт работает по HTTPS
  - Не согласиться — старые браузеры не знают атрибут max
answer: [1]
explanation: |
  HTML-проверка выполняется на компьютере покупателя и полностью под его контролем. `curl -d "quantity=-5" …` вообще не видит формы. Сервер — единственное место, где проверку нельзя обойти. HTTPS шифрует канал, но не мешает отправить неверные данные.

title: Имя для старой цены
type: quiz
kind: single
difficulty: 1
pitfall: Элемент пишется через два подчёркивания, модификатор — через два дефиса и ставится рядом с основным классом.
statement: |
  У карточки (`card`) есть цена (`card__price`). Нужна зачёркнутая старая цена — вариант обычной цены. Какая разметка соответствует схеме блок / элемент / модификатор?
options:
  - '`<p class="card__price--old">`'
  - '`<p class="card__price card__price--old">`'
  - '`<p class="card__price__old">`'
  - '`<p class="card-price-old-gray">`'
answer: [1]
explanation: |
  Старая цена — модификатор элемента `card__price`: `card__price--old`. Его ставят рядом с основным классом, чтобы старая цена получила все стили цены, а модификатор поменял только отличия (цвет, зачёркивание). `card__price__old` — «элемент элемента», такой вложенности в схеме нет. А имя по виду (`gray`) соврёт после смены дизайна.

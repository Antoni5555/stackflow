title: extends или include
type: quiz
kind: multiple
difficulty: 2
pitfall: extends даёт странице весь каркас и заполняет его блоки; include вставляет готовый кусок в нужное место.
statement: |
  Отметьте верные утверждения о шаблонах Django.
options:
  - Страница «О нас» начинается с `{% extends "base.html" %}` и заполняет `{% block content %}`
  - Карточку товара, которая нужна в каталоге и в корзине, удобно вынести в отдельный файл и вставлять `{% include %}`
  - "`{% include \"base.html\" %}` в начале каждой страницы — то же самое, что `extends`"
  - Чтобы у каждой страницы был свой `<title>`, в `base.html` делают отдельный блок для заголовка
  - Для наследования шаблонов шапку нужно скопировать в каждый шаблон страницы
answer: [0, 1, 3]
explanation: |
  `extends` — страница берёт каркас `base.html` и переопределяет его блоки: `content`, `title`. `include` вставляет готовый кусок вроде карточки товара. Вставка `base.html` через `include` не даст заполнить блоки — получится каркас с пустой серединой, а своя разметка страницы окажется после него. Смысл наследования — как раз в том, что шапка существует в одном файле.

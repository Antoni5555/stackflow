title: Фигурные скобки в браузере
type: quiz
kind: single
difficulty: 1
pitfall: Шаблоны Django выполняет сервер; браузер о них ничего не знает.
statement: |
  Разработчик открыл `templates/base.html` двойным щелчком прямо в браузере и увидел на странице текст `{% block content %}{% endblock %}`. Что это значит?
options:
  - В base.html ошибка — блок записан неверно
  - Браузер не поддерживает новую версию шаблонов Django
  - Шаблон собирает сервер — Django заменяет теги {% %} до отправки; открытый как файл шаблон браузер показывает как есть
  - Нужно подключить к странице JavaScript-библиотеку для шаблонов
answer: [2]
explanation: |
  Шаблон — заготовка для сервера. Django, обрабатывая запрос, подставляет данные, выполняет `{% for %}` и `{% if %}`, склеивает страницу с `base.html` и отправляет браузеру готовый HTML. Открытый с диска файл никто не обработал, поэтому теги видны текстом. Смотреть страницу нужно через запущенный сервер.

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" class="fig" role="img" aria-labelledby="t"><title id="t">Три страницы с одной шапкой и подвалом: копии расходятся, шаблон хранит их в одном месте</title>
<style>
.fig text{white-space:pre}
.fig-t{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:14px;fill:#0e0e0e;fill:var(--text,#0e0e0e)}
.fig-c{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:14px;fill:#0e0e0e;fill:var(--text,#0e0e0e)}
.fig-cs{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:12px;fill:#0e0e0e;fill:var(--text,#0e0e0e)}
.fig-h{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:12px;letter-spacing:.04em;text-transform:uppercase;fill:#6e6e6a;fill:var(--muted,#6e6e6a)}
.fig-s{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:12px;fill:#6e6e6a;fill:var(--muted,#6e6e6a)}
.fig-box{fill:#ffffff;fill:var(--surface,#ffffff);stroke:#e0e0dc;stroke:var(--border,#e0e0dc);stroke-width:1.5}
.fig-box2{fill:#ebebe8;fill:var(--surface-2,#ebebe8);stroke:#e0e0dc;stroke:var(--border,#e0e0dc);stroke-width:1.5}
.fig-acc{fill:#dcf25c;fill:var(--accent,#dcf25c)}
.fig-onacc{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:13px;fill:#0e0e0e;fill:var(--on-accent,#0e0e0e)}
.fig-ln{stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5;fill:none}
.fig-lnd{stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.fig-ah{fill:#6e6e6a;fill:var(--muted,#6e6e6a)}
.fig-err{fill:#fdecea;fill:var(--error-bg,#fdecea);stroke:#d93025;stroke:var(--error,#d93025);stroke-width:1.5}
.fig-errt{font-family:Manrope,sans-serif;font-family:var(--font-main,Manrope,sans-serif);font-size:13px;fill:#d93025;fill:var(--error,#d93025)}
.fig-ok{fill:#e7f6ec;fill:var(--success-bg,#e7f6ec);stroke:#1f9d55;stroke:var(--success,#1f9d55);stroke-width:1.5}
.fig-dash{fill:none;stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5;stroke-dasharray:5 4}
.fig-term{fill:#0d0d0f;fill:var(--term-bg,#0d0d0f)}
.fig-tt{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:13px;fill:#e6e6e3;fill:var(--term-text,#e6e6e3)}
.fig-tterr{font-family:'JetBrains Mono',monospace;font-family:var(--font-code,'JetBrains Mono',monospace);font-size:13px;fill:#f87171}
.fig-m1{fill:#dbe4ff;fill:var(--match-1,#dbe4ff)}
.fig-m2{fill:#ffe3e3;fill:var(--match-2,#ffe3e3)}
.fig-m3{fill:#d3f9d8;fill:var(--match-3,#d3f9d8)}
.fig-venn{fill-opacity:.75;stroke:#6e6e6a;stroke:var(--muted,#6e6e6a);stroke-width:1.5}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fig-ah"/></marker></defs>
<text x="20" y="24" text-anchor="start" class="fig-h">копии в каждом файле</text>
<rect x="20" y="36" width="124" height="200" rx="12" class="fig-box2"/>
<rect x="28" y="44" width="108" height="32" rx="12" class="fig-box"/>
<text x="82.0" y="65.0" text-anchor="middle" class="fig-t">шапка</text>
<text x="82" y="140" text-anchor="middle" class="fig-cs">index.html</text>
<rect x="28" y="196" width="108" height="32" rx="12" class="fig-box"/>
<text x="82.0" y="217.0" text-anchor="middle" class="fig-t">подвал</text>
<rect x="156" y="36" width="124" height="200" rx="12" class="fig-box2"/>
<rect x="164" y="44" width="108" height="32" rx="12" class="fig-box"/>
<text x="218.0" y="65.0" text-anchor="middle" class="fig-t">шапка</text>
<text x="218" y="140" text-anchor="middle" class="fig-cs">catalog.html</text>
<rect x="164" y="196" width="108" height="32" rx="12" class="fig-box"/>
<text x="218.0" y="217.0" text-anchor="middle" class="fig-t">подвал</text>
<rect x="292" y="36" width="124" height="200" rx="12" class="fig-box2"/>
<rect x="300" y="44" width="108" height="32" rx="12" class="fig-err"/>
<text x="354.0" y="65.0" text-anchor="middle" class="fig-errt">шапка</text>
<text x="354" y="140" text-anchor="middle" class="fig-cs">about.html</text>
<rect x="300" y="196" width="108" height="32" rx="12" class="fig-box"/>
<text x="354.0" y="217.0" text-anchor="middle" class="fig-t">подвал</text>
<text x="20" y="262" text-anchor="start" class="fig-errt">about.html: забыли добавить новую ссылку в шапку</text>
<path d="M440 136H500" class="fig-ln" marker-end="url(#a)"/>
<text x="520" y="24" text-anchor="start" class="fig-h">один шаблон + страницы</text>
<rect x="520" y="36" width="340" height="84" rx="12" class="fig-ok"/>
<text x="536" y="62" text-anchor="start" class="fig-t">base.html: шапка, подвал,</text>
<text x="536" y="86" text-anchor="start" class="fig-t">место для содержимого</text>
<text x="536" y="108" text-anchor="start" class="fig-cs">{% block content %}</text>
<rect x="520" y="170" width="108" height="50" rx="12" class="fig-box"/>
<text x="574.0" y="191.0" text-anchor="middle" class="fig-cs">index</text>
<text x="574.0" y="209.0" text-anchor="middle" class="fig-cs">extends base</text>
<path d="M574 170V124" class="fig-ln" marker-end="url(#a)"/>
<rect x="636" y="170" width="108" height="50" rx="12" class="fig-box"/>
<text x="690.0" y="191.0" text-anchor="middle" class="fig-cs">catalog</text>
<text x="690.0" y="209.0" text-anchor="middle" class="fig-cs">extends base</text>
<path d="M690 170V124" class="fig-ln" marker-end="url(#a)"/>
<rect x="752" y="170" width="108" height="50" rx="12" class="fig-box"/>
<text x="806.0" y="191.0" text-anchor="middle" class="fig-cs">about</text>
<text x="806.0" y="209.0" text-anchor="middle" class="fig-cs">extends base</text>
<path d="M806 170V124" class="fig-ln" marker-end="url(#a)"/>
<text x="520" y="254" text-anchor="start" class="fig-s">шапку правят в одном файле — меняются все страницы</text>
</svg>

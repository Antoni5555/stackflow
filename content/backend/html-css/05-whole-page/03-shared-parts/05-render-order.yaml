title: Как собирается страница
type: quiz
kind: order
difficulty: 2
pitfall: Шаблон собирается на сервере до отправки ответа — браузер получает уже готовый HTML.
statement: |
  Покупатель открывает страницу «О нас». Расставьте шаги в том порядке, в котором они происходят.
options:
  - Браузер отправляет GET /about/
  - Django находит view по адресу и вызывает её
  - View отдаёт шаблон about.html на отрисовку
  - "Django видит `{% extends \"base.html\" %}` и вставляет блоки страницы в каркас"
  - Сервер отправляет готовый HTML в ответе 200
  - Браузер рисует страницу и запрашивает style.css
answer: [0, 1, 2, 3, 4, 5]
explanation: |
  Сборка шаблона — часть обработки запроса на сервере: view выбирает шаблон, Django склеивает его с `base.html` и только потом отправляет ответ. Браузер получает обычный HTML и уже по нему запрашивает стили и картинки — отдельными запросами.

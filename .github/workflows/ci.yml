name: CI

on:
  push:
    branches: [main]
  pull_request:

# Два деплоя одновременно не идут: новый ждёт, пока закончится предыдущий
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: flake8

  tests:
    runs-on: ubuntu-latest
    # Postgres как на сервере: тесты с моделями пойдут на той же СУБД
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: develop_lab
          POSTGRES_USER: develop_lab
          POSTGRES_PASSWORD: develop_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-secret-key
      POSTGRES_DB: develop_lab
      POSTGRES_USER: develop_lab
      POSTGRES_PASSWORD: develop_lab
      DB_HOST: localhost
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Симуляторы тренажёров (чистый JS) — тесты в Node. Из npm — PGlite (эталоны
      # SQL-задач) и Playwright (эталоны задач на вёрстку: стили считает только браузер);
      # Playwright нужен Node 20+
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: pytest
      - run: node --test tests/js/*.test.js

  # Образы web и nginx с тегом = SHA коммита. Собираются всегда (сломанный
  # Dockerfile видно сразу), а в GHCR уходят только с main и только после
  # зелёных lint и tests.
  images:
    needs: [lint, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      # Имя образа в GHCR — только строчными: Antoni5555 → antoni5555
      - run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Сборка
        run: |
          # Метка связывает образ с репозиторием: у пакета те же права, что у него
          label="org.opencontainers.image.source=https://github.com/${{ github.repository }}"
          for target in web nginx; do
            docker build --target "$target" --label "$label" \
              -t "$IMAGE_PREFIX/stackflow-$target:${{ github.sha }}" .
          done
      - name: Отправка в GHCR
        if: env.PUSH == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for target in web nginx; do
            docker push "$IMAGE_PREFIX/stackflow-$target:${{ github.sha }}"
          done

  # Деплой на сервер по SSH. Включается переменной репозитория
  # DEPLOY_ENABLED=true (Settings → Secrets and variables → Actions → Variables),
  # когда сервер настроен по docs/deploy.md. До этого job пропускается.
  deploy:
    needs: [images]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
      DEPLOY_DIR: stackflow
    steps:
      - uses: actions/checkout@v7
      - name: SSH-ключ
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Отпечаток сервера заранее известен: подменённый сервер не пройдёт
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Файлы деплоя на сервер
        run: |
          scp docker-compose.prod.yml "$SSH_TARGET:$DEPLOY_DIR/docker-compose.yml"
          scp deploy/deploy.sh "$SSH_TARGET:$DEPLOY_DIR/deploy.sh"
          scp deploy/backup.sh "$SSH_TARGET:$DEPLOY_DIR/backup.sh"
          scp deploy/monitor.sh deploy/notify.sh "$SSH_TARGET:$DEPLOY_DIR/"
      - name: Вход сервера в GHCR
        # Временный токен этого запуска CI: им сервер скачает образы
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh "$SSH_TARGET" \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Деплой
        run: ssh "$SSH_TARGET" "cd $DEPLOY_DIR && sh deploy.sh ${{ github.sha }}"
      - name: Выход сервера из GHCR
        # Токен уже не действует после этого запуска — не оставляем его на сервере
        if: always()
        run: ssh "$SSH_TARGET" docker logout ghcr.io

  # Итог запуска в Telegram (docs/notifications.md): всегда после пуша в main —
  # и при успехе, и при падении любого этапа. Без секрета TG_TOKEN пропускается.
  notify:
    needs: [lint, tests, images, deploy]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # сообщение коммита — через env, а не подстановкой в скрипт
      COMMIT_MSG: ${{ github.event.head_commit.message }}
      R_LINT: ${{ needs.lint.result }}
      R_TESTS: ${{ needs.tests.result }}
      R_IMAGES: ${{ needs.images.result }}
      R_DEPLOY: ${{ needs.deploy.result }}
    steps:
      - uses: actions/checkout@v7
        if: env.TG_TOKEN != ''
      - name: Сообщение
        if: env.TG_TOKEN != ''
        run: |
          mark() { case "$1" in success) echo '✅' ;; skipped) echo '⏭' ;; cancelled) echo '⏹' ;; *) echo '❌' ;; esac; }
          esc() { sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'; }
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          secs=$(( $(date +%s) - $(date -d "$started" +%s) ))
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          commit_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          if [ "$R_DEPLOY" = success ]; then level=ok; event='Деплой завершён'
          elif [ "$R_DEPLOY" = skipped ] && [ "$R_IMAGES" = success ]; then level=info; event='Сборка без деплоя'
          else level=fail; event='Деплой не прошёл'; fi
          {
            echo "Коммит: <a href=\"$commit_url\">${GITHUB_SHA:0:7}</a> — $(printf '%s' "$COMMIT_MSG" | head -1 | esc)"
            echo "Автор: $GITHUB_ACTOR · ветка ${GITHUB_REF_NAME}"
            echo "Этапы: проверка $(mark "$R_LINT") · тесты $(mark "$R_TESTS") · образы $(mark "$R_IMAGES") · выкатка $(mark "$R_DEPLOY")"
            echo "Длительность: $((secs / 60)) мин $((secs % 60)) с"
            [ "$level" = fail ] && echo && echo "Сайт работает на прошлой версии. Что упало — в логе сборки."
          } | LINKS="<a href=\"https://stack-flow.ru\">Открыть сайт</a> · <a href=\"$run_url\">Лог сборки</a>" \
            sh deploy/notify.sh "$level" "$event"
